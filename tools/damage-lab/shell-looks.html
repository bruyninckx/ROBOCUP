<title>ROBOCUS Arena Looks</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Stencil+One&family=Fredoka:wght@500;700&family=Bangers&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* layout: three arenas side by side, all drawing the same live fight; controls in a strip above */
:root {
  --bg: #E9E4DA; --panel: #F6F2EA; --ink: #2B2118; --muted: #6E6457; --line: #CFC6B7; --chip: #E1DACD; --accent: #C8642B;
  --f-display: "Saira Stencil One", "Arial Black", Impact, sans-serif;
  --f-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #1D1A16; --panel: #27231E; --ink: #EDE6DA; --muted: #A79C8C; --line: #3E3830; --chip: #332E27; --accent: #E08A57; color-scheme: dark } }
:root[data-theme="dark"] { --bg: #1D1A16; --panel: #27231E; --ink: #EDE6DA; --muted: #A79C8C; --line: #3E3830; --chip: #332E27; --accent: #E08A57; color-scheme: dark }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 var(--f-body); }
.wrap { max-width: 1500px; margin: 0 auto; padding-block: 14px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1 { font: 400 28px/1.1 var(--f-display); margin: 4px 0 2px; text-wrap: balance; }
.lede { color: var(--muted); margin: 0 0 12px; max-width: 75ch; }
.controls { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: end; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-bottom: 12px; }
.controls label { display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: var(--muted); }
select, input[type=number] { font: 14px var(--f-body); padding: 6px 8px; border-radius: 7px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); min-width: 0; }
input[type=number] { width: 90px; }
button { font: 600 13px var(--f-body); padding: 7px 11px; border-radius: 7px; border: 1px solid var(--line); background: var(--chip); color: var(--ink); cursor: pointer; }
button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button.go { background: var(--accent); border-color: var(--accent); color: #fff; }
button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.btns { display: flex; gap: 6px; flex-wrap: wrap; }
.hp { display: flex; gap: 10px; flex-wrap: wrap; margin: 0 0 10px; font: 12px var(--f-mono); }
.hp div { flex: 1 1 220px; min-width: 0; }
.hp b { font: 600 13px var(--f-body); }
.meter { height: 6px; background: var(--chip); border-radius: 3px; margin-top: 3px; overflow: hidden; }
.meter i { display: block; height: 100%; }
.looks { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 980px) { .looks { grid-template-columns: 1fr; max-width: 640px; } }
figure { margin: 0; min-width: 0; }
.cv { position: relative; width: 100%; max-width: 100%; aspect-ratio: 1; border-radius: 10px; overflow: hidden; background: #222; }
.cv canvas { display: block; width: 100%; height: 100%; }
figcaption { margin-top: 6px; font-size: 13px; color: var(--muted); }
figcaption b { color: var(--ink); font-size: 15px; display: block; }
@media (prefers-reduced-motion: reduce) { .cv { scroll-behavior: auto; } }
</style>
<div class="wrap">
  <h1>ROBOCUS Arena Looks</h1>
  <p class="lede">Three top-down art directions drawing the same 2.0 fight at the same moment. The engine and the fight are unchanged; only the drawing differs. Flips now read from above: the robot rolls over its side and shows its belly.</p>
  <div class="controls">
    <label for="pa">Robot 1<select id="pa"></select></label>
    <label for="pb">Robot 2<select id="pb"></select></label>
    <label for="arenaSel">Arena<select id="arenaSel"></select></label>
    <label for="seed">Seed<input type="number" id="seed" min="1" value="1"></label>
    <div class="btns"><button type="button" class="go" id="fight">Fight</button><button type="button" id="newseed">New seed</button><button type="button" id="rand">Random robots</button><button type="button" id="pause">Pause</button></div>
    <div class="btns"><button type="button" data-speed="0.5">0.5×</button><button type="button" data-speed="1" aria-pressed="true">1×</button><button type="button" data-speed="2">2×</button></div>
  </div>
  <div class="hp" id="hp"></div>
  <div class="looks">
    <figure><div class="cv"><canvas id="c0" aria-label="Workshop look: lit steel, real shadows"></canvas></div><figcaption><b>Workshop</b>Painted steel under one work lamp: every plate is lit from the same side, bevels catch the light, shadows grow as a robot leaves the floor.</figcaption></figure>
    <figure><div class="cv"><canvas id="c1" aria-label="Toy box look: chunky vinyl robots with eyes"></canvas></div><figcaption><b>Toy box</b>Chunky vinyl toys on a play mat: thick outlines, candy colours, eyes that track the enemy, squash and stretch on every hit.</figcaption></figure>
    <figure><div class="cv"><canvas id="c2" aria-label="Comic look: ink outlines, halftone, sound effects"></canvas></div><figcaption><b>Comic</b>Inked panels on newsprint: hard cel shading with halftone, speed lines, and sound effects that burst out of the big hits.</figcaption></figure>
  </div>
</div>
