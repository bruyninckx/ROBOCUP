<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Scrapyard Dominus</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Rough mock-up: plain white, black text, team colours only. */
:root { --bg: #ffffff; --ink: #111111; --muted: #6f6f6f; --line: #dddddd; --soft: #f5f5f5; --blue: #1f6feb; --red: #d62828; --green: #2a9d3a; --orange: #e07b00; color-scheme: light; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;

.wrap { max-width: 1100px; margin: 0 auto; display: grid; gap: 14px; }
h1 { font-size: 20px; margin: 0; } h2 { font-size: 17px; margin: 0; } h3 { font-size: 14px; margin: 0; }
button, select, input { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--ink); border-radius: 6px; padding: 4px 10px; }
button { cursor: pointer; } button.primary { background: var(--ink); color: var(--bg); }
button:disabled { opacity: .35; cursor: default; }
input[type=number] { width: 64px; padding: 3px 6px; }
button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.top { display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; }
.phases { display: flex; gap: 4px; flex-wrap: wrap; margin-left: auto; }
.phases span { padding: 2px 9px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); font-size: 13px; }
.phases span.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.teams { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.team { border: 1px solid var(--line); border-top: 5px solid var(--c); border-radius: 6px; padding: 8px 10px; display: grid; gap: 4px; min-width: 0; }
.team h3 { color: var(--c); display: flex; gap: 6px; }
.team h3 .you { color: var(--muted); font-weight: 400; }
.nums { display: flex; gap: 12px; font-variant-numeric: tabular-nums; flex-wrap: wrap; }
.nums b { font-size: 16px; }
.fame { height: 6px; background: var(--soft); border-radius: 3px; overflow: hidden; }
.fame i { display: block; height: 100%; background: var(--c); }
.bot { font-size: 12.5px; color: var(--muted); display: flex; gap: 6px; flex-wrap: wrap; }
.bot b { color: var(--ink); }
.main { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 14px; align-items: start; }
.panel { border: 1px solid var(--line); border-radius: 6px; padding: 14px; display: grid; gap: 12px; min-width: 0; }
.panel p { margin: 0; }
.muted { color: var(--muted); }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.cards { display: flex; gap: 10px; flex-wrap: wrap; }
.card { width: 190px; border: 1px solid var(--ink); border-radius: 6px; padding: 8px 10px; display: grid; gap: 4px; text-align: left; background: var(--bg); }
.card .k { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.card.sel { outline: 3px solid var(--ink); }
.card:disabled { opacity: .4; }
.log { border: 1px solid var(--line); border-radius: 6px; padding: 10px; max-height: 560px; overflow-y: auto; font-size: 13px; display: grid; gap: 3px; }
.log .r { font-weight: 700; margin-top: 6px; }
.log .me { font-weight: 600; }
canvas { display: block; width: 100%; height: auto; border: 1px solid var(--ink); }
table { border-collapse: collapse; font-variant-numeric: tabular-nums; }
th, td { border: 1px solid var(--line); padding: 4px 8px; text-align: left; }
th { background: var(--soft); font-weight: 600; }
.vs { display: grid; grid-template-columns: 1fr auto 1fr; gap: 12px; align-items: start; }
.vs .mid { align-self: center; font-weight: 700; }
.fighter { border: 2px solid var(--c); border-radius: 6px; padding: 8px 10px; display: grid; gap: 3px; }
.fighter h3 { color: var(--c); }
.odds { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
.tag { display: inline-block; font-size: 11px; padding: 1px 6px; border: 1px solid var(--line); border-radius: 999px; color: var(--muted); }
.big { font-size: 22px; font-weight: 700; }
@media (max-width: 860px) { .teams { grid-template-columns: repeat(2, minmax(0, 1fr)); } .main { grid-template-columns: 1fr; } }
@media (max-width: 520px) { .vs { grid-template-columns: 1fr; } .vs .mid { justify-self: center; } }
</style>

<div class="wrap">
  <div class="top">

</div>

<script src="../src/sim.js"></script>
<script>
(function () {
  'use strict';
  const $ = s => document.querySelector(s);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const rnd = Math.random, pick = a => a[Math.floor(rnd() * a.length)];
  const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const clone = o => JSON.parse(JSON.stringify(o));
  const WIN_FAME = 12;

  const L = (hp, armor, speed, turret, fp, acc, bullet) => ({ hp, armor, speed, turret, fp, acc, bullet });
  const PRESETS = {
    Bulwark:   { lv: L(4, 3, 1, 0, 4, 1, 1), range: 'mid', weapon: 'gun', cal: 'medium' },
    Marksman:  { lv: L(3, 0, 0, 1, 4, 3, 3), range: 'long', weapon: 'gun', cal: 'medium' },
    Hornet:    { lv: L(4, 0, 1, 0, 4, 3, 2), range: 'mid', weapon: 'gun', cal: 'rapid' },
    Dasher:    { lv: L(3, 0, 4, 1, 4, 1, 1), range: 'short', weapon: 'gun', cal: 'medium' },
    Burner:    { lv: L(4, 1, 2, 1, 4, 2, 0), range: 'mid', weapon: 'laser', cal: 'medium' },
    Lobber:    { lv: L(1, 0, 3, 0, 4, 2, 4), range: 'long', weapon: 'mortar', cal: 'medium' },
    Buzzsaw:   { lv: L(3, 2, 3, 1, 4, 0, 1), range: 'mid', weapon: 'saw', cal: 'medium' },
    Whirlwind: { lv: L(4, 2, 3, 0, 4, 0, 0), range: 'short', weapon: 'spinner', cal: 'medium' },
    Torch:     { lv: L(4, 1, 3, 2, 4, 0, 0), range: 'short', weapon: 'flame', cal: 'medium' },
  };
  // Starter Deck: 9 stock starter robots (11 stat points, cap level 3, no mod/helpers, 1 engineer)
  const STARTERS = {
    's1. Scrapper': { lv: L(3, 1, 3, 0, 3, 0, 1), range: 'short', weapon: 'gun',     cal: 'medium', desc: 'Tough & quick medium gun, likes it up close. Beats spinners & mortars.' },
    's1. Rattler':  { lv: L(1, 0, 2, 0, 3, 3, 2), range: 'mid',   weapon: 'gun',     cal: 'rapid',  desc: 'Accurate rapid-fire bullet hose. Shreds lasers & mortars.' },
    's1. Plinker':  { lv: L(0, 2, 1, 0, 3, 2, 3), range: 'long',  weapon: 'gun',     cal: 'medium', desc: 'Armoured long-range sniper with fast bullets. Deletes lasers.' },
    's1. Tin Can':  { lv: L(1, 3, 1, 0, 3, 1, 2), range: 'mid',   weapon: 'gun',     cal: 'medium', desc: 'Armour-3 brick with medium gun. Rapid fire bounces right off.' },
    's1. Sparky':   { lv: L(2, 1, 3, 1, 3, 1, 0), range: 'mid',   weapon: 'laser',   cal: 'medium', desc: 'Fast laser that cooks flamethrowers & spinners.' },
    's1. Lobster':  { lv: L(1, 1, 3, 0, 3, 0, 3), range: 'long',  weapon: 'mortar',  cal: 'medium', desc: 'Quick mortar lobber. Crushes slow saw turrets.' },
    's1. Grinder':  { lv: L(1, 2, 0, 0, 3, 3, 2), range: 'mid',   weapon: 'saw',     cal: 'medium', desc: 'Slow, precise saw-blade turret. Beats armour & lasers.' },
    's1. Zippo':    { lv: L(0, 3, 3, 2, 3, 0, 0), range: 'short', weapon: 'flame',   cal: 'medium', desc: 'Armoured fast flamethrower. Burns spinners & rapid guns.' },
    's1. Top':      { lv: L(2, 3, 3, 0, 3, 0, 0), range: 'short', weapon: 'spinner', cal: 'medium', desc: 'Armoured spinner. Wrecks saw turrets & long guns.' },
  };
  const SMATRIX = {
    's1. Scrapper': { 's1. Rattler': 56, 's1. Plinker': 66, 's1. Tin Can': 48, 's1. Sparky': 27, 's1. Lobster': 74, 's1. Grinder': 67, 's1. Zippo': 38, 's1. Top': 89 },
    's1. Rattler':  { 's1. Scrapper': 45, 's1. Plinker': 54, 's1. Tin Can': 18, 's1. Sparky': 100, 's1. Lobster': 89, 's1. Grinder': 55, 's1. Zippo': 31, 's1. Top': 25 },
    's1. Plinker':  { 's1. Scrapper': 34, 's1. Rattler': 47, 's1. Tin Can': 52, 's1. Sparky': 98, 's1. Lobster': 43, 's1. Grinder': 41, 's1. Zippo': 66, 's1. Top': 14 },
    's1. Tin Can':  { 's1. Scrapper': 52, 's1. Rattler': 82, 's1. Plinker': 48, 's1. Sparky': 75, 's1. Lobster': 43, 's1. Grinder': 26, 's1. Zippo': 44, 's1. Top': 20 },
    's1. Sparky':   { 's1. Scrapper': 74, 's1. Rattler': 0,  's1. Plinker': 2,  's1. Tin Can': 25, 's1. Lobster': 52, 's1. Grinder': 16, 's1. Zippo': 100, 's1. Top': 98 },
    's1. Lobster':  { 's1. Scrapper': 27, 's1. Rattler': 11, 's1. Plinker': 58, 's1. Tin Can': 57, 's1. Sparky': 48, 's1. Grinder': 78, 's1. Zippo': 59, 's1. Top': 67 },
    's1. Grinder':  { 's1. Scrapper': 34, 's1. Rattler': 45, 's1. Plinker': 59, 's1. Tin Can': 74, 's1. Sparky': 85, 's1. Lobster': 23, 's1. Zippo': 47, 's1. Top': 2 },
    's1. Zippo':    { 's1. Scrapper': 62, 's1. Rattler': 70, 's1. Plinker': 34, 's1. Tin Can': 57, 's1. Sparky': 0,  's1. Lobster': 42, 's1. Grinder': 54, 's1. Top': 80 },
    's1. Top':      { 's1. Scrapper': 12, 's1. Rattler': 76, 's1. Plinker': 86, 's1. Tin Can': 81, 's1. Sparky': 2,  's1. Lobster': 33, 's1. Grinder': 98, 's1. Zippo': 21 },
  };
  function starterOverallAvg(name) {
    const row = SMATRIX[name]; if (!row) return 50;
    const vals = Object.values(row);
    return Math.round(vals.reduce((a, b) => a + b, 0) / vals.length);
  }
  function starterVsTableAvg(name) {
    const row = SMATRIX[name]; if (!row || !G) return starterOverallAvg(name);
    const oppNames = [];
    for (const t of G.teams) if (!t.human) for (const r of t.robots) if (row[r.name] !== undefined) oppNames.push(r.name);
    if (!oppNames.length) return starterOverallAvg(name);
    return Math.round(oppNames.reduce((a, n) => a + row[n], 0) / oppNames.length);
  }
  const SCRAP = { lv: L(1, 0, 1, 1, 1, 1, 1), range: 'mid', weapon: 'gun', cal: 'medium' };
  const STATNAME = { hp: 'Health', armor: 'Armour', speed: 'Speed', turret: 'Turret', fp: 'Firepower', acc: 'Accuracy', bullet: 'Bullet speed' };
  const SHORT = { hp: 'HP', armor: 'AR', speed: 'SP', turret: 'TU', fp: 'FP', acc: 'AC', bullet: 'BU' };

  // ---- intrigue cards ----
  // need: fame required to play. tamper: hidden effect on the target's robots at their next fight.
  const SCHEMES = {
    bolts:   { name: 'Loose Bolts', need: 0, target: 'team', text: 'Sabotage: their robots fight with 2 less Armour next fight.', tamper: { armor: -2 } },
    sugar:   { name: 'Sugar in the Tank', need: 0, target: 'team', text: 'Sabotage: their robots fight with 2 less Speed next fight.', tamper: { speed: -2 } },
    gears:   { name: 'Stripped Gears', need: 0, target: 'team', text: 'Sabotage: their turrets turn 2 levels slower next fight.', tamper: { turret: -2 } },
    lens:    { name: 'Smudged Lens', need: 3, target: 'team', text: 'Sabotage: their robots fight with 2 less Accuracy next fight.', tamper: { acc: -2 } },
    pocket:  { name: 'Pickpocket', need: 0, target: 'team', text: 'Steal 3 credits from the target.' },
    night:   { name: 'Night Shift', need: 0, target: 'self', text: 'Your mechanics work overtime: gain 4 credits.' },
    press:   { name: 'Bribe the Press', need: 5, target: 'self', text: 'Pay 3 credits: gain 1 fame.' },
    smear:   { name: 'Smear Campaign', need: 7, target: 'team', text: 'The target loses 1 fame.' },
    overtime:{ name: 'Secret Upgrade', need: 4, target: 'self', text: 'Hidden: your robots fight with +1 Firepower and +1 Armour next fight.', tamper: { fp: 1, armor: 1 } },
    guard:   { name: 'Guard Dog', need: 0, target: 'none', text: 'Keep in hand. The next scheme against you has a 50% chance to fail (card is used up).' },
  };
  const SCHEME_DECK = ['bolts', 'bolts', 'sugar', 'sugar', 'gears', 'gears', 'lens', 'pocket', 'pocket', 'night', 'night', 'press', 'press', 'smear', 'overtime', 'overtime', 'guard', 'guard', 'guard'];

  // ---- market lots & crate rewards ----
  const LOTS = {
    plate:  { name: 'Armour Plate', text: '+1 Armour on one robot.', stat: 'armor' },
    engine: { name: 'Tuned Engine', text: '+1 Speed on one robot.', stat: 'speed' },
    motor:  { name: 'Turret Motor', text: '+1 Turret turn on one robot.', stat: 'turret' },
    chip:   { name: 'Targeting Chip', text: '+1 Accuracy on one robot.', stat: 'acc' },
    hull:   { name: 'Reinforced Hull', text: '+1 Health on one robot.', stat: 'hp' },
    barrel: { name: 'Long Barrel', text: '+1 Bullet speed on one robot.', stat: 'bullet' },
    core:   { name: 'High-Output Core', text: '+1 Firepower on one robot.', stat: 'fp' },
    laser:   { name: 'Laser Retrofit', text: 'Turn one robot\'s weapon into a laser (ignores armour, mid range).', weapon: 'laser' },
    mortar:  { name: 'Mortar Retrofit', text: 'Turn one robot\'s weapon into a mortar (splash, long range).', weapon: 'mortar' },
    saw:     { name: 'Saw Launcher', text: 'Turn one robot\'s weapon into a boomerang saw (hits out and back).', weapon: 'saw' },
    spinner: { name: 'Spinner Rim', text: 'Turn one robot\'s weapon into a spinning melee ring (ramming damage).', weapon: 'spinner' },
    flame:   { name: 'Flamethrower', text: 'Turn one robot\'s weapon into a short-range fire cone (ignores half armour).', weapon: 'flame' },
    rapid:   { name: 'Rapid-fire Kit', text: 'Gun becomes rapid calibre: many small bullets, quick turret.', cal: 'rapid' },
    heavy:   { name: 'Heavy Cannon', text: 'Gun becomes heavy calibre: huge slow shells, ignores most armour.', cal: 'heavy' },
    robot:   { name: 'New Robot', text: 'A fresh robot joins your garage (max 3).', robot: true },
    mech:    { name: 'Mechanic', text: '+1 credit income every round.', mech: true },
  };
  const WINNER_CRATE_POOL = ['plate', 'engine', 'motor', 'chip', 'hull', 'barrel', 'core', 'laser', 'mortar', 'saw', 'spinner', 'flame', 'rapid', 'heavy', 'mech'];
  const SCRAP_CRATES = [
    { id: 'patch', name: 'Scrap Patch Kit', text: 'Free field repair (−30 damage, or +2 credits if no robot needs repair).', patch: 30 },
    { id: 's_plate', name: 'Salvaged Plate', text: '+1 Armour on a robot (or +2 credits if maxed).', stat: 'armor' },
    { id: 's_hull', name: 'Salvaged Hull', text: '+1 Health on a robot (or +2 credits if maxed).', stat: 'hp' },
    { id: 's_engine', name: 'Salvaged Servo', text: '+1 Speed on a robot (or +2 credits if maxed).', stat: 'speed' },
    { id: 's_motor', name: 'Salvaged Gear', text: '+1 Turret turn on a robot (or +2 credits if maxed).', stat: 'turret' },
    { id: 's_chip', name: 'Salvaged Sights', text: '+1 Accuracy on a robot (or +2 credits if maxed).', stat: 'acc' },
    { id: 's_scheme', name: 'Black-Box Tape', text: 'Draw 1 intrigue card and gain +1 credit.', scheme: true },
  ];

  // ---- team sponsors (one rule each) ----
  const SPONSORS = {
    aegis:     { name: 'Aegis Heavy', tag: 'Built to Last', text: 'In Upkeep, each of your robots repairs 25 damage for free.' },
    blackwire: { name: 'Blackwire Syndicate', tag: 'Dirty Tricks', text: 'Draw +1 intrigue card in Upkeep (hand max 5); schemes need 2 less fame.' },
    sovereign: { name: 'Sovereign Foundry', tag: 'Deep Pockets', text: 'Start with 4 mechanics (instead of 3) and win deadlocked Market rebid ties.' },
    apex:      { name: 'Apex Media', tag: 'Prime Time', text: 'Gain +2 credits when you Host; robots become Fan Favourites at 2 wins (not 3).' },
    lucky:     { name: 'Lucky Seven', tag: 'House Edge', text: 'Bet up to 5 credits (instead of 3); losing bets refund 1 credit.' },
    vulture:   { name: 'Vulture Salvage', tag: 'Nothing Wasted', text: '+2 credits whenever any robot is scrapped; get 2 Scrap Crates when you lose.' },
  };
  const favWins = t => t.sponsor === 'apex' ? 2 : 3;
  const maxBet = t => t.sponsor === 'lucky' ? 5 : 3;

  const TEAMS = [
    { name: 'Blue Bolts', col: '#1f6feb', human: true },
    { name: 'Red Rivets', col: '#d62828' },
    { name: 'Green Gears', col: '#2a9d3a' },
    { name: 'Orange Ohms', col: '#e07b00' },
  ];
  let G;
  let botId = 0;
  function mkRobot(name, b) { return { id: ++botId, name, b: clone(b), dmg: 0, wins: 0 }; }
  function newGame() {
    G = {
      round: 1, phase: 'sponsor', draftPick: 1, starterDeck: shuffle(Object.keys(STARTERS)), starterChoices: [],
      host: -1, lastHost: -1,
      teams: TEAMS.map((t, i) => ({ ...t, i, sponsor: null, fame: 4, credits: 8, mechs: 3, hand: [], robots: [], tamper: {}, schemeLog: [] })),
      deck: shuffle(SCHEME_DECK.slice()), lots: shuffle(Object.keys(LOTS).concat(['plate', 'engine', 'chip', 'hull', 'mech', 'robot'])),
      fight: null, over: false,
    };
    $('#log').innerHTML = '';
    log('Opening Setup: Choose your Team Sponsor, then draft 2 stock robots (1 of 3 twice) from the 9-robot Starter Deck. First to ' + WIN_FAME + ' fame wins.');
    renderPickSponsor();
  }
  function renderPickSponsor() {
    let h = '<h2>Step 1 of 3 — Choose your Team Sponsor</h2><p>Each sponsor backs your garage with one special rule for the whole game. Next, you and the 3 AI teams will draft 2 stock robots from the 9-card Starter Deck.</p><div class="cards">';
    for (const id in SPONSORS) {
      const sp = SPONSORS[id];
      h += '<button class="card" data-sp="' + id + '" style="width:230px"><span class="k">' + esc(sp.tag) + '</span><b>' + esc(sp.name) + '</b><span class="muted">' + esc(sp.text) + '</span></button>';
    }
    h += '</div><div class="row"><button id="randSp">Random sponsor</button><button id="quickStart">Quick-Start (Random Sponsor & Draft)</button></div>';
    panel(h);
    const choose = (mySp, autoDraft) => {
      const rest = shuffle(Object.keys(SPONSORS).filter(k => k !== mySp));
      G.teams.forEach((t, i) => {
        t.sponsor = i === 0 ? mySp : rest[i - 1];
        if (t.sponsor === 'sovereign') t.mechs = 4;
      });
      log('You sign with <b>' + esc(SPONSORS[mySp].name) + '</b> (' + esc(SPONSORS[mySp].text) + ').', 'me');
      for (const t of G.teams) if (!t.human) log(tname(t.i) + ' is backed by <b>' + esc(SPONSORS[t.sponsor].name) + '</b>.');
      G.phase = 'draft';
      G.draftPick = 1;
      dealStarterChoicesDom();
      if (autoDraft) {
        pickStarterDom(G.starterChoices[0], true);
        pickStarterDom(G.starterChoices[0], true);
      } else {
        renderStarterDraft();
      }
    };
    $('#panel').querySelectorAll('[data-sp]').forEach(b => b.onclick = () => choose(b.dataset.sp, false));
    $('#randSp').onclick = () => choose(pick(Object.keys(SPONSORS)), false);
    $('#quickStart').onclick = () => choose(pick(Object.keys(SPONSORS)), true);
  }
  function dealStarterChoicesDom() {
    G.starterDeck = shuffle(G.starterDeck);
    G.starterChoices = G.starterDeck.splice(0, 3);
  }
  function aiDraftOneStarterDom(ti) {
    G.starterDeck = shuffle(G.starterDeck);
    const hand = G.starterDeck.splice(0, 3);
    const otherNames = [];
    for (const ot of G.teams) if (ot.i !== ti) for (const r of ot.robots) if (SMATRIX[r.name]) otherNames.push(r.name);
    let bestIdx = 0, bestScore = -1;
    hand.forEach((name, idx) => {
      const row = SMATRIX[name] || {};
      const score = otherNames.length

        : starterOverallAvg(name);
      if (score > bestScore) { bestScore = score; bestIdx = idx; }
    });
    const chosen = hand.splice(bestIdx, 1)[0];
    G.starterDeck.push(...hand);
    G.starterDeck = shuffle(G.starterDeck);
    G.teams[ti].robots.push(mkRobot(chosen, STARTERS[chosen]));

  }
  function pickStarterDom(chosenName, silentRender) {
    if (!G.starterChoices.includes(chosenName)) return;

  // ---------- 2. intrigue ----------

  function resolveScheme(from, id, to) {

    h += '<table><tr><th>Lot</th><th>What it does</th><th>Your bid</th></tr>';
    G.market.forEach((id, k) => h += '<tr><td><b>' + LOTS[id].name + '</b></td><td class="muted">' + LOTS[id].text + '</td><td><input type="number" min="0" max="' + t.credits + '" value="0" id="bid' + k + '" aria-label="Bid on ' + LOTS[id].name + '"></td></tr>');
    h += '<tr><td><b>Host the fight</b></td><td class="muted">Host gains 1 fame' + (t.sponsor === 'apex' ? ' (+2 credits from Apex Media)' : '') + ', picks which two teams fight, and decides if the loser is spared or scrapped.</td><td><input type="number" min="0" max="' + t.credits + '" value="0" id="bidH" aria-label="Bid to host"></td></tr></table>';

  function aiBids(t) {
    let budget = t.credits;
    const out = [];
    for (let k = 0; k < 4; k++) {
      const hostBonus = t.sponsor === 'apex' ? 1.2 : 0;
      const want = k === 3 ? (t.fame >= 9 ? 3 : 1.5) + hostBonus : (G.market[k] === 'robot' && t.robots.length < 3 ? 4 : G.market[k] === 'mech' ? 3 : 2.5);
      let b = Math.round(want * (0.4 + rnd() * 1.1));

  function finalizeDomLot(k, w, mx, note) {

  function renderDomRebid() {

  }

  }
  function applyLot(ti, lot, r) {

  // ---------- 4. arena: host picks ----------

  function renderHostPick() {

  }
  function invite(pair) {

  }
  function renderChooseRobot() {

  }
  function afterChoose() {

    // odds from the VISIBLE builds and current damage only (sabotage is hidden)
    const [ra, rb] = G.fight.robots;
    let w = 0; const N = 60;
    for (let k = 0; k < N; k++) {
      const sw = k % 2;
      const B = Sim.newBattle(sw ? [rb.b, ra.b] : [ra.b, rb.b], 7000 + k * 13);
      B.bots[sw ? 1 : 0].hp -= ra.dmg; B.bots[sw ? 0 : 1].hp -= rb.dmg;
      while (!B.over) Sim.step(B, 1 / 30);
      w += B.winner === (sw ? 1 : 0) ? 1 : B.winner === -1 ? 0.5 : 0;
    }
    const p = Math.max(0.03, Math.min(0.97, w / N));
    G.fight.p = [p, 1 - p];
    G.fight.pay = G.fight.p.map(x => Math.max(1.1, Math.min(6, Math.round(0.92 / x * 10) / 10)));

  }

  // ---------- 5. bets ----------
  function startBets() {

        '<span class="odds">' + Math.round(F.p[s] * 100) + '%</span><span class="muted">pays ' + F.pay[s] + '× your stake</span>' +
        '<label class="row">Bet <input type="number" min="0" max="' + lim + '" value="0" id="bet' + s + '"' + (mine >= 0 && mine !== s ? ' disabled' : '') + '> credits</label></div>';

  // ---------- 6. fight ----------
  let anim = null;

    const cv = $('#cv'), ctx = cv.getContext('2d');
    let last = performance.now(), acc = 0, doneT = 0;
    const loop = now => {
      if (G.phase !== 'fight') return;

      acc += dt * mult; while (acc >= 1 / 60 && !F.B.over) { Sim.step(F.B, 1 / 60); acc -= 1 / 60; }

      if (F.B.over) { doneT += dt; if (doneT > 1.2) { cancelAnimationFrame(anim); aftermath(); } }
    };

  }
  function drawFight(ctx, F) {

    const col = s => G.teams[F.teams[s]].col;

    for (const q of B.bullets) { ctx.fillStyle = col(q.owner); ctx.beginPath(); ctx.arc(q.x, q.y, Math.min(6, 1.6 + Math.sqrt(q.dmg) * 0.6), 0, 7); ctx.fill(); }

      ctx.strokeStyle = col(q.owner); ctx.lineWidth = 2;

        ctx.beginPath(); ctx.moveTo(b.x, b.y); ctx.arc(b.x, b.y, 130, b.turret - 0.42, b.turret + 0.42); ctx.closePath(); ctx.fill();
        ctx.restore();
      }
    }

      if (b.hp <= 0) {
        ctx.rotate(b.body); ctx.strokeStyle = col(b.i); ctx.lineWidth = 2; ctx.strokeRect(-SIZE / 2, -SIZE / 2, SIZE, SIZE);
        ctx.beginPath(); ctx.moveTo(-15, -15); ctx.lineTo(15, 15); ctx.moveTo(15, -15); ctx.lineTo(-15, 15); ctx.stroke(); ctx.restore(); continue;
      }
      if (b.s.weapon === 'spinner') {
        ctx.save(); ctx.rotate(b.spinA || 0); ctx.strokeStyle = col(b.i); ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(0, 0, SIZE * 0.72, 0, 7); ctx.stroke();
        for (let k = 0; k < 8; k++) { const a = k * Math.PI / 4; ctx.beginPath(); ctx.moveTo(Math.cos(a) * SIZE * 0.65, Math.sin(a) * SIZE * 0.65); ctx.lineTo(Math.cos(a + 0.18) * SIZE * 0.85, Math.sin(a + 0.18) * SIZE * 0.85); ctx.stroke(); }
        ctx.restore();
      }
      ctx.save(); ctx.rotate(b.body); ctx.fillStyle = col(b.i); ctx.globalAlpha = b.hitT > 0 ? 0.45 : 1; ctx.fillRect(-SIZE / 2, -SIZE / 2, SIZE, SIZE); ctx.globalAlpha = 1;
      const ar = Sim.LV.armor.indexOf(b.s.armor);
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 1; for (let k = 0; k < ar; k++) ctx.strokeRect(-12 + k * 3, -12 + k * 3, 24 - k * 6, 24 - k * 6);
      ctx.restore();
      ctx.rotate(b.turret); ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(0, 0, 7, 0, 7); ctx.fill();

      ctx.fillText(F.robots[b.i].name, b.x, b.y - 31);

    ctx.globalAlpha = 1;
    ctx.fillStyle = '#6f6f6f'; ctx.font = '12px system-ui, sans-serif'; ctx.textAlign = 'left'; ctx.fillText(B.t.toFixed(1) + ' s', 10, H - 10);
    if (B.over) { ctx.fillStyle = B.winner >= 0 ? col(B.winner) : '#111'; ctx.font = '700 24px system-ui, sans-serif'; ctx.textAlign = 'center'; ctx.fillText(B.winner >= 0 ? F.robots[B.winner].name + ' wins' : 'Draw', W / 2, 44); }
  }

  // ---------- 7. aftermath ----------
  function aftermath() {
    G.phase = 'after';
    const F = G.fight, B = F.B, w = B.winner;
    // damage carries over
    B.bots.forEach((b, s) => { const r = F.robots[s]; r.dmg = Math.min(maxHp(r), Math.round(maxHp(r) - Math.max(0, b.hp) * maxHp(r) / b.s.hp)); });
    for (const ti of F.teams) { G.teams[ti].tamper = {}; G.teams[ti].schemeLog = []; }
    if (w < 0) { log('The fight ends in a draw. Bets are returned.'); for (const x of F.bets) G.teams[x.team].credits += x.amt; nextRoundButton('<p>A draw. Nobody gains fame; bets are returned.</p>'); return; }
    const W = F.teams[w], Lt = F.teams[1 - w], wr = F.robots[w], lr = F.robots[1 - w];
    const wTeam = G.teams[W], lTeam = G.teams[Lt];
    wTeam.fame += 1; wTeam.credits += 3; wr.wins++;
    let msg = '<p>' + tname(W) + '\'s <b>' + esc(wr.name) + '</b> wins: +1 fame, +3 credits.';
    if (wr.wins === favWins(wTeam)) { wTeam.fame += 1; msg += ' Win #' + wr.wins + ': <b>' + esc(wr.name) + '</b> becomes a fan favourite (+1 fame).'; }
    msg += '</p>';
    log(tname(W) + '\'s ' + esc(wr.name) + ' beats ' + tname(Lt) + '\'s ' + esc(lr.name) + ' (+1 fame).', W === 0 || Lt === 0 ? 'me' : '');
    for (const x of F.bets) {
      if (x.side === w) { const p = Math.round(x.amt * F.pay[w]); G.teams[x.team].credits += p; log(tname(x.team) + ' collects ' + p + ' from the bookmaker.', x.team === 0 ? 'me' : ''); }
      else if (G.teams[x.team].sponsor === 'lucky') { G.teams[x.team].credits += 1; log(tname(x.team) + ' gets 1 credit back from Lucky Seven insurance.', x.team === 0 ? 'me' : ''); }
    }
    G.fight.winner = { team: W, robot: wr };
    G.fight.loser = { team: Lt, robot: lr };
    const favNeed = favWins(lTeam);
    if (G.host === 0) {
      let h = msg + '<p><b>You are the host.</b> ' + tname(Lt) + '\'s ' + esc(lr.name) + ' lies in pieces. Spare it, or have it scrapped?' + (lr.wins >= favNeed ? ' Scrapping a fan favourite costs you 1 fame.' : '') + '</p>' +
        '<div class="row"><button id="spare">Spare it</button><button id="scrap">Scrap it</button></div>';
      panel(h);
      $('#spare').onclick = () => fate(false, msg); $('#scrap').onclick = () => fate(true, msg);
    } else {
      const H = G.teams[G.host];
      const lead = G.teams.slice().sort((a, b) => b.fame - a.fame)[0].i;
      const baseChance = (Lt === lead ? 0.7 : 0.3) + (H.sponsor === 'vulture' ? 0.25 : 0);
      const scrap = G.host !== Lt && rnd() < baseChance && lr.wins < favNeed;
      fate(scrap, msg);
    }
  }
  function fate(scrap, msg) {
    const { team, robot } = G.fight.loser, T = G.teams[team];
    if (scrap) {
      if (robot.wins >= favWins(T)) G.teams[G.host].fame = Math.max(0, G.teams[G.host].fame - 1);
      T.robots.splice(T.robots.indexOf(robot), 1);
      log((G.host === 0 ? 'You give' : tname(G.host) + ' gives') + ' the thumbs down: ' + tname(team) + '\'s ' + esc(robot.name) + ' is scrapped.', team === 0 || G.host === 0 ? 'me' : '');
      msg += '<p>Thumbs down. <b>' + esc(robot.name) + '</b> is scrapped.</p>';
      for (const v of G.teams) if (v.sponsor === 'vulture') { v.credits += 2; log(tname(v.i) + ' salvages +2 credits from the scrap heap (Vulture Salvage).', v.i === 0 ? 'me' : ''); }
      if (!T.robots.length) { T.robots.push(mkRobot('Scrapbot', SCRAP)); log(tname(team) + ' is left with nothing but a Scrapbot.'); }
    } else {
      log((G.host === 0 ? 'You spare ' : tname(G.host) + ' spares ') + tname(team) + '\'s ' + esc(robot.name) + '.', team === 0 || G.host === 0 ? 'me' : '');
      msg += '<p>Thumbs up. <b>' + esc(robot.name) + '</b> goes back to the garage, badly dented.</p>';
    }
    resolveCrates(msg);
  }
  function giveScrapCrate(ti, preferredRobot) {
    const T = G.teams[ti], sc = pick(SCRAP_CRATES);
    if (sc.patch) {
      const dmgBot = (preferredRobot && T.robots.includes(preferredRobot) && preferredRobot.dmg > 0) ? preferredRobot : T.robots.filter(r => r.dmg > 0).sort((a, b) => b.dmg - a.dmg)[0];
      if (dmgBot) { const healed = Math.min(dmgBot.dmg, sc.patch); dmgBot.dmg -= healed; return sc.name + ' (−' + healed + ' dmg on ' + esc(dmgBot.name) + ')'; }
      T.credits += 2; return sc.name + ' (sold for +2 credits)';
    }
    if (sc.scheme) {
      const cap = T.sponsor === 'blackwire' ? 5 : 4;
      T.hand.push(draw1()); while (T.hand.length > cap) T.hand.shift();
      T.credits += 1;
      return sc.name + ' (+1 intrigue card, +1 credit)';
    }
    if (sc.stat) {
      const cands = T.robots.filter(r => r.b.lv[sc.stat] < 4);
      const tgt = (preferredRobot && cands.includes(preferredRobot)) ? preferredRobot : cands.sort((a, b) => power(b) - power(a))[0];
      if (tgt) { tgt.b.lv[sc.stat]++; return sc.name + ' (+1 ' + STATNAME[sc.stat] + ' on ' + esc(tgt.name) + ')'; }
      T.credits += 2; return sc.name + ' (maxed, sold for +2 credits)';
    }
    return sc.name;
  }
  function resolveCrates(msg) {
    const { team: Lt, robot: lr } = G.fight.loser, { team: W, robot: wr } = G.fight.winner;
    const lTeam = G.teams[Lt], wTeam = G.teams[W];
    const scrapCount = lTeam.sponsor === 'vulture' ? 2 : 1;
    const scrapGot = [];
    for (let k = 0; k < scrapCount; k++) scrapGot.push(giveScrapCrate(Lt, lr));
    const scrapSummary = scrapGot.join(' and ');
    log(tname(Lt) + ' opens ' + (scrapCount > 1 ? '2 Scrap Crates' : 'a Scrap Crate') + ': ' + scrapSummary + '.', Lt === 0 ? 'me' : '');
    msg += '<p><b>Scrap Crate (' + tname(Lt) + '):</b> ' + scrapSummary + '.</p>';

    const choices = shuffle(WINNER_CRATE_POOL.slice()).slice(0, 3);
    if (W === 0) {
      G.crateChoices = choices;
      G.crateBot = Math.max(0, wTeam.robots.indexOf(wr));
      renderWinnerCrate(msg);
    } else {
      const pickLot = choices.find(id => LOTS[id].mech || aiPickRobot(wTeam, id)) || choices[0];
      const tgt = needsRobot(pickLot) ? (aiPickRobot(wTeam, pickLot) || wr) : null;
      applyLot(W, pickLot, tgt);
      const detail = LOTS[pickLot].mech ? '+1 Mechanic' : (tgt ? 'on ' + esc(tgt.name) : '');
      log(tname(W) + ' picks <b>' + LOTS[pickLot].name + '</b> from the Winner\'s Crate ' + detail + '.');
      msg += '<p><b>Winner\'s Crate (' + tname(W) + '):</b> picked <b>' + LOTS[pickLot].name + '</b> ' + detail + '.</p>';
      nextRoundButton(msg);
    }
  }
  function renderWinnerCrate(msg) {
    const t = me(), choices = G.crateChoices;
    let h = '<h2>Aftermath</h2>' + msg + '<h3>Winner\'s Crate: pick 1 of 3</h3><p>Choose your prize from the arena crate.</p>';
    if (t.robots.length > 1) {
      h += '<div class="row"><span>Install part on:</span>' + t.robots.map((r, k) => '<button data-cb="' + k + '"' + (G.crateBot === k ? ' class="primary"' : '') + '>' + esc(r.name) + ' (' + esc(buildText(r)) + ')</button>').join('') + '</div>';
    }
    h += '<div class="cards">' + choices.map(id => '<button class="card" data-wc="' + id + '"><span class="k">Winner\'s Crate</span><b>' + esc(LOTS[id].name) + '</b><span class="muted">' + esc(LOTS[id].text) + '</span></button>').join('') + '</div>';
    panel(h);
    $('#panel').querySelectorAll('[data-cb]').forEach(b => b.onclick = () => { G.crateBot = +b.dataset.cb; renderWinnerCrate(msg); });
    $('#panel').querySelectorAll('[data-wc]').forEach(b => b.onclick = () => {
      const id = b.dataset.wc, r = t.robots[G.crateBot] || t.robots[0];
      applyLot(0, id, r);
      const detail = LOTS[id].mech ? '(+1 Mechanic)' : 'on ' + esc(r.name);
      log('Winner\'s Crate: you pick <b>' + LOTS[id].name + '</b> ' + detail + '.', 'me');
      nextRoundButton(msg + '<p><b>Winner\'s Crate:</b> you picked <b>' + esc(LOTS[id].name) + '</b> ' + detail + '.</p>');
    });
  }
  function nextRoundButton(msg) {
    renderTop();
    if (checkWin()) return;
    panel('<h2>Aftermath</h2>' + msg + '<div class="row"><button class="primary" id="go">Next round</button></div>');
    $('#go').onclick = () => { G.round++; G.host = -1; G.fight = null; startRound(); };
  }

  newGame();
})();
</script>
