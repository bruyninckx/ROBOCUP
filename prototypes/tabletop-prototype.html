    notify('👑 <b>Host bid:</b> every team bids in secret for the right to host this round.', '#111');
    updateHud();
  }
  // AI host bid: what it is worth to this team, from the credits left after the lots
  function aiHostBid(t) {
    const want = (t.fame >= 9 ? 3 : 1.5) + (t.sponsor === 'apex' ? 1.2 : 0);
    return Math.max(0, Math.min(Math.round(want * (0.4 + rnd() * 1.1)), t.credits, Math.ceil(t.credits * 0.6)));
  }
  function resolveHostBid(myBid) {
    if (G.marketAuction) return;
    const all = G.teams.map(t => { const b = zeroBids(); b[HOST_K] = Math.min(t.credits, t.i === viewerSeat ? myBid : aiHostBid(t)); return b; });
    G.teams.forEach((t, i) => { if (t.shill && all[i][HOST_K]) all[i][HOST_K] = Math.max(0, all[i][HOST_K] - t.shill); });
    G.marketAuction = { all, initialAll: all.map(b => b.slice()), rebidAdds: G.teams.map(zeroBids), curK: HOST_K, lastK: HOST_K, hostOnly: true, wins: [], results: [], tie: null };
    stepMarketAuction();
  }

  function aiBids(t) {
    let budget = t.credits;
    return zeroBids().map((_, k) => {
      if (k === HOST_K) return 0;                          // hosting is a separate bid after the lots
      if (!canTake(t, G.market[k])) {                      // no robot of ours can take it: only as a cheap Stash buy (to trade, or to keep it from a rival)
        const lead = leaderOf(), g = lead !== t ? partGain(lead, G.market[k]) : null;
        const b = (g && g.d > 0.08) || rnd() < 0.2 ? Math.min(budget, 1 + (rnd() < 0.4 ? 1 : 0)) : 0;
        budget -= b; return b;
      }
      const want = LOTS[G.market[k]].robot ? robotWant(t, G.market[k], 4) : G.market[k] === 'eng' ? 3 : 2.2;
      let b = Math.round(want * (0.4 + rnd() * 1.1));
      b = Math.max(0, Math.min(b, budget, Math.ceil(t.credits * 0.6)));
      budget -= b;
      return b;
    });
  }

  function aiRebid(t, k, curBid, maxAdd) {
    if (maxAdd <= 0) return 0;
    if (k < NLOTS && !canTake(t, G.market[k])) return Math.min(maxAdd, rnd() < 0.3 ? 1 : 0);
    const lotId = k < NLOTS ? G.market[k] : 'host';
    const maxWilling = k === HOST_K
      ? (t.fame >= 9 ? 4.5 : 2.5) + (t.sponsor === 'apex' ? 1.5 : 0)
      : (LOTS[lotId].robot ? robotWant(t, lotId, 5.5) : (lotId === 'eng' || lotId === 'mech') ? 4.2 : 3.5) + (t.sponsor === 'sovereign' ? 1.0 : 0);
    const add = Math.round(Math.max(0, maxWilling - curBid) * (0.35 + rnd() * 0.85));
    return Math.max(0, Math.min(maxAdd, add));
  }

  function availForRebid(ti, k) {
    const A = G.marketAuction;
    if (!A) return 0;
    let futureCommitted = 0;
    for (let m = k + 1; m <= HOST_K; m++) futureCommitted += (A.all[ti][m] || 0);
    return Math.max(0, G.teams[ti].credits - (A.all[ti][k] || 0) - futureCommitted);
  }

  /* ---------- New Robot lots (Kev, 6 Nov): the lot is a real robot from the starter deck, shown on its tile ---------- */
  function drawStarter() {
    const inMarket = new Set((G.market || []).map(id => LOTS[id] && LOTS[id].starter).filter(Boolean));
    if (!G.starterDeck || !G.starterDeck.length) {
      const taken = new Set(G.teams.flatMap(t => t.robots.map(r => r.name)));
      G.starterDeck = shuffle(Object.keys(STARTERS).filter(k => !taken.has(k) && !inMarket.has(k)));
    }
    return G.starterDeck.pop() || null;
  }
  const returnStarter = n => { if (n && STARTERS[n] && !G.starterDeck.includes(n) && !G.teams.some(t => t.robots.some(r => r.name === n))) G.starterDeck.unshift(n); };
  function robotLot(n) {
    const bot = mkRobot(n, STARTERS[n].b), id = 'robot:' + n;
    LOTS[id] = { name: n, icon: '🤖', text: wepName(bot.b) + ' · ' + bot.b.range + ' · ' + Sim.LV.hp[bot.b.lv.hp] + ' HP', robot: true, starter: n, bot, desc: STARTERS[n].d };
    return id;
  }
  function dealLot() {
    let id = G.lots.pop();
    if (LOTS[id] && LOTS[id].robot) {
      if (LOTS[id].starter) returnStarter(LOTS[id].starter);
      const n = drawStarter();
      id = n ? robotLot(n) : 'mech';
    }
    return id;
  }
  // what a robot lot is worth to an AI team: more when the bookie rates it well against that team's rivals
  function robotWant(t, id, base) {
    const L = LOTS[id];
    if (t.robots.length >= 3) return 1;
    const p = L && L.bot ? fieldOdds(t.i, Object.assign({}, L.bot.b, { eng: Math.min(1, freeEng(t)) })).p : null;
    return base + (p == null ? 0 : (p - 0.5) * 5);
  }
  const needsRobot = id => !LOTS[id].robot && !LOTS[id].mech && !LOTS[id].eng;
  // can this part go on this robot? Weapon upgrades need that weapon, calibres need a gun (no weapon swaps)
  function canFit(r, L) {
    if (!r || !L) return false;
    if (L.wup) return (r.b.weapon || 'gun') === Sim.WUPS[L.wup].for;
    if (L.cal) return (r.b.weapon || 'gun') === 'gun' && (r.b.cal || 'medium') !== L.cal;
    if (L.stat) return r.b.lv[L.stat] < 4;
    return true;
  }
  const canTake = (t, id) => !needsRobot(id) || t.robots.some(r => canFit(r, LOTS[id]));
  function aiPickRobot(t, lot) {
    const L = LOTS[lot];
    const fit = t.robots.filter(r => canFit(r, L));
    if (!fit.length) return null;
    let cands = fit;
    if (L.mod) cands = cands.filter(r => !r.b.mod);
    if (L.arm) cands = cands.filter(r => !r.b.arm);
    if (L.helper) cands = cands.filter(r => (r.b.helpers || []).length < 3);
    if (!cands.length) cands = fit;   // every robot has one already: replace it on the strongest
    return cands.slice().sort((a, b) => power(b) - power(a))[0];
  }
  // which stats a weapon actually uses (src/sim.js): flame and spinner ignore accuracy and velocity, beams ignore velocity
  const UNUSED_STATS = { flame: ['acc', 'bullet'], spinner: ['acc', 'bullet'], laser: ['bullet'], railgun: ['bullet'] };
  const WUP_SHORT = { barrel: 'barrel', lens: 'lens', serrated: 'serrated', ricochet: 'ricochet', napalm: 'napalm', cluster: 'cluster' };
  const wepName = b => (b.weapon === 'gun' ? (b.cal || 'medium') + ' gun' : b.weapon) + (Sim.wupOf(b) ? ' + ' + WUP_SHORT[b.wup] : '');
  // what a lot does to this robot in real numbers (Sim.statsOf before/after), e.g. "HP 85→110 · Speed 118→113"
  const PREVIEW_F = [['hp', 'HP', 0, ''], ['armor', 'Armour', 1, '/hit'], ['speed', 'Speed', 0, ''], ['turret', 'Turret', 0, '°/s'], ['fp', 'Firepower', 1, ' dps'], ['acc', 'Accuracy', 0, '%'], ['bullet', 'Velocity', 0, '']];
  function lotAfter(r, L) {
    const nb = clone(r.b);
    if (L.stat) { if (nb.lv[L.stat] >= 4) return null; nb.lv[L.stat]++; }
    if (L.cal) { if (nb.weapon !== 'gun') return null; nb.cal = L.cal; }
    if (L.wup) nb.wup = L.wup;
    if (L.mod) nb.mod = L.mod;
    if (L.arm) nb.arm = L.arm;
    return nb;
  }
  function lotDiff(r, L) {
    if (!L || !r || !(L.stat || L.cal || L.wup || L.mod || L.arm)) return [];
    if (!canFit(r, L)) return null;
    const nb = lotAfter(r, L);
    if (!nb) return null;   // stat already at max
    const a = Sim.statsOf(r.b), b = Sim.statsOf(nb), f = (v, d) => d ? (Math.round(v * 10) / 10).toString() : Math.round(v).toString();
    return PREVIEW_F.filter(([k]) => Math.abs((b[k] || 0) - (a[k] || 0)) > 0.05).map(([k, l, d, u]) => ({ k, l, from: f(a[k], d), to: f(b[k], d), u }));
  }
  function lotPreview(r, L) {
    const d = lotDiff(r, L);
    if (d === null) return L.stat ? 'already maxed: no gain!' : 'doesn\'t fit this robot';
    const s = d.map(x => x.l + ' ' + x.from + '→' + x.to + x.u).join(' · ');
    return L.arm && L.arm !== 'mesh' ? L.text + (s ? ' · ' + s : '') : s || L.text;
  }
  // short line for the auction tile: the main stat on each of your robots
  function lotGainShort(t, L) {
    if (!L || !(L.stat || L.arm === 'mesh') || !t.robots.length) return '';
    const key = L.stat || 'armor', lab = PREVIEW_F.find(x => x[0] === key);
    return lab[1] + ': ' + t.robots.map(r => { const d = lotDiff(r, L); if (d === null) return 'max'; const x = d.find(y => y.k === key); return x ? x.from + '→' + x.to : '='; }).join(' / ');
  }

  function weaponSwapNote(r, L) {
    if (!L || !L.cal || r.b.weapon !== 'gun') return '';
    const nb = { weapon: 'gun', cal: L.cal };
    if (nb.weapon === r.b.weapon && (nb.weapon !== 'gun' || nb.cal === r.b.cal)) return '';
    const lv = r.b.lv, lost = (UNUSED_STATS[r.b.weapon] || []).filter(k => !(UNUSED_STATS[nb.weapon] || []).includes(k));
    const nameOf = { acc: 'Accuracy', bullet: 'Velocity' };
    const lines = ['<b>' + esc(wepName(r.b)) + '</b> → <b>' + esc(wepName(nb)) + '</b>. The robot keeps its stat levels; only the weapon changes.'];
    if (lost.length) lines.push('⚠️ ' + lost.map(k => nameOf[k] + ' ' + lv[k] + '/4').join(' and ') + ': the old weapon ignored ' + (lost.length > 1 ? 'these' : 'this') + ', the new one needs ' + (lost.length > 1 ? 'them' : 'it') + '.');
    const gone = (UNUSED_STATS[nb.weapon] || []).filter(k => !(UNUSED_STATS[r.b.weapon] || []).includes(k));
    if (gone.length) lines.push('Points in ' + gone.map(k => nameOf[k]).join(' and ') + ' are wasted on the new weapon.');
    if (nb.weapon === 'gun' && nb.cal !== 'medium') { const c = Sim.CAL[nb.cal]; lines.push('A ' + nb.cal + ' gun turns its turret at ×' + c.turret + ' and fires ' + (c.rate > 1.4 ? 'faster' : 'slower') + ' than a medium gun.'); }
    if (r.b.weapon !== 'gun' && nb.weapon === 'gun') lines.push('Range is reset to <b>mid</b>; change it with the Range button.');
    const pv = lotPreview(r, L);
    if (pv) lines.push('In numbers: ' + pv + '.');
    return lines.join('<br>');
  }

  function applyLot(ti, lot, r) {
    const t = G.teams[ti], L = LOTS[lot];
    if (L.mech) { t.mechs++; return '+1 Mechanic Pool'; }
    if (L.eng) {
      t.engPool++;
      const needBot = t.robots.slice().sort((a, b) => Sim.strainOf(b.b).total - Sim.strainOf(a.b).total).find(x => (x.b.eng || 0) < 3);
      if (needBot) needBot.b.eng = (needBot.b.eng || 0) + 1;
      return needBot ? `Assigned to ${needBot.name}` : '+1 Engineer Pool';
    }
    if (L.robot) {
      if (t.robots.length >= 3) { t.credits += 2; if (L.starter) { returnStarter(L.starter); L.bot = null; } return 'Bays Full (+2 Cr)'; }
      let nr;
      if (L.bot) { nr = L.bot; L.bot = null; }   // the robot shown on the tile
      else {
        if (!G.starterDeck || !G.starterDeck.length) G.starterDeck = shuffle(Object.keys(STARTERS));
        const n = G.starterDeck.pop();
        nr = mkRobot(n, STARTERS[n].b);
      }
      nr.b.eng = Math.min(1, freeEng(t));
      t.robots.push(nr);
      return `New Bot: ${nr.name}`;
    }
    if (!r) return '';
    if (!canFit(r, L)) return 'No robot can use it';   // no weapon swaps (Kev, 6 Nov); checked before a stat goes up
    if (L.stat) r.b.lv[L.stat] = Math.min(4, r.b.lv[L.stat] + 1);
    if (L.cal) r.b.cal = L.cal;
    if (L.wup) r.b.wup = L.wup;
    const t_ = G.teams[ti], oldLot = (k, v) => Object.keys(LOTS).find(id => LOTS[id][k] === v);
    if (L.mod) { if (r.b.mod && r.b.mod !== L.mod) { const o = oldLot('mod', r.b.mod); if (o) toStash(t_, o); } r.b.mod = L.mod; }
    if (L.arm) { if (r.b.arm && r.b.arm !== L.arm) { const o = oldLot('arm', r.b.arm); if (o) toStash(t_, o); } r.b.arm = L.arm; }
    if (L.helper) {
      r.b.helpers = r.b.helpers || [];
      if (r.b.helpers.length < 3) r.b.helpers.push(L.helper);
      else r.b.helpers[r.b.helpers.length - 1] = L.helper;
    }
    return `Fitted on ${r.name}`;
  }

  function resolveMarket(myBids) {
    if (G.marketAuction) return;   // already resolving (rebid or Botched Install window)
    const all = G.teams.map(t => t.i === viewerSeat ? myBids.slice() : aiBids(t));
    G.teams.forEach((t, i) => { if (t.shill) { all[i] = all[i].map(v => Math.max(0, v - t.shill)); if (all[i].some(v => v)) notify('🏢 Shill Bidder: ' + esc(t.name) + '\'s bids count ' + t.shill + ' lower.', t.col); } });
    all.forEach(b => { b[HOST_K] = 0; });
    G.marketAuction = {
      all, lastK: NLOTS - 1,
      initialAll: all.map(b => b.slice()),
      rebidAdds: G.teams.map(zeroBids),
      curK: 0,
      wins: [],
      results: [],
      tie: null
    };
    stepMarketAuction();
  }

  function submitHumanRebid() {
    const A = G.marketAuction;
    if (!A || !A.tie) return;
    const { k, teams, baseBid, myAdd } = A.tie;
    const adds = [];
    teams.forEach(ti => {
      const add = ti === viewerSeat ? myAdd : aiRebid(G.teams[ti], k, baseBid, availForRebid(ti, k));
      A.all[ti][k] += add;
      A.rebidAdds[ti][k] += add;
      adds.push(add);
    });
    A.tie.lastMaxAdd = Math.max(...adds);
    A.tie.waitingHuman = false;
    stepMarketAuction();
  }

  function finalizeLotResult(k, w, mx, rebidNote) {
    const A = G.marketAuction;
    const col = A.all.map(b => b[k]);
    const initCol = A.initialAll.map(b => b[k]);
    const addCol = A.rebidAdds.map(b => b[k]);
    if (w >= 0 && mx > 0) {
      G.teams[w].credits -= mx;
    }
    if (k < NLOTS) {
      const lotId = G.market[k], L = LOTS[lotId];
      if (w >= 0) A.wins.push({ idx: k, lot: lotId, team: w, price: mx });
      else if (L.starter) { returnStarter(L.starter); L.bot = null; }   // an unsold robot goes back to the starter deck
      A.results.push({
        idx: k, id: lotId, name: L.name, icon: L.icon, text: L.text,
        winner: w, price: mx, bids: col, initBids: initCol, addBids: addCol,
        rebidNote: rebidNote || '', target: w < 0 ? 'Unclaimed' : ''
      });
    } else {
      G.host = w >= 0 ? w : Math.floor(rnd() * 4);
      const hostT = G.teams[G.host];
      A.results.push({
        idx: HOST_K, id: 'host', name: 'Host the Fight', icon: '👑', text: '+1 Fame & Pick Fighters',
        winner: G.host, price: w >= 0 ? mx : 0, bids: col, initBids: initCol, addBids: addCol,
        rebidNote: rebidNote || '',
        target: w >= 0 ? '+1 Fame' + (hostT.sponsor === 'apex' ? ' & +2 Cr' : '') : 'Random Draw (0 Cr)'
      });
    }
  }

  function stepMarketAuction() {
    const A = G.marketAuction;
    if (!A) return;

    while (A.curK <= A.lastK) {
      const k = A.curK;
      const lotName = k < NLOTS ? LOTS[G.market[k]].name : 'Host the Fight';
      const col = A.all.map(b => b[k]);
      const eligible = A.tie && A.tie.k === k ? A.tie.teams : [0, 1, 2, 3];
      const mx = Math.max(...eligible.map(ti => col[ti]));

      if (mx <= 0) {
        finalizeLotResult(k, -1, 0, '');
        A.tie = null;
        A.curK++;
        continue;
      }

      const contenders = eligible.filter(ti => col[ti] === mx);
      if (contenders.length === 1) {
        const w = contenders[0];
        const hadRebid = A.tie && A.tie.k === k;
        const note = hadRebid ? `Won Rebid (${A.initialAll[w][k]}+${A.rebidAdds[w][k]} Cr)` : '';
        if (hadRebid) {
          notify(`⚔️ <b>${esc(G.teams[w].name)}</b> won the tie-break rebid on <b>${esc(lotName)}</b> (${mx} Cr total)!`, G.teams[w].col);
        }
        finalizeLotResult(k, w, mx, note);
        A.tie = null;
        A.curK++;
        continue;
      }

      // Tie among 2+ teams at mx > 0!
      // Rulebook (5 Nov): Sovereign Foundry wins any tie it's in outright, without a rebid.
      const sov = contenders.find(ti => G.teams[ti].sponsor === 'sovereign');
      if (sov != null) {
        notify(`⚖️ Tie on <b>${esc(lotName)}</b> at ${mx} Cr — <b>${esc(G.teams[sov].name)}</b> wins outright (Sovereign Foundry)!`, G.teams[sov].col);
        finalizeLotResult(k, sov, mx, 'Sovereign wins ties');
        A.tie = null;
        A.curK++;
        continue;
      }
      // If a rebid round just took place and nobody added any credits, the team with less fame wins.
      if (A.tie && A.tie.k === k && A.tie.lastMaxAdd === 0) {
        const sorted = contenders.slice().sort((a, b) => G.teams[a].fame - G.teams[b].fame || a - b);
        const w = sorted[0];
        const reason = 'Low-Fame Tiebreak';
        notify(`⚖️ Rebid stalemate on <b>${esc(lotName)}</b> at ${mx} Cr — <b>${esc(G.teams[w].name)}</b> wins (${reason})!`, G.teams[w].col);
        finalizeLotResult(k, w, mx, reason);
        A.tie = null;
        A.curK++;
        continue;
      }

      // Start or continue Spartacus Rebid among tied contenders!
      if (contenders.includes(viewerSeat)) {
        A.tie = {
          k,
          teams: contenders,
          baseBid: mx,
          myAdd: 0,
          maxMyAdd: availForRebid(viewerSeat, k),
          waitingHuman: true,
          lastMaxAdd: null
        };
        updateHud();
        return; // Wait for human rebid input
      } else {
        // AI-only tie: resolve secret AI rebids immediately
        const adds = [];
        contenders.forEach(ti => {
          const add = aiRebid(G.teams[ti], k, mx, availForRebid(ti, k));
          A.all[ti][k] += add;
          A.rebidAdds[ti][k] += add;
          adds.push(add);
        });
        A.tie = {
          k,
          teams: contenders,
          baseBid: mx,
          waitingHuman: false,
          lastMaxAdd: Math.max(...adds)
        };
        // Loop continues on same k to evaluate the new rebid totals!
      }
    }

    if (A.hostOnly) {
      const hostT = G.teams[G.host], res = A.results[0];
      hostT.fame += 1;
      if (hostT.sponsor === 'apex') hostT.credits += 2;
      notify('👑 <b>' + esc(hostT.name) + '</b> is Arena Host' + (res && res.price ? ' for ' + res.price + ' Cr' : ' (nobody bid: random draw)') + ' (+1 Fame' + (hostT.sponsor === 'apex' ? ', +2 Cr Apex' : '') + ').', hostT.col);
      G.marketResults = (G.marketResults || []).filter(r => r.idx !== HOST_K).concat(A.results);
      tlog('host_bid', { host: G.host, price: res ? res.price : 0, bids: res ? res.bids : null });
      G.hostResolved = true; G.marketResolved = true; G.marketAuction = null; G.marketStage = 'done';
      if (checkWin()) return;
      updateHud();
      return;
    }
    // All lots resolved! First a window for Botched Install, then the installs (hosting is bid for afterwards)
    if (!A.sabotageDone) {
      for (const x of A.wins) notify('📦 <b>' + esc(G.teams[x.team].name) + '</b> won ' + lotRef(x.lot) + ' (' + x.price + ' Cr).', G.teams[x.team].col);
      A.sabotageDone = true; G.ivBusy = true; updateHud();
      botchedWindow(A).catch(e => console.error(e)).then(() => { G.ivBusy = false; stepMarketAuction(); });
      return;
    }
    G.pendingInstall = A.wins.filter(x => x.team === viewerSeat && needsRobot(x.lot) && canTake(me(), x.lot));
    for (const x of A.wins) {
      if (x.team !== viewerSeat || !needsRobot(x.lot) || !canTake(me(), x.lot)) {
        const pickR = x.team === viewerSeat ? null : aiPickRobot(G.teams[x.team], x.lot);
        const toBox = needsRobot(x.lot) && !canTake(G.teams[x.team], x.lot);
        const dest = toBox ? (toStash(G.teams[x.team], x.lot) ? '📦 To the Stash' : '🏦 Stash full: sold') : applyLot(x.team, x.lot, pickR);
        A.results[x.idx].target = dest;
      } else {
        A.results[x.idx].target = '▼ Click a Robot Bay below';
      }
    }
    G.marketResults = A.results;
    tlog('market', { lots: A.results.map(r => ({ id: r.id, winner: r.winner, price: r.price, bids: r.bids, target: r.target })) });
    G.marketResolved = true;
    G.marketAuction = null;
    if (checkWin()) return;
    updateHud();
  }

  /* ---------- Botched Install (Kev, 6 Nov): stopping a rival's upgrade is a scheme, not a dead bid ----------
   * After the lots are won and before anything is fitted, every team holding Botched Install may play it on a
   * rival's part. Normal defence: the target's Security Bots roll 4-6, then the reaction window. If it lands, the
   * part is scrapped (bottom of the lot deck), the winner gets half its bid back and the saboteur 1 Cr. */
  function partThreat(ti, lot) {   // best band jump the part gives one of the winner's robots, or null while the bookie works
    const T = G.teams[ti];
    let best = null;
    for (const r of T.robots) {
      const nb = lotBuild(r, LOTS[lot]); if (!nb) continue;
      const a = fieldOdds(ti, r.b).p, b = fieldOdds(ti, nb).p;
      if (a == null || b == null) continue;
      const jump = BANDS.indexOf(bandOf(a)) - BANDS.indexOf(bandOf(b));
      if (!best || jump > best.jump || (jump === best.jump && b - a > best.d)) best = { r, a, b, jump, d: b - a };
    }
    return best;
  }
  async function botchedWindow(A) {
    const parts = A.wins.filter(x => needsRobot(x.lot) && canTake(G.teams[x.team], x.lot));
    for (const x of parts) {
      const W = G.teams[x.team], th = partThreat(x.team, x.lot);
      const thTxt = th ? esc(th.r.name) + ': ' + bandOf(th.a).short + ' → ' + bandOf(th.b).short : '';
      for (const oi of [viewerSeat].concat([0, 1, 2, 3].filter(i => i !== viewerSeat))) {
        const o = G.teams[oi];
        if (o === W || !o.hand.includes('botched_install') || o.fame < (CARDS.botched_install.need || 0)) continue;
        let yes = oi === viewerSeat
          ? await ivModal('🔧 Botched Install?', nm(W) + ' won ' + lotRef(x.lot) + ' for ' + x.price + ' Cr.' + (thTxt ? '<br>🎩 Best fit: <b>' + thTxt + '</b>' : '') + '<br>Play ' + cardRef('botched_install') + ': the install fails and the part is scrapped (they get ' + Math.floor(x.price / 2) + ' Cr back, you take 1 Cr). Or threaten it and ask for a payoff.',
              [{ label: '🔧 Botch it', value: () => true }, { label: '💰 Demand a payoff', value: () => 'pay' }, { label: 'Let it go', secondary: true, value: () => false }])
          : (th && th.jump >= 1) || (W === leaderOf() && x.price >= 3 && rnd() < 0.6) || (!th && x.price >= 4 && rnd() < 0.5);
        if (!yes) continue;
        // a threat first: pay off the holder and the card stays in its hand
        const demand = Math.ceil(x.price / 2) + 1;
        if (yes === 'pay') {
          const d = await dealPanel({ title: '💰 Payoff from ' + esc(W.name), intro: 'What do you want from ' + nm(W) + ' to leave its ' + lotRef(x.lot) + ' alone?', from: W, give: false, want: true, lock: 'Lock in demand' });
          const ask = d && d.want;
          if (ask && !bundleEmpty(ask) && bundleWorth(W, ask) <= partWorth(W, x.lot) + 1) { transfer(W, o, ask); notify('💰 ' + nm(W) + ' pays you ' + bundleText(ask) + ' to keep its ' + lotRef(x.lot) + ' safe.', W.col); break; }
          if (ask && !bundleEmpty(ask)) notify('✋ ' + nm(W) + ' refuses to pay ' + bundleText(ask) + '.', W.col);
          yes = await ivModal('🔧 Botch it now?', nm(W) + ' didn\'t pay. Play ' + cardRef('botched_install') + ' on its ' + lotRef(x.lot) + '?', [{ label: '🔧 Botch it', value: () => true }, { label: 'Let it go', secondary: true, value: () => false }]);
          if (!yes) continue;
        } else if (oi !== viewerSeat) {
          if (W.i === viewerSeat) {
            const pay = await ivModal('💰 A threat', nm(o) + ' says it will wreck your ' + lotRef(x.lot) + ' (' + cardRef('botched_install') + ') unless you pay <b>' + demand + ' Cr</b>.', [{ label: 'Pay ' + demand + ' Cr', value: () => 'pay' }, { label: '🤝 Offer something else', value: () => 'deal' }, { label: 'Refuse', secondary: true, value: () => null }]);
            if (pay === 'pay' && me().credits >= demand) { transfer(W, o, { cr: demand, items: [] }); notify('💰 You pay ' + nm(o) + ' ' + demand + ' Cr to keep your ' + lotRef(x.lot) + '.', W.col); break; }
            if (pay === 'deal') {
              const d = await dealPanel({ title: '🤝 Buy off ' + esc(o.name), intro: 'It wants about ' + demand + ' Cr.', from: o, lock: 'Lock in offer' });
              if (d && bundleWorth(o, d.give) >= demand - 1) { transfer(W, o, d.give); notify('💰 ' + nm(o) + ' takes ' + bundleText(d.give) + ' and leaves your ' + lotRef(x.lot) + ' alone.', o.col); break; }
              notify('✋ ' + nm(o) + ' isn\'t bought off.', o.col);
            }
          } else if (W.credits >= demand + 1 && partWorth(W, x.lot) >= demand && rnd() < 0.5) {
            transfer(W, o, { cr: demand, items: [] }); notify('💰 ' + nm(W) + ' pays ' + nm(o) + ' ' + demand + ' Cr to keep its ' + lotRef(x.lot) + ' safe.', W.col); break;
          }
        }
        { const ph = playHead(o, 'botched_install', W); logBegin(ph[0], o.col, ph[1], ph[2]); }
        notify('target: ' + lotRef(x.lot) + (thTxt ? ' (' + thTxt + ')' : ''));
        removeFromHand(o, 'botched_install');
        const d = await defend(o, CARDS.botched_install, W);
        discardCard('botched_install');
        if (!d.blocked) {
          x.botched = true;
          const back = Math.floor(x.price / 2); W.credits += back; o.credits += 1;
          G.lots.unshift(x.lot);
          A.results[x.idx].target = '🔧 Botched: scrapped';
          notify('🔧 The install fails: ' + lotRef(x.lot) + ' is scrapped. ' + nm(W) + ' gets ' + back + ' Cr back, ' + nm(o) + ' takes 1 Cr.', o.col);
        }
        logEnd(d.blocked ? 'blocked' : 'landed');
        updateHud();
        break;   // one Botched Install per part
      }
    }
    A.wins = A.wins.filter(x => !x.botched);
  }

  /* ---------- Phase 4: Host step, then invites ----------
   * Kev, 6 Nov: Arena cards. The fight has a format: 'duel' (host invites 2), 'mirror' (duel, every robot fights as
   * 2 copies), 'ffa' (Grand Melee: every team with a ready robot), '2v2' (Grand Final / Tag Team Licence). The House
   * Robot can join any format. A fight has entrants (one team + robot each) on sides: F.teams[e], F.robots[e],
   * F.sides[e]; bets, odds and the winner are per side. */
  const HOUSE_BUILD = { lv: L(3, 2, 2, 2, 3, 2, 1), range: 'mid', weapon: 'gun', cal: 'heavy', mod: null, helpers: [], eng: 2 };
  const HOUSE_COL = '#5b5b5b';
  const FORMAT_NAME = { duel: 'Duel', mirror: 'Mirror duel', ffa: 'Free-for-all', '2v2': '2v2' };
  const sideTeams = (F, sd) => F.teams.filter((_, e) => F.sides[e] === sd);
  const sideName = (F, sd) => sd === 'house' || sd === 9 ? 'House Robot' : sideTeams(F, sd).map(ti => G.teams[ti].name).join(' + ');
  const sideRobots = (F, sd) => F.robots.filter((r, e) => F.sides[e] === sd && r);
  const sideLabel = (F, sd) => sideRobots(F, sd).map(r => r.name).join(' + ');
  const mySide = F => { const e = F.teams.indexOf(viewerSeat); return e >= 0 ? F.sides[e] : -1; };
  const fightTitle = F => (F.house ? '🏠 ' : '') + (FORMAT_NAME[F.format] || 'Duel');

  async function startArena() {
    G.phase = 'arena';
    G.chooseMyBot = false;
    G.fight = null;
    setCameraGoal('compound');
    // the format this round: from an Intrigue event (Grand Final / Tag Team), then the Host step may change it
    G.arenaEvent = G.nextEvent || null;
    G.houseRobot = false;
    G.hostStep = true; updateHud();
    await hostStep();
    G.hostStep = false;
    const ev = G.arenaEvent, H = G.host;
    if (ev && ev.kind === 'ffa') return invite(G.teams.map(t => t.i), G.teams.map((_, i) => i), 'ffa');
    if (ev && (ev.kind === 'final' || ev.kind === 'tag')) {
      let a = ev.kind === 'final' ? G.teams.slice().sort((x, y) => y.fame - x.fame || x.i - y.i).slice(0, 2).map(t => t.i) : ev.teams.slice();
      const b = G.teams.map(t => t.i).filter(i => !a.includes(i));
      return invite(a.concat(b), [0, 0, 1, 1], '2v2');
    }
    const fmt = ev && ev.kind === 'mirror' ? 'mirror' : 'duel';
    G.pendingFormat = fmt;
    if (H === viewerSeat) {
      // AI teams may offer you a deal to be invited, or to be left out
      G.inviteOffers = [];
      for (const T of G.teams) {
        if (T.i === H || !readyRobots(T).length) continue;
        const r = readyRobots(T).sort((x, y) => power(y) - power(x))[0], p = fieldOdds(T.i, r.b).p;
        const want = r.dmg >= maxHp(r) * 0.5 || (p != null && p <= 0.3) ? 'out' : p != null && p >= 0.55 ? 'in' : null;
        if (want && rnd() < 0.55) { const B = aiBundle(T, G.teams[H], 1 + (rnd() < 0.4 ? 1 : 0)); if (!bundleEmpty(B)) G.inviteOffers.push({ team: T.i, want, B }); }
      }
      if (G.inviteOffers.length) notify('👑 Offers to you as host: ' + G.inviteOffers.map(o => nm(G.teams[o.team]) + ' ' + bundleText(o.B) + (o.want === 'in' ? ' to be invited' : ' to be left out')).join(' · '), G.teams[H].col);
      G.pickTeams = [];
      updateHud();
      return;
    }
    const host = G.teams[H];
    let others = G.teams.filter(t => t.i !== H);
    // you may offer the AI host a deal: invite me, or leave me out
    let forceIn = false, forceOut = false;
    if (readyRobots(me()).length) {
      const pick = await ivModal('👑 Host ' + esc(host.name) + ' picks the fighters', 'Make the host a deal?', [{ label: '✋ Invite me', value: () => 'in' }, { label: '🙈 Leave me out', value: () => 'out' }, { label: 'No deal', secondary: true, value: () => null }]);
      if (pick) {
        const d = await dealPanel({ title: pick === 'in' ? '✋ Ask to be invited' : '🙈 Ask to be left out', intro: 'Offer ' + nm(host) + ' something for it.', from: host, lock: 'Lock in offer' });
        if (d && !bundleEmpty(d.give)) {
          if (bundleWorth(host, d.give) >= 2) { transfer(me(), host, d.give); if (pick === 'in') forceIn = true; else forceOut = true; notify('🤝 ' + nm(host) + ' takes ' + bundleText(d.give) + ' and ' + (pick === 'in' ? 'invites you.' : 'leaves you out.'), host.col); }
          else notify('✋ ' + nm(host) + ' turns down ' + bundleText(d.give) + '.', host.col);
        }
      }
    }
    if (forceOut) others = others.filter(t => t.i !== viewerSeat);
    let a, b;
    const best = readyRobots(host).sort((x, y) => power(y) - power(x))[0];
    const able = others.filter(t => readyRobots(t).length);
    if (forceIn) {
      a = viewerSeat; b = (rnd() < 0.45 && best && best.dmg < maxHp(best) * 0.5) ? H : (shuffle(able.filter(t => t.i !== viewerSeat))[0] || others.find(t => t.i !== viewerSeat)).i;
    } else if (rnd() < 0.45 && best && best.dmg < maxHp(best) * 0.5 && able.length) {
      a = H; b = able.slice().sort((x, y) => y.fame - x.fame)[0].i;
    } else {
      const s = shuffle(able.length >= 2 ? able.slice() : others.slice());
      a = s[0].i; b = s[1].i;
    }
    notify('👑 Host <b>' + esc(host.name) + '</b> invites ' + esc(G.teams[a].name) + ' vs ' + esc(G.teams[b].name) + (fmt === 'mirror' ? ' (Mirror: 2 copies each)' : '') + '!', host.col);
    invite([a, b], [0, 1], fmt);
  }

  // Host step: the host may play Mirror or Unleash the House Robot, anyone may play Grand Melee (host first, then clockwise)
  async function hostStep() {
    const H = G.host;
    const usable = (t, id) => t.hand.includes(id) && t.fame >= (CARDS[id].need || 0) && (id === 'grand_melee' || t.i === H);
    const fmtNow = () => G.arenaEvent ? ({ ffa: 'a free-for-all', mirror: 'a Mirror duel', final: 'the Grand Final (2v2)', tag: 'a Tag Team 2v2' })[G.arenaEvent.kind] : 'a duel';
    for (const ti of [0, 1, 2, 3].map(k => (H + k) % 4)) {
      const t = G.teams[ti];
      for (;;) {
        const active = { grand_melee: G.arenaEvent && G.arenaEvent.kind === 'ffa', mirror: G.arenaEvent && G.arenaEvent.kind === 'mirror', unleash_the_house_robot: G.houseRobot };
        const opts = ['grand_melee', 'mirror', 'unleash_the_house_robot'].filter(id => usable(t, id) && !active[id]);   // nothing that is already in force
        if (!opts.length) break;
        let id = null;
        if (ti === viewerSeat) {
          id = await ivModal('🏟️ Host step', 'This round\'s fight is ' + fmtNow() + (G.houseRobot ? ' with the House Robot' : '') + '. ' + (ti === H ? 'You are the host. ' : '') + 'Play an Arena card?' +
            opts.map(o => '<br>' + cardRef(o) + ': ' + esc(CARDS[o].text)).join(''),
            opts.map(o => ({ label: CARDS[o].icon + ' ' + esc(CARDS[o].name), value: () => o })).concat([{ label: 'No', secondary: true, value: () => null }]), 12000, null);
        } else {
          const want = { grand_melee: ti === H ? 0.7 : 0.2, mirror: 0.45, unleash_the_house_robot: 0.5 };
          id = opts.find(o => rnd() < want[o]) || null;
        }
        if (!id) break;
        const ph = playHead(t, id, null); logBegin(ph[0], t.col, ph[1], ph[2]);
        removeFromHand(t, id); discardCard(id);
        if (id === 'grand_melee') { G.arenaEvent = { kind: 'ffa', by: ti, card: id }; notify('⚔️ Grand Melee: this round is a free-for-all for every team with a ready robot. The host gets +1 fame when it happens.'); }
        if (id === 'mirror') { G.arenaEvent = { kind: 'mirror', by: ti, card: id }; notify('🪞 Mirror: each invited robot fights as 2 copies; afterwards it keeps the damage of its healthiest copy.'); }
        if (id === 'unleash_the_house_robot') { G.houseRobot = true; notify('🏠 The House Robot joins this fight and attacks whoever is closest.'); }
        logEnd('landed');
        updateHud();
        await sleep(350);
      }
    }
  }

  function invite(list, sides, format) {
    format = format || G.pendingFormat || 'duel';
    const teams = list.slice(), sd = (sides || list.map((_, i) => i)).slice();
    // a team with no ready robot declines (−1 fame); in a duel a team with a ready robot steps in, in an event it just sits out
    for (let e = teams.length - 1; e >= 0; e--) {
      const t = G.teams[teams[e]];
      if (readyRobots(t).length) continue;
      addFame(t, -1);
      const repl = format === 'duel' || format === 'mirror' ? G.teams.filter(x => !teams.includes(x.i) && readyRobots(x).length)[0] : null;
      notify('😴 ' + nm(t) + ' has no ready robot and ' + (repl ? 'declines (−1 fame); ' + nm(repl) + ' steps in.' : 'sits out (−1 fame).'), t.col);
      if (repl) teams[e] = repl.i; else { teams.splice(e, 1); sd.splice(e, 1); }
    }
    // renumber sides 0..n-1; an event left with one side is no fight
    const used = [...new Set(sd)]; const sides2 = sd.map(x => used.indexOf(x));
    if (used.length < 2) { notify('🏟️ Not enough teams with a ready robot: no fight this round.', '#b45309'); G.fight = null; G.phase = 'after'; G.awaitingJudgment = false; G.nextEvent = null; updateHud(); return; }
    G.fight = { teams, robots: teams.map(() => null), sides: sides2, nSides: used.length, format, house: !!G.houseRobot, event: G.arenaEvent };
    if (format === '2v2' || format === 'ffa') notify('🏟️ ' + fightTitle(G.fight) + ': ' + used.map((_, k) => esc(sideName(G.fight, k))).join(' vs ') + '.', '#111');
    teams.forEach((ti, e) => {
      if (ti !== viewerSeat) {
        const t = G.teams[ti];
        rebalanceAiEngineers(t);
        G.fight.robots[e] = readyRobots(t).filter(r => r.dmg < maxHp(r)).sort((a, b) => power(b) - power(a))[0] || readyRobots(t)[0] || t.robots[0];
      }
    });
    if (teams.includes(viewerSeat)) {
      G.chooseMyBot = true;
      updateHud();
    } else {
      afterChoose();
    }
  }

  function declineInvite() {
    const F = G.fight;
    if (F.format !== 'duel' && F.format !== 'mirror') return;   // events can't be declined
    const t = me(), s = F.teams.indexOf(viewerSeat);
    t.fame = Math.max(0, t.fame - 1);
    const repl = G.teams.filter(x => !F.teams.includes(x.i) && x.i !== viewerSeat && readyRobots(x).length)[0] || G.teams.filter(x => !F.teams.includes(x.i) && x.i !== viewerSeat)[0];
    F.teams[s] = repl.i;
    F.robots[s] = (readyRobots(repl).length ? readyRobots(repl) : repl.robots).slice().sort((a, b) => power(b) - power(a))[0];
    G.chooseMyBot = false;
    notify('You declined (−1 Fame); <b>' + esc(repl.name) + '</b> steps in.', repl.col);
    afterChoose();
  }

  // the battle for this fight: builds (copies for Mirror, the House Robot), sim teams, bot → entrant mapping
  function buildBattle(F, seed, visible, noDamage) {
    F.sides = F.sides || F.teams.map((_, i) => i); F.nSides = F.nSides || new Set(F.sides).size; F.format = F.format || 'duel';
    const copies = F.format === 'mirror' ? 2 : 1, builds = [], botEnt = [], botName = [];
    F.teams.forEach((ti, e) => {
      const r = F.robots[e], b = visible ? clone(r.b) : fightBuild(ti, r);
      for (let c = 0; c < copies; c++) { builds.push(clone(b)); botEnt.push(e); botName.push(r.name + (copies > 1 ? ' #' + (c + 1) : '')); }
    });
    const teamOpt = F.format === '2v2' || F.format === 'mirror' || (F.house && F.nSides === 2) ? botEnt.map(e => F.sides[e]) : null;
    if (F.house) { builds.push(clone(HOUSE_BUILD)); botEnt.push(-1); botName.push('House Robot'); if (teamOpt) teamOpt.push(9); }
    const B = Sim.newBattle(builds, seed, teamOpt ? { teams: teamOpt } : undefined);
    if (!noDamage) B.bots.forEach((b, i) => { if (!b.helper && botEnt[i] >= 0) b.hp = Math.max(10, b.hp - F.robots[botEnt[i]].dmg); });
    if (F.house) {   // the House Robot drops in at the top middle
      const hb = B.bots[builds.length - 1]; hb.x = B.W / 2; hb.y = 70; hb.body = hb.turret = Math.PI / 2;
      B.bots.filter(x => x.helper && x.owner === hb.i).forEach(x => { x.x = hb.x; x.y = hb.y + 30; });
    }
    return { B, builds, botEnt, botName, teamOpt };
  }
  // which side won: a side index, 'house', or -1 for a draw
  function winSide(F, B, map) {
    if (B.winner < 0) return -1;
    if (map.teamOpt) return B.winner === 9 ? 'house' : B.winner;
    const e = map.botEnt[B.winner];
    return e == null || e < 0 ? 'house' : F.sides[e];
  }

  function afterChoose() {
    G.chooseMyBot = false;
    const F = G.fight;
    // appearance money (rulebook): 2 Cr per invited team, plus 2 per Fan token on its robot (6 for a Fan Favourite)
    F.teams.forEach((ti, e) => { const T = G.teams[ti], r = F.robots[e]; T.credits += r.wins >= favWins(T) ? 6 : 2 + 2 * r.wins; });
    // Bookie simulates the visible builds: all parts are open, only face-down Intrigue cards stay hidden
    const N = F.nSides === 2 && F.teams.length === 2 && !F.house && F.format === 'duel' ? 40 : 20;
    const w = Array(F.nSides).fill(0);
    for (let k = 0; k < N; k++) {
      let ws;
      if (N === 40) {   // duel: swap sides every other fight
        const sw = k % 2, G2 = { teams: sw ? F.teams.slice().reverse() : F.teams, robots: sw ? F.robots.slice().reverse() : F.robots, sides: [0, 1], nSides: 2, format: 'duel' };
        const m = buildBattle(G2, 7001 + k * 977, true);
        while (!m.B.over) Sim.step(m.B, 1 / 30);
        ws = winSide(G2, m.B, m); if (sw && ws >= 0) ws = 1 - ws;
      } else {
        const m = buildBattle(F, 7001 + k * 977, true);
        while (!m.B.over) Sim.step(m.B, 1 / 30);
        ws = winSide(F, m.B, m);
      }
      if (ws === -1) w.forEach((_, i) => { w[i] += 1 / F.nSides; }); else if (ws !== 'house') w[ws] += 1;
    }
    F.p = w.map(x => Math.max(0.03, Math.min(0.95, x / N)));
    F.bands = F.p.map(bandOf);
    F.pay = F.bands.map(bd => bd.pay);
    startBets();
  }

  /* ---------- Phase 5: Bets on Arena Floor ---------- */
  function startBets() {
    G.phase = 'bets';
    G.myBet = Array(G.fight.nSides).fill(0);
    G.hedge = false;
    setCameraGoal('compound');
    updateHud();
  }
  // Bets-step arena cards for the human (buttons in the prompt)
  function humanBookiesFriend() {
    const t = me(), F = G.fight;
    if (!removeFromHand(t, 'bookie_s_friend')) return;
    discardCard('bookie_s_friend');
    const rows = [];
    F.teams.forEach((ti, e) => {
      const r = F.robots[e];
      (r.faceDown || []).forEach(x => rows.push('🂠 on <b>' + esc(r.name) + '</b> (' + esc(G.teams[ti].name) + '): ' + cardRef(x.id) + ', played by ' + esc(G.teams[x.from].name)));
      (G.teams[ti].schemeLog || []).forEach(x => rows.push('🔧 on ' + esc(G.teams[ti].name) + '\'s garage: ' + cardRef(x.id) + ', played by ' + esc(G.teams[x.from].name)));
    });
    const ph = playHead(t, 'bookie_s_friend', null); logBegin(ph[0], t.col, ph[1], ph[2]); notify('you looked at ' + rows.length + ' hidden card' + (rows.length === 1 ? '' : 's') + ' in this fight'); logEnd('landed');
    ivModal('🔍 Bookie\'s Friend', rows.length ? 'Hidden cards in this fight:<br>' + rows.join('<br>') : 'No face-down cards in this fight: the bookie\'s odds are honest.', [{ label: 'OK', value: () => null }]);
    updateHud();
  }
  function humanHedgeBet() {
    const t = me();
    if (G.hedge || !removeFromHand(t, 'hedge_bet')) return;
    discardCard('hedge_bet'); G.hedge = true;
    const ph = playHead(t, 'hedge_bet', null); logBegin(ph[0], t.col, ph[1], ph[2]); notify('you may bet up to 4 Cr on any side this fight'); logEnd('landed');
    updateHud();
  }
  const betLimit = t => t.i === viewerSeat && G.hedge ? Math.max(4, maxBetOf(t)) : maxBetOf(t);

  async function lockBetsAndRollout() {
    if (G.betsLocked) return;
    G.betsLocked = true;
    const F = G.fight, t = me();
    F.bets = [];
    const hs = G.myBet.findIndex(v => v > 0);
    if (hs >= 0) {
      F.bets.push({ team: viewerSeat, side: hs, amt: G.myBet[hs] });
      t.credits -= G.myBet[hs];
      notify('🎲 You bet ' + G.myBet[hs] + ' Cr on <b>' + esc(sideLabel(F, hs)) + '</b> (' + F.bands[hs].name + ').', t.col);
    }
    for (const T of G.teams) {
      if (T.i === viewerSeat || T.credits < 2) continue;
      const own = F.teams.indexOf(T.i), fav = F.p.indexOf(Math.max(...F.p));
      if (T.hand.includes('hedge_bet') && T.fame >= (CARDS.hedge_bet.need || 0) && rnd() < 0.5) {   // AI Hedge Bet: back the favourite, even against itself
        removeFromHand(T, 'hedge_bet'); discardCard('hedge_bet');
        const amt = Math.min(T.credits, 3 + Math.floor(rnd() * 2));
        T.credits -= amt; F.bets.push({ team: T.i, side: fav, amt });
        notify('🎲 <b>' + esc(T.name) + '</b> plays ' + cardRef('hedge_bet') + ' and bets ' + amt + ' Cr on <b>' + esc(sideLabel(F, fav)) + '</b> (' + F.pay[fav] + '×).', T.col);
        continue;
      }
      if (rnd() < 0.3) continue;
      let side = own >= 0 ? F.sides[own] : -1;
      if (side < 0) { let x = rnd() * F.p.reduce((a, b) => a + b, 0); side = 0; for (let k = 0; k < F.p.length; k++) { x -= F.p[k]; if (x <= 0) { side = k; break; } } }
      const amt = Math.min(T.credits, 1 + Math.floor(rnd() * maxBetOf(T)));
      T.credits -= amt;
      F.bets.push({ team: T.i, side, amt });
      notify(`🎲 <b>${esc(T.name)}</b> bet ${amt} Cr on <b>${esc(sideLabel(F, side))}</b> (${F.pay[side]}×).`, T.col);
    }
    updateHud();
    await swapStep();
    G.betsLocked = false;
    startFight();
  }
  // Swap the Entry: after bets are placed, change which robot an invited team sends (bets and odds stay as they were)
  async function swapStep() {
    const F = G.fight;
    const swaps = () => { const out = []; F.teams.forEach((ti, e) => { readyRobots(G.teams[ti]).filter(r => r !== F.robots[e]).forEach(r => out.push({ e, ti, r })); }); return out; };
    for (const ti of [viewerSeat].concat([0, 1, 2, 3].filter(i => i !== viewerSeat))) {
      const o = G.teams[ti];
      if (!o.hand.includes('swap_the_entry') || o.fame < (CARDS.swap_the_entry.need || 0)) continue;
      const opts = swaps(); if (!opts.length) continue;
      let pick = null;
      if (ti === viewerSeat) {
        pick = await ivModal('🔀 Swap the Entry?', 'Bets are locked. Change which robot a team sends:', opts.slice(0, 8).map(x => ({ label: esc(G.teams[x.ti].name) + ': ' + esc(F.robots[x.e].name) + ' → ' + esc(x.r.name), value: () => x })).concat([{ label: 'No', secondary: true, value: () => null }]));
        if (pick && pick.ti !== viewerSeat) {
          const how = await ivModal('🔀 Swap or payoff?', 'Swap now, or ask ' + nm(G.teams[pick.ti]) + ' to pay you to leave its line-up alone?', [{ label: '🔀 Swap now', value: () => 'swap' }, { label: '💰 Demand a payoff', value: () => 'pay' }]);
          if (how === 'pay') {
            const W = G.teams[pick.ti], d = await dealPanel({ title: '💰 Payoff from ' + esc(W.name), intro: 'What do you want to leave its ' + esc(F.robots[pick.e].name) + ' in the fight?', from: W, give: false, want: true, lock: 'Lock in demand' });
            if (d && !bundleEmpty(d.want) && bundleWorth(W, d.want) <= 3) { transfer(W, o, d.want); notify('💰 ' + nm(W) + ' pays you ' + bundleText(d.want) + ' to keep its line-up.', W.col); continue; }
            notify('✋ ' + nm(W) + ' won\'t pay. You swap.', W.col);
          }
        }
      } else if (rnd() < 0.4) {
        const myBet = (F.bets.find(b => b.team === ti) || {}).side;
        pick = opts.filter(x => x.ti !== ti && F.sides[x.e] !== myBet).sort((a, b) => power(a.r) - power(b.r))[0] || null;   // sabotage a rival side with its weakest robot
        if (pick && power(pick.r) >= power(F.robots[pick.e])) pick = null;
      }
      if (!pick) continue;
      if (ti !== viewerSeat && pick.ti === viewerSeat) {   // the AI threatens you first
        const pay = await ivModal('💰 A threat', nm(o) + ' will make you send <b>' + esc(pick.r.name) + '</b> instead of ' + esc(F.robots[pick.e].name) + ' (' + cardRef('swap_the_entry') + ') unless you pay <b>2 Cr</b>.', [{ label: 'Pay 2 Cr', value: () => true }, { label: 'Refuse', secondary: true, value: () => false }]);
        if (pay && me().credits >= 2) { transfer(me(), o, { cr: 2, items: [] }); notify('💰 You pay ' + nm(o) + ' 2 Cr to keep your line-up.', me().col); continue; }
      }
      removeFromHand(o, 'swap_the_entry'); discardCard('swap_the_entry');
      const ph = playHead(o, 'swap_the_entry', G.teams[pick.ti]); logBegin(ph[0], o.col, ph[1], ph[2]);
      notify(esc(G.teams[pick.ti].name) + ' now sends <b>' + esc(pick.r.name) + '</b> instead of ' + esc(F.robots[pick.e].name) + '. The bets stand.');
      F.robots[pick.e] = pick.r;
      logEnd('landed');
      updateHud();
    }
  }

  /* ---------- Phase 6: roll-in, countdown and the fight ---------- */
  function startFight() {
    G.phase = 'fight';
    const F = G.fight;
    const m = buildBattle(F, (rnd() * 4294967296) >>> 0, false);
    F.B = m.B; F.botEnt = m.botEnt; F.botName = m.botName; F.teamOpt = m.teamOpt; F.builds = m.builds;
    F.entBot = F.teams.map((_, e) => m.botEnt.indexOf(e));
    tlog('fight_start', { format: F.format, house: !!F.house, event: F.event ? F.event.kind : null, sides: F.sides, p: F.p, bands: (F.bands || []).map(b => b.name),
      entrants: F.teams.map((ti, e) => ({ team: ti, robot: F.robots[e].name, dmg: F.robots[e].dmg, b: ptBuild(F.robots[e].b), faceDown: (F.robots[e].faceDown || []).map(x => x.id) })), bets: F.bets });
    F.rollout = 0;
    F.rolloutDone = false;
    if (F.format === 'ffa' && F.event && F.event.kind === 'ffa' && G.host >= 0) { addFame(G.teams[G.host], 1); notify('⚔️ Grand Melee happens: host ' + nm(G.teams[G.host]) + ' +1 fame.', G.teams[G.host].col); }

    F.teams.forEach((ti, e) => {
      const T = G.teams[ti], b0 = F.B.bots[F.entBot[e]];
      for (const x of (F.robots[e].faceDown || []).concat(T.schemeLog)) {
        const txt = x.from === ti ? '⚡ ' + CARDS[x.id].name.toUpperCase() + '!' : '🔧 SABOTAGED: ' + CARDS[x.id].name.toUpperCase() + '!';
        F.B.banners.push({ x: b0.x, y: b0.y - 36, text: txt, col: x.from === ti ? '#2a9d3a' : '#d62828', life: 2.6 });
      }
    });

    setCameraGoal('arena');
    updateHud();
  }

  function stepAiCombatCards(F) {
    const B = F.B;
    if (F.spar || B.over || B.tick % 60 !== 0) return;
    F.teams.forEach((ti, e) => {
      if (ti === viewerSeat) return;
      const T = G.teams[ti], bi = F.entBot ? F.entBot[e] : e, b = B.bots[bi];
      if (!b || b.hp <= 0) return;
      const cIdx = T.hand.findIndex(id => CARDS[id].phase === 'fight' && T.fame >= (CARDS[id].need || 0));
      if (cIdx < 0 || B.rng() > 0.35) return;
      const id = T.hand.splice(cIdx, 1)[0];
      if (id === 'trigger' || id === 'overclock' || id === 'field_eng') {
        Sim.queueCmd(B, { card: id, bot: bi, by: T.name });
        notify('🃏 <b>' + esc(T.name) + '</b> played ' + cardRef(id) + '!', T.col);
      } else if (id === 'oil_card' || id === 'emp_card') {
        const foe = B.bots.filter(x => !x.helper && x.hp > 0 && x.team !== b.team).sort((p, q) => Math.hypot(p.x - b.x, p.y - b.y) - Math.hypot(q.x - b.x, q.y - b.y))[0];
        if (foe) {
          Sim.queueCmd(B, { card: id, x: foe.x, y: foe.y, by: T.name });
          notify('🃏 <b>' + esc(T.name) + '</b> played ' + cardRef(id) + '!', T.col);
        }
      }
    });
  }

  /* ---------- Phase 7: Aftermath, Fight Recap & Crates ---------- */
  function aftermath() {
    if (G.fight && G.fight.spar) return endSpar();
    G.phase = 'after';
    setCameraGoal('compound');
    const F = G.fight, B = F.B;
    const map = { botEnt: F.botEnt || F.teams.map((_, i) => i), teamOpt: F.teamOpt };
    const ws = winSide(F, B, map);
    F.winSide = ws;
    tlog('fight_end', { sandbox: !!F.sandbox, winSide: ws, time: Math.round(B.t * 10) / 10, timeout: !!B.timeout, p: F.p,
      bots: B.bots.filter(b => !b.helper).map((b, i) => ({ name: F.botName ? F.botName[i] : i, hp: Math.max(0, Math.round(b.hp)), max: Math.round(b.s.hp), broken: b.broken || [], crits: b.crits })),
      log: B.log.filter(ev => ['ko', 'card', 'break', 'glitch'].includes(ev.k)).slice(0, 40) });
    F.recap = Sim.recap(B, i => (F.botName && F.botName[i]) || (F.robots[i] ? F.robots[i].name : 'Bot ' + (i + 1)), t => sideName(F, t));
    { const tp = F.recap.turning; notify('🏁 ' + esc(F.recap.headline) + (tp ? '<br>⭐ Turning point at ' + tp.t + ' s' + (tp.line ? ': ' + esc(tp.line.detail || tp.line.text) : '') : '') + F.recap.lines.filter(l => l.k === 'card' && l !== (tp && tp.line)).map(l => '<br>' + l.t.toFixed(1) + ' s ' + esc(l.detail || l.text)).join(''), '#111'); }
    if (ws >= 0 && F.bands && F.bands[ws] && F.bands[ws].min < 0.42) F.recap.upset = 'UPSET! Bookie had ' + sideLabel(F, ws) + ' as ' + F.bands[ws].name + ' (' + F.pay[ws] + '×)!';
    G.nextEvent = null;

    if (F.sandbox) {
      G.awaitingJudgment = false;
      updateHud();
      return;
    }
    // damage: each robot keeps what its bot took (Mirror: its healthiest copy)
    F.teams.forEach((ti, e) => {
      const r = F.robots[e];
      { const idx = B.bots.map((b, i) => i).filter(i => !B.bots[i].helper && map.botEnt[i] === e);
        const ko = idx.map(i => { const k = B.log.find(ev => ev.k === 'ko' && ev.who === i); return k ? k.t : B.t; });
        const sec = Math.max(...ko); r.wear = (r.wear || 0) + sec;
        tlog('wear', { robot: r.name, add: Math.round(sec * 10) / 10, wear: Math.round(r.wear), mult: +wearMult(r).toFixed(2) });
        if (ti === viewerSeat) notify('⏱ <b>' + esc(r.name) + '</b> fought ' + Math.round(sec) + ' s: wear ' + Math.round(r.wear) + ' s, repairs now cost ×' + wearMult(r).toFixed(2) + ' until you repair it.', G.teams[ti].col); }
      const left = B.bots.filter((b, i) => !b.helper && map.botEnt[i] === e).map(b => Math.max(0, b.hp) / b.s.hp);
      r.dmg = Math.min(maxHp(r), Math.round(maxHp(r) * (1 - Math.max(...left))));
    });
    for (const ti of F.teams) { G.teams[ti].tamper = {}; G.teams[ti].schemeLog = []; }
    F.robots.forEach(r => {
      if (!r) return;
      if (r.tamper && r.tamper.postDmg) { r.dmg = Math.min(maxHp(r) - 1, r.dmg + r.tamper.postDmg); notify('🔥 Overclock wears ' + esc(r.name) + ': ' + r.tamper.postDmg + ' lasting damage.', '#b45309'); }
      r.tamper = {}; r.faceDown = []; r.exhausted = true;
    });

    if (ws === -1 || ws === 'house') {
      for (const x of F.bets) { G.teams[x.team].credits += x.amt; x.payout = x.amt; }
      notify(ws === 'house' ? '🏠 The House Robot wins! Nobody gets fame; bets refunded.' : 'Arena Draw! Bets refunded.', '#111');
      G.awaitingJudgment = false;
      updateHud();
      return;
    }
    const famePer = F.event && F.event.kind === 'final' ? 2 : 1;
    const winners = F.teams.map((ti, e) => ({ ti, e })).filter(x => F.sides[x.e] === ws);
    const losers = F.teams.map((ti, e) => ({ ti, e })).filter(x => F.sides[x.e] !== ws);
    winners.forEach(({ ti, e }) => {
      const T = G.teams[ti], r = F.robots[e];
      T.fame += famePer; r.wins++;   // rulebook: no prize money, credits come from bets and appearance money
      if (r.wins === favWins(T)) T.fame += 1;
    });
    notify('🏆 <b>' + esc(sideLabel(F, ws)) + '</b> (' + esc(sideName(F, ws)) + ') win' + (winners.length > 1 ? '' : 's') + '! +' + famePer + ' Fame' + (winners.length > 1 ? ' each' : '') + '.', G.teams[winners[0].ti].col);
    losers.forEach(({ e }) => { const r = F.robots[e]; r.dmg = Math.max(r.dmg, Math.round(maxHp(r) / 2)); });   // a spared loser keeps half its health as damage

    for (const x of F.bets) {
      if (x.side === ws) {
        const pay = Math.round(x.amt * F.pay[ws]);
        x.payout = pay;
        G.teams[x.team].credits += pay;
        notify('🪙 <b>' + esc(G.teams[x.team].name) + '</b> won ' + pay + ' Cr on their bet!', G.teams[x.team].col);
      } else if (G.teams[x.team].sponsor === 'lucky') {
        x.payout = 1;
        G.teams[x.team].credits += 1;
      } else {
        x.payout = 0;
      }
    }
    // Kev, 6 Nov: the host judges EVERY losing robot, one at a time, in the order they were knocked out
    const koAt = e => { const i = B.log.findIndex(ev => ev.k === 'ko' && map.botEnt[ev.who] === e); return i < 0 ? 1e9 : i; };
    const order = losers.slice().sort((a, b) => koAt(a.e) - koAt(b.e));
    F.winner = { team: winners[0].ti, robot: F.robots[winners[0].e] };
    F.winners = winners.map(x => ({ team: x.ti, robot: F.robots[x.e] }));
    F.fateQueue = order.map(x => ({ team: x.ti, robot: F.robots[x.e] }));
    F.fateN = F.fateQueue.length; F.fateI = 1;
    F.loser = F.fateQueue.shift();
    if (F.fateN > 1) notify('👑 The host now decides spare or scrap for each losing robot, first knocked out first: ' + order.map(x => esc(F.robots[x.e].name) + ' (' + esc(G.teams[x.ti].name.split(' ')[0]) + ')').join(', ') + '.', G.teams[G.host].col);

    // every losing team opens a consolation Scrap Crate (auto-applied)
    const crateTxt = [];
    losers.forEach(({ ti, e }) => {
      const lTeam = G.teams[ti], lr = F.robots[e];
      if (lTeam.robots.includes(lr) && lr.dmg > 0) {
        const patch = lTeam.sponsor === 'vulture' ? 50 : 30;
        lr.dmg = Math.max(0, lr.dmg - patch);
        crateTxt.push(lTeam.name.split(' ')[0] + ': −' + patch + ' HP');
        notify(`📦 <b>${esc(lTeam.name)}</b> opens a Scrap Crate: patched −${patch} dmg on ${esc(lr.name)}.`, lTeam.col);
      } else {
        const bonus = lTeam.sponsor === 'vulture' ? 4 : 2;
        lTeam.credits += bonus;
        crateTxt.push(lTeam.name.split(' ')[0] + ': +' + bonus + ' Cr');
      }
    });
    F.loserCrateText = 'Scrap Crate: ' + crateTxt.join(', ');
    F.winnerCrateText = 'Fan token +1';   // Winner's Crate cut (rulebook)

    fateStep();
  }

  // Spare or scrap, with deals (Kev, 6 Nov): the loser's team pleads, rivals push to scrap; the host takes the offers of the side it picks
  async function fateStep() {
    const F = G.fight, H = G.teams[G.host], L = G.teams[F.loser.team], lr = F.loser.robot;
    const canScrap = lr.wins < favWins(L) && G.host !== L.i;
    if (!canScrap) {   // nothing to decide: the host's own robot, or a Fan Favourite
      resolveFate(false, G.host === L.i ? 'it is the host\'s own robot' : 'a Fan Favourite can\'t be scrapped');
      return;
    }
    F.fateOffers = { spare: [], scrap: [] };
    G.fateBusy = true; updateHud();
    for (const T of G.teams) {
      if (T === H || T.i === viewerSeat) continue;
      if (T === L) { const B = aiBundle(T, H, Math.min(T.credits - 1, 1 + 2 * lr.wins + (rnd() < 0.5 ? 1 : 0))); if (!bundleEmpty(B)) F.fateOffers.spare.push({ team: T.i, B }); }
      else if (canScrap && L === leaderOf() && rnd() < 0.6) { const B = aiBundle(T, H, 1 + (rnd() < 0.5 ? 1 : 0)); if (!bundleEmpty(B)) F.fateOffers.scrap.push({ team: T.i, B }); }
    }
    if (H.i !== viewerSeat && canScrap) {
      const mine = L.i === viewerSeat;
      const pick = mine ? 'spare' : await ivModal('👑 Spare or scrap?' + (F.fateN > 1 ? ' (' + F.fateI + ' of ' + F.fateN + ')' : ''), 'Host ' + nm(H) + ' decides the fate of ' + nm(L) + '\'s <b>' + esc(lr.name) + '</b>' + (F.fateN > 1 ? ' (every losing robot is judged in turn)' : '') + '. Push the decision with a deal?',
        [{ label: '👍 Offer: spare it', value: () => 'spare' }, { label: '👎 Offer: scrap it', value: () => 'scrap' }, { label: 'Stay out', secondary: true, value: () => null }]);
      if (pick) {
        const d = await dealPanel({ title: (pick === 'spare' ? '👍 Plead to spare ' : '👎 Push to scrap ') + esc(lr.name), intro: 'The host only takes the offers of the side it picks.' + (mine ? ' Your robot is on the line.' : ''), from: H, lock: 'Lock in offer' });
        if (d && !bundleEmpty(d.give)) F.fateOffers[pick].push({ team: viewerSeat, B: d.give });
      }
    }
    const offTxt = side => F.fateOffers[side].map(o => esc(G.teams[o.team].name) + ' ' + bundleText(o.B)).join(', ');
    if (F.fateOffers.spare.length || F.fateOffers.scrap.length) notify('👑 Offers to the host: ' + [F.fateOffers.spare.length ? '👍 spare: ' + offTxt('spare') : '', F.fateOffers.scrap.length ? '👎 scrap: ' + offTxt('scrap') : ''].filter(Boolean).join(' · '), H.col);
    G.fateBusy = false;
    if (G.host === viewerSeat) { G.awaitingJudgment = true; updateHud(); return; }
    const lead = leaderOf().i;
    const base = canScrap && (L.i === lead ? rnd() < 0.7 : rnd() < 0.3);
    const v = side => F.fateOffers[side].reduce((a, o) => a + bundleWorth(H, o.B), 0);
    const score = (base ? 2 : 0) + v('scrap') - v('spare') - (base ? 0 : 1);
    resolveFate(canScrap && score > 0);
  }

  function resolveFate(scrap, safeWhy) {
    G.awaitingJudgment = false;
    const { team, robot } = G.fight.loser, T = G.teams[team];
    { const H = G.teams[G.host], offs = (G.fight.fateOffers || {})[scrap ? 'scrap' : 'spare'] || [];   // the host takes the offers of the side it picked
      offs.forEach(o => { transfer(G.teams[o.team], H, o.B); notify('🤝 ' + nm(G.teams[o.team]) + ' pays the host ' + bundleText(o.B) + ' (' + (scrap ? 'scrap' : 'spare') + ').', G.teams[o.team].col); }); }
    if (scrap) {
      if (robot.wins >= favWins(T)) G.teams[G.host].fame = Math.max(0, G.teams[G.host].fame - 1);
      T.robots.splice(T.robots.indexOf(robot), 1);
      for (const v of G.teams) if (v.sponsor === 'vulture') v.credits += 2;
      notify('👎 Host scrapped <b>' + esc(robot.name) + '</b>!', '#d62828');
      if (removeFromHand(T, 'blaze_of_glory')) { discardCard('blaze_of_glory'); addFame(T, 1); notify('🔥 ' + cardRef('blaze_of_glory') + ': ' + nm(T) + ' +1 fame for the scrapped robot.', T.col); }
      if (!T.robots.length) T.robots.push(mkRobot('Scrapbot', SCRAP));
    } else if (safeWhy) {
      notify('🛡️ <b>' + esc(robot.name) + '</b> (' + nm(T) + ') is safe: ' + safeWhy + '.', '#2a9d3a');
    } else {
      notify('👍 Host spared <b>' + esc(robot.name) + '</b>.', '#2a9d3a');
    }
    if (checkWin()) return;
    const F = G.fight;
    if (F && F.fateQueue && F.fateQueue.length) {   // next losing robot
      F.loser = F.fateQueue.shift(); F.fateI++; F.fateOffers = null;
      updateHud(); fateStep(); return;
    }
    updateHud();
  }

  /* test hook for automated play-throughs (read-only use) */
  window.ROBOCUS_DEBUG = { get PT() { return PT; }, ptSaveNow, ptError, get G() { return G; }, CARDS, humanPlay, cashIn, weaponSwapNote, LOTS, SC, fieldOdds, oddsShift, openScout, closeScout, buyScout, startSpar, scoutWork, updateHud, afterChoose, humanBookiesFriend, humanHedgeBet, toStash, humanTrade, startLots, robotLot, drawStarter, resolveMarket, get helpRegions() { return helpRegions; }, worldToScreen };

  function checkWin() {
    const w = G.teams.filter(t => t.fame >= WIN_FAME).sort((a, b) => b.fame - a.fame || b.credits - a.credits);
    if (!w.length) return false;
    if (!G.over) { tlog('game_over', { winner: w[0].i, winnerName: w[0].name, rounds: G.round, teams: ptSnapshot() }); setTimeout(ptSaveNow, 50); }
    G.over = true;
    updateHud();
    return true;
  }

  /* ============================================================================
   * 3. ARCHITECTURAL COMPOUND & ARENA RENDERER + SPATIAL HIT-TESTING
   * ============================================================================ */
  const cv = $('#worldCv'), ctx = cv.getContext('2d');

  function screenToWorld(sx, sy) {
    const W = window.innerWidth, H = window.innerHeight;
    return {
      x: (sx - W / 2) / cam.zoom + cam.x,
      y: (sy - H / 2) / cam.zoom + cam.y
    };
  }
  function worldToScreen(wx, wy) {
    const W = window.innerWidth, H = window.innerHeight;
    return {
      x: (wx - cam.x) * cam.zoom + W / 2,
      y: (wy - cam.y) * cam.zoom + H / 2
    };
  }

  // Dynamic Asymmetrical Layout:
  // When no fight is ongoing (arenaExpand = 0), the Central Pit is a compact 620x210 stage,
  // pulling all 4 garages into a tight 1048x600 compound so your Command Garage & robots render large and crisp.
  // When a fight starts (arenaExpand = 1), the Arena smoothly expands to the full 900x560 battleground.
  let arenaExpand = 0;
  const lerp = (a, b, u) => a + (b - a) * u;

  function getDynamicLayout(u) {
    const aw = lerp(620, Sim.W, u);
    const ah = lerp(220, Sim.H, u);
    const ax = 0;
    const ay = lerp(-68, 0, u);
    // At u=0:
    // - Central Stage spans x: -310 .. +310, y: -178 .. +42
    // - North Opponent Garage (620x124) spans x: -310 .. +310, y: -318 .. -194 (16px corridor to -178)
    // - West/East Opponent Garages (236x360) span x: -562 .. -326 and +326 .. +562, y: -318 .. +42 (top flush with North -318, bottom flush with Stage +42!)
    // - South Command Garage (1124x268) spans x: -562 .. +562, y: +62 .. +330 (20px clear corridor below Stage & West/East!)
    const slots = [
      { pos: 0, dir: 'S', gx: 0,                  gy: lerp(196, 436, u),  gw: 1124, gh: 268, doorX: 0,       doorY: ay + ah / 2 },
      { pos: 1, dir: 'W', gx: lerp(-444, -590, u), gy: lerp(-138, 0, u),  gw: 236,  gh: 360, doorX: -aw / 2, doorY: ay          },
      { pos: 2, dir: 'N', gx: 0,                  gy: lerp(-256, -360, u),gw: 620,  gh: 124, doorX: 0,       doorY: ay - ah / 2 },
      { pos: 3, dir: 'E', gx: lerp(444, 590, u),   gy: lerp(-138, 0, u),  gw: 236,  gh: 360, doorX: aw / 2,  doorY: ay          },
    ];
    return { ax, ay, aw, ah, slots };
  }

  function teamAtPos(pos) { return (viewerSeat + pos) % 4; }
  function posOfTeam(ti) { return (ti - viewerSeat + 4) % 4; }

  // Minimalist 2-column visual stat bars (uses exact Sim.STATS keys: armor, speed, turret, fp, acc, bullet)
  const STAT_BARS_LEFT  = [
    { k: 'armor',  lbl: 'ARMOUR',   short: 'ARM' },
    { k: 'speed',  lbl: 'SPEED',    short: 'SPD' },
    { k: 'turret', lbl: 'TURRET',   short: 'TUR' },
  ];
  const STAT_BARS_RIGHT = [
    { k: 'fp',     lbl: 'FIREPWR',  short: 'FPW' },
    { k: 'acc',    lbl: 'ACCURACY', short: 'ACC' },
    { k: 'bullet', lbl: 'VELOCITY', short: 'VEL' },
  ];

  function drawBar(ctx, x, y, w, h, frac, fillCol, bgCol = '#e6e3da', ticks = 0) {
    const f = Math.max(0, Math.min(1, frac || 0));
    ctx.fillStyle = bgCol;
    ctx.fillRect(x, y, w, h);
    if (f > 0) {
      ctx.fillStyle = fillCol;
      ctx.fillRect(x, y, w * f, h);
    }
    if (ticks > 1) {
      ctx.fillStyle = 'rgba(255,255,255,0.65)';
      for (let i = 1; i < ticks; i++) {
        ctx.fillRect(Math.round(x + (w * i) / ticks), y, 1, h);
      }
    }
    ctx.strokeStyle = '#c8c4b8';
    ctx.lineWidth = 1;
    ctx.strokeRect(x, y, w, h);
  }

  // garage previews shrink big frames a little so they still fit their box (bigger still looks bigger)
  const previewK = b => Math.sqrt(30 / Sim.frameOf(b).size);
  function drawRobotSprite(ctx, x, y, bodyA, turretA, col, b, hpFrac, name, modTag, stunned, overclocked, now, scale = 1, simBot = null) {
    // frame size grows with strain (Sim.frameOf), so loaded robots look (and are) bigger
    const frameSz = simBot && simBot.size ? simBot.size : b.size || Sim.frameOf(b).size;
    const SIZE = frameSz * scale, fs = frameSz / 30;
    ctx.save();
    ctx.translate(x, y);

    if (hpFrac <= 0) {
      ctx.rotate(bodyA);
      ctx.strokeStyle = col; ctx.lineWidth = 2.5;
      ctx.strokeRect(-SIZE / 2, -SIZE / 2, SIZE, SIZE);
      ctx.beginPath(); ctx.moveTo(-14 * scale, -14 * scale); ctx.lineTo(14 * scale, 14 * scale); ctx.moveTo(14 * scale, -14 * scale); ctx.lineTo(-14 * scale, 14 * scale); ctx.stroke();
      ctx.restore();
      return;
    }

    if (overclocked) {
      ctx.strokeStyle = '#d99000'; ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.arc(0, 0, (23 + Math.sin(now / 60) * 2.5) * scale, 0, Math.PI * 2); ctx.stroke();
    }

    const w = b.weapon || 'gun', cal = b.cal || 'medium';
    if (w === 'spinner') {
      const bladeBrk = (simBot?.broken || []).includes('Spinner blade');
      const spinA = simBot ? (simBot.spin || now / 45) : (now / 90);
      const R = 28 * scale * fs;
      ctx.save();
      ctx.rotate(spinA);
      ctx.fillStyle = col; ctx.globalAlpha = bladeBrk ? 0.35 : 0.85;
      ctx.beginPath();
      const teeth = 16;
      for (let k = 0; k < teeth * 2; k++) {
        const rr = k % 2 ? R * 0.74 : R, a = k * Math.PI / teeth;
        if (k === 0) ctx.moveTo(Math.cos(a) * rr, Math.sin(a) * rr);
        else ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr);
      }
      ctx.closePath(); ctx.fill(); ctx.globalAlpha = 1;
      ctx.strokeStyle = '#111'; ctx.lineWidth = 1.4; ctx.stroke();
      ctx.restore();
    }

    ctx.save();
    ctx.rotate(bodyA);
    // drive, drawn under the body: wheels = 4 tyres, tracks = treads, omni = corner rollers, boost = rear thruster
    const S2 = SIZE / 2, drv = b.drive || 'wheels';
    ctx.fillStyle = '#111';
    if (drv === 'tracks') {
      const tw = 6 * scale, off = simBot ? ((simBot.x + simBot.y) * 0.25) % (6 * scale) : 0;
      for (const sy of [-1, 1]) {
        const ty = sy > 0 ? S2 - 1 * scale : -S2 - tw + 1 * scale;
        ctx.fillStyle = '#111'; ctx.fillRect(-S2 - 3 * scale, ty, SIZE + 6 * scale, tw);
        ctx.strokeStyle = '#666'; ctx.lineWidth = 1;
        for (let tx = -S2 - 3 * scale + off; tx < S2 + 3 * scale; tx += 6 * scale) { ctx.beginPath(); ctx.moveTo(tx, ty); ctx.lineTo(tx, ty + tw); ctx.stroke(); }
      }
    } else if (drv === 'omni') {
      for (const [ax, ay] of [[-1, -1], [1, -1], [-1, 1], [1, 1]]) { ctx.beginPath(); ctx.arc(ax * S2, ay * S2, 4.5 * scale, 0, Math.PI * 2); ctx.fill(); }
    } else if (drv === 'boost') {
      const dash = simBot && simBot.dashT > 0;
      ctx.fillStyle = dash ? '#f08c00' : '#111'; ctx.fillRect(-S2 - (dash ? 16 : 6) * scale, -5 * scale, (dash ? 16 : 6) * scale, 10 * scale);
      ctx.fillStyle = '#111'; for (const sy of [-1, 1]) ctx.fillRect(-S2 + 3 * scale, sy > 0 ? S2 - 1 * scale : -S2 - 3 * scale, 8 * scale, 4 * scale);
    } else {
      for (const sx of [-1, 1]) for (const sy of [-1, 1]) ctx.fillRect(sx * (S2 - 7 * scale) - 4.5 * scale, sy > 0 ? S2 - 1 * scale : -S2 - 4 * scale, 9 * scale, 5 * scale);
    }
    ctx.fillStyle = col;
    ctx.fillRect(-SIZE / 2, -SIZE / 2, SIZE, SIZE);
    ctx.strokeStyle = '#111'; ctx.lineWidth = 2;
    ctx.strokeRect(-SIZE / 2, -SIZE / 2, SIZE, SIZE);
    ctx.fillStyle = '#ffffff'; ctx.fillRect(SIZE / 2 - 5 * scale, -3 * scale, 3 * scale, 6 * scale);

    const ar = b.lv ? b.lv.armor : 0;
    if (ar > 0) {
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.2;
      for (let k = 0; k < Math.min(3, ar); k++) {
        const inset = (3 + k * 3) * scale;
        ctx.strokeRect(-SIZE / 2 + inset, -SIZE / 2 + inset, SIZE - inset * 2, SIZE - inset * 2);
      }
    }
    ctx.restore();

    ctx.save();
    ctx.rotate(turretA);
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(0, 0, 7.5 * scale, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#111'; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(0, 0, 4.5 * scale, 0, Math.PI * 2); ctx.fill();
    if (w === 'mortar') ctx.fillRect(0, -5 * scale, 16 * scale, 10 * scale);
    else if (w === 'laser') { ctx.fillStyle = '#1f6feb'; ctx.fillRect(0, -2 * scale, 24 * scale, 4 * scale); }
    else if (w === 'saw') { ctx.strokeStyle = '#111'; ctx.lineWidth = 2.2; ctx.beginPath(); ctx.arc(16 * scale, 0, 7.5 * scale, 0, Math.PI * 2); ctx.stroke(); ctx.fillRect(0, -4 * scale, 14 * scale, 8 * scale); }
    else if (w === 'flame') {
      ctx.fillStyle = '#111'; ctx.fillRect(0, -4.5 * scale, 18 * scale, 9 * scale);
      ctx.fillStyle = '#ea580c'; ctx.fillRect(15 * scale, -6 * scale, 6 * scale, 12 * scale);
    } else if (w === 'spinner') {
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(0, 0, 3 * scale, 0, Math.PI * 2); ctx.fill();
    } else {
      ctx.fillRect(0, (cal === 'heavy' ? -4 : cal === 'rapid' ? -1.5 : -2.5) * scale, (cal === 'heavy' ? 28 : cal === 'rapid' ? 21 : 25) * scale, (cal === 'heavy' ? 8 : cal === 'rapid' ? 3 : 5) * scale);
    }
    ctx.restore();
    ctx.restore();

    if (name) {
      ctx.fillStyle = col;
      ctx.font = '800 13px system-ui, sans-serif';
      ctx.textAlign = 'center';
      const top = Math.max(15 * scale, (w === 'spinner' ? 22 * fs : SIZE / 2 / scale + 1) * scale);   // clear of a big frame or spinner blade
      ctx.fillText(name + (modTag || ''), x, y - top - 13 * scale);
      ctx.fillStyle = '#111'; ctx.fillRect(x - 23, y - top - 9 * scale, 46, 6);
      ctx.fillStyle = '#e5e2da'; ctx.fillRect(x - 22, y - top - 8 * scale, 44, 4);
      ctx.fillStyle = col; ctx.fillRect(x - 22, y - top - 8 * scale, 44 * Math.max(0, hpFrac), 4);
    }
    if (stunned) {
      ctx.fillStyle = '#1f6feb'; ctx.font = '800 11px system-ui, sans-serif';
      ctx.textAlign = 'center'; ctx.fillText('STUNNED', x, y + 28 * scale);
    }
  }

  function renderWorld(now) {
    const dpr = Math.max(1, window.devicePixelRatio || 1);
    const sw = window.innerWidth, sh = window.innerHeight;
    const targetW = Math.round(sw * dpr);
    const targetH = Math.round(sh * dpr);

    if (cv.width !== targetW || cv.height !== targetH) {
      cv.width = targetW;
      cv.height = targetH;
      cv.style.width = sw + 'px';
      cv.style.height = sh + 'px';
    }

    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, targetW, targetH);

    ctx.fillStyle = '#f6f4ee';
    ctx.fillRect(0, 0, targetW, targetH);

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';

    // Smoothly interpolate Arena expansion (0 = compact pre-fight stage, 1 = full 900x560 fight arena)
    const targetExpand = G.phase === 'fight' ? 1 : 0;
    arenaExpand += (targetExpand - arenaExpand) * 0.12;
    if (Math.abs(targetExpand - arenaExpand) < 0.002) arenaExpand = targetExpand;

    cam.x += (cam.tx - cam.x) * 0.10;
    cam.y += (cam.ty - cam.y) * 0.10;
    cam.zoom += (cam.tzoom - cam.zoom) * 0.10;
    if (Math.abs(cam.tx - cam.x) < 0.04) cam.x = cam.tx;
    if (Math.abs(cam.ty - cam.y) < 0.04) cam.y = cam.ty;
    if (Math.abs(cam.tzoom - cam.zoom) < 0.001) cam.zoom = cam.tzoom;

    ctx.save();
    ctx.translate(sw / 2, sh / 2);
    ctx.scale(cam.zoom, cam.zoom);
    ctx.translate(-cam.x, -cam.y);

    hitRegions = [];
    helpRegions = [];

    const L = getDynamicLayout(arenaExpand);
    const ax0 = L.ax - L.aw / 2, ay0 = L.ay - L.ah / 2;

    // Subtle architectural background grid
    ctx.strokeStyle = '#e5e1d7';
    ctx.lineWidth = 1;
    for (let x = -900; x <= 900; x += 60) { ctx.beginPath(); ctx.moveTo(x, -660); ctx.lineTo(x, 660); ctx.stroke(); }
    for (let y = -660; y <= 660; y += 60) { ctx.beginPath(); ctx.moveTo(-900, y); ctx.lineTo(900, y); ctx.stroke(); }

    // 1. Draw Corridors & Blast Doors connecting the 4 Garages to the Central Stage / Arena
    const doorOpen = false;   // robots roll in from the arena's sides now (fight intro)
    L.slots.forEach(slot => {
      const ti = teamAtPos(slot.pos);
      const isFighter = G.fight && G.fight.teams && G.fight.teams.includes(ti);
      const openAmt = (doorOpen && isFighter) ? Math.sin(Math.min(1, G.fight.rollout * 1.8) * Math.PI) * 32 : 0;

      ctx.fillStyle = '#eae6dc';
      if (slot.dir === 'S' || slot.dir === 'N') {
        const topY = slot.dir === 'S' ? slot.doorY : (slot.gy + slot.gh / 2);
        const botY = slot.dir === 'S' ? (slot.gy - slot.gh / 2) : slot.doorY;
        const ch = Math.max(0, botY - topY);
        ctx.fillRect(-40, topY, 80, ch);
        ctx.strokeStyle = '#111'; ctx.lineWidth = 1.8;
        ctx.strokeRect(-40, topY, 80, ch);
        ctx.fillStyle = '#111';
        ctx.fillRect(-38 - openAmt, slot.doorY - 3, 37, 6);
        ctx.fillRect(1 + openAmt, slot.doorY - 3, 37, 6);
      } else {
        const leftX = slot.dir === 'E' ? slot.doorX : (slot.gx + slot.gw / 2);
        const rightX = slot.dir === 'E' ? (slot.gx - slot.gw / 2) : slot.doorX;
        const cw = Math.max(0, rightX - leftX);
        ctx.fillRect(leftX, slot.doorY - 40, cw, 80);
        ctx.strokeStyle = '#111'; ctx.lineWidth = 1.8;
        ctx.strokeRect(leftX, slot.doorY - 40, cw, 80);
        ctx.fillStyle = '#111';
        ctx.fillRect(slot.doorX - 3, slot.doorY - 38 - openAmt, 6, 37);
        ctx.fillRect(slot.doorX - 3, slot.doorY + 1 + openAmt, 6, 37);
      }
    });

    // 2. Draw Central Pit / Stage (compact 620x210 when no fight is ongoing; expands to 900x560 during fights)
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(ax0, ay0, L.aw, L.ah);
    ctx.strokeStyle = '#f0ede6'; ctx.lineWidth = 1;
    for (let x = ax0 + 60; x < ax0 + L.aw; x += 60) { ctx.beginPath(); ctx.moveTo(x, ay0); ctx.lineTo(x, ay0 + L.ah); ctx.stroke(); }
    for (let y = ay0 + 60; y < ay0 + L.ah; y += 60) { ctx.beginPath(); ctx.moveTo(ax0, y); ctx.lineTo(ax0 + L.aw, y); ctx.stroke(); }

    ctx.strokeStyle = '#dfdbd0'; ctx.lineWidth = 1.8;
    ctx.beginPath(); ctx.arc(L.ax, L.ay, Math.min(L.aw, L.ah) * 0.34, 0, Math.PI * 2); ctx.stroke();

    ctx.strokeStyle = '#111111'; ctx.lineWidth = 3;
    ctx.strokeRect(ax0, ay0, L.aw, L.ah);

    hitRegions.push({ kind: 'arena', x: ax0, y: ay0, w: L.aw, h: L.ah });

    // 3. Draw Asymmetrical Garages: Player Command Garage (Pos 0) vs Slim Opponent Recon Strips (Pos 1, 2, 3)
    L.slots.forEach(slot => {
      const ti = teamAtPos(slot.pos);
      const t = G.teams[ti];
      if (slot.pos === 0) drawPlayerCommandGarage(ctx, slot, ti, t, now);
      else drawSlimOpponentGarage(ctx, slot, ti, t, now);
    });

    // 4. Draw Spatial Phase Content inside the Central Stage / Arena
    if (G.phase === 'setup') {
      drawSetupOnArena(ctx, L, now);
    } else if (G.phase === 'market') {
      drawMarketOnArena(ctx, L);
    } else if (G.phase === 'bets' && G.fight) {
      drawBettingOnArena(ctx, L);
    } else if (G.phase === 'fight' && G.fight && G.fight.B) {
      drawLiveBattleInArena(ctx, now, L);
    } else if (G.phase === 'after' && G.fight && G.fight.B) {
      drawAftermathOnArena(ctx, L);
    } else {
      drawStandbyStage(ctx, L, now);
    }

    // Welding sparks FX in garages
    for (let i = weldSparks.length - 1; i >= 0; i--) {
      const sp = weldSparks[i];
      sp.x += sp.vx * 0.016; sp.y += sp.vy * 0.016; sp.life -= 0.016;
      ctx.fillStyle = '#f59e0b';
      ctx.fillRect(sp.x - 2, sp.y - 2, 4, 4);
      if (sp.life <= 0) weldSparks.splice(i, 1);
    }

    ctx.restore();

    // 5. Screen-Space Targeting Arrow when dragging a card
    if (dragCard) {
      drawTargetingArrow(ctx, dragCard.startX, dragCard.startY, dragCard.curX, dragCard.curY, dragCard.card.phase === 'fight' ? '#d99000' : '#1f6feb');
    }

    ctx.restore();
  }

  /* ---------- Interactive Opening Setup & Starter Deck Draft on Arena Stage ---------- */
  function wrapLines(ctx, text, maxW) {
    const words = String(text || '').split(/\s+/);
    const lines = [];
    let cur = '';
    for (const w of words) {
      const test = cur ? cur + ' ' + w : w;
      if (ctx.measureText(test).width > maxW && cur) {
        lines.push(cur);
        cur = w;
      } else {
        cur = test;
      }
    }
    if (cur) lines.push(cur);
    return lines;
  }

  function drawSetupOnArena(ctx, L, now) {
    const cx = L.ax, cy = L.ay, x0 = cx - L.aw / 2, y0 = cy - L.ah / 2;
    const t = me();

    ctx.fillStyle = '#f6f4ee';
    ctx.fillRect(x0 + 2, y0 + 2, L.aw - 4, 26);
    ctx.strokeStyle = '#dedad0'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(x0, y0 + 28); ctx.lineTo(x0 + L.aw, y0 + 28); ctx.stroke();

    if (G.setupStep === 'sponsor') {
      ctx.fillStyle = '#111'; ctx.font = '900 11px system-ui, sans-serif'; ctx.textAlign = 'left';
      ctx.fillText('OPENING SETUP (STEP 1 OF 3)  —  CHOOSE YOUR TEAM SPONSOR', x0 + 12, y0 + 18.5);
      ctx.fillStyle = '#666'; ctx.font = '700 9.5px system-ui, sans-serif'; ctx.textAlign = 'right';
      ctx.fillText('AI teams draft from remaining sponsors', x0 + L.aw - 12, y0 + 18.5);

      const cw = 192, ch = 84, gapX = 10, gapY = 8;
      const startX = cx - (3 * cw + 2 * gapX) / 2, startY = y0 + 34;

      SPONSOR_KEYS.forEach((spKey, idx) => {
        const sp = SPONSORS[spKey];
        const col = idx % 3, row = Math.floor(idx / 3);
        const bx = startX + col * (cw + gapX), by = startY + row * (ch + gapY);
        const hov = mouse.wx >= bx && mouse.wx <= bx + cw && mouse.wy >= by && mouse.wy <= by + ch;

        ctx.fillStyle = hov ? '#f5f9ff' : '#fcfbf9';
        ctx.fillRect(bx, by, cw, ch);
        ctx.strokeStyle = hov ? t.col : '#222';
        ctx.lineWidth = hov ? 2.5 : 1.3;
        ctx.strokeRect(bx, by, cw, ch);

        // Top Sponsor Name & Tag Header
        ctx.fillStyle = hov ? t.col : '#111';
        ctx.fillRect(bx, by, cw, 20);
        ctx.fillStyle = '#ffffff'; ctx.font = '800 10px system-ui, sans-serif'; ctx.textAlign = 'left';
        ctx.fillText(sp.name, bx + 8, by + 13.5);
        ctx.font = '700 8.5px system-ui, sans-serif'; ctx.textAlign = 'right';
        ctx.fillText(sp.tag.toUpperCase(), bx + cw - 8, by + 13.5);

        // Wrapped Sponsor Rule Description
        ctx.fillStyle = '#333'; ctx.font = '600 9.5px system-ui, sans-serif'; ctx.textAlign = 'left';
        const lines = wrapLines(ctx, sp.text, cw - 16);
        lines.slice(0, 2).forEach((ln, li) => {
          ctx.fillText(ln, bx + 8, by + 35 + li * 12);
        });

        // Bottom Select Pill
        ctx.fillStyle = hov ? t.col : '#eae6dc';
        ctx.fillRect(bx + 8, by + ch - 21, cw - 16, 16);
        ctx.fillStyle = hov ? '#fff' : '#111'; ctx.font = '800 9.5px system-ui, sans-serif'; ctx.textAlign = 'center';
        ctx.fillText('Sign Sponsor Contract →', bx + cw / 2, by + ch - 9.5);

        hitRegions.push({ kind: 'setup_sponsor', spKey, x: bx, y: by, w: cw, h: ch });
      });
      return;
    }

    // Step 2 & Step 3: Starter Deck Draft (Pick 1 of 3 twice, from the 9 s1. starters)
    const pickNum = G.setupStep === 'draft1' ? 1 : 2;
    ctx.fillStyle = '#111'; ctx.font = '900 11px system-ui, sans-serif'; ctx.textAlign = 'left';
    ctx.fillText(STARTER_PICKS > 1 ? `STARTER DECK DRAFT (PICK ${pickNum} OF ${STARTER_PICKS})  —  KEEP 1 OF 3 STOCK ROBOTS` : 'STARTER DECK DRAFT  —  KEEP 1 OF 3 STOCK ROBOTS', x0 + 12, y0 + 18.5);
    ctx.fillStyle = '#555'; ctx.font = '700 9.5px system-ui, sans-serif'; ctx.textAlign = 'right';
    ctx.fillText('11 Stat Pts · Cap Lv3 · Stock Parts · 1 Eng', x0 + L.aw - 12, y0 + 18.5);

    const cw = 192, ch = 180, gap = 10;
    const startX = cx - (3 * cw + 2 * gap) / 2, by = y0 + 33;

    (G.draftOffer || []).forEach((sName, idx) => {
      const def = STARTERS[sName];
      if (!def) return;
      const b = def.b;
      const bx = startX + idx * (cw + gap);
      const hov = mouse.wx >= bx && mouse.wx <= bx + cw && mouse.wy >= by && mouse.wy <= by + ch;

      ctx.fillStyle = hov ? '#f8fbff' : '#fcfbf9';
      ctx.fillRect(bx, by, cw, ch);
      ctx.strokeStyle = hov ? t.col : '#222';
      ctx.lineWidth = hov ? 2.5 : 1.5;
      ctx.strokeRect(bx, by, cw, ch);

      // 1. Top-Left Blueprint Robot Sprite (34 x 34) + Name, Weapon & HP/Strain
      const px = bx + 8, py = by + 6, ps = 34;
      ctx.fillStyle = '#f3f1ea'; ctx.fillRect(px, py, ps, ps);
      ctx.strokeStyle = '#d0ccc0'; ctx.lineWidth = 1; ctx.strokeRect(px, py, ps, ps);
      drawRobotSprite(ctx, px + ps / 2, py + ps / 2, -Math.PI / 2, -Math.PI / 2, t.col, b, 1, null, null, false, false, now, 0.65 * previewK(b));

      ctx.fillStyle = '#111'; ctx.font = '900 12px system-ui, sans-serif'; ctx.textAlign = 'left';
      ctx.fillText(sName, bx + 48, by + 17);

      const wep = b.weapon === 'gun' ? `${b.cal || 'medium'} gun` : b.weapon;
      ctx.fillStyle = t.col; ctx.font = '800 9.5px system-ui, sans-serif';
