    }

    hitRegions.push({ kind: 'bay', team: ti, bayIdx: bIdx, robot: r, x: bx, y: by, w: bw, h: bh });

    if (inArenaNow) {
      ctx.fillStyle = t.col; ctx.font = '800 11px system-ui, sans-serif'; ctx.textAlign = 'center';
      ctx.fillText('IN ARENA PIT', bx + bw / 2, by + bh / 2 + 4);
      return;
    }

    const curHp = Math.max(0, maxHp(r) - r.dmg);
    const hpFrac = curHp / maxHp(r);
    const rk = Sim.riskOf(r.b);
    const wep = wepName(r.b).replace('medium', 'med');
    const helpers = r.b.helpers || [];

    // 1. Mini Blueprint Sprite Box (28 x 28) at top-left
    const px = bx + 6, py = by + 5, ps = 28;
    ctx.fillStyle = '#f3f1ea';
    ctx.fillRect(px, py, ps, ps);
    ctx.strokeStyle = '#d5d1c7'; ctx.lineWidth = 1;
    ctx.strokeRect(px, py, ps, ps);
    drawRobotSprite(ctx, px + ps / 2, py + ps / 2, -Math.PI / 2, -Math.PI / 2, t.col, r.b, hpFrac, null, null, false, false, now, 0.54 * previewK(r.b));
    { const hl = helpLook(r.b); help(px, py, ps, ps, hl[0], hl[1]); }
    { const hn = helpName(t, r); help(bx + 38, by + 4, bw / 2 - 30, 14, hn[0], hn[1]); }
    help(bx + bw / 2 + 8, by + 4, bw / 2 - 12, 14, esc(wepName(r.b)) + ' · ' + r.b.range + ' range', 'Its weapon and the distance it tries to fight at.');
    help(bx + 38, by + 18, bw - 42, 14, 'Health ' + curHp + '/' + maxHp(r), 'Damage stays between fights until it is repaired.');

    // 2. Top-Right Name, Weapon/Range & Filled HP Bar (bx + 40 .. bx + bw - 6)
    ctx.fillStyle = '#111'; ctx.font = '800 11px system-ui, sans-serif'; ctx.textAlign = 'left';
    ctx.fillText(r.name + (r.wins ? ' ★' + r.wins : ''), bx + 40, by + 15);

    ctx.fillStyle = '#666'; ctx.font = '700 9px system-ui, sans-serif'; ctx.textAlign = 'right';
    ctx.fillText(`${wep} · ${r.b.range}`, bx + bw - 6, by + 15);

    const hpCol = hpFrac > 0.5 ? '#2a9d3a' : hpFrac > 0.25 ? '#d99000' : '#d62828';
    const hpBarW = bw - 88;
    drawBar(ctx, bx + 40, by + 22, hpBarW, 6.5, hpFrac, hpCol, '#e6e3da', 0);
    ctx.fillStyle = '#222'; ctx.font = '700 8.5px system-ui, sans-serif'; ctx.textAlign = 'right';
    ctx.fillText(`${curHp}/${maxHp(r)}`, bx + bw - 6, by + 28.5);

    // 3. Full 6-Stat Filled Bar Grid (2 Columns x 3 Rows: ARM, SPD, TUR | FPW, ACC, VEL)
    const colW = Math.floor((bw - 16) / 2);
    const barW = colW - 26;
    STAT_BARS_LEFT.forEach((st, idx) => {
      const ry = by + 39 + idx * 11.5;
      const lv = r.b.lv?.[st.k] || 0;
      ctx.fillStyle = '#444'; ctx.font = '700 8.5px system-ui, sans-serif'; ctx.textAlign = 'left';
      ctx.fillText(st.short, bx + 6, ry + 6);
      drawBar(ctx, bx + 30, ry, barW, 6.5, lv / 4, t.col, '#e6e3da', 4);
    });
    STAT_BARS_RIGHT.forEach((st, idx) => {
      const ry = by + 39 + idx * 11.5;
      const lv = r.b.lv?.[st.k] || 0;
      const rx = bx + 10 + colW;
      ctx.fillStyle = '#444'; ctx.font = '700 8.5px system-ui, sans-serif'; ctx.textAlign = 'left';
      ctx.fillText(st.short, rx, ry + 6);
      drawBar(ctx, rx + 24, ry, barW, 6.5, lv / 4, t.col, '#e6e3da', 4);
    });

    help(bx + 4, by + 34, bw - 8, 38, STAT_GRID_HELP[0], STAT_GRID_HELP[1] + '<br>' + Sim.STATS.filter(k => k !== 'hp').map(k => STAT_HELP[k][0] + ' ' + (r.b.lv[k] || 0)).join(' · '));
    // 4. Bottom Recon Footer Strip: Strain, Engineers, Drones & Hidden Mod
    const fy = by + 74, fh = bh - 78;
    ctx.fillStyle = '#f3f1ea';
    ctx.fillRect(bx + 4, fy, bw - 8, fh);

    const glitchPct = Math.round((rk.glitch || 0) * 100);
    const riskCol = glitchPct < 15 ? '#2a9d3a' : glitchPct < 30 ? '#b45309' : '#d62828';
    ctx.fillStyle = riskCol; ctx.font = '700 8.5px system-ui, sans-serif'; ctx.textAlign = 'left';
    ctx.fillText(`STR ${rk.strain} (${rk.eng}E · ${glitchPct}%)`, bx + 8, fy + fh / 2 + 3);
    { const h1 = helpStrain(r.b); help(bx + 4, fy, 82, fh, 'STR ' + rk.strain + ' (' + rk.eng + 'E · ' + glitchPct + '%)', '<b>STR</b> strain ⚡' + rk.strain + ' · <b>' + rk.eng + 'E</b> engineers on it · <b>' + glitchPct + '%</b> glitch chance per fight.<br>' + h1[1]); }

    // 🎩 bookie's band vs the field + tags (click the chip for the scout panel)
    const cw = 70, cx = bx + bw - 8 - cw, cy = fy + 2, ch = fh - 4;
    drawOddsChip(ctx, fieldOdds(ti, r.b).p, cx, cy, cw, ch, 8.5, true);
    hitRegions.push({ kind: 'scout_chip', team: ti, robot: r, x: cx, y: cy, w: cw, h: ch });
    { const hb = helpBand(ti, r, fieldOdds(ti, r.b).p); help(cx, cy, cw, ch, hb[0], hb[1] + (scouted() ? '<br>Short names: H.fav · Fav · Even · Dog · H.dog.' : '')); }
    { const ht = helpTagsTxt(tagsFor(ti, r.b), 'this robot'); help(bx + 86, fy, cx - bx - 88, fh, ht[0], ht[1]); }
    drawTags(ctx, tagsFor(ti, r.b), cx - 6, fy + fh / 2 + 3, bw - cw - 96, 'right', 8.5, 1);
  }

  function drawMarketOnArena(ctx, L) {
    const x0 = L.ax - L.aw / 2, y0 = L.ay - L.ah / 2;

    if (G.marketAuction && G.marketAuction.tie) {
      // --- Interactive Spartacus Tie-Break Rebid View ---
      const A = G.marketAuction, tie = A.tie;
      const items = A.hostOnly ? [{ id: 'host', k: 3, name: 'Host the Fight', icon: '👑', text: '+1 Fame & Pick Fighters' }] : G.market.map((id, k) => ({ id, k, ...LOTS[id] }));

      ctx.fillStyle = '#fff8eb';
      ctx.fillRect(x0 + 2, y0 + 2, L.aw - 4, 26);
      ctx.strokeStyle = '#d99000'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(x0, y0 + 28); ctx.lineTo(x0 + L.aw, y0 + 28); ctx.stroke();

      const tiedNames = tie.teams.map(ti => G.teams[ti].name.split(' ')[0]).join(' vs ');
      ctx.fillStyle = '#b45309'; ctx.font = '900 11px system-ui, sans-serif'; ctx.textAlign = 'left';
      ctx.fillText(`⚔️ TIE-BREAK REBID ON ${items.find(it => it.k === tie.k).name.toUpperCase()} (${tiedNames} @ ${tie.baseBid} Cr)`, x0 + 12, y0 + 19);

      ctx.fillStyle = '#333'; ctx.font = '700 10px system-ui, sans-serif'; ctx.textAlign = 'right';
      ctx.fillText(`Unspent Available: ${tie.maxMyAdd} Cr`, x0 + L.aw - 12, y0 + 19);

      const w = 142, h = 180, gap = 10;
      const totalW = items.length * w + (items.length - 1) * gap;
      const startX = L.ax - totalW / 2, cy = y0 + 33;

      items.forEach((it, j) => {
        const k = it.k, x = startX + j * (w + gap);
        const done = A.results.find(r => r.idx === k);
        if (k < tie.k && done) {
          // Already resolved lot
          const res = done;
          const wTeam = res.winner >= 0 ? G.teams[res.winner] : null;
          ctx.fillStyle = '#fcfbf9'; ctx.fillRect(x, cy, w, h);
          ctx.strokeStyle = wTeam ? wTeam.col : '#bbb6a8'; ctx.lineWidth = 1.5; ctx.strokeRect(x, cy, w, h);
          ctx.fillStyle = wTeam ? wTeam.col : '#888'; ctx.fillRect(x, cy, w, 22);
          ctx.fillStyle = '#fff'; ctx.font = '800 10px system-ui, sans-serif'; ctx.textAlign = 'center';
          ctx.fillText(wTeam ? `WON: ${wTeam.name.toUpperCase()}` : 'NO BIDS', x + w / 2, cy + 14.5);
          ctx.fillStyle = '#111'; ctx.font = '900 12px system-ui, sans-serif';
          ctx.fillText(`PAID ${res.price} Cr`, x + w / 2, cy + 44);
          ctx.font = '800 11.5px system-ui, sans-serif';
          ctx.fillText(`${it.icon} ${it.name}`, x + w / 2, cy + 72);
          ctx.fillStyle = '#666'; ctx.font = '600 9.5px system-ui, sans-serif';
          ctx.fillText(it.text, x + w / 2, cy + 90);
        } else if (k === tie.k) {
          // Active Tie-Break Rebid Card!
          ctx.fillStyle = '#fffdf7'; ctx.fillRect(x, cy, w, h);
          ctx.strokeStyle = '#d99000'; ctx.lineWidth = 2.5; ctx.strokeRect(x, cy, w, h);
          ctx.fillStyle = '#d99000'; ctx.fillRect(x, cy, w, 22);
          ctx.fillStyle = '#fff'; ctx.font = '900 10px system-ui, sans-serif'; ctx.textAlign = 'center';
          ctx.fillText(`⚔️ TIE AT ${tie.baseBid} Cr!`, x + w / 2, cy + 14.5);

          ctx.fillStyle = '#111'; ctx.font = '800 11.5px system-ui, sans-serif';
          ctx.fillText(`${it.icon} ${it.name}`, x + w / 2, cy + 40);

          ctx.fillStyle = '#555'; ctx.font = '700 9px system-ui, sans-serif';
          ctx.fillText(`Tied: ${tiedNames}`, x + w / 2, cy + 55);
          ctx.fillStyle = '#b45309'; ctx.font = '800 10px system-ui, sans-serif';
          ctx.fillText(`Your Total: ${tie.baseBid + tie.myAdd} Cr`, x + w / 2, cy + 71);

          // Stepper: [−] +N Cr [+]
          const btnY = cy + 80;
          ctx.fillStyle = '#f2efe8'; ctx.fillRect(x + 12, btnY, 26, 26);
          ctx.strokeStyle = '#222'; ctx.lineWidth = 1.2; ctx.strokeRect(x + 12, btnY, 26, 26);
          ctx.fillStyle = '#111'; ctx.font = '800 14px system-ui, sans-serif';
          ctx.fillText('−', x + 25, btnY + 18);

          ctx.fillStyle = '#1f6feb'; ctx.font = '900 13px system-ui, sans-serif';
          ctx.fillText(`+${tie.myAdd} Cr`, x + w / 2, btnY + 18);

          ctx.fillStyle = '#f2efe8'; ctx.fillRect(x + w - 38, btnY, 26, 26);

          ctx.fillStyle = '#fff'; ctx.font = '800 10.5px system-ui, sans-serif';

        } else {

          ctx.fillStyle = '#f6f4ee'; ctx.fillRect(x, cy, w, h);
          ctx.strokeStyle = '#ccc8bc'; ctx.lineWidth = 1; ctx.strokeRect(x, cy, w, h);
          ctx.fillStyle = '#777'; ctx.font = '800 10px system-ui, sans-serif'; ctx.textAlign = 'center';
          ctx.fillText('RESOLVING NEXT...', x + w / 2, cy + 20);

          ctx.fillText(`Your Bid: ${A.all[viewerSeat][k]} Cr`, x + w / 2, cy + 92);

      });
      return;
    }

    if (G.marketResolved && G.marketResults) {

      ctx.fillRect(x0 + 2, y0 + 2, L.aw - 4, 26);
      ctx.strokeStyle = '#dedad0'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(x0, y0 + 28); ctx.lineTo(x0 + L.aw, y0 + 28); ctx.stroke();

        hitRegions.push({ kind: 'market_continue', x: btnX, y: btnY, w: btnW, h: btnH });
      }

      const w = 142, h = 180, gap = 10;
      const totalW = G.marketResults.length * w + (G.marketResults.length - 1) * gap;
      const startX = L.ax - totalW / 2, cy = y0 + 33;

      G.marketResults.forEach((res, k) => {
        const x = startX + k * (w + gap);
        const wTeam = res.winner >= 0 ? G.teams[res.winner] : null;
        const winCol = wTeam ? wTeam.col : '#888';

        ctx.fillStyle = '#fcfbf9';
        ctx.fillRect(x, cy, w, h);
        ctx.strokeStyle = wTeam ? winCol : '#bbb6a8';
        ctx.lineWidth = wTeam ? 2 : 1.2;
        ctx.strokeRect(x, cy, w, h);

        // 1. Top Winner Team Banner (22px tall)

        ctx.fillRect(x, cy, w, 22);
        ctx.fillStyle = '#ffffff';
        ctx.font = '800 10.5px system-ui, sans-serif';
        ctx.textAlign = 'center';

        ctx.fillText(wLabel, x + w / 2, cy + 14.5);

        // 2. Price Paid Badge (+ Rebid Note if tied)
        ctx.fillStyle = wTeam ? '#111' : '#777';

        const paidTxt = wTeam ? (res.rebidNote ? `PAID ${res.price} Cr (Rebid)` : `PAID ${res.price} Cr`) : '0 Cr · Unclaimed';
        ctx.fillText(paidTxt, x + w / 2, cy + 39);

        // 3. Lot Icon, Name & Effect
        ctx.fillStyle = '#111';
        ctx.font = '800 11.5px system-ui, sans-serif';
        ctx.fillText(`${res.icon} ${res.name}`, x + w / 2, cy + 57);

        ctx.fillStyle = '#666';
        ctx.font = '600 9.5px system-ui, sans-serif';
        ctx.fillText(res.text, x + w / 2, cy + 71);

        // 4. Destination / Installed-On Pill
        const isPendingHere = waitingInstall && G.pendingInstall[0].idx === k;
        ctx.fillStyle = isPendingHere ? '#e8f1ff' : '#f2efe8';
        ctx.fillRect(x + 8, cy + 77, w - 16, 18);
        ctx.strokeStyle = isPendingHere ? '#1f6feb' : '#d5d1c7';
        ctx.lineWidth = 1;
        ctx.strokeRect(x + 8, cy + 77, w - 16, 18);
        ctx.fillStyle = isPendingHere ? '#1f6feb' : '#222';
        ctx.font = '700 9.5px system-ui, sans-serif';
        ctx.fillText(res.target || 'Claimed', x + w / 2, cy + 89.5);

      drawTags(ctx, lotTags(LOTS[it.id], viewerSeat), x + w / 2, y + 98, w - 10, 'center', 9.5);

      // 🎩 what the lot does to each of your robots' odds vs the field

  function drawLiveBattleInArena(ctx, now, L) {
    const F = G.fight, B = F.B, ax0 = -Sim.W / 2, ay0 = -Sim.H / 2;
    const col = s => G.teams[F.teams[s]] ? G.teams[F.teams[s]].col : '#111';

    ctx.save();
    ctx.translate(ax0, ay0);

    // Zones (Oil Slicks, EMP Bombs)
    for (const z of B.zones) {
      if (z.kind === 'oil') {
        ctx.fillStyle = 'rgba(20, 20, 20, 0.22)';
        ctx.strokeStyle = '#222'; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.arc(z.x, z.y, z.r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      } else if (z.kind === 'emp_bomb') {
        const u = 1 - z.fuse / z.maxFuse;
        ctx.strokeStyle = '#1f6feb'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(z.x, z.y, z.r, 0, Math.PI * 2); ctx.stroke();
        ctx.fillStyle = 'rgba(31, 111, 235, 0.22)';
        ctx.beginPath(); ctx.arc(z.x, z.y, z.r * u, 0, Math.PI * 2); ctx.fill();
      }
    }

    // Waller Drone Cover Barriers
    if (B.walls) {
      for (const w of B.walls) {
        ctx.save();
        ctx.translate(w.x, w.y); ctx.rotate(w.a || 0);
        ctx.fillStyle = '#d6d3c9'; ctx.strokeStyle = col(w.team != null ? w.team : w.owner); ctx.lineWidth = 2;
        ctx.fillRect(-(w.r || 22), -5, (w.r || 22) * 2, 10);
        ctx.strokeRect(-(w.r || 22), -5, (w.r || 22) * 2, 10);
        ctx.restore();
      }
    }

    for (const sm of B.smokes) {
      ctx.fillStyle = '#9a9a9a'; ctx.globalAlpha = 0.35 * Math.min(1, sm.life);
      for (let k = 0; k < 7; k++) {
        const a = k * 0.9 + B.t * 0.3;
        ctx.beginPath();
        ctx.arc(sm.x + Math.cos(a) * sm.r * 0.45, sm.y + Math.sin(a) * sm.r * 0.45, sm.r * 0.55, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    }
    for (const m of B.mines) {
      ctx.fillStyle = col(m.team != null ? m.team : m.owner);
      ctx.beginPath(); ctx.arc(m.x, m.y, 5, 0, Math.PI * 2); ctx.fill();
    }
    for (const d of B.decoys) {
      ctx.save(); ctx.translate(d.x, d.y); ctx.rotate(d.body);
      ctx.strokeStyle = col(d.team != null ? d.team : d.owner); ctx.setLineDash([4, 3]); ctx.lineWidth = 2;
      ctx.strokeRect(-15, -15, 30, 30); ctx.restore();
    }

    // Waypoint lines
    for (const b of B.bots) {
      if (!b.helper && b.hp > 0 && b.wpT > 0 && b.wpX != null) {
        ctx.save();
        ctx.strokeStyle = col(b.team); ctx.setLineDash([5, 4]); ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(b.x, b.y); ctx.lineTo(b.wpX, b.wpY); ctx.stroke();
        ctx.beginPath(); ctx.arc(b.wpX, b.wpY, 10, 0, Math.PI * 2); ctx.stroke();
        ctx.restore();
      }
    }

    // Projectiles
    for (const q of B.bullets) {
      ctx.fillStyle = col(q.team != null ? q.team : q.owner);
      ctx.beginPath(); ctx.arc(q.x, q.y, Math.min(6, 1.8 + Math.sqrt(q.dmg) * 0.6), 0, Math.PI * 2); ctx.fill();
    }
    for (const q of B.saws) {
      const c = col(q.team != null ? q.team : q.owner);
      ctx.save(); ctx.translate(q.x, q.y); ctx.rotate(B.t * 25 + q.owner);
      ctx.fillStyle = c; ctx.beginPath();
      for (let k = 0; k < 16; k++) { const r = k % 2 ? 6 : 9.5, a = k * Math.PI / 8; ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r); }
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(0, 0, 2.5, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }
    for (const q of B.shells) {
      const u = q.t / q.T;
      ctx.strokeStyle = '#aaa'; ctx.lineWidth = 1; ctx.setLineDash([4, 4]);
      ctx.beginPath(); ctx.arc(q.tx, q.ty, 45, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]);
      ctx.fillStyle = col(q.team != null ? q.team : q.owner);
      ctx.beginPath();
      ctx.arc(q.sx + (q.tx - q.sx) * u, q.sy + (q.ty - q.sy) * u - Math.sin(Math.PI * u) * 90, 5 + Math.sin(Math.PI * u) * 3, 0, Math.PI * 2);
      ctx.fill();
    }
    for (const b of B.bots) {
      if (b.beam && b.hp > 0) {
        ctx.strokeStyle = col(b.team); ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(b.x + Math.cos(b.beamA) * 20, b.y + Math.sin(b.beamA) * 20);
        ctx.lineTo(b.x + Math.cos(b.beamA) * 280, b.y + Math.sin(b.beamA) * 280);
        ctx.stroke();
        ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(b.x + Math.cos(b.beamA) * 20, b.y + Math.sin(b.beamA) * 20);
        ctx.lineTo(b.x + Math.cos(b.beamA) * 280, b.y + Math.sin(b.beamA) * 280);
        ctx.stroke();
      }
      if (b.flame > 0 && b.hp > 0) {
        ctx.save();
        ctx.fillStyle = 'rgba(249, 115, 22, 0.26)';
        ctx.beginPath();
        ctx.moveTo(b.x, b.y);
        ctx.arc(b.x, b.y, 130, b.turret - 0.38, b.turret + 0.38);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      }
    }

    // Main Robots & Helper Drones
    for (const b of B.bots) {
      const side = b.team != null ? b.team : b.i;
      const ti = F.teams[side], slot = L.slots[posOfTeam(ti)];
      const doorLocalX = slot.doorX - ax0, doorLocalY = slot.doorY - ay0;
      const u = F.rolloutDone ? 1 : Math.min(1, F.rollout);
      const rx = doorLocalX + (b.x - doorLocalX) * u;
      const ry = doorLocalY + (b.y - doorLocalY) * u;

      if (b.helper) {
        if (b.hp <= 0) continue;
        const hd = Sim.HELPERS[b.helper];
        ctx.save();
        ctx.translate(rx, ry);
        if (b.helper === 'spotter' || b.helper === 'jammer') {
          ctx.strokeStyle = col(side); ctx.globalAlpha = 0.2; ctx.lineWidth = 1; ctx.setLineDash([4, 4]);
          ctx.beginPath(); ctx.arc(0, 0, b.helper === 'spotter' ? 200 : 160, 0, Math.PI * 2); ctx.stroke();
          ctx.setLineDash([]); ctx.globalAlpha = 1;
        }
        ctx.fillStyle = '#fff'; ctx.strokeStyle = col(side); ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(0, 0, 9, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        ctx.fillStyle = '#111'; ctx.font = '10px system-ui, sans-serif'; ctx.textAlign = 'center';
        ctx.fillText(hd ? hd.icon : '•', 0, 3.5);
        ctx.restore();
        continue;
      }

      if (b.shield > 0 && b.hp > 0) {
        ctx.strokeStyle = '#0284c7'; ctx.fillStyle = 'rgba(2, 132, 199, 0.12)'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(rx, ry, 23, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      }

      const modTag = b.mod ? ' [' + Sim.MODS[b.mod].name + ']' : '';   // parts are open (rulebook)
      drawRobotSprite(ctx, rx, ry, b.body, b.turret, col(side), F.robots[side].b, b.hp / b.s.hp, F.robots[side].name, modTag, b.stun > 0, b.overclockT > 0, now, 1, b);

      // Show active burning / broken parts status under robot
      const subTags = [];
      if (b.burn > 0) subTags.push('BURNING');
      const brkCount = (b.broken || []).length;
      if (brkCount > 0) subTags.push(`${brkCount} BROKEN`);
      if (subTags.length && b.hp > 0) {
        ctx.fillStyle = '#d62828'; ctx.font = '800 10px system-ui, sans-serif'; ctx.textAlign = 'center';
        ctx.fillText(subTags.join(' · '), rx, ry + 30);
      }

      hitRegions.push({ kind: 'arena_bot', slot: side, x: ax0 + rx - 32, y: ay0 + ry - 32, w: 64, h: 64 });
    }

    for (const f of B.fx) {
      if (f.k === 'heal') {
        ctx.strokeStyle = '#16a34a'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(f.x1, f.y1); ctx.lineTo(f.x2, f.y2); ctx.stroke();
        continue;
      }
      ctx.strokeStyle = f.col || '#111'; ctx.lineWidth = 2;
      const r = f.k === 'boom' ? 45 * (1 - f.life / 0.3) : f.k === 'bigboom' ? 90 * (1 - f.life / 0.4) : f.k === 'emp' ? f.r : 10;
      ctx.beginPath(); ctx.arc(f.x, f.y, Math.max(2, r), 0, Math.PI * 2); ctx.stroke();
    }
    for (const bn of B.banners) {
      ctx.fillStyle = bn.col || '#111'; ctx.font = '800 13px system-ui, sans-serif'; ctx.textAlign = 'center';
      ctx.fillText(bn.text, bn.x, bn.y);
    }

    ctx.restore();
  }

  function drawTargetingArrow(ctx, x1, y1, x2, y2, col) {
    ctx.save();
    const cx = (x1 + x2) / 2, cy = Math.min(y1, y2) - 90;
    ctx.strokeStyle = col;
    ctx.lineWidth = 4;
    ctx.setLineDash([10, 6]);
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.quadraticCurveTo(cx, cy, x2, y2);
    ctx.stroke();
    ctx.setLineDash([]);

    ctx.beginPath();
    ctx.arc(x2, y2, 16, 0, Math.PI * 2);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(x2, y2, 4, 0, Math.PI * 2);
    ctx.fillStyle = col;
    ctx.fill();
    ctx.restore();
  }

  /* ---------- Pointer & Card Drop Interactions ---------- */
  window.addEventListener('pointermove', e => {
    mouse.sx = e.clientX; mouse.sy = e.clientY;
    mouse.overCanvas = e.target && e.target.id === 'worldCv';
    const hEl = e.target && e.target.closest ? e.target.closest('[data-help]') : null;
    mouse.htmlHelp = hEl ? hEl.dataset.help : null;
    const w = screenToWorld(e.clientX, e.clientY);
    mouse.wx = w.x; mouse.wy = w.y;

    // Spatial hysteresis for Hand Tray open/close so it never jitters at hover boundaries
    const stage = $('#handStage');
    if (stage) {
      const distCenter = Math.abs(e.clientX - window.innerWidth / 2);
      const fromBottom = window.innerHeight - e.clientY;
      if (stage.classList.contains('open')) {
        if (!dragCard && (fromBottom > 245 || distCenter > 365)) {
          stage.classList.remove('open');
        }
      } else if (fromBottom <= 62 && distCenter <= 300) {
        stage.classList.add('open');
      }
    }

    if (dragCard) {
      dragCard.curX = e.clientX;
      dragCard.curY = e.clientY;
      const dx = e.clientX - dragCard.startX, dy = e.clientY - dragCard.startY;
      dragCard.el.style.transform = `translate(${dx}px, ${dy}px) rotate(${dx * 0.04}deg) scale(1.08)`;
    }
  });

  window.addEventListener('pointerup', e => {
    if (!dragCard) return;
    const dc = dragCard;
    dragCard = null;
    $('#handStage').classList.remove('dragging-active');
    const w = screenToWorld(e.clientX, e.clientY);

    if (e.clientY < window.innerHeight - 145) {
      if (tryPlayDraggedCard(dc, w.x, w.y)) {
        renderHand(true);
        updateHud();
        return;
      }
    }
    renderHand(true);
  });

  function tryPlayDraggedCard(dc, wx, wy) {
    const c = dc.card, t = me();
    if (G.phase === 'intrigue' && G.intrigueTurn === viewerSeat && c.phase !== 'fight') {
      const gHit = hitRegions.find(r => r.kind === 'garage' && wx >= r.x && wx <= r.x + r.w && wy >= r.y && wy <= r.y + r.h);
      if ((c.target === 'rival' || c.target === 'any' || c.phase === 'security') && !gHit) return false;
      humanPlay(dc.id, gHit ? gHit.team : null);
      return true;
    } else if (G.phase === 'fight' && c.phase === 'fight' && G.fight?.B && !G.fight.B.over && G.fight.rolloutDone) {
      const inArena = wx >= -Sim.W / 2 && wx <= Sim.W / 2 && wy >= -Sim.H / 2 && wy <= Sim.H / 2;
      if (!inArena) return false;
      const localX = wx + Sim.W / 2, localY = wy + Sim.H / 2;

      const B = G.fight.B;
      let nearSlot = 0, bestD = Infinity;
      B.bots.filter(b => !b.helper).forEach((b, s) => {
        const d = Math.hypot(b.x - localX, b.y - localY);
        if (d < bestD) { bestD = d; nearSlot = s; }
      });
      const mySlot = G.fight.teams.indexOf(viewerSeat);

      t.hand.splice(dc.idx, 1);
      const cmd = {
        card: dc.id,
        bot: c.target === 'arena' ? (mySlot >= 0 ? mySlot : nearSlot) : nearSlot,
        x: localX,
        y: localY
      };
      Sim.queueCmd(B, cmd);
      if (bc) bc.postMessage({ type: 'CARD_CMD', seat: viewerSeat, cmd, name: c.name });
      notify('🃏 You played ' + cardRef(dc.id) + '!', t.col);
      return true;
    }
    return false;
  }

  cv.addEventListener('click', e => {
    if (dragCard) return;
    const w = screenToWorld(e.clientX, e.clientY);
    const wx = w.x, wy = w.y;

    for (let i = hitRegions.length - 1; i >= 0; i--) {
      const r = hitRegions[i];
      if (wx < r.x || wx > r.x + r.w || wy < r.y || wy > r.y + r.h) continue;

      if (r.kind === 'setup_sponsor') {
        pickSetupSponsor(r.spKey);
        return;
      }

      if (r.kind === 'setup_draft') {
        pickSetupStarter(r.idx);
        return;
      }

      if (r.kind === 'sponsor_cycle') {
        const t = me();
        const idx = (SPONSOR_KEYS.indexOf(t.sponsor) + 1) % SPONSOR_KEYS.length;
        t.sponsor = SPONSOR_KEYS[idx];
        t.mechs = t.sponsor === 'sovereign' ? 4 : 3;
        notify(`Sponsor switched to <b>${esc(SPONSORS[t.sponsor].name)}</b> (${esc(SPONSORS[t.sponsor].tag)}).`, t.col);
        updateHud();
        return;
      }

      if (r.kind === 'hire_eng') {
        const t = me();
        if (t.credits >= 3 && t.engPool < 6) {
          t.credits -= 3;
          t.engPool++;
          const needBot = t.robots.slice().sort((a, b) => Sim.strainOf(b.b).total - Sim.strainOf(a.b).total).find(x => (x.b.eng || 0) < 3);
          if (needBot) needBot.b.eng = (needBot.b.eng || 0) + 1;
          notify('Hired an Engineer (+1 Engineer Pool).', t.col);
          updateHud();
        }
        return;
      }

      if (r.kind === 'eng_minus') {
        const bot = r.robot;
        if ((bot.b.eng || 0) > 0) {
          bot.b.eng--;
          updateHud();
        }
        return;
      }

      if (r.kind === 'eng_plus') {
        const t = me(), bot = r.robot;
        if ((bot.b.eng || 0) < 3 && freeEng(t) > 0) {
          bot.b.eng = (bot.b.eng || 0) + 1;
          spawnWeldSparks(r.x + r.w / 2, r.y + r.h / 2);
          updateHud();
        }
        return;
      }

      if (r.kind === 'range_toggle') {
        const bot = r.robot, order = ['short', 'mid', 'long'];
        bot.b.range = order[(order.indexOf(bot.b.range) + 1) % 3];
        updateHud();
        return;
      }

      if (r.kind === 'mod_cycle') {
        const bot = r.robot, mods = [null, ...Object.keys(Sim.MODS)];
        const curIdx = mods.indexOf(bot.b.mod || null);
        bot.b.mod = mods[(curIdx + 1) % mods.length];
        updateHud();
        return;
      }

      if (r.kind === 'focus_toggle') {
        const bot = r.robot, order = ['main', 'medics', 'helpers'];
        bot.b.focus = order[(order.indexOf(bot.b.focus || 'main') + 1) % 3];
        updateHud();
        return;
      }

      if (r.kind === 'bay_action' || (r.kind === 'bay' && r.team === viewerSeat)) {
        const t = me(), bot = r.robot;
        if (G.phase === 'upkeep') {
          const cost = Math.ceil(bot.dmg / 20);
          if (cost > 0 && t.credits >= cost) {
            t.credits -= cost; bot.dmg = 0;
            spawnWeldSparks(r.x + r.w / 2, r.y + r.h / 2);
            notify('🔧 Repaired <b>' + esc(bot.name) + '</b> to full HP.', t.col);
            updateHud();
          }
        } else if (G.phase === 'market' && G.pendingInstall && G.pendingInstall.length) {
          if (!canFit(bot, LOTS[G.pendingInstall[0].lot])) { notify('⚠️ ' + lotRef(G.pendingInstall[0].lot) + ' doesn\'t fit ' + esc(bot.name) + ' (' + esc(wepName(bot.b)) + ').', '#b45309'); return; }
          const item = G.pendingInstall.shift();
          const note = weaponSwapNote(bot, LOTS[item.lot]);
          if (note) {
            G.pendingInstall.unshift(item);
            if (G.swapAsk) return;
            G.swapAsk = true;
            ivModal('🔁 Change calibre on ' + esc(bot.name) + '?', note, [{ label: 'Change it', value: () => true }, { label: 'Pick another bay', secondary: true, value: () => false }]).then(ok => {
              G.swapAsk = false;
              if (!ok) return;
              G.pendingInstall.shift();
              const dest = applyLot(viewerSeat, item.lot, bot);
              if (G.marketResults && item.idx != null && G.marketResults[item.idx]) G.marketResults[item.idx].target = dest || `Fitted on ${bot.name}`;
              notify('🔩 Installed <b>' + esc(LOTS[item.lot].name) + '</b> on ' + esc(bot.name) + '.', t.col);
              updateHud();
            });
            return;
          }
          const dest = applyLot(viewerSeat, item.lot, bot);
          if (G.marketResults && item.idx != null && G.marketResults[item.idx]) {
            G.marketResults[item.idx].target = dest || `Fitted on ${bot.name}`;
          }
          spawnWeldSparks(r.x + r.w / 2, r.y + r.h / 2);
          notify('🔩 Installed <b>' + esc(LOTS[item.lot].name) + '</b> on ' + esc(bot.name) + '.', t.col);
          updateHud();
        } else if (G.phase === 'arena' && G.chooseMyBot) {
          if (bot.exhausted) { notify('😴 <b>' + esc(bot.name) + '</b> is exhausted and can\'t fight this round.', '#b45309'); return; }
          const s = G.fight.teams.indexOf(viewerSeat);
          G.fight.robots[s] = bot;
          afterChoose();
        }
        return;
      }

      if (r.kind === 'market_continue') {
        continueMarket();
        return;
      }

      if (r.kind === 'rebid_minus' && G.marketAuction?.tie) {
        G.marketAuction.tie.myAdd = Math.max(0, G.marketAuction.tie.myAdd - 1);
        updateHud();
        return;
      }
      if (r.kind === 'rebid_plus' && G.marketAuction?.tie) {
        G.marketAuction.tie.myAdd = Math.min(G.marketAuction.tie.maxMyAdd, G.marketAuction.tie.myAdd + 1);
        updateHud();
        return;
      }
      if (r.kind === 'rebid_submit' && G.marketAuction?.tie) {
        submitHumanRebid();
        return;
      }

      if (r.kind === 'market_minus') {
        G.myBids[r.idx] = Math.max(0, (G.myBids[r.idx] || 0) - 1);
        updateHud(); return;
      }
      if ((r.kind === 'market_plus' || r.kind === 'market_tile') && r.idx < 3 && !canTake(me(), G.market[r.idx])) {
        notify('⚠️ None of your robots can take ' + lotRef(G.market[r.idx]) + ', so you can\'t bid on it. Want to stop a rival getting it? Keep ' + cardRef('botched_install') + ' ready.', '#b45309');
        return;
      }
      if (r.kind === 'market_plus' || r.kind === 'market_tile') {
        const spent = r.idx === 3 ? G.myBids[3] : G.myBids.slice(0, 3).reduce((a, b) => a + b, 0);
        if (spent < me().credits) G.myBids[r.idx] = (G.myBids[r.idx] || 0) + 1;
        else if (r.kind === 'market_tile') G.myBids[r.idx] = 0;
        updateHud(); return;
      }

      if (r.kind === 'garage' && G.phase === 'arena' && G.host === viewerSeat && !G.chooseMyBot) {
        const k = G.pickTeams.indexOf(r.team);
        if (k >= 0) G.pickTeams.splice(k, 1);
        else if (G.pickTeams.length < 2) G.pickTeams.push(r.team);
        updateHud(); return;
      }

      if (r.kind === 'bet_card') {
        const other = 1 - r.side;
        G.myBet[other] = 0;
        const cap = maxBetOf(me());
        const next = (G.myBet[r.side] + 1) % (cap + 1);
        G.myBet[r.side] = next <= me().credits ? next : 0;
        updateHud(); return;
      }

      if (r.kind === 'buy_scout') { buyScout(); return; }
      if (r.kind === 'scout_chip') { openScout(r.team, r.robot); return; }

      if (r.kind === 'crate_pick') {
        const t = me();
        const wr = G.fight?.winner?.robot || t.robots[0];
        applyLot(viewerSeat, r.lot, wr);
        if (G.fight) G.fight.winnerCrateText = `Crate: ${LOTS[r.lot].name}`;
        G.crateChoices = null;
        notify(`🎁 Claimed <b>${esc(LOTS[r.lot].name)}</b> from the Winner's Crate!`, t.col);
        updateHud();
        return;
      }
    }
  });

  function spawnWeldSparks(wx, wy) {
    for (let k = 0; k < 18; k++) {
      const a = rnd() * Math.PI * 2, sp = 40 + rnd() * 90;
      weldSparks.push({ x: wx, y: wy, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 0.35 + rnd() * 0.25 });
    }
  }

  /* ---------- Main 60 FPS Loop ---------- */
  let lastT = performance.now(), accT = 0, finishWait = 0;
  function loop(now) {
    requestAnimationFrame(loop);
    const dt = Math.min(0.1, (now - lastT) / 1000);
    lastT = now;

    if (G && !G.over) { scoutWork(G.phase === 'fight' ? 3 : 14); if (scoutOpen) renderScout(false); }
    if (G && G.phase === 'fight' && G.fight && G.fight.B) {
      const F = G.fight, B = F.B;
      if (!F.rolloutDone) {
        F.rollout += dt * 0.85;
        if (F.rollout >= 1) {
          F.rollout = 1;
          F.rolloutDone = true;
          updateHud();
        }
      } else {
        accT += dt;
        while (accT >= 1 / 60 && !B.over) {
          stepAiCombatCards(F);
          Sim.step(B, 1 / 60);
          accT -= 1 / 60;
        }
        if (B.over) {
          finishWait += dt;
          if (finishWait > 1.4) {
            finishWait = 0;
            aftermath();
          }
        }
      }
    }
    renderWorld(now);
    updateHelp(now);
  }

  /* ---------- Top Pill & Hand Controls ---------- */
  $('#seatSel').onchange = e => {
    viewerSeat = +e.target.value;
    updateHud();
  };
  $('#handTab').addEventListener('pointerenter', () => {
    $('#handStage').classList.add('open');
  });
  $('#handTab').onclick = e => {
    e.stopPropagation();
    const tray = $('#handTray');
    tray.classList.toggle('pinned');
    const pinned = tray.classList.contains('pinned');
    $('#handTab').title = pinned ? 'Hand pinned open (click to collapse)' : 'Click to pin hand open';
  };
  window.addEventListener('resize', () => {
    if (!cam.manualZoom) {
      setCameraGoal(G?.phase === 'fight' ? 'arena' : 'compound');
    }
  });
  $('#camToggleBtn').onclick = () => {
    cam.manualZoom = !cam.manualZoom;
    if (cam.manualZoom) {
      const zoomedIn = cam.tzoom > 0.85;
      cam.tx = 0; cam.ty = zoomedIn ? 72 : 0; cam.tzoom = zoomedIn ? getCompoundZoom() : getArenaZoom();
    } else {
      setCameraGoal(G.phase === 'fight' ? 'arena' : 'compound');
    }
  };
  // action log controls: collapse (remembered per browser), "new" jump button, out of the way while dragging a card
  (() => {
    const lp = $('#logPanel'), body = $('#ticker'), nb = $('#lpNew'), tg = $('#lpToggle');
    let col = window.innerWidth < 1250;
    try { const v = localStorage.getItem('robocus.logCollapsed'); if (v != null) col = v === '1'; } catch (e) {}
    const apply = () => { lp.classList.toggle('collapsed', col); LOGC.unread = 0; tg.textContent = col ? '▸ show' : '–'; if (G) setCameraGoal(G.phase === 'fight' ? 'arena' : 'compound'); };
    tg.onclick = () => { col = !col; try { localStorage.setItem('robocus.logCollapsed', col ? '1' : '0'); } catch (e) {} apply(); if (!col) body.scrollTop = body.scrollHeight; };
    body.addEventListener('scroll', () => { if (logAtBottom()) nb.hidden = true; });
    nb.onclick = () => { body.scrollTop = body.scrollHeight; nb.hidden = true; };
    apply();
    setInterval(() => lp.classList.toggle('dragging', !!dragCard), 150);
  })();
  $('#quickFightBtn').onclick = () => {
    if (G.phase === 'setup') quickFinishSetup();
    const t = me();
    ['trigger', 'waypoint', 'overclock', 'field_eng'].forEach(cid => {
      if (t.hand.length < 5 && !t.hand.includes(cid)) t.hand.push(cid);
    });
    const foe = (viewerSeat + 1 + Math.floor(rnd() * 3)) % 4;
    G.fight = {
      sandbox: true,
      teams: [viewerSeat, foe],
      robots: [t.robots[0], G.teams[foe].robots[0]],
      bets: []
    };
    startFight();
  };

  newGame();
  requestAnimationFrame(loop);
})();
</script>
</body>
