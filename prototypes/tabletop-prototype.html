      ctx.fillText(`${wep.toUpperCase()} · ${b.range.toUpperCase()}`, bx + 48, by + 28.5);

      const hpVal = Sim.LV.hp[b.lv.hp];
      const rk = Sim.riskOf(b);
      const gPct = Math.round((rk.glitch || 0) * 100);
      ctx.fillStyle = '#444'; ctx.font = '700 9px system-ui, sans-serif';
      ctx.fillText(`${hpVal} HP · Strain ${rk.strain} (1E · ${gPct}% glitch)`, bx + 48, by + 39);

      // 2. Full 6-Stat Filled Bar Grid (2 Columns x 3 Rows: ARM, SPD, TUR | FPW, ACC, VEL)
      const colW = Math.floor((cw - 18) / 2);
      const barW = colW - 26;
      STAT_BARS_LEFT.forEach((st, sIdx) => {
        const ry = by + 46 + sIdx * 11.5;
        const lv = b.lv?.[st.k] || 0;
        ctx.fillStyle = '#444'; ctx.font = '700 8.5px system-ui, sans-serif'; ctx.textAlign = 'left';
        ctx.fillText(st.short, bx + 8, ry + 6);
        drawBar(ctx, bx + 32, ry, barW, 6.5, lv / 4, t.col, '#e6e3da', 4);
      });
      STAT_BARS_RIGHT.forEach((st, sIdx) => {
        const ry = by + 46 + sIdx * 11.5;
        const lv = b.lv?.[st.k] || 0;
        const rx = bx + 12 + colW;
        ctx.fillStyle = '#444'; ctx.font = '700 8.5px system-ui, sans-serif'; ctx.textAlign = 'left';
        ctx.fillText(st.short, rx, ry + 6);
        drawBar(ctx, rx + 24, ry, barW, 6.5, lv / 4, t.col, '#e6e3da', 4);
      });

      // 3. Tactical Identity & Matchup Box (by + 83 .. by + 144)
      ctx.fillStyle = '#f3f1ea';
      ctx.fillRect(bx + 8, by + 83, cw - 16, 61);
      ctx.strokeStyle = '#dfdbd0'; ctx.lineWidth = 1;
      ctx.strokeRect(bx + 8, by + 83, cw - 16, 61);

      ctx.fillStyle = '#222'; ctx.font = '600 8.8px system-ui, sans-serif'; ctx.textAlign = 'left';
      const dLines = wrapLines(ctx, def.d, cw - 24);
      dLines.slice(0, 2).forEach((ln, li) => {
        ctx.fillText(ln, bx + 12, by + 95 + li * 11);
      });

      const tableAvg = Math.round(starterVsTableAvg(sName, viewerSeat) * 100);
      const baseAvg = Math.round(starterOverallAvg(sName) * 100);
      const hasRivals = G.teams.some(tm => tm.i !== viewerSeat && tm.robots.length > 0);
      ctx.fillStyle = hasRivals && tableAvg >= 55 ? '#15803d' : '#1f6feb';
      ctx.font = '800 9px system-ui, sans-serif';
      ctx.fillText(
        hasRivals ? `vs Rivals on Table: ${tableAvg}% avg (Deck ${baseAvg}%)` : `Starter Deck Avg Win Rate: ${baseAvg}%`,
        bx + 12,
        by + 123
      );

      ctx.fillStyle = '#555'; ctx.font = '600 8.3px system-ui, sans-serif';
      ctx.fillText(starterMatchupNote(sName), bx + 12, by + 136);

      // 4. Bottom Action Button (by + 149 .. by + 174)
      ctx.fillStyle = hov ? t.col : '#111';
      ctx.fillRect(bx + 8, by + 149, cw - 16, 25);
      ctx.fillStyle = '#ffffff'; ctx.font = '800 10.5px system-ui, sans-serif'; ctx.textAlign = 'center';
      ctx.fillText(`Draft ${sName} (Bay ${pickNum}) →`, bx + cw / 2, by + 165);

      hitRegions.push({ kind: 'setup_draft', idx, x: bx, y: by, w: cw, h: ch });
    });
  }

  /* ---------- Compact Pre-Fight Central Stage Overview ---------- */
  function drawStandbyStage(ctx, L, now) {
    const cx = L.ax, cy = L.ay, x0 = cx - L.aw / 2, y0 = cy - L.ah / 2;

    // Minimalist Stage Header Bar
    ctx.fillStyle = '#f6f4ee';
    ctx.fillRect(x0 + 2, y0 + 2, L.aw - 4, 28);
    ctx.strokeStyle = '#dedad0'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(x0, y0 + 30); ctx.lineTo(x0 + L.aw, y0 + 30); ctx.stroke();

    ctx.fillStyle = '#111'; ctx.font = '800 11px system-ui, sans-serif'; ctx.textAlign = 'left';
    ctx.fillText(`ARENA PIT  ·  ROUND ${G.round} STANDBY`, x0 + 14, y0 + 19);

    const hostTxt = G.host >= 0 ? `HOST: ${G.teams[G.host].name.toUpperCase()}` : 'HOST: DECIDED IN MARKET';
    ctx.fillStyle = G.host >= 0 ? G.teams[G.host].col : '#666';
    ctx.textAlign = 'right';
    ctx.fillText(hostTxt, x0 + L.aw - 14, y0 + 19);

    ctx.textAlign = 'center';
    if (G.phase === 'arena' && G.fight && G.fight.teams) {
      // Show Invited Matchup Preview (any format: sides joined by VS, teams on a side by +)
      const F = G.fight, n = F.nSides || 2;
      ctx.fillStyle = '#111'; ctx.font = '800 12px system-ui, sans-serif';
      ctx.fillText('UPCOMING: ' + fightTitle(F).toUpperCase() + (F.house ? ' + HOUSE ROBOT' : ''), cx, cy - 36);
      const parts = [];
      for (let k = 0; k < n; k++) { if (k) parts.push({ t: ' VS ', c: '#888' }); sideTeams(F, k).forEach((ti, j) => { if (j) parts.push({ t: ' + ', c: '#888' }); parts.push({ t: G.teams[ti].name.toUpperCase(), c: G.teams[ti].col }); }); }
      ctx.font = '900 ' + (n > 2 || F.format === '2v2' ? 14 : 18) + 'px system-ui, sans-serif';
      const tw = parts.reduce((a, p) => a + ctx.measureText(p.t).width, 0);
      let px = cx - tw / 2; ctx.textAlign = 'left';
      parts.forEach(p => { ctx.fillStyle = p.c; ctx.fillText(p.t, px, cy - 6); px += ctx.measureText(p.t).width; });

      ctx.textAlign = 'center';
      ctx.fillStyle = '#2a9d3a'; ctx.font = '800 12px system-ui, sans-serif';
      ctx.fillText(G.chooseMyBot ? '▼ Click "Send to Pit" on one of your Robot Bays below' : 'Preparing fighters...', cx, cy + 24);
    } else if (G.phase === 'arena' && G.host === viewerSeat) {
      ctx.fillStyle = '#111'; ctx.font = '900 15px system-ui, sans-serif';
      ctx.fillText('YOU ARE ARENA HOST — CLICK ANY 2 GARAGES TO INVITE', cx, cy - 14);

  /* ---------- Controlling Player's Large Command Garage (Pos 0 — South) ---------- */
  function drawPlayerCommandGarage(ctx, slot, ti, t, now) {

    // 2. Sponsor Pill (x0 + 215, w: 235) — uses sp.name & sp.tag (no undefined!)
    const sp = t.sponsor ? SPONSORS[t.sponsor] : null;

    // 3. Fame Bar (x0 + 468 .. x0 + 628)

    drawBar(ctx, x0 + 542, y0 + 16, 84, 9, t.fame / WIN_FAME, t.col, '#e6e3da', 4);
    help(x0 + 462, y0 + 8, 170, 26, 'Fame ' + t.fame + '/' + WIN_FAME, 'First team to ' + WIN_FAME + ' fame wins. You get fame from winning fights, hosting and Publicity cards. Many Intrigue cards need a minimum fame to play.');

    // 4. Credits, Mechanics & Engineers Summary (x0 + 644 .. x0 + 908)
    const fEng = freeEng(t);
    ctx.fillStyle = '#111'; ctx.font = '800 11.5px system-ui, sans-serif'; ctx.textAlign = 'left';
    ctx.fillText(`CREDITS: ${t.credits} Cr     MECHS: ${t.mechs}     ENG: ${fEng}/${t.engPool} Free`, x0 + 644, y0 + 25);
    help(x0 + 640, y0 + 8, 270, 26, 'Credits · Mechanics · Engineers', '<b>Cr</b> credits: for bids, repairs, bets, scouting and sparring.<br><b>MECHS</b>: each Mechanic earns 1 Cr per Upkeep (each robot costs 1 Cr upkeep).<br><b>ENG</b> free/total Engineers: put 0–3 on a robot with its − / + buttons to cut glitches and breaks.');

    // 5. Hire Engineer Button (x0 + 920, w: 112)
    const hireX = x0 + slot.gw - 126, hireY = y0 + 10, hireW = 110, hireH = 22;
    const canHireEng = G.phase === 'upkeep' && t.credits >= 3 && t.engPool < 6;

    ctx.strokeRect(hireX, hireY, hireW, hireH);
    ctx.fillStyle = canHireEng ? '#fff' : '#888';
    ctx.font = '800 10.5px system-ui, sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('+ Hire Eng (3 Cr)', hireX + hireW / 2, hireY + 14.5);
    if (canHireEng) {
      hitRegions.push({ kind: 'hire_eng', x: hireX, y: hireY, w: hireW, h: hireH });

    // Header Bottom Divider
    ctx.strokeStyle = '#e5e1d7'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(x0, y0 + 40); ctx.lineTo(x0 + slot.gw, y0 + 40); ctx.stroke();

    // --- 3 Minimalist Robot Bay Cards (354 x 210 each inside 1124px South Garage) ---
    for (let bIdx = 0; bIdx < 3; bIdx++) {
      const bw = 354, bh = 210;
      const bx = x0 + 16 + bIdx * 369;
      const by = y0 + 46;
      const r = t.robots[bIdx];
      const inArenaNow = G.phase === 'fight' && G.fight && G.fight.robots && G.fight.robots.includes(r);

        (G.setupStep === 'draft2' && bIdx === 1)
      );
      ctx.fillStyle = r ? '#fcfbf9' : (isDraftingThisBay ? '#f0f6ff' : '#f6f4ee');
      ctx.fillRect(bx, by, bw, bh);
      ctx.strokeStyle = r ? '#222' : (isDraftingThisBay ? t.col : '#bbb6a8');
      ctx.lineWidth = r ? 1.5 : (isDraftingThisBay ? 2.2 : 1.2);
      if (!r && !isDraftingThisBay) ctx.setLineDash([5, 5]);
      ctx.strokeRect(bx, by, bw, bh);
      ctx.setLineDash([]);

      if (!r) {
        if (isDraftingThisBay) {
          ctx.fillStyle = t.col; ctx.font = '900 13px system-ui, sans-serif'; ctx.textAlign = 'center';
          ctx.fillText(`▲ DRAFT STARTER #${bIdx + 1} ON ARENA STAGE`, bx + bw / 2, by + bh / 2 - 4);
          ctx.fillStyle = '#555'; ctx.font = '600 11px system-ui, sans-serif';
          ctx.fillText('Pick 1 of the 3 s1. stock robots above', bx + bw / 2, by + bh / 2 + 14);
        } else if (G.phase === 'setup' && bIdx < STARTER_PICKS) {
          ctx.fillStyle = '#666'; ctx.font = '800 12.5px system-ui, sans-serif'; ctx.textAlign = 'center';
          ctx.fillText(`STARTER BAY #${bIdx + 1} (OPENING DRAFT)`, bx + bw / 2, by + bh / 2 - 4);
          ctx.fillStyle = '#888'; ctx.font = '600 11px system-ui, sans-serif';
          ctx.fillText('Drafted from the 9-bot s1. Starter Deck', bx + bw / 2, by + bh / 2 + 14);
        } else {
          ctx.fillStyle = '#666'; ctx.font = '800 12.5px system-ui, sans-serif'; ctx.textAlign = 'center';
          ctx.fillText('+ EMPTY ENGINEERING BAY', bx + bw / 2, by + bh / 2 - 4);
          ctx.fillStyle = '#888'; ctx.font = '600 11px system-ui, sans-serif';
          ctx.fillText('Win a New Robot lot in the Market', bx + bw / 2, by + bh / 2 + 14);
        }
        continue;
      }

      hitRegions.push({ kind: 'bay', team: ti, bayIdx: bIdx, robot: r, x: bx, y: by, w: bw, h: bh });

      if (inArenaNow) {
        ctx.fillStyle = t.col; ctx.font = '900 14px system-ui, sans-serif'; ctx.textAlign = 'center';
        ctx.fillText('DEPLOYED IN ARENA PIT', bx + bw / 2, by + bh / 2 + 5);
        continue;
      }

      const curHp = Math.max(0, maxHp(r) - r.dmg);
      const hpFrac = curHp / maxHp(r);
      const helpers = r.b.helpers || [];

      // 1. Top-Left Chassis Blueprint Preview Box (52 x 52)
      const px = bx + 12, py = by + 10, ps = 52;
      ctx.fillStyle = '#f3f1ea';
      ctx.fillRect(px, py, ps, ps);
      ctx.strokeStyle = '#d0ccc0'; ctx.lineWidth = 1;
      ctx.strokeRect(px, py, ps, ps);
      drawRobotSprite(ctx, px + ps / 2, py + ps / 2, -Math.PI / 2, -Math.PI / 2, t.col, r.b, hpFrac, null, null, false, false, now, 0.95 * previewK(r.b));
      { const hl = helpLook(r.b); help(px, py, ps, ps, hl[0], hl[1]); }
      { const hn = helpName(t, r); help(bx + 70, by + 8, 200, 20, hn[0], hn[1]); }
      help(bx + bw - 90, by + 8, 80, 20, esc(wepName(r.b)) + ' · ' + r.b.range + ' range', 'Its weapon, for life: robots never swap weapons. ' + (Sim.wupOf(r.b) ? '<b>' + esc(Sim.WUPS[r.b.wup].name) + '</b>: ' + esc(Sim.WUPS[r.b.wup].text) + ' ' : 'Upgrade it with its own weapon upgrade from the Market. ') + 'Preferred distance: <b>' + r.b.range + '</b> (change it with the Range button).');
      help(bx + 70, by + 28, bw - 80, 14, 'Health ' + Math.max(0, maxHp(r) - r.dmg) + '/' + maxHp(r), 'Damage stays between fights. Repair in Upkeep: 0.7 Cr per 20 damage (about 1 Cr per 29), ×(1 + fighting time / 60 s), rounded up.<br>' + wearTxt(r));

      // Clean geometric satellite dots for helper drones on the preview corner
      helpers.forEach((hk, hi) => {
        const dx = px + 8 + hi * 10, dy = py + ps - 6;
        ctx.fillStyle = t.col;
        ctx.beginPath(); ctx.arc(dx, dy, 3.2, 0, Math.PI * 2); ctx.fill();
      });

      // 2. Top-Right Identity, Weapon & Filled HP Bar (bx + 74 .. bx + bw - 12)
      const fav = r.wins >= favWins(t);
      const winStr = r.wins ? '  ' + '★'.repeat(Math.min(3, r.wins)) : '';
      ctx.fillStyle = '#111'; ctx.font = '900 14.5px system-ui, sans-serif'; ctx.textAlign = 'left';
      ctx.fillText(r.name + winStr + (fav ? ' [FAV]' : '') + (r.exhausted ? ' 😴' : '') + (r.faceDown && r.faceDown.length ? ' 🂠×' + r.faceDown.length : ''), bx + 74, by + 23);

      const wepLabel = wepName(r.b);
      ctx.fillStyle = '#555'; ctx.font = '800 10.5px system-ui, sans-serif'; ctx.textAlign = 'right';
      ctx.fillText(wepLabel.toUpperCase(), bx + bw - 12, by + 23);

      // Clean Filled HP Bar
      const hpCol = hpFrac > 0.5 ? '#2a9d3a' : hpFrac > 0.25 ? '#d99000' : '#d62828';
      drawBar(ctx, bx + 74, by + 30, 190, 8, hpFrac, hpCol, '#e6e3da', 0);
      ctx.fillStyle = '#222'; ctx.font = '700 10.5px system-ui, sans-serif'; ctx.textAlign = 'right';
      ctx.fillText(`${curHp}/${maxHp(r)} HP`, bx + bw - 12, by + 38);

      // Contextual Action Button OR Helper Drone Line (by + 44 .. by + 62)
      const repCost = repairCost(r);
      const actX = bx + 74, actY = by + 43, actW = bw - 86, actH = 20;
      if (G.phase === 'upkeep' && repCost > 0) {
        const ok = t.credits >= repCost;
        ctx.fillStyle = ok ? '#111' : '#999';
        ctx.fillRect(actX, actY, actW, actH);
        ctx.fillStyle = '#fff'; ctx.font = '800 10.5px system-ui, sans-serif'; ctx.textAlign = 'center';
        fitText(ctx, `Repair −${r.dmg} HP: ${repCost} Cr` + (r.wear > 0 ? `  ·  ⏱ ${Math.round(r.wear)} s wear ×${wearMult(r).toFixed(1)}` : ''), actX + actW / 2, actY + 13.5, actW - 10, '800', 10.5);
        hitRegions.push({ kind: 'bay_action', robot: r, x: actX, y: actY, w: actW, h: actH });
        help(actX, actY, actW, actH, 'Repair', 'Fix all ' + r.dmg + ' damage for ' + repCost + ' Cr: 0.7 Cr per 20 damage, more the longer it has fought.<br>' + wearTxt(r) + '<br>Repairing resets the wear. Unrepaired damage stays for the next fight.');
      } else if (G.phase === 'market' && G.pendingInstall && G.pendingInstall.length) {
        const nextLot = LOTS[G.pendingInstall[0].lot];
        const pv = lotPreview(r, nextLot), wasted = !canFit(r, nextLot);
        const sh = oddsShift(viewerSeat, r, nextLot);
        ctx.fillStyle = wasted ? '#999' : '#1f6feb';
        ctx.fillRect(actX, actY, actW, actH);
        ctx.fillStyle = '#fff'; ctx.textAlign = 'center';
        fitText(ctx, `Fit ${nextLot.name}: ` + (sh ? '🎩 ' + sh + ' · ' : sh === null ? '🎩 … · ' : '') + pv, actX + actW / 2, actY + 13.5, actW - 8, '800', 10.5);
        help(actX, actY, actW, actH, 'Fit ' + esc(nextLot.name) + ' on ' + esc(r.name), (sh ? '<b>🎩 ' + sh + '</b>: the bookie\'s band vs the field before→after (= means no change).<br>' : '') + 'In numbers: ' + esc(pv) + '.<br><i>Click to fit it here.</i>');
        hitRegions.push({ kind: 'bay_action', robot: r, x: actX, y: actY, w: actW, h: actH });
      } else if (G.phase === 'arena' && G.chooseMyBot) {
        ctx.fillStyle = r.exhausted ? '#999' : '#2a9d3a';
        ctx.fillRect(actX, actY, actW, actH);
        ctx.fillStyle = '#fff'; ctx.font = '800 10.5px system-ui, sans-serif'; ctx.textAlign = 'center';
        ctx.fillText(r.exhausted ? `${r.name} is exhausted` : `Send ${r.name} to Arena Pit`, actX + actW / 2, actY + 13.5);
        hitRegions.push({ kind: 'bay_action', robot: r, x: actX, y: actY, w: actW, h: actH });
      } else {
        // 🎩 the bookie's band vs the field (click for the scout panel) + counter tags
        const fo = fieldOdds(ti, r.b);
        drawOddsChip(ctx, fo.p, actX, actY, 112, actH, 10.5);
        hitRegions.push({ kind: 'scout_chip', team: ti, robot: r, x: actX, y: actY, w: 112, h: actH });
        { const hb = helpBand(ti, r, fo.p); help(actX, actY, 112, actH, hb[0], hb[1]); }
        { const ht = helpTagsTxt(tagsFor(ti, r.b), 'this robot'); help(actX + 116, actY, actW - 116, actH, ht[0], ht[1]); }
        if (!drawTags(ctx, tagsFor(ti, r.b), actX + 120, actY + 14, actW - 122, 'left', 10.5)) {
          ctx.fillStyle = '#888'; ctx.font = '600 10px system-ui, sans-serif'; ctx.textAlign = 'left'; ctx.fillText('no clear counters', actX + 120, actY + 14);
        }
      }

      // Subtle Divider
      ctx.strokeStyle = '#e8e4da'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(bx + 12, by + 68); ctx.lineTo(bx + bw - 12, by + 68); ctx.stroke();

      // 3. Minimalist Visual Stat Bars (2 Columns x 3 Rows, by + 75 .. by + 125)
      const unused = UNUSED_STATS[r.b.weapon] || [];
      const calF = r.b.weapon === 'gun' && r.b.cal && r.b.cal !== 'medium' ? Sim.CAL[r.b.cal].turret : 1;
      STAT_BARS_LEFT.forEach((st, idx) => {
        const ry = by + 76 + idx * 17;
        const lv = r.b.lv?.[st.k] || 0;
        ctx.fillStyle = '#444'; ctx.font = '700 9.5px system-ui, sans-serif'; ctx.textAlign = 'left';
        ctx.fillText(st.lbl, bx + 12, ry + 7.5);
        if (st.k === 'turret' && calF !== 1) { ctx.fillStyle = calF < 1 ? '#d62828' : '#2a9d3a'; ctx.font = '800 8.5px system-ui, sans-serif'; ctx.textAlign = 'right'; ctx.fillText('×' + calF, bx + 66, ry + 7.5); }
        drawBar(ctx, bx + 70, ry, 96, 8, lv / 4, t.col, '#e6e3da', 4);
        { const hs = helpStat(r.b, st.k); help(bx + 10, ry - 4, 160, 16, hs[0], hs[1]); }
      });
      STAT_BARS_RIGHT.forEach((st, idx) => {
        const ry = by + 76 + idx * 17;
        const lv = r.b.lv?.[st.k] || 0, off = unused.includes(st.k);
        ctx.fillStyle = off ? '#aaa' : '#444'; ctx.font = '700 9.5px system-ui, sans-serif'; ctx.textAlign = 'left';
        ctx.fillText(st.lbl, bx + 182, ry + 7.5);
        ctx.globalAlpha = off ? 0.35 : 1;
        drawBar(ctx, bx + 246, ry, 96, 8, lv / 4, t.col, '#e6e3da', 4);
        ctx.globalAlpha = 1;
        if (off) { ctx.fillStyle = '#999'; ctx.font = '700 8px system-ui, sans-serif'; ctx.textAlign = 'left'; ctx.fillText('unused', bx + 250, ry + 7); }
        { const hs = helpStat(r.b, st.k); help(bx + 180, ry - 4, 165, 16, hs[0], hs[1]); }
      });

      // 4. Strain, Filled Risk Bar & Engineer Stepper (by + 132 .. by + 168)
      const rk = Sim.riskOf(r.b);
      const eng = rk.eng;
      const glitchPct = Math.round((rk.glitch || 0) * 100);
      const breakPct = Math.round((rk.anyBreak || 0) * 100);
      const riskFrac = Math.min(1, (rk.glitch || 0) + (rk.anyBreak || 0) * 0.5);
      const riskCol = riskFrac < 0.18 ? '#2a9d3a' : riskFrac < 0.38 ? '#d99000' : '#d62828';

      const sbX = bx + 12, sbY = by + 132, sbW = bw - 24, sbH = 36;
      ctx.fillStyle = '#f5f3ec';
      ctx.fillRect(sbX, sbY, sbW, sbH);
      ctx.strokeStyle = '#d5d1c7'; ctx.lineWidth = 1;
      ctx.strokeRect(sbX, sbY, sbW, sbH);

      ctx.fillStyle = '#111'; ctx.font = '800 10px system-ui, sans-serif'; ctx.textAlign = 'left';
      const stLbl = `STRAIN ${rk.strain} · ${Sim.frameOf(r.b).name.toUpperCase()}`;
      ctx.fillText(stLbl, sbX + 8, sbY + 14);
      const stW = ctx.measureText(stLbl).width;
      ctx.fillStyle = riskCol; ctx.textAlign = 'right';
      fitText(ctx, `Glitch ${glitchPct}% · Break ${breakPct}%`, sbX + 214, sbY + 14, 206 - stW - 10, '700', 10);
      ctx.textAlign = 'left';
      { const h1 = helpStrain(r.b), h2 = helpRisk(r.b); help(sbX, sbY, stW + 12, sbH, h1[0], h1[1]); help(sbX + stW + 12, sbY, 214 - stW - 12, sbH, h2[0], h2[1]); }

      // Clean Filled Reliability / Risk Bar
      drawBar(ctx, sbX + 8, sbY + 21, 206, 7, riskFrac, riskCol, '#e2dfd7', 0);

      // Engineer Stepper: [−] 1 ENG [+]
      const emX = sbX + sbW - 102, emY = sbY + 6, eBtnW = 22, eBtnH = 24;
      const canMinus = eng > 0;
      const canPlus = eng < 3 && freeEng(t) > 0;

      ctx.fillStyle = canMinus ? '#fff' : '#e6e3da';
      ctx.fillRect(emX, emY, eBtnW, eBtnH);

  /* ---------- Opponent Reconnaissance Garages (Pos 1 West, Pos 2 North, Pos 3 East) ---------- */
  function drawSlimOpponentGarage(ctx, slot, ti, t, now) {
    const x0 = slot.gx - slot.gw / 2, y0 = slot.gy - slot.gh / 2;
    const horiz = slot.dir === 'N';

    const isDragTarget = dragCard && dragCard.card.target === 'garage' && ti !== viewerSeat;
    const isHostPicked = G.phase === 'arena' && G.host === viewerSeat && (G.pickTeams || []).includes(ti);
    const hovered = mouse.wx >= x0 && mouse.wx <= x0 + slot.gw && mouse.wy >= y0 && mouse.wy <= y0 + slot.gh;

    ctx.fillStyle = '#ffffff';
    ctx.fillRect(x0, y0, slot.gw, slot.gh);
    ctx.strokeStyle = (isDragTarget && hovered) || isHostPicked ? t.col : '#111111';
    ctx.lineWidth = (isDragTarget && hovered) || isHostPicked ? 3.5 : 2;
    ctx.strokeRect(x0, y0, slot.gw, slot.gh);

    ctx.fillStyle = t.col;
    ctx.fillRect(x0, y0, slot.gw, 4);

    hitRegions.push({ kind: 'garage', team: ti, x: x0, y: y0, w: slot.gw, h: slot.gh });

    const spName = t.sponsor && SPONSORS[t.sponsor] ? SPONSORS[t.sponsor].name : 'Sponsor Draft...';
    const badges = (G.host === ti ? ' [HOST]' : '') + (G.intrigueTurn === ti ? ' 🕵️' : '');
    const assets = '🤖' + secReady(t) + ' · 🃏' + t.hand.length + ' · 📦' + stashOf(t).length;
    const oppHelp = ['Fame · Cr · M/E · 🤖 · 🃏', '<b>Fame ' + t.fame + '/' + WIN_FAME + '</b> (first to ' + WIN_FAME + ' wins) · <b>' + t.credits + ' Cr</b> credits · <b>' + t.mechs + 'M</b> Mechanics (earn credits) / <b>' + t.engPool + 'E</b> Engineers (keep robots running) · <b>🤖' + secReady(t) + '</b> ready Security Bots (block schemes) · <b>🃏' + t.hand.length + '</b> Intrigue cards in hand · <b>📦' + stashOf(t).length + '</b> Stash: ' + (stashOf(t).length ? stashOf(t).map(id => esc(LOTS[id].name) + ' (' + partForTxt(me(), id) + ')').join(', ') : 'empty') + '.'];
    const spHelp = t.sponsor && SPONSORS[t.sponsor] ? ['Sponsor: ' + esc(SPONSORS[t.sponsor].name), '<b>' + esc(SPONSORS[t.sponsor].tag) + '</b>: ' + esc(SPONSORS[t.sponsor].text)] : null;
    const badgeHelp = G.host === ti || G.intrigueTurn === ti ? [esc(t.name), (G.host === ti ? '<b>[HOST]</b>: runs this round\'s fight. ' : '') + (G.intrigueTurn === ti ? '<b>🕵️</b>: it\'s their Intrigue turn.' : '')] : null;

    if (horiz) {
      // North Opponent Garage (620 x 124)
      const statTxt = `Fame ${t.fame}/${WIN_FAME}  ·  ${t.credits} Cr  ·  ${t.mechs}M / ${t.engPool}E  ·  ${assets}`;
      ctx.fillStyle = '#222'; ctx.font = '700 10.5px system-ui, sans-serif'; ctx.textAlign = 'right';
      const statW = ctx.measureText(statTxt).width;
      ctx.fillText(statTxt, x0 + slot.gw - 10, y0 + 18);
      ctx.fillStyle = t.col; ctx.textAlign = 'left';
      fitText(ctx, `${t.name} · ${spName}${badges}`, x0 + 10, y0 + 18, slot.gw - 30 - statW, '800', 12);
      help(x0 + slot.gw - 10 - statW, y0 + 5, statW, 18, oppHelp[0], oppHelp[1]);
      { const hh = spHelp || badgeHelp; if (hh) help(x0 + 6, y0 + 5, slot.gw - 24 - statW, 18, hh[0], hh[1] + (badgeHelp && spHelp ? '<br>' + badgeHelp[1] : '')); }

      // 3 Recon Cards with Full 6-Stat Filled Bars (196 x 92 each)
      for (let bIdx = 0; bIdx < 3; bIdx++) {
        const bw = 196, bh = 92;
        const bx = x0 + 10 + bIdx * 202, by = y0 + 25;
        drawCompactOpponentBay(ctx, slot, ti, t, t.robots[bIdx], bIdx, bx, by, bw, bh, now);
      }
    } else {
      // West / East Opponent Garages (236 x 360)
      ctx.fillStyle = t.col; ctx.font = '800 12px system-ui, sans-serif'; ctx.textAlign = 'left';
      const head = `${t.name}${badges}`;
      const headW = ctx.measureText(head).width;
      ctx.fillText(head, x0 + 10, y0 + 18);
      ctx.fillStyle = '#666'; ctx.textAlign = 'right';
      fitText(ctx, spName, x0 + slot.gw - 10, y0 + 18, slot.gw - 28 - headW, '700', 10);
      if (badgeHelp) help(x0 + 6, y0 + 5, headW + 8, 18, badgeHelp[0], badgeHelp[1]);
      if (spHelp) help(x0 + headW + 18, y0 + 5, slot.gw - headW - 24, 18, spHelp[0], spHelp[1]);

      ctx.fillStyle = '#444'; ctx.textAlign = 'left';
      fitText(ctx, `Fame ${t.fame}/${WIN_FAME} · ${t.credits} Cr · ${t.mechs}M/${t.engPool}E · ${assets}`, x0 + 10, y0 + 32, slot.gw - 20, '600', 10);
      help(x0 + 6, y0 + 23, slot.gw - 12, 14, oppHelp[0], oppHelp[1]);

      // 3 Recon Cards with Full 6-Stat Filled Bars (216 x 98 each)
      for (let bIdx = 0; bIdx < 3; bIdx++) {
        const bw = slot.gw - 20, bh = 98;
        const bx = x0 + 10, by = y0 + 40 + bIdx * 104;
        drawCompactOpponentBay(ctx, slot, ti, t, t.robots[bIdx], bIdx, bx, by, bw, bh, now);

    }
  }

  function fitText(ctx, text, x, y, maxW, weight, size) {
    let s = size;
    do { ctx.font = weight + ' ' + s + 'px system-ui, sans-serif'; s -= 0.5; } while (s > 7 && ctx.measureText(text).width > maxW);
    if (ctx.measureText(text).width > maxW) { while (text.length > 3 && ctx.measureText(text + '…').width > maxW) text = text.slice(0, -1); text += '…'; }
    ctx.fillText(text, x, y);
  }

  function drawCompactOpponentBay(ctx, slot, ti, t, r, bIdx, bx, by, bw, bh, now) {
    const inArenaNow = G.phase === 'fight' && G.fight && G.fight.robots && G.fight.robots.includes(r);
    ctx.fillStyle = r ? '#fcfbf9' : '#f5f3ec';
    ctx.fillRect(bx, by, bw, bh);
    ctx.strokeStyle = r ? '#c8c4b8' : '#dcd8ce'; ctx.lineWidth = 1;
    ctx.strokeRect(bx, by, bw, bh);

    if (!r) {
      ctx.fillStyle = '#999'; ctx.font = '700 10px system-ui, sans-serif'; ctx.textAlign = 'center';
      ctx.fillText('EMPTY BAY', bx + bw / 2, by + bh / 2 + 3);
      return;
    }

    hitRegions.push({ kind: 'bay', team: ti, bayIdx: bIdx, robot: r, x: bx, y: by, w: bw, h: bh });

    if (inArenaNow) {
      ctx.fillStyle = t.col; ctx.font = '800 11px system-ui, sans-serif'; ctx.textAlign = 'center';
      ctx.fillText('IN ARENA PIT', bx + bw / 2, by + bh / 2 + 4);
      return;
    }

    const curHp = Math.max(0, maxHp(r) - r.dmg);
    const hpFrac = curHp / maxHp(r);
    const rk = Sim.riskOf(r.b);
    const wep = wepName(r.b).replace('medium', 'med');
    const helpers = r.b.helpers || [];

    // 1. Mini Blueprint Sprite Box (28 x 28) at top-left
    const px = bx + 6, py = by + 5, ps = 28;
    ctx.fillStyle = '#f3f1ea';
    ctx.fillRect(px, py, ps, ps);
    ctx.strokeStyle = '#d5d1c7'; ctx.lineWidth = 1;
    ctx.strokeRect(px, py, ps, ps);
    drawRobotSprite(ctx, px + ps / 2, py + ps / 2, -Math.PI / 2, -Math.PI / 2, t.col, r.b, hpFrac, null, null, false, false, now, 0.54 * previewK(r.b));
    { const hl = helpLook(r.b); help(px, py, ps, ps, hl[0], hl[1]); }
    { const hn = helpName(t, r); help(bx + 38, by + 4, bw / 2 - 30, 14, hn[0], hn[1]); }
    help(bx + bw / 2 + 8, by + 4, bw / 2 - 12, 14, esc(wepName(r.b)) + ' · ' + r.b.range + ' range', 'Its weapon and the distance it tries to fight at.');
    help(bx + 38, by + 18, bw - 42, 14, 'Health ' + curHp + '/' + maxHp(r), 'Damage stays between fights until it is repaired.<br>' + wearTxt(r));

    // 2. Top-Right Name, Weapon/Range & Filled HP Bar (bx + 40 .. bx + bw - 6)
    ctx.fillStyle = '#111'; ctx.font = '800 11px system-ui, sans-serif'; ctx.textAlign = 'left';
    ctx.fillText(r.name + (r.wins ? ' ★' + r.wins : ''), bx + 40, by + 15);

    ctx.fillStyle = '#666'; ctx.font = '700 9px system-ui, sans-serif'; ctx.textAlign = 'right';
    ctx.fillText(`${wep} · ${r.b.range}`, bx + bw - 6, by + 15);

    const hpCol = hpFrac > 0.5 ? '#2a9d3a' : hpFrac > 0.25 ? '#d99000' : '#d62828';
    const hpBarW = bw - 88;
    drawBar(ctx, bx + 40, by + 22, hpBarW, 6.5, hpFrac, hpCol, '#e6e3da', 0);
    ctx.fillStyle = '#222'; ctx.font = '700 8.5px system-ui, sans-serif'; ctx.textAlign = 'right';
    ctx.fillText(`${curHp}/${maxHp(r)}`, bx + bw - 6, by + 28.5);

    // 3. Full 6-Stat Filled Bar Grid (2 Columns x 3 Rows: ARM, SPD, TUR | FPW, ACC, VEL)
    const colW = Math.floor((bw - 16) / 2);
    const barW = colW - 26;
    STAT_BARS_LEFT.forEach((st, idx) => {
      const ry = by + 39 + idx * 11.5;
      const lv = r.b.lv?.[st.k] || 0;
      ctx.fillStyle = '#444'; ctx.font = '700 8.5px system-ui, sans-serif'; ctx.textAlign = 'left';
      ctx.fillText(st.short, bx + 6, ry + 6);
      drawBar(ctx, bx + 30, ry, barW, 6.5, lv / 4, t.col, '#e6e3da', 4);
    });
    STAT_BARS_RIGHT.forEach((st, idx) => {
      const ry = by + 39 + idx * 11.5;
      const lv = r.b.lv?.[st.k] || 0;
      const rx = bx + 10 + colW;
      ctx.fillStyle = '#444'; ctx.font = '700 8.5px system-ui, sans-serif'; ctx.textAlign = 'left';
      ctx.fillText(st.short, rx, ry + 6);
      drawBar(ctx, rx + 24, ry, barW, 6.5, lv / 4, t.col, '#e6e3da', 4);
    });

    help(bx + 4, by + 34, bw - 8, 38, STAT_GRID_HELP[0], STAT_GRID_HELP[1] + '<br>' + Sim.STATS.filter(k => k !== 'hp').map(k => STAT_HELP[k][0] + ' ' + (r.b.lv[k] || 0)).join(' · '));
    // 4. Bottom Recon Footer Strip: Strain, Engineers, Drones & Hidden Mod
    const fy = by + 74, fh = bh - 78;
    ctx.fillStyle = '#f3f1ea';
    ctx.fillRect(bx + 4, fy, bw - 8, fh);

    const glitchPct = Math.round((rk.glitch || 0) * 100);
    const riskCol = glitchPct < 15 ? '#2a9d3a' : glitchPct < 30 ? '#b45309' : '#d62828';
    ctx.fillStyle = riskCol; ctx.font = '700 8.5px system-ui, sans-serif'; ctx.textAlign = 'left';
    ctx.fillText(`STR ${rk.strain} (${rk.eng}E · ${glitchPct}%)`, bx + 8, fy + fh / 2 + 3);
    { const h1 = helpStrain(r.b); help(bx + 4, fy, 82, fh, 'STR ' + rk.strain + ' (' + rk.eng + 'E · ' + glitchPct + '%)', '<b>STR</b> strain ⚡' + rk.strain + ' · <b>' + rk.eng + 'E</b> engineers on it · <b>' + glitchPct + '%</b> glitch chance per fight.<br>' + h1[1]); }

    // 🎩 bookie's band vs the field + tags (click the chip for the scout panel)
    const cw = 70, cx = bx + bw - 8 - cw, cy = fy + 2, ch = fh - 4;
    drawOddsChip(ctx, fieldOdds(ti, r.b).p, cx, cy, cw, ch, 8.5, true);
    hitRegions.push({ kind: 'scout_chip', team: ti, robot: r, x: cx, y: cy, w: cw, h: ch });
    { const hb = helpBand(ti, r, fieldOdds(ti, r.b).p); help(cx, cy, cw, ch, hb[0], hb[1] + (scouted() ? '<br>Short names: H.fav · Fav · Even · Dog · H.dog.' : '')); }
    { const ht = helpTagsTxt(tagsFor(ti, r.b), 'this robot'); help(bx + 86, fy, cx - bx - 88, fh, ht[0], ht[1]); }
    drawTags(ctx, tagsFor(ti, r.b), cx - 6, fy + fh / 2 + 3, bw - cw - 96, 'right', 8.5, 1);
  }

  function drawMarketOnArena(ctx, L) {
    const x0 = L.ax - L.aw / 2, y0 = L.ay - L.ah / 2;

    if (G.marketAuction && G.marketAuction.tie) {
      // --- Interactive Spartacus Tie-Break Rebid View ---
      const A = G.marketAuction, tie = A.tie;
      const items = A.hostOnly ? [{ id: 'host', k: HOST_K, name: 'Host the Fight', icon: '👑', text: '+1 Fame & Pick Fighters' }] : G.market.map((id, k) => ({ id, k, ...LOTS[id] }));

      ctx.fillStyle = '#fff8eb';
      ctx.fillRect(x0 + 2, y0 + 2, L.aw - 4, 26);
      ctx.strokeStyle = '#d99000'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(x0, y0 + 28); ctx.lineTo(x0 + L.aw, y0 + 28); ctx.stroke();

      const tiedNames = tie.teams.map(ti => G.teams[ti].name.split(' ')[0]).join(' vs ');
      ctx.fillStyle = '#b45309'; ctx.font = '900 11px system-ui, sans-serif'; ctx.textAlign = 'left';
      ctx.fillText(`⚔️ TIE-BREAK REBID ON ${items.find(it => it.k === tie.k).name.toUpperCase()} (${tiedNames} @ ${tie.baseBid} Cr)`, x0 + 12, y0 + 19);

      ctx.fillStyle = '#333'; ctx.font = '700 10px system-ui, sans-serif'; ctx.textAlign = 'right';
      ctx.fillText(`Unspent Available: ${tie.maxMyAdd} Cr`, x0 + L.aw - 12, y0 + 19);

      const w = 142, h = 180, gap = 10;
      const totalW = items.length * w + (items.length - 1) * gap;
      const startX = L.ax - totalW / 2, cy = y0 + 33;

      items.forEach((it, j) => {
        const k = it.k, x = startX + j * (w + gap);
        const done = A.results.find(r => r.idx === k);
        if (k < tie.k && done) {
          // Already resolved lot
          const res = done;
          const wTeam = res.winner >= 0 ? G.teams[res.winner] : null;
          ctx.fillStyle = '#fcfbf9'; ctx.fillRect(x, cy, w, h);
          ctx.strokeStyle = wTeam ? wTeam.col : '#bbb6a8'; ctx.lineWidth = 1.5; ctx.strokeRect(x, cy, w, h);
          ctx.fillStyle = wTeam ? wTeam.col : '#888'; ctx.fillRect(x, cy, w, 22);
          ctx.fillStyle = '#fff'; ctx.font = '800 10px system-ui, sans-serif'; ctx.textAlign = 'center';
          ctx.fillText(wTeam ? `WON: ${wTeam.name.toUpperCase()}` : 'NO BIDS', x + w / 2, cy + 14.5);
          ctx.fillStyle = '#111'; ctx.font = '900 12px system-ui, sans-serif';
          ctx.fillText(`PAID ${res.price} Cr`, x + w / 2, cy + 44);
          ctx.font = '800 11.5px system-ui, sans-serif';
          ctx.fillText(`${it.icon} ${it.name}`, x + w / 2, cy + 72);
          ctx.fillStyle = '#666'; ctx.font = '600 9.5px system-ui, sans-serif';
          ctx.fillText(it.text, x + w / 2, cy + 90);
        } else if (k === tie.k) {
          // Active Tie-Break Rebid Card!
          ctx.fillStyle = '#fffdf7'; ctx.fillRect(x, cy, w, h);
          ctx.strokeStyle = '#d99000'; ctx.lineWidth = 2.5; ctx.strokeRect(x, cy, w, h);
          ctx.fillStyle = '#d99000'; ctx.fillRect(x, cy, w, 22);
          ctx.fillStyle = '#fff'; ctx.font = '900 10px system-ui, sans-serif'; ctx.textAlign = 'center';
          ctx.fillText(`⚔️ TIE AT ${tie.baseBid} Cr!`, x + w / 2, cy + 14.5);

          ctx.fillStyle = '#111'; ctx.font = '800 11.5px system-ui, sans-serif';
          ctx.fillText(`${it.icon} ${it.name}`, x + w / 2, cy + 40);

          ctx.fillStyle = '#555'; ctx.font = '700 9px system-ui, sans-serif';
          ctx.fillText(`Tied: ${tiedNames}`, x + w / 2, cy + 55);
          ctx.fillStyle = '#b45309'; ctx.font = '800 10px system-ui, sans-serif';
          ctx.fillText(`Your Total: ${tie.baseBid + tie.myAdd} Cr`, x + w / 2, cy + 71);

          // Stepper: [−] +N Cr [+]
          const btnY = cy + 80;
          ctx.fillStyle = '#f2efe8'; ctx.fillRect(x + 12, btnY, 26, 26);
          ctx.strokeStyle = '#222'; ctx.lineWidth = 1.2; ctx.strokeRect(x + 12, btnY, 26, 26);
          ctx.fillStyle = '#111'; ctx.font = '800 14px system-ui, sans-serif';
          ctx.fillText('−', x + 25, btnY + 18);

          ctx.fillStyle = '#1f6feb'; ctx.font = '900 13px system-ui, sans-serif';
          ctx.fillText(`+${tie.myAdd} Cr`, x + w / 2, btnY + 18);

          ctx.fillStyle = '#f2efe8'; ctx.fillRect(x + w - 38, btnY, 26, 26);
          ctx.strokeStyle = '#222'; ctx.lineWidth = 1.2; ctx.strokeRect(x + w - 38, btnY, 26, 26);
          ctx.fillStyle = '#111'; ctx.font = '800 14px system-ui, sans-serif';
          ctx.fillText('+', x + w - 25, btnY + 18);

          hitRegions.push({ kind: 'rebid_minus', x: x + 12, y: btnY, w: 26, h: 26 });
          hitRegions.push({ kind: 'rebid_plus',  x: x + w - 38, y: btnY, w: 26, h: 26 });

          // Submit Rebid Button on Card
          const sbY = cy + 114, sbH = 26;
          ctx.fillStyle = '#111'; ctx.fillRect(x + 10, sbY, w - 20, sbH);
          ctx.fillStyle = '#fff'; ctx.font = '800 10.5px system-ui, sans-serif';
          ctx.fillText('Lock Rebid →', x + w / 2, sbY + 16.5);
          hitRegions.push({ kind: 'rebid_submit', x: x + 10, y: sbY, w: w - 20, h: sbH });

          ctx.fillStyle = '#666'; ctx.font = '600 8.5px system-ui, sans-serif';
          ctx.fillText(`Max +${tie.maxMyAdd} Cr unspent`, x + w / 2, cy + 156);
        } else {
          // Future lot waiting in queue
          ctx.fillStyle = '#f6f4ee'; ctx.fillRect(x, cy, w, h);
          ctx.strokeStyle = '#ccc8bc'; ctx.lineWidth = 1; ctx.strokeRect(x, cy, w, h);
          ctx.fillStyle = '#777'; ctx.font = '800 10px system-ui, sans-serif'; ctx.textAlign = 'center';
          ctx.fillText('RESOLVING NEXT...', x + w / 2, cy + 20);
          ctx.fillStyle = '#111'; ctx.font = '800 11.5px system-ui, sans-serif';
          ctx.fillText(`${it.icon} ${it.name}`, x + w / 2, cy + 62);
          ctx.fillStyle = '#555'; ctx.font = '700 10px system-ui, sans-serif';
          ctx.fillText(`Your Bid: ${A.all[viewerSeat][k]} Cr`, x + w / 2, cy + 92);
        }
      });
      return;
    }

    if (G.marketResolved && G.marketResults) {
      // --- Post-Bidding Market Auction Results Overview ---
      ctx.fillStyle = '#f6f4ee';
      ctx.fillRect(x0 + 2, y0 + 2, L.aw - 4, 26);
      ctx.strokeStyle = '#dedad0'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(x0, y0 + 28); ctx.lineTo(x0 + L.aw, y0 + 28); ctx.stroke();

      ctx.fillStyle = '#111'; ctx.font = '900 11px system-ui, sans-serif'; ctx.textAlign = 'left';
      ctx.fillText('MARKET AUCTION RESULTS  —  WHO GOT WHAT & FOR HOW MUCH', x0 + 12, y0 + 19);

      const waitingInstall = G.pendingInstall && G.pendingInstall.length > 0;
      if (waitingInstall) {
        const nextLot = LOTS[G.pendingInstall[0].lot];
        ctx.fillStyle = '#1f6feb'; ctx.font = '800 10.5px system-ui, sans-serif'; ctx.textAlign = 'right';
        ctx.fillText(`▼ Click a Robot Bay below to fit ${nextLot.name}`, x0 + L.aw - 12, y0 + 19);
      } else {
        const btnW = 148, btnH = 20, btnX = x0 + L.aw - btnW - 8, btnY = y0 + 4;
        ctx.fillStyle = '#111';
        ctx.fillRect(btnX, btnY, btnW, btnH);
        ctx.fillStyle = '#fff'; ctx.font = '800 10px system-ui, sans-serif'; ctx.textAlign = 'center';
        ctx.fillText('Continue to Host Phase →', btnX + btnW / 2, btnY + 13.5);
        hitRegions.push({ kind: 'market_continue', x: btnX, y: btnY, w: btnW, h: btnH });
      }

      const nR = G.marketResults.length, gap = nR > 4 ? 6 : 10, w = Math.min(142, Math.floor((L.aw - 12 - (nR - 1) * gap) / nR)), h = 180;
      const totalW = nR * w + (nR - 1) * gap;
      const startX = L.ax - totalW / 2, cy = y0 + 33;

      G.marketResults.forEach((res, k) => {
        const x = startX + k * (w + gap);
        const wTeam = res.winner >= 0 ? G.teams[res.winner] : null;
        const winCol = wTeam ? wTeam.col : '#888';

        ctx.fillStyle = '#fcfbf9';
        ctx.fillRect(x, cy, w, h);
        ctx.strokeStyle = wTeam ? winCol : '#bbb6a8';
        ctx.lineWidth = wTeam ? 2 : 1.2;
        ctx.strokeRect(x, cy, w, h);

        // 1. Top Winner Team Banner (22px tall)
        ctx.fillStyle = winCol;
        ctx.fillRect(x, cy, w, 22);
        ctx.fillStyle = '#ffffff';
        ctx.font = '800 10.5px system-ui, sans-serif';
        ctx.textAlign = 'center';
        const wLabel = wTeam ? `${wTeam.name.toUpperCase()}${res.winner === viewerSeat ? ' (YOU)' : ''}` : 'NO BIDS';
        fitText(ctx, wLabel, x + w / 2, cy + 14.5, w - 8, '800', 10.5);

        // 2. Price Paid Badge (+ Rebid Note if tied)
        ctx.fillStyle = wTeam ? '#111' : '#777';
        ctx.font = '900 12px system-ui, sans-serif';
        const paidTxt = wTeam ? (res.rebidNote ? `PAID ${res.price} Cr (Rebid)` : `PAID ${res.price} Cr`) : '0 Cr · Unclaimed';
        fitText(ctx, paidTxt, x + w / 2, cy + 39, w - 8, '900', 12);

        // 3. Lot Icon, Name & Effect
        ctx.fillStyle = '#111';
        fitText(ctx, `${res.icon} ${res.name}`, x + w / 2, cy + 57, w - 8, '800', 11.5);
        if (LOTS[res.id]) help(x + 4, cy + 47, w - 8, 28, esc(res.icon + ' ' + res.name), esc(res.text) + (LOTS[res.id].desc ? '<br>' + esc(LOTS[res.id].desc) : ''));

        ctx.fillStyle = '#666';
        fitText(ctx, res.text, x + w / 2, cy + 71, w - 8, '600', 9.5);

        // 4. Destination / Installed-On Pill
        const isPendingHere = waitingInstall && G.pendingInstall[0].idx === k;
        ctx.fillStyle = isPendingHere ? '#e8f1ff' : '#f2efe8';
        ctx.fillRect(x + 8, cy + 77, w - 16, 18);
        ctx.strokeStyle = isPendingHere ? '#1f6feb' : '#d5d1c7';
        ctx.lineWidth = 1;
        ctx.strokeRect(x + 8, cy + 77, w - 16, 18);
        ctx.fillStyle = isPendingHere ? '#1f6feb' : '#222';
        fitText(ctx, res.target || 'Claimed', x + w / 2, cy + 89.5, w - 20, '700', 9.5);

        // 5. All 4 Players' Sealed Bids (+ Rebid Additions) Breakdown
        ctx.strokeStyle = '#e5e1d7'; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(x + 8, cy + 101); ctx.lineTo(x + w - 8, cy + 101); ctx.stroke();

        ctx.fillStyle = '#777'; ctx.font = '800 8.5px system-ui, sans-serif'; ctx.textAlign = 'left';
        ctx.fillText('ALL SEALED BIDS:', x + 10, cy + 113);

        G.teams.forEach((tm, ti) => {
          const ry = cy + 127 + ti * 13;
          const bAmt = res.bids[ti] || 0;
          const initB = res.initBids ? res.initBids[ti] : bAmt;
          const addB = res.addBids ? res.addBids[ti] : 0;
          const isW = res.winner === ti && res.price > 0;
          ctx.fillStyle = isW ? tm.col : '#555';
          ctx.font = (isW ? '800 ' : '600 ') + '9px system-ui, sans-serif';
          ctx.textAlign = 'left';
          ctx.fillText(tm.name.split(' ')[0] + (ti === viewerSeat && w > 130 ? ' (You)' : ti === viewerSeat ? '*' : ''), x + 8, ry);
          ctx.textAlign = 'right';
          const bidStr = addB > 0 ? `${initB}+${addB}=${bAmt} Cr` : `${bAmt} Cr`;
          ctx.fillText(`${bidStr}${isW ? ' ★' : ''}`, x + w - 8, ry);
        });
      });
      return;
    }

    // Kev, 6 Nov: the lots first, then hosting as its own sealed bid
    const items = G.marketStage === 'host' ? [{ id: 'host', k: HOST_K, name: 'Host the Fight', icon: '👑', text: '+1 Fame & Pick Fighters' }] : G.market.map((id, k) => ({ id, k, ...LOTS[id] }));
    // Kev, 6 Nov: text must be readable: wider, taller tiles, bigger type, the bookie line in two parts
    const gap = items.length > 3 ? 8 : 12, w = Math.min(172, Math.floor((L.aw - 8 - (items.length - 1) * gap) / items.length)), h = 200;
    const totalW = items.length * w + (items.length - 1) * gap;
    const startX = L.ax - totalW / 2, y = L.ay - h / 2;
    if (G.marketStage === 'host') {
      ctx.fillStyle = '#111'; ctx.font = '900 11px system-ui, sans-serif'; ctx.textAlign = 'center';
      ctx.fillText('👑 HOST BID — SEPARATE SEALED BID AFTER THE LOTS', L.ax, y - 10);
      const hb = G.teams.map(t => t.name.split(' ')[0] + ' ' + t.credits + ' Cr').join('  ·  ');
      ctx.fillStyle = '#666'; ctx.font = '700 9.5px system-ui, sans-serif'; ctx.fillText('Credits left: ' + hb, L.ax, y + h + 16);
      help(L.ax - 220, y + h + 6, 440, 14, 'Credits left', 'What every team has left after the lots: that is all they can bid for hosting.');
    }

    items.forEach((it, j) => {
      const k = it.k, x = startX + j * (w + gap);
      const bid = G.myBids[k] || 0;

      const noFit = k < NLOTS && !canTake(me(), it.id);
      ctx.fillStyle = k === HOST_K ? '#fffdf5' : noFit ? '#efede7' : '#fcfbf9';
      ctx.fillRect(x, y, w, h);
      ctx.strokeStyle = bid > 0 ? '#1f6feb' : '#222';
      ctx.lineWidth = bid > 0 ? 2.5 : 1.5;
      ctx.strokeRect(x, y, w, h);

      const RL = LOTS[it.id];
      if (RL && RL.bot) drawRobotLot(ctx, RL, x, y, w, h);
      else {
      ctx.font = '26px system-ui, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(it.icon, x + w / 2, y + 40);

      ctx.fillStyle = '#111';
      fitText(ctx, it.name, x + w / 2, y + 64, w - 12, '800', 14);

      ctx.fillStyle = '#555';
      fitText(ctx, it.text, x + w / 2, y + 82, w - 12, '600', 11.5);
      drawTags(ctx, lotTags(LOTS[it.id], viewerSeat), x + w / 2, y + 98, w - 12, 'center', 11.5);
      if (/Str/.test(it.text)) help(x + 4, y + 74, w - 8, 14, esc(it.name), (it.wup ? esc(Sim.WUPS[it.wup].text) + '<br>Robots keep their weapon for life; this upgrade only fits that weapon.<br>' : it.mod && Sim.MODS[it.mod] ? esc(Sim.MODS[it.mod].text) + '<br>One module per robot: a new one replaces the old (the old goes to your Stash).<br>' : it.cal ? 'Changes a gun\'s calibre (guns only; robots never swap weapons).<br>' : esc(it.text) + '<br>') + '<b>Str</b> = strain ⚡ the part adds to the robot: more glitches and breaks, and a bigger frame.');
      else if (k === HOST_K) help(x + 4, y + 56, w - 8, 34, 'Host the Fight', 'Highest bid hosts this round: +1 fame, and you pick which two teams fight (you may pick yourself).');
      { const hl = helpLotTags(LOTS[it.id]); if (hl) help(x + 4, y + 89, w - 8, 13, hl[0], hl[1]); }
      const gain = lotGainShort(me(), LOTS[it.id] || it);
      if (gain) { ctx.fillStyle = '#1f6feb'; fitText(ctx, gain, x + w / 2, y + 113, w - 12, '800', 11); help(x + 4, y + 103, w - 8, 13, 'Real numbers', esc(gain) + '<br>The stat on each of your robots before→after, one per robot (separated by /). "max" = already at level 4.'); }
      // 🎩 what the lot does to each of your robots' odds vs the field
      if (LOTS[it.id] && needsRobot(it.id)) {
        const sh = me().robots.map(r => [r, oddsShiftRaw(viewerSeat, r, LOTS[it.id])]).filter(x => x[1] !== undefined);
        ctx.fillStyle = '#444';
        if (sh.some(x => x[1] === null)) fitText(ctx, '🎩 bookie working…', x + w / 2, y + 176, w - 12, '800', 11);
        else if (!sh.length) { ctx.fillStyle = '#b45309'; fitText(ctx, '📦 none of your robots can take it', x + w / 2, y + 168, w - 12, '800', 10.5); ctx.fillStyle = '#666'; fitText(ctx, 'win it for your Stash (bank: ' + bankHalf(it.id) + ' Cr)', x + w / 2, y + 184, w - 12, '700', 10); help(x + 4, y + 158, w - 8, 34, 'Not for your robots', 'Weapon upgrades only fit that weapon, and calibres only fit guns (robots keep their weapon for life). You can still win it: it goes into your 📦 Stash, to trade in a deal, fit later on a new robot, or sell to the bank at half value (' + bankHalf(it.id) + ' Cr).'); }
        else if (sh.length === 1) {
          const [r, v] = sh[0];
          ctx.fillStyle = '#666'; fitText(ctx, '🎩 ' + r.name, x + w / 2, y + 168, w - 12, '700', 10.5);
          ctx.fillStyle = v.col; fitText(ctx, v.text, x + w / 2, y + 186, w - 12, '900', 12.5);
        } else sh.forEach(([r, v], j) => { ctx.fillStyle = v.col; fitText(ctx, r.name.replace('s1. ', '') + ': ' + v.short, x + w / 2, y + 166 + j * 14, w - 12, '800', 11); });
        help(x + 4, y + 156, w - 8, 40, '🎩 What it does to your odds', 'The bookie\'s band vs the field for each of your robots, <b>before→after</b> fitting this lot. <b>=</b> means the band doesn\'t move. ' + BAND_HELP + (scouted() ? '' : '<br>Exact % with a scout.'));
      }
      }

      const btnY = y + 124;
      ctx.fillStyle = '#f2efe8'; ctx.fillRect(x + 14, btnY, 28, 28);
      ctx.strokeStyle = '#222'; ctx.lineWidth = 1.2; ctx.strokeRect(x + 14, btnY, 28, 28);
      ctx.fillStyle = '#111'; ctx.font = '800 15px system-ui, sans-serif';
      ctx.fillText('−', x + 28, btnY + 19);

      ctx.fillStyle = bid > 0 ? '#1f6feb' : '#111';
      ctx.font = '900 15px system-ui, sans-serif';
      ctx.fillText(bid + ' Cr', x + w / 2, btnY + 19);

      ctx.fillStyle = '#f2efe8'; ctx.fillRect(x + w - 42, btnY, 28, 28);
      ctx.strokeStyle = '#222'; ctx.lineWidth = 1.2; ctx.strokeRect(x + w - 42, btnY, 28, 28);
      ctx.fillStyle = '#111'; ctx.font = '800 15px system-ui, sans-serif';
      ctx.fillText('+', x + w - 28, btnY + 19);

      if (G.marketStage === 'open') {   // preview: bidding opens after the open market
        ctx.fillStyle = noFit ? '#efede7' : '#fcfbf9'; ctx.fillRect(x + 4, btnY - 4, w - 8, 36);
        ctx.fillStyle = '#555'; fitText(ctx, '🔒 bids open after the open market', x + w / 2, btnY + 18, w - 20, '800', 10.5);
      } else {
        hitRegions.push({ kind: 'market_minus', idx: k, x: x + 14, y: btnY, w: 28, h: 28 });
        hitRegions.push({ kind: 'market_plus',  idx: k, x: x + w - 42, y: btnY, w: 28, h: 28 });
        hitRegions.push({ kind: 'market_tile',  idx: k, x, y, w, h });
      }
    });
  }

  // a New Robot lot: the robot itself, its weapon, frame, counter tags and the bookie's band vs the field
  function drawRobotLot(ctx, RL, x, y, w, h) {
    const t = me(), bot = RL.bot, eng = Math.min(1, freeEng(t)), full = t.robots.length >= 3, now = performance.now();
    const b = (bot.b.eng || 0) === eng ? bot.b : Object.assign({}, bot.b, { eng }), fr = Sim.frameOf(b);   // as it would arrive in your garage
    ctx.fillStyle = '#efece4'; ctx.fillRect(x + 6, y + 6, w - 12, 46);
    drawRobotSprite(ctx, x + w / 2, y + 29, -Math.PI / 2, -Math.PI / 2, t.col, b, 1, null, null, false, false, now, 0.6 * previewK(b));
    ctx.textAlign = 'center'; ctx.fillStyle = '#111';
    fitText(ctx, '🤖 ' + RL.name, x + w / 2, y + 68, w - 10, '800', 14);
    ctx.fillStyle = '#555';
    fitText(ctx, RL.text, x + w / 2, y + 84, w - 10, '600', 11);
    const lv = b.lv, stats = PREVIEW_F.map(([k, lab]) => lab + ' ' + lv[k] + '/4' + ((UNUSED_STATS[b.weapon] || []).includes(k) ? ' (unused)' : '')).join(' · ');
    help(x + 4, y + 4, w - 8, 86, '🤖 ' + esc(RL.name) + ' · for sale',
      esc(RL.desc || '') + '<br><b>' + esc(wepName(b)) + '</b>, ' + b.range + ' range, ' + Sim.LV.hp[lv.hp] + ' HP, ' + fr.name + ' frame.<br>Stat levels: ' + stats + '.<br>' +
      'Win it and it joins your team in an empty bay (up to 3 robots). ' + (eng ? 'One of your free Engineers 👷 goes on it.' : '<b>You have no free Engineer</b>, so it arrives without one (more glitches); the bookie counts that.') + ' ' + (full ? '<b>Your bays are full:</b> you would get 2 Cr instead.' : '') + '<br>Robots keep their weapon for life.');
    const tg = tagsFor(viewerSeat, b);
    if (drawTags(ctx, tg, x + w / 2, y + 100, w - 12, 'center', 11)) { const ht = helpTagsTxt(tg, 'this robot'); help(x + 4, y + 90, w - 8, 13, ht[0], ht[1]); }
    ctx.fillStyle = '#1f6feb';
    fitText(ctx, fr.name + ' frame · ⚡' + Sim.strainOf(b).total + ' · ' + (eng ? '👷 1 Eng' : '👷 no Eng'), x + w / 2, y + 115, w - 12, '800', 10.5);
    { const hl = helpLook(b); help(x + 4, y + 105, w - 8, 13, hl[0], hl[1]); }
    if (full) {
      ctx.fillStyle = '#b45309'; fitText(ctx, '🏠 your bays are full', x + w / 2, y + 168, w - 12, '800', 10.5);
      ctx.fillStyle = '#666'; fitText(ctx, 'win it: +2 Cr instead', x + w / 2, y + 184, w - 12, '700', 10);
      help(x + 4, y + 158, w - 8, 34, 'Bays full', 'You already have 3 robots. Winning this lot pays you 2 Cr instead (the robot goes back to the deck). You can still bid to keep it from a rival.');
      return;
    }
    const p = fieldOdds(viewerSeat, b).p, c = oddsChip(p);
    ctx.fillStyle = '#666'; fitText(ctx, '🎩 vs the field', x + w / 2, y + 168, w - 12, '700', 10.5);
    ctx.fillStyle = c.col; fitText(ctx, p == null ? 'bookie working…' : scouted() ? bandOf(p).short + ' ' + pctTxt(p) : bandOf(p).name, x + w / 2, y + 186, w - 12, '900', 12.5);
    help(x + 4, y + 158, w - 8, 34, '🎩 Bookie vs the field' + (p == null ? '' : ': ' + bandOf(p).name + (scouted() ? ' (' + pctTxt(p) + ')' : '')),
      'The bookie\'s chance for <b>' + esc(RL.name) + '</b> against every robot of the other teams, at full health, as it comes (no extra parts). ' + BAND_HELP + (scouted() ? '' : '<br>Exact % with a scout.'));
  }

  function drawBettingOnArena(ctx, L) {
    const F = G.fight, mine = mySide(F);
    const maxB = betLimit(me());
    const n = F.nSides || 2, gap = 12;
    const w = n === 2 ? 276 : n === 3 ? 214 : 170, h = 158;
    const totalW = n * w + (n - 1) * gap, x0 = L.ax - totalW / 2;
    // format banner
    ctx.fillStyle = '#111'; ctx.font = '900 11px system-ui, sans-serif'; ctx.textAlign = 'center';
    const banner = fightTitle(F).toUpperCase() + (F.house ? ' + HOUSE ROBOT' : '') + (F.format === 'mirror' ? ' — EVERY ROBOT FIGHTS AS 2 COPIES' : F.event && F.event.kind === 'final' ? ' — GRAND FINAL: DOUBLE FAME' : '');
    ctx.fillText(banner, L.ax, L.ay - h / 2 - 8);
    if (F.house) help(L.ax - 160, L.ay - h / 2 - 20, 320, 16, '🏠 House Robot', 'A neutral robot (heavy gun, armour 2) that attacks whoever is closest. If it is the last one standing nobody gets fame and bets are refunded. The bookie counts it in the odds.');
    for (let s = 0; s < n; s++) {
      const ents = F.teams.map((ti, e) => ({ ti, e })).filter(x => F.sides[x.e] === s);
      const T = G.teams[ents[0].ti], robots = ents.map(x => F.robots[x.e]);
      const bd = F.bands ? F.bands[s] : bandOf(F.p[s]);
      const x = x0 + s * (w + gap), y = L.ay - h / 2 - 1;
      const stake = G.myBet[s] || 0;
      const lockedOut = mine >= 0 && mine !== s && !G.hedge;

      ctx.fillStyle = '#fcfbf9';
      ctx.fillRect(x, y, w, h);
      ctx.strokeStyle = stake > 0 ? T.col : '#222';
      ctx.lineWidth = stake > 0 ? 3 : 1.5;
      ctx.strokeRect(x, y, w, h);

      ctx.textAlign = 'center';
      if (ents.length === 1) {
        ctx.fillStyle = T.col; fitText(ctx, `${T.name}: ${robots[0].name}`, x + w / 2, y + 22, w - 16, '800', 13.5);
        const r = robots[0], st = Sim.strainOf(r.b).total;
        ctx.fillStyle = '#555'; fitText(ctx, `${Math.max(0, maxHp(r) - r.dmg)}/${maxHp(r)} HP  ·  ${buildText(r)}  ·  Strain ${st}`, x + w / 2, y + 39, w - 16, '600', 10.5);
        help(x + 10, y + 29, w - 20, 14, esc(r.name), 'Health now/max · weapon · preferred range' + ((r.b.helpers || []).length ? ' · drones' : '') + ' · strain ⚡' + st + ' (more strain: more glitches and a bigger target).');
      } else {
        ents.forEach((x2, j) => { ctx.fillStyle = G.teams[x2.ti].col; fitText(ctx, G.teams[x2.ti].name + ': ' + F.robots[x2.e].name + ' (' + Math.max(0, maxHp(F.robots[x2.e]) - F.robots[x2.e].dmg) + ' HP)', x + w / 2, y + 18 + j * 15, w - 16, '800', 11.5); });
      }

      // odds band + win-probability bar
      ctx.fillStyle = '#f4f2ec';
      ctx.fillRect(x + 12, y + 48, w - 24, 58);
      ctx.strokeStyle = '#d5d1c7'; ctx.lineWidth = 1;
      ctx.strokeRect(x + 12, y + 48, w - 24, 58);
      ctx.fillStyle = '#111';
      const exactStr = scouted() ? ` (${Math.round(F.p[s] * 100)}%)` : '';
      fitText(ctx, `${bd.name.toUpperCase()}  ·  Pays ${F.pay[s]}×${exactStr}`, x + w / 2, y + 69, w - 32, '900', 14);
      drawBar(ctx, x + 24, y + 79, w - 48, 8, F.p[s], T.col, '#e2dfd7', 4);
      help(x + 12, y + 48, w - 24, 44, bd.name + ' · pays ' + F.pay[s] + '×', 'The bookie ran the visible builds ' + (n === 2 && !F.house ? '40' : '20') + ' times (with their current damage; face-down cards are secret). A winning bet returns your stake × ' + F.pay[s] + '. ' + BAND_HELP + ' The bar is the win chance.');
      // tags: for a one-robot side vs a one-robot foe, this matchup; else vs the field
      if (ents.length === 1) {
        const r = robots[0], foes = F.robots.filter((_, e) => F.sides[e] !== s);
        const mt = foes.length === 1 ? Sim.tagsOf(r.b, 3, [Sim.classOf(foes[0].b)]) : { strong: [], weak: [] };
        const tg = mt.strong.length || mt.weak.length ? mt : tagsFor(ents[0].ti, r.b);
        { const ht = helpTagsTxt(tg, 'this robot'); if (mt.strong.length || mt.weak.length) ht[1] = 'This matchup: the opponent uses a <b>' + esc(clsName(Sim.classOf(foes[0].b))) + '</b>.<br>' + ht[1]; help(x + 12, y + 92, w - 24, 14, ht[0], ht[1]); }
        if (!drawTags(ctx, tg, x + w / 2, y + 100, w - 40, 'center', 10, 3)) { ctx.fillStyle = '#666'; fitText(ctx, 'Bookie estimate (ignores face-down cards)', x + w / 2, y + 100, w - 30, '600', 9.5); }
      } else {
        ctx.fillStyle = '#666'; fitText(ctx, ents.length + ' robots on this side', x + w / 2, y + 100, w - 30, '700', 9.5);
      }

      if (lockedOut) {
        ctx.fillStyle = '#999'; fitText(ctx, '(Cannot bet against your own robot)', x + w / 2, y + 138, w - 20, '700', 11);
        help(x + 10, y + 120, w - 20, 30, 'Your own fight', 'You can only bet on your own side, unless you play <b>Hedge Bet</b>.');
      } else {
        ctx.fillStyle = stake > 0 ? T.col : '#111';
        ctx.fillRect(x + 20, y + 116, w - 40, 30);
        ctx.fillStyle = '#fff';
        fitText(ctx, stake > 0 ? `Wager: ${stake} Cr → Win ${Math.round(stake * F.pay[s])} Cr` : `Click to Bet (0–${maxB} Cr)`, x + w / 2, y + 135, w - 48, '800', 12);
        hitRegions.push({ kind: 'bet_card', side: s, x, y, w, h });
      }
    }

    const tx = L.ax - 85, ty = L.ay + h / 2 + 3, tw = 170, th = 20;
    ctx.fillStyle = '#fff'; ctx.fillRect(tx, ty, tw, th);
    ctx.strokeStyle = '#888'; ctx.lineWidth = 1; ctx.strokeRect(tx, ty, tw, th);
    ctx.fillStyle = '#333'; ctx.font = '700 10px system-ui, sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(scouted() ? '🔭 Scouted: exact %' : `🔭 Hire a scout (${SCOUT_PRICE} Cr): exact %`, L.ax, ty + 13.5);
    if (!scouted()) hitRegions.push({ kind: 'buy_scout', x: tx, y: ty, w: tw, h: th });
    help(tx, ty, tw, th, '🔭 Scout', scouted() ? 'You hired a scout this round: exact % everywhere until the round ends.' : 'Pay ' + SCOUT_PRICE + ' Cr: the exact % for every matchup until the end of the round, instead of the fuzzy bands.');
  }

  function drawAftermathOnArena(ctx, L) {

    // 2-Column Aftermath Overview: Left = Fight Recap & Log, Right = Bookie Bets & Match Payouts

    help(x + 8, y + 6, splitX - x - 16, 20, 'Fight recap', esc(rec.headline) + (rec.turning ? '<br>⭐ Turning point at ' + rec.turning.t + ' s' + (rec.turning.line ? ': ' + esc(rec.turning.line.text) : '') + '.' : ''));
    if (rec.upset) {
      ctx.fillStyle = '#d99000'; ctx.font = '800 10px system-ui, sans-serif';
      ctx.fillText(rec.upset, x + 12, y + 35);
    } else {
      ctx.fillStyle = '#666'; ctx.font = '600 10px system-ui, sans-serif';
      const sumTxt = Array.isArray(rec.summary) ? rec.summary.join('  ') : (rec.summary || '');
      fitText(ctx, sumTxt, x + 12, y + 35, splitX - x - 24, '600', 10);
      help(x + 8, y + 26, splitX - x - 16, 13, 'Crits, malfunctions, broken parts', esc(sumTxt));
    }

    ctx.strokeStyle = '#e5e1d7'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(x + 12, y + 43); ctx.lineTo(splitX - 10, y + 43); ctx.stroke();

    const lines = rec.lines || [];
    if (!lines.length) {
      ctx.fillStyle = '#777'; ctx.font = '600 10.5px system-ui, sans-serif';
      ctx.fillText('Clean fight — no major malfunctions or breaks.', x + 12, y + 66);
    } else {
      // the 6 most important moments (KOs, cards played, breaks first), shown in time order
      const show = lines.slice().sort((a, b) => (b.pri - a.pri) || (a.t - b.t)).slice(0, 6).sort((a, b) => a.t - b.t);
      show.forEach((it, idx) => {

        fitText(ctx, (it.turn ? '⭐ ' : '') + it.text, x + 46, rowY, splitX - x - 58, it.k === 'card' || it.turn ? '800' : '700', 10);
        help(x + 8, rowY - 12, splitX - x - 16, 17, it.t.toFixed(1) + ' s' + (it.turn ? ' · ⭐ turning point' : ''), esc(it.detail || it.text) + (it.turn ? '<br>Around here the winner took the health lead for good.' : ''));
      });
    }

    // Vertical Divider
    ctx.strokeStyle = '#dedad0'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(splitX, y + 8); ctx.lineTo(splitX, y + h - 8); ctx.stroke();

    // --- Right Column: Bookie Bets & Match Rewards Overview ---
    const rx = splitX + 12, rw = x + w - rx - 10;
    ctx.fillStyle = '#111'; ctx.font = '900 11.5px system-ui, sans-serif'; ctx.textAlign = 'left';
    ctx.fillText('BOOKIE BETS & PAYOUTS OVERVIEW', rx, y + 20);
    ctx.fillStyle = '#666'; ctx.font = '600 9.5px system-ui, sans-serif';
    ctx.fillText('Who bet on what & how much they won/lost', rx, y + 34);

    ctx.strokeStyle = '#e5e1d7'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(rx, y + 43); ctx.lineTo(rx + rw, y + 43); ctx.stroke();

    G.teams.forEach((tm, ti) => {
      const rowY = y + 60 + ti * 23;
      const bObj = (F.bets || []).find(b => b.team === ti);
      ctx.fillStyle = tm.col; ctx.font = '800 10.5px system-ui, sans-serif'; ctx.textAlign = 'left';
      ctx.fillText(tm.name + (ti === viewerSeat ? ' (You)' : ''), rx, rowY);

      if (!bObj) {
        ctx.fillStyle = '#999'; ctx.font = '600 10px system-ui, sans-serif'; ctx.textAlign = 'right';
