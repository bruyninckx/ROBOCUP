        budget -= b; return b;
      }
      const want = LOTS[G.market[k]].robot ? robotWant(t, G.market[k], LOTS[G.market[k]].legend ? 6 : 4) : LOTS[G.market[k]].legend ? 5 : LOTS[G.market[k]].crew ? crewWant(t, LOTS[G.market[k]].crew) : G.market[k] === 'eng' ? 3 : 2.2;
      let b = Math.round(want * (0.4 + rnd() * 1.1));
      b = Math.max(0, Math.min(b, budget, Math.ceil(t.credits * 0.6)));
      budget -= b;
      return b;
    });
  }

  // what a crew card is worth to an AI team (Mechanics pay back early; 2.0: Chief Engineers and Repair Techs repair)
  function crewWant(t, k) {
    if (k === 'mechanic') return G.round <= 4 ? 4 : 2.5;
    if (k === 'chief') return t.robots.some(r => r.wear) ? 2.5 : 1.5;   // 2.0: 1 repair action
    if (k === 'accountant') return t.robots.length >= 2 ? 3.5 : 2;
    if (k === 'repairtech') return t.robots.some(r => wrecked(r)) ? 2.5 : 1.5;   // 2.0: 1 repair action
    return hasCrew(t, k) ? 0.5 : 2.5;
  }
  function aiRebid(t, k, curBid, maxAdd) {
    if (maxAdd <= 0) return 0;
    if (aiV2(t, k === HOST_K ? 'host' : 'bids')) {   // v2: add up to what the lot is worth to it, no more
      const worth = k === HOST_K ? aiHostValue(t) : aiLotValue(t, G.market[k]);
      return Math.max(0, Math.min(maxAdd, Math.round(worth - curBid)));
    }
    if (k < NLOTS && !canTake(t, G.market[k])) return Math.min(maxAdd, rnd() < 0.3 ? 1 : 0);
    const lotId = k < NLOTS ? G.market[k] : 'host';
    const maxWilling = k === HOST_K
      ? (t.fame >= 9 ? 4.5 : 2.5)
      : (LOTS[lotId].robot ? robotWant(t, lotId, LOTS[lotId].legend ? 8 : 5.5) : LOTS[lotId].legend ? 7 : (lotId === 'eng' || lotId === 'mech') ? 4.2 : 3.5) + (t.sponsor === 'sovereign' ? 1.0 : 0);
    const add = Math.round(Math.max(0, maxWilling - curBid) * (0.35 + rnd() * 0.85));
    return Math.max(0, Math.min(maxAdd, add));
  }

  function availForRebid(ti, k) {
    const A = G.marketAuction;
    if (!A) return 0;
    let futureCommitted = 0;
    for (let m = k + 1; m <= HOST_K; m++) futureCommitted += (A.all[ti][m] || 0);
    return Math.max(0, G.teams[ti].credits - (A.all[ti][k] || 0) - futureCommitted);
  }

  /* ---------- New Robot lots: a real robot, shown on its tile ----------
   * 2.0 (placeholder until Kev decides): rounds 1-2 deal level 1 robots, rounds 3-4 level 2, round 5+ level 3, from the
   * market robots nobody owns; when a level runs dry, the nearest level, then the starters. No legendary robot lot. */
  function drawStarter() {
    const inMarket = new Set((G.market || []).map(id => LOTS[id] && LOTS[id].starter).filter(Boolean));
    if (!G.starterDeck || !G.starterDeck.length) {
      const taken = new Set(G.teams.flatMap(t => t.robots.map(r => r.name)));
      G.starterDeck = shuffle(Object.keys(STARTERS).filter(k => !taken.has(k) && !inMarket.has(k)));
    }
    return G.starterDeck.pop() || null;
  }
  // a robot back into its deck (also when scrapped): market robots to their level's deck, starters to the starter deck
  const returnStarter = n => {
    if (!n || !LU.ROBOTS[n] || G.teams.some(t => t.robots.some(r => r.name === n))) return;
    const lv = levelOf(n);
    if (lv > 0) { const D = G.robotDecks[lv] = G.robotDecks[lv] || []; if (!D.includes(n)) D.unshift(n); }
    else if (!G.starterDeck.includes(n)) G.starterDeck.unshift(n);
  };
  function robotLot(n) {
    const bot = mkRobot(n), id = 'robot:' + n;
    LOTS[id] = { name: n, icon: '🤖', text: wepLabel(n) + ' · ' + (bot.level ? 'level ' + bot.level + ' ' + starsOf(bot.level) : 'starter'), robot: true, starter: n, bot,
      desc: descOf(n), value: 1 + bot.level * 2, legend: false };
    return id;
  }
  const ROBOT_LOT_ROUNDS = 5;
  const waveLevel = () => G.round <= 2 ? 1 : G.round <= 4 ? 2 : 3;
  function dealRobot() {
    const inMarket = new Set((G.market || []).map(x => LOTS[x] && LOTS[x].starter).filter(Boolean));
    const owned = new Set(G.teams.flatMap(t => t.robots.map(r => r.name)));
    const lv = waveLevel();
    for (const L0 of [lv, lv - 1, lv + 1, lv - 2, lv + 2].filter(x => x >= 1 && x <= 3)) {
      const D = G.robotDecks[L0] || [];
      const card = D.filter(k => !inMarket.has(k) && !owned.has(k)).pop();
      if (card) { D.splice(D.indexOf(card), 1); return robotLot(card); }
    }
    const n = drawStarter();
    return n ? robotLot(n) : 'mech';
  }
  function dealLot() {
    let id = G.lots.pop();
    if (id === 'crew') { const k = G.crewDeck.pop(); return k ? crewLot(k) : 'mech'; }
    if (id === 'robot' || (LOTS[id] && LOTS[id].robot)) {
      if (LOTS[id] && LOTS[id].starter) returnStarter(LOTS[id].starter);
      id = dealRobot();
    }
    return id;
  }
  // what a robot lot is worth to an AI team: more when the bookie rates it well against that team's rivals
  function robotWant(t, id, base) {
    const L = LOTS[id];
    if (t.robots.length >= 3) return 1;
    const p = L && L.bot ? fieldOdds(t.i, L.bot).p : null;
    return base + (p == null ? 0 : (p - 0.5) * 5) + (L && L.bot ? L.bot.level * 0.5 : 0);
  }
  const needsRobot = id => !LOTS[id].robot && !LOTS[id].mech && !LOTS[id].eng && !LOTS[id].crew && !LOTS[id].tape;
  // 2.0: can this part go on this robot? 2 part slots + 1 legendary slot; at most 3 drones (lineup.js caps them)
  function canFit(r, L) {
    if (!r || !L) return false;
    if (L.part) {
      const P = LU.PARTS[L.part];
      if (!P) return false;
      if (P.kind === 'legendary') return !r.leg;
      if ((r.parts || []).length >= 2) return false;
      if (P.kind === 'drone' && droneCount(r) >= 3) return false;
      return true;
    }
    return !needsRobot0(L);
  }
  const needsRobot0 = L => !!L.part;
  const canTake = (t, id) => !needsRobot(id) || t.robots.some(r => canFit(r, LOTS[id]));
  function aiPickRobot(t, lot) {   // 2.0: the robot whose odds gain most from the part
    const L = LOTS[lot], fit = t.robots.filter(r => canFit(r, L));
    if (!fit.length) return null;
    const gain = r => { const nb = lotBuild(r, L); return nb ? fieldOdds(t.i, nb).p - fieldOdds(t.i, r).p : 0; };
    return fit.map(r => ({ r, g: gain(r) + baseStr(r) * 0.02 })).sort((a, b) => b.g - a.g)[0].r;
  }
  // what a lot does to this robot, in the bookie's numbers ("62% → 70% vs the field")
  function lotPreview(r, L) {
    if (!L || !L.part) return L ? L.text : '';
    if (!canFit(r, L)) return LU.PARTS[L.part].kind === 'legendary' ? 'legendary slot taken' : (r.parts || []).length >= 2 ? 'both part slots taken' : 'no room for another drone';
    const ti = ownerOf(r) ? ownerOf(r).i : viewerSeat, a = fieldOdds(ti, r).p, b = fieldOdds(ti, withPart(r, L.part)).p;
    return pctTxt(a) + ' → ' + pctTxt(b) + ' vs the field' + (swapOut(r, L) ? ' (replaces its ' + swapOut(r, L) + ')' : '');
  }
  const lotGainShort = () => '';
  const weaponSwapNote = () => '';

  function applyLot(ti, lot, r) {
    const t = G.teams[ti], L = LOTS[lot];
    if (L.crew) { t.crew.push({ uid: ++crewSeq, kind: L.crew }); return 'Hired'; }
    if (L.mech) { t.mechs++; return '+1 Mechanic'; }
    if (L.eng) { t.engPool++; return '+1 Chief Engineer'; }
    if (L.robot) {
      if (t.robots.length >= 3) { t.credits += 2; if (L.starter) { returnStarter(L.starter); L.bot = null; } return 'Bays Full (+2 Cr)'; }
      let nr;
      if (L.bot) { nr = L.bot; L.bot = null; }   // the robot shown on the tile
      else nr = mkRobot(drawStarter() || pick(Object.keys(STARTERS)));
      t.robots.push(nr);
      return `New Bot: ${nr.name}`;
    }
    if (L.tape) { t.hand.push(draw1()); t.credits += 1; return '+1 Intrigue card, +1 Cr'; }
    if (!r) return '';
    if (!canFit(r, L)) return 'No room on ' + r.name;
    if (L.part) {
      if (LU.PARTS[L.part].kind === 'legendary') r.leg = L.part; else (r.parts = r.parts || []).push(L.part);
    }
    return `Fitted on ${r.name}`;
  }

  function resolveMarket() {
    if (G.marketAuction) return;   // already resolving (rebid or Botched Install window)
    const all = G.teams.map(t => isHuman(t.i) ? (PS(t.i).bids || zeroBids()).slice() : aiBids(t));
    G.teams.forEach((t, i) => { if (t.shill) { all[i] = all[i].map(v => Math.max(0, v - t.shill)); if (all[i].some(v => v)) notify('🏢 Shill Bidder: ' + esc(t.name) + '\'s bids count ' + t.shill + ' lower.', t.col); } });
    all.forEach(b => { b[HOST_K] = 0; });
    G.marketAuction = {
      all, lastK: NLOTS - 1,
      initialAll: all.map(b => b.slice()),
      rebidAdds: G.teams.map(zeroBids),
      curK: 0,
      wins: [],
      results: [],
      tie: null
    };
    stepMarketAuction();
  }

  // a tie with people in it: each tied person sets how much to add on top, then locks it in
  const tieMine = (S = HS) => { const T = G.marketAuction && G.marketAuction.tie; return !!T && T.waitingHuman && (T.waiting || []).includes(S); };
  ACT.rebidAdj = (S, d) => { if (!tieMine(S)) return; const T = G.marketAuction.tie; T.add[S] = Math.max(0, Math.min(T.maxAdd[S] || 0, (T.add[S] || 0) + d)); };
  ACT.rebidLock = S => {
    if (!tieMine(S)) return;
    const T = G.marketAuction.tie; T.waiting = T.waiting.filter(x => x !== S);
    if (!T.waiting.filter(isHuman).length) submitHumanRebid();
  };
  function submitHumanRebid() {
    const A = G.marketAuction;
    if (!A || !A.tie) return;
    const { k, teams, baseBid } = A.tie, addOf = A.tie.add || {};
    const adds = [];
    teams.forEach(ti => {
      const add = isHuman(ti) ? Math.min(addOf[ti] || 0, availForRebid(ti, k)) : aiRebid(G.teams[ti], k, baseBid, availForRebid(ti, k));
      A.all[ti][k] += add;
      A.rebidAdds[ti][k] += add;
      adds.push(add);
    });
    A.tie.lastMaxAdd = Math.max(...adds);
    A.tie.waitingHuman = false;
    stepMarketAuction();
  }

  function finalizeLotResult(k, w, mx, rebidNote) {
    const A = G.marketAuction;
    const col = A.all.map(b => b[k]);
    const initCol = A.initialAll.map(b => b[k]);
    const addCol = A.rebidAdds.map(b => b[k]);
    if (w >= 0 && mx > 0) {
      G.teams[w].credits -= mx;
    }
    if (k < NLOTS) {
      const lotId = G.market[k], L = LOTS[lotId];
      if (w >= 0) A.wins.push({ idx: k, lot: lotId, team: w, price: mx });
      else if (L.starter) { returnStarter(L.starter); L.bot = null; }   // an unsold robot goes back to its deck
      else if (L.legend && !G.legends.includes(lotId)) G.legends.unshift(lotId);   // an unsold legendary comes back later
      else if (L.crew) G.crewDeck.unshift(L.crew);                                 // unsold crew goes back to the crew deck
      A.results.push({
        idx: k, id: lotId, name: L.name, icon: L.icon, text: L.text,
        winner: w, price: mx, bids: col, initBids: initCol, addBids: addCol,
        rebidNote: rebidNote || '', target: w < 0 ? 'Unclaimed' : ''
      });
    } else {
      G.host = w >= 0 ? w : Math.floor(rnd() * 4);
      const hostT = G.teams[G.host];
      A.results.push({
        idx: HOST_K, id: 'host', name: 'Host the Fight', icon: '👑', text: '+1 Fame & Pick Fighters',
        winner: G.host, price: w >= 0 ? mx : 0, bids: col, initBids: initCol, addBids: addCol,
        rebidNote: rebidNote || '',
        target: w >= 0 ? '+1 Fame' + (hostT.sponsor === 'apex' ? ' & +2 Cr' : '') : 'Random Draw (0 Cr)'
      });
    }
  }

  function stepMarketAuction() {
    const A = G.marketAuction;
    if (!A) return;

    while (A.curK <= A.lastK) {
      const k = A.curK;
      const lotName = k < NLOTS ? LOTS[G.market[k]].name : 'Host the Fight';
      const col = A.all.map(b => b[k]);
      const eligible = A.tie && A.tie.k === k ? A.tie.teams : [0, 1, 2, 3];
      const mx = Math.max(...eligible.map(ti => col[ti]));

      if (mx <= 0) {
        finalizeLotResult(k, -1, 0, '');
        A.tie = null;
        A.curK++;
        continue;
      }

      const contenders = eligible.filter(ti => col[ti] === mx);
      if (contenders.length === 1) {
        const w = contenders[0];
        const hadRebid = A.tie && A.tie.k === k;
        const note = hadRebid ? `Won Rebid (${A.initialAll[w][k]}+${A.rebidAdds[w][k]} Cr)` : '';
        if (hadRebid) {
          notify(`⚔️ <b>${esc(G.teams[w].name)}</b> won the tie-break rebid on <b>${esc(lotName)}</b> (${mx} Cr total)!`, G.teams[w].col);
        }
        finalizeLotResult(k, w, mx, note);
        A.tie = null;
        A.curK++;
        continue;
      }

      // Tie among 2+ teams at mx > 0!
      // Rulebook (5 Nov): Sovereign Foundry wins any tie it's in outright, without a rebid.
      // Kev, 7 Nov (sponsor check): only Market lot ties, not the host bid (winning host ties made it win 31–41%)
      const sov = A.hostOnly ? null : contenders.find(ti => G.teams[ti].sponsor === 'sovereign');
      if (sov != null) {
        notify(`⚖️ Tie on <b>${esc(lotName)}</b> at ${mx} Cr — <b>${esc(G.teams[sov].name)}</b> wins outright (Sovereign Foundry)!`, G.teams[sov].col);
        finalizeLotResult(k, sov, mx, 'Sovereign wins ties');
        A.tie = null;
        A.curK++;
        continue;
      }
      // If a rebid round just took place and nobody added any credits, the team with less fame wins.
      if (A.tie && A.tie.k === k && A.tie.lastMaxAdd === 0) {
        const sorted = contenders.slice().sort((a, b) => G.teams[a].fame - G.teams[b].fame || a - b);
        const w = sorted[0];
        const reason = 'Low-Fame Tiebreak';
        notify(`⚖️ Rebid stalemate on <b>${esc(lotName)}</b> at ${mx} Cr — <b>${esc(G.teams[w].name)}</b> wins (${reason})!`, G.teams[w].col);
        finalizeLotResult(k, w, mx, reason);
        A.tie = null;
        A.curK++;
        continue;
      }

      // Start or continue Spartacus Rebid among tied contenders!
      if (contenders.some(isHuman)) {
        const maxAdd = {}; contenders.filter(isHuman).forEach(ti => { maxAdd[ti] = availForRebid(ti, k); });
        A.tie = {
          k,
          teams: contenders,
          baseBid: mx,
          add: {}, maxAdd,
          waiting: contenders.filter(isHuman),
          waitingHuman: true,
          lastMaxAdd: null
        };
        updateHud();
        return; // Wait for human rebid input
      } else {
        // AI-only tie: resolve secret AI rebids immediately
        const adds = [];
        contenders.forEach(ti => {
          const add = aiRebid(G.teams[ti], k, mx, availForRebid(ti, k));
          A.all[ti][k] += add;
          A.rebidAdds[ti][k] += add;
          adds.push(add);
        });
        A.tie = {
          k,
          teams: contenders,
          baseBid: mx,
          waitingHuman: false,
          lastMaxAdd: Math.max(...adds)
        };
        // Loop continues on same k to evaluate the new rebid totals!
      }
    }

    if (A.hostOnly) {
      const hostT = G.teams[G.host], res = A.results[0];
      const hf = CATCHUP.leaderhost && soleLeader() === hostT ? 0 : HOST_FAME;
      G.fameSrc = 'host'; hostT.fame += hf; G.fameSrc = null; G.hostFameGiven = hf;
      if (hostT.sponsor === 'apex') hostT.credits += 2;
      notify('👑 <b>' + esc(hostT.name) + '</b> is Arena Host' + (res && res.price ? ' for ' + res.price + ' Cr' : ' (nobody bid: random draw)') + ' (' + (hf ? '+' + hf + ' Fame' : 'no host fame: fame leader') + (hostT.sponsor === 'apex' ? ', +2 Cr Apex' : '') + ').', hostT.col);
      G.hostCount = (G.hostCounts || [])[G.host] || 1;
      tlog('wager', { host: G.host, count: G.hostCount });
      if (G.hostCount === 2) notify('🤖🤖 ' + nm(hostT) + '\'s robot count: <b>2 per side</b> (if this round is a normal duel). Each invited team sends up to 2 robots.', hostT.col);
      G.marketResults = (G.marketResults || []).filter(r => r.idx !== HOST_K).concat(A.results);
      tlog('host_bid', { host: G.host, price: res ? res.price : 0, bids: res ? res.bids : null });
      G.hostResolved = true; G.marketResolved = true; G.marketAuction = null; G.marketStage = 'done';
      if (checkWin()) return;
      updateHud();
      return;
    }
    // All lots resolved! First a window for Botched Install, then the installs (hosting is bid for afterwards)
    if (!A.sabotageDone) {
      for (const x of A.wins) notify('📦 <b>' + esc(G.teams[x.team].name) + '</b> won ' + lotRef(x.lot) + ' (' + x.price + ' Cr).', G.teams[x.team].col);
      A.sabotageDone = true; G.ivBusy = true; updateHud();
      botchedWindow(A).catch(e => console.error(e)).then(() => { G.ivBusy = false; stepMarketAuction(); });
      return;
    }
    for (const h of humanSeats()) PS(h).install = A.wins.filter(x => x.team === h && needsRobot(x.lot) && canTake(G.teams[h], x.lot));
    for (const x of A.wins) {
      if (!isHuman(x.team) || !needsRobot(x.lot) || !canTake(G.teams[x.team], x.lot)) {
        const pickR = isHuman(x.team) ? null : aiPickRobot(G.teams[x.team], x.lot);
        const toBox = needsRobot(x.lot) && !canTake(G.teams[x.team], x.lot);
        const dest = toBox ? (toStash(G.teams[x.team], x.lot) ? '📦 To the Stash' : '🏦 Stash full: sold') : applyLot(x.team, x.lot, pickR);
        A.results[x.idx].target = dest;
      } else {
        A.results[x.idx].target = '▼ Click a Robot Bay below';
      }
    }
    G.marketResults = A.results;
    tlog('market', { lots: A.results.map(r => ({ id: r.id, winner: r.winner, price: r.price, bids: r.bids, target: r.target })) });
    G.marketResolved = true;
    G.marketAuction = null;
    if (checkWin()) return;
    updateHud();
  }

  /* ---------- Botched Install (Kev, 6 Nov): stopping a rival's upgrade is a scheme, not a dead bid ----------
   * After the lots are won and before anything is fitted, every team holding Botched Install may play it on a
   * rival's part. Normal defence: the target's Security Bots roll 4-6, then the reaction window. If it lands, the
   * part is scrapped (bottom of the lot deck), the winner gets half its bid back and the saboteur 1 Cr. */
  function partThreat(ti, lot) {   // best band jump the part gives one of the winner's robots, or null while the bookie works
    const T = G.teams[ti];
    let best = null;
    for (const r of T.robots) {
      const nb = lotBuild(r, LOTS[lot]); if (!nb) continue;
      const a = fieldOdds(ti, r).p, b = fieldOdds(ti, nb).p;
      const jump = BANDS.indexOf(bandOf(a)) - BANDS.indexOf(bandOf(b));
      if (!best || jump > best.jump || (jump === best.jump && b - a > best.d)) best = { r, a, b, jump, d: b - a };
    }
    return best;
  }
  async function botchedWindow(A) {
    const parts = A.wins.filter(x => needsRobot(x.lot) && canTake(G.teams[x.team], x.lot));
    for (const x of parts) {
      const W = G.teams[x.team], th = partThreat(x.team, x.lot);
      const thTxt = th ? esc(th.r.name) + ': ' + pctTxt(th.a) + ' → ' + pctTxt(th.b) : '';
      for (const oi of seatOrder()) {
        const o = G.teams[oi];
        if (o === W || !o.hand.includes('botched_install') || o.fame < (CARDS.botched_install.need || 0)) continue;
        let yes = isHuman(oi)
          ? await askSeat(oi, '🔧 Botched Install?', nm(W) + ' won ' + lotRef(x.lot) + ' for ' + x.price + ' Cr.' + (thTxt ? '<br>🎩 Best fit: <b>' + thTxt + '</b>' : '') + '<br>Play ' + cardRef('botched_install') + ': the install fails and the part is scrapped (they get ' + Math.floor(x.price / 2) + ' Cr back, you take 1 Cr). Or threaten it and ask for a payoff.',
              [{ label: '🔧 Botch it', value: () => true }, { label: '💰 Demand a payoff', value: () => 'pay' }, { label: 'Let it go', secondary: true, value: () => false }])
          : (th && th.jump >= 1) || (W === leaderOf() && x.price >= 3 && rnd() < 0.6) || (!th && x.price >= 4 && rnd() < 0.5);
        if (!yes) continue;
        // a threat first: pay off the holder and the card stays in its hand
        const demand = Math.ceil(x.price / 2) + 1;
        if (yes === 'pay') {
          const d = await dealPanel({ title: '💰 Payoff from ' + esc(W.name), intro: 'What do you want from ' + nm(W) + ' to leave its ' + lotRef(x.lot) + ' alone?', from: W, give: false, want: true, lock: 'Lock in demand' });
          const ask = d && d.want;
          if (ask && !bundleEmpty(ask) && bundleWorth(W, ask) <= partWorth(W, x.lot) + 1) { transfer(W, o, ask); notify('💰 ' + nm(W) + ' pays you ' + bundleText(ask) + ' to keep its ' + lotRef(x.lot) + ' safe.', W.col); break; }
          if (ask && !bundleEmpty(ask)) notify('✋ ' + nm(W) + ' refuses to pay ' + bundleText(ask) + '.', W.col);
          yes = await askSeat(oi, '🔧 Botch it now?', nm(W) + ' didn\'t pay. Play ' + cardRef('botched_install') + ' on its ' + lotRef(x.lot) + '?', [{ label: '🔧 Botch it', value: () => true }, { label: 'Let it go', secondary: true, value: () => false }]);
          if (!yes) continue;
        } else if (!isHuman(oi)) {
          if (isHuman(W.i)) {
            const pay = await askSeat(W.i, '💰 A threat', nm(o) + ' says it will wreck your ' + lotRef(x.lot) + ' (' + cardRef('botched_install') + ') unless you pay <b>' + demand + ' Cr</b>.', [{ label: 'Pay ' + demand + ' Cr', value: () => 'pay' }, { label: '🤝 Offer something else', value: () => 'deal' }, { label: 'Refuse', secondary: true, value: () => null }]);
            if (pay === 'pay' && W.credits >= demand) { transfer(W, o, { cr: demand, items: [] }); notify('💰 ' + nm(W) + ' pays ' + nm(o) + ' ' + demand + ' Cr to keep your ' + lotRef(x.lot) + '.', W.col); break; }
            if (pay === 'deal') {
              const d = await dealPanel({ title: '🤝 Buy off ' + esc(o.name), intro: 'It wants about ' + demand + ' Cr.', from: o, lock: 'Lock in offer' });
              if (d && bundleWorth(o, d.give) >= demand - 1) { transfer(W, o, d.give); notify('💰 ' + nm(o) + ' takes ' + bundleText(d.give) + ' and leaves your ' + lotRef(x.lot) + ' alone.', o.col); break; }
              notify('✋ ' + nm(o) + ' isn\'t bought off.', o.col);
            }
          } else if (W.credits >= demand + 1 && partWorth(W, x.lot) >= demand && rnd() < 0.5) {
            transfer(W, o, { cr: demand, items: [] }); notify('💰 ' + nm(W) + ' pays ' + nm(o) + ' ' + demand + ' Cr to keep its ' + lotRef(x.lot) + ' safe.', W.col); break;
          }
        }
        { const ph = playHead(o, 'botched_install', W); logBegin(ph[0], o.col, ph[1], ph[2]); }
        await playFx(o, 'botched_install', W);
        notify('target: ' + lotRef(x.lot) + (thTxt ? ' (' + thTxt + ')' : ''));
        removeFromHand(o, 'botched_install');
        const d = await defend(o, CARDS.botched_install, W);
        discardCard('botched_install');
        if (!d.blocked) {
          x.botched = true;
          const back = Math.floor(x.price / 2); W.credits += back; o.credits += 1;
          if (LOTS[x.lot] && LOTS[x.lot].legend) { if (!G.legends.includes(x.lot)) G.legends.unshift(x.lot); } else G.lots.unshift(x.lot);
          A.results[x.idx].target = '🔧 Botched: scrapped';
          notify('🔧 The install fails: ' + lotRef(x.lot) + ' is scrapped. ' + nm(W) + ' gets ' + back + ' Cr back, ' + nm(o) + ' takes 1 Cr.', o.col);
        }
        logEnd(d.blocked ? 'blocked' : 'landed');
        updateHud();
        break;   // one Botched Install per part
      }
    }
    A.wins = A.wins.filter(x => !x.botched);
  }

  /* ---------- Phase 4: Host step, then invites ----------
   * Kev, 6 Nov: Arena cards. The fight has a format: 'duel' (host invites 2), 'mirror' (duel, every robot fights as
   * 2 copies), 'ffa' (Grand Melee: every team with a ready robot), '2v2' (Grand Final / Tag Team Licence). The House
   * Robot can join any format. A fight has entrants (one team + robot each) on sides: F.teams[e], F.robots[e],
   * F.sides[e]; bets, odds and the winner are per side. */
  const HOUSE_NAME = 'Juggernaut';   // 2.0 House Robot: a neutral level-2 Juggernaut
  const HOUSE_COL = '#5b5b5b';
  const FORMAT_NAME = { duel: 'Duel', mirror: 'Mirror duel', ffa: 'Free-for-all', '2v2': '2v2', double: 'Double duel (2 per side)' };
  // Robot-count wager (Kev, 6 Nov): with the host bid you name 1 or 2 robots per side; the winning host's count is used.
  // 2 costs the host 1 Cr; each invited team sends up to 2; if the fight ends up uneven (2 vs 1) the host loses its host fame.
  const WAGER_COST = 1;
  // AI robot count (Kev, 6 Nov: "improve AI play"): 2 per side only when the host has 2 fit robots and another team does too
  // (an uneven 2 vs 1 costs the host its fame), and not every time
  const fitRobots = T => readyRobots(T).filter(r => !wrecked(r));
  function aiHostCount(t) { return fitRobots(t).length >= 2 && G.teams.some(x => x !== t && fitRobots(x).length >= 2) && rnd() < 0.6 ? 2 : 1; }
  // the AI's guess of robot a beating robot b: the bookie's number if it has one, else a rough power comparison
  const aiEdge = (ra, rb) => Math.max(0.02, Math.min(0.98, duelP(ra, rb)));   // 2.0: strength already counts damage
  const bestVs = (T, foes) => readyRobots(T).map(r => ({ r, p: foes.length ? foes.reduce((a, f) => a + aiEdge(r, f), 0) / foes.length : 0.5 })).sort((x, y) => y.p - x.p)[0];
  const sideTeams = (F, sd) => F.teams.filter((_, e) => F.sides[e] === sd);
  const sideName = (F, sd) => sd === 'house' || sd === 9 ? 'House Robot' : sideTeams(F, sd).map(ti => G.teams[ti].name).join(' + ');
  const sideRobots = (F, sd) => F.robots.filter((r, e) => F.sides[e] === sd && r);
  const sideLabel = (F, sd) => sideRobots(F, sd).map(r => r.name).join(' + ');
  const mySide = F => { const e = F.teams.indexOf(viewerSeat); return e >= 0 ? F.sides[e] : -1; };
  const fightTitle = F => (F.house ? '🏠 ' : '') + (FORMAT_NAME[F.format] || 'Duel');

  async function startArena() {
    G.phase = 'arena';
    G.chooseMyBot = false;
    G.fight = null;
    setCameraGoal('compound');
    // the format this round: from an Intrigue event (Grand Final / Tag Team), then the Host step may change it
    G.arenaEvent = G.nextEvent || null;
    G.houseRobot = !!window.__testHouse;   // test hook: the House Robot joins every fight
    G.hostStep = true; updateHud();
    await hostStep();
    G.hostStep = false;
    const ev = G.arenaEvent, H = G.host;
    if (ev && ev.kind === 'ffa') return invite(G.teams.map(t => t.i), G.teams.map((_, i) => i), 'ffa');
    if (ev && (ev.kind === 'final' || ev.kind === 'tag')) {
      let a = ev.kind === 'final' ? G.teams.slice().sort((x, y) => y.fame - x.fame || x.i - y.i).slice(0, 2).map(t => t.i) : ev.teams.slice();
      const b = G.teams.map(t => t.i).filter(i => !a.includes(i));
      return invite(a.concat(b), [0, 0, 1, 1], '2v2');
    }
    let fmt = ev && ev.kind === 'mirror' ? 'mirror' : 'duel';
    if (fmt === 'duel' && G.hostCount === 2) {   // the host called 2 per side: pays 1 Cr (if it can)
      if (G.teams[H].credits >= WAGER_COST) { G.teams[H].credits -= WAGER_COST; fmt = 'double'; notify('🤖🤖 Host ' + nm(G.teams[H]) + ' pays ' + WAGER_COST + ' Cr: this fight is <b>2 robots per side</b>.', G.teams[H].col); }
      else notify('🤖 Host ' + nm(G.teams[H]) + ' can\'t pay ' + WAGER_COST + ' Cr for 2 per side: it stays a duel.', G.teams[H].col);
    }
    G.pendingFormat = fmt;
    if (isHuman(H)) {
      // AI teams may offer you a deal to be invited, or to be left out
      G.inviteOffers = [];
      for (const T of G.teams) {
        if (T.i === H || isHuman(T.i) || !readyRobots(T).length) continue;
        const r = readyRobots(T).sort((x, y) => power(y) - power(x))[0], p = fieldOdds(T.i, r).p;
        const want = wrecked(r) || p <= 0.3 ? 'out' : p >= 0.55 ? 'in' : null;
        if (want && rnd() < 0.55) { const B = aiBundle(T, G.teams[H], 1 + (rnd() < 0.4 ? 1 : 0)); if (!bundleEmpty(B)) G.inviteOffers.push({ team: T.i, want, B }); }
      }
      if (G.inviteOffers.length) notify('👑 Offers to you as host: ' + G.inviteOffers.map(o => nm(G.teams[o.team]) + ' ' + bundleText(o.B) + (o.want === 'in' ? ' to be invited' : ' to be left out')).join(' · '), G.teams[H].col);
      G.pickTeams = [];
      updateHud();
      return;
    }
    const host = G.teams[H];
    let others = G.teams.filter(t => t.i !== H);
    // you may offer the AI host a deal: invite me, or leave me out
    let forceIn = -1; const forceOut = new Set();
    for (const h of humanSeats()) {   // each person may offer the AI host a deal (one at a time)
      const Me = G.teams[h];
      if (!readyRobots(Me).length) continue;
      const pick = await askSeat(h, '👑 Host ' + esc(host.name) + ' picks the fighters', 'Make the host a deal?', [{ label: '✋ Invite me', value: () => 'in' }, { label: '🙈 Leave me out', value: () => 'out' }, { label: 'No deal', secondary: true, value: () => null }]);
      if (!pick || (pick === 'in' && forceIn >= 0)) continue;
      const d = await dealPanel({ title: pick === 'in' ? '✋ Ask to be invited' : '🙈 Ask to be left out', intro: 'Offer ' + nm(host) + ' something for it.', from: host, lock: 'Lock in offer' }, h);
      if (d && !bundleEmpty(d.give)) {
        if (bundleWorth(host, d.give) >= 2) { transfer(Me, host, d.give); if (pick === 'in') forceIn = h; else forceOut.add(h); notify('🤝 ' + nm(host) + ' takes ' + bundleText(d.give) + ' from ' + nm(Me) + ' and ' + (pick === 'in' ? 'invites it.' : 'leaves it out.'), host.col); }
        else notify('✋ ' + nm(host) + ' turns down ' + nm(Me) + '\'s ' + bundleText(d.give) + '.', host.col);
      }
    }
    others = others.filter(t => !forceOut.has(t.i));
    let a, b;
    // Kev, 6 Nov ("improve AI play"): the host weighs the matchups instead of picking at random.
    // 2 per side: only teams that can field 2 (an uneven fight costs the host its fame)
    const two = fmt === 'double', okTeam = t => readyRobots(t).length >= (two ? 2 : 1);
    const able0 = others.filter(t => readyRobots(t).length), able = able0.filter(okTeam).length >= (okTeam(host) ? 1 : 2) ? able0.filter(okTeam) : able0;
    const strong = T => readyRobots(T).slice().sort((x, y) => power(y) - power(x)).slice(0, 2);
    const mine = able.map(T => ({ T, p: (bestVs(host, strong(T)) || { p: 0 }).p })).sort((x, y) => y.p - x.p);
    const fightSelf = readyRobots(host).length && (!two || okTeam(host)) && mine.length && mine[0].p >= 0.55 && rnd() < 0.85;
    if (forceIn >= 0) {
      const vsMe = (bestVs(host, strong(G.teams[forceIn])) || { p: 0 }).p;
      a = forceIn; b = readyRobots(host).length && vsMe >= 0.55 ? H : (able.filter(t => t.i !== forceIn).sort((x, y) => y.fame - x.fame)[0] || others.find(t => t.i !== forceIn)).i;
    } else if (fightSelf) {
      a = H; b = mine[0].T.i;   // its best matchup (ties: whoever has more fame)
    } else if (able.length >= 2) {
      // stay out: put the team with the most fame against the rival most likely to beat it
      const lead = able.slice().sort((x, y) => y.fame - x.fame)[0], rest = able.filter(t => t !== lead);
      const foe = rest.map(T => ({ T, p: (bestVs(T, strong(lead)) || { p: 0 }).p })).sort((x, y) => y.p - x.p)[0];
      if (rnd() < 0.8 && foe) { a = lead.i; b = foe.T.i; } else { const sh = shuffle(able.slice()); a = sh[0].i; b = sh[1].i; }
    } else {
      const s = shuffle(able.length >= 2 ? able.slice() : others.slice());
      a = s[0].i; b = (s[1] || { i: H }).i;
    }
    notify('👑 Host <b>' + esc(host.name) + '</b> invites ' + esc(G.teams[a].name) + ' vs ' + esc(G.teams[b].name) + (fmt === 'mirror' ? ' (Mirror: 2 copies each)' : fmt === 'double' ? ' (up to 2 robots each)' : '') + '!', host.col);
    invite([a, b], [0, 1], fmt);
  }

  // Host step: the host may play Mirror or Unleash the House Robot, anyone may play Grand Melee (host first, then clockwise)
  async function hostStep() {
    const H = G.host;
    const usable = (t, id) => t.hand.includes(id) && t.fame >= (CARDS[id].need || 0) && (id === 'grand_melee' || t.i === H);
    const fmtNow = () => G.arenaEvent ? ({ ffa: 'a free-for-all', mirror: 'a Mirror duel', final: 'the Grand Final (2v2)', tag: 'a Tag Team 2v2' })[G.arenaEvent.kind] : 'a duel';
    for (const ti of [0, 1, 2, 3].map(k => (H + k) % 4)) {
      const t = G.teams[ti];
      for (;;) {
        const active = { grand_melee: G.arenaEvent && G.arenaEvent.kind === 'ffa', mirror: G.arenaEvent && G.arenaEvent.kind === 'mirror', unleash_the_house_robot: G.houseRobot };
        const opts = ['grand_melee', 'mirror', 'unleash_the_house_robot'].filter(id => usable(t, id) && !active[id]);   // nothing that is already in force
        if (!opts.length) break;
        let id = null;
        if (isHuman(ti)) {
          id = await askSeat(ti, '🏟️ Host step', 'This round\'s fight is ' + fmtNow() + (G.houseRobot ? ' with the House Robot' : '') + '. ' + (ti === H ? 'You are the host. ' : '') + 'Play an Arena card?' +
            opts.map(o => '<br>' + cardRef(o) + ': ' + esc(CARDS[o].text)).join(''),
            opts.map(o => ({ label: CARDS[o].icon + ' ' + esc(CARDS[o].name), value: () => o })).concat([{ label: 'No', secondary: true, value: () => null }]), 12000, null);
        } else {
          const want = { grand_melee: ti === H ? 0.7 : 0.2, mirror: 0.45, unleash_the_house_robot: 0.5 };
          id = opts.find(o => rnd() < want[o]) || null;
        }
        if (!id) break;
        const ph = playHead(t, id, null); logBegin(ph[0], t.col, ph[1], ph[2]);
        await playFx(t, id, null);
        removeFromHand(t, id); discardCard(id);
        if (id === 'grand_melee') { G.arenaEvent = { kind: 'ffa', by: ti, card: id }; notify('⚔️ Grand Melee: this round is a free-for-all for every team with a ready robot. The host gets +1 fame when it happens.'); }
        if (id === 'mirror') { G.arenaEvent = { kind: 'mirror', by: ti, card: id }; notify('🪞 Mirror: each invited robot fights as 2 copies; afterwards it keeps the damage of its healthiest copy.'); }
        if (id === 'unleash_the_house_robot') { G.houseRobot = true; notify('🏠 The House Robot joins this fight and attacks whoever is closest.'); }
        logEnd('landed');
        updateHud();
        await sleep(350);
      }
    }
  }

  function invite(list, sides, format) {
    format = format || G.pendingFormat || 'duel';
    const teams = list.slice(), sd = (sides || list.map((_, i) => i)).slice();
    // a team with no ready robot declines (−1 fame); in a duel a team with a ready robot steps in, in an event it just sits out
    for (let e = teams.length - 1; e >= 0; e--) {
      const t = G.teams[teams[e]];
      if (readyRobots(t).length) continue;
      addFame(t, -1);
      const repl = format === 'duel' || format === 'mirror' || format === 'double' ? G.teams.filter(x => !teams.includes(x.i) && readyRobots(x).length)[0] : null;
      notify('😴 ' + nm(t) + ' has no ready robot and ' + (repl ? 'declines (−1 fame); ' + nm(repl) + ' steps in.' : 'sits out (−1 fame).'), t.col);
      if (repl) teams[e] = repl.i; else { teams.splice(e, 1); sd.splice(e, 1); }
    }
    // renumber sides 0..n-1; an event left with one side is no fight
    const used = [...new Set(sd)]; const sides2 = sd.map(x => used.indexOf(x));
    if (used.length < 2) { notify('🏟️ Not enough teams with a ready robot: no fight this round.', '#b45309'); G.fight = null; G.phase = 'after'; G.awaitingJudgment = false; G.nextEvent = null; updateHud(); return; }
    G.fight = { teams, robots: teams.map(() => null), sides: sides2, nSides: used.length, format, house: !!G.houseRobot, event: G.arenaEvent };
    if (format === '2v2' || format === 'ffa') notify('🏟️ ' + fightTitle(G.fight) + ': ' + used.map((_, k) => esc(sideName(G.fight, k))).join(' vs ') + '.', '#111');
    teams.forEach((ti, e) => {
      if (!isHuman(ti)) {
        const t = G.teams[ti];
        const foes = teams.filter((x, k) => sides2[k] !== sides2[e]).flatMap(x => readyRobots(G.teams[x]).slice().sort((p, q) => power(q) - power(p)).slice(0, 1));
        const pick = bestVs({ robots: readyRobots(t).filter(r => !wrecked(r)) }, foes);   // Kev, 6 Nov: send the robot with the best matchup, not just the biggest
        G.fight.robots[e] = (pick && pick.r) || readyRobots(t).sort((a, b) => power(b) - power(a))[0] || t.robots[0];
      }
    });
    const people = teams.filter(isHuman);
    if (people.length) {
      for (const h of people) PS(h).choose = true;
      G.chooseMyBot = true;
      updateHud();
    } else {
      afterChoose();
    }
  }
  ACT.pickTeam = (S, ti) => {
    if (!(G.phase === 'arena' && G.host === S && !G.chooseMyBot && !G.hostStep && !G.fight && G.pickTeams)) return;
    const k = G.pickTeams.indexOf(ti);
    if (k >= 0) G.pickTeams.splice(k, 1);
    else if (G.pickTeams.length < 2) G.pickTeams.push(ti);
  };
  ACT.invite = S => {
    if (!(G.phase === 'arena' && G.host === S && !G.fight && G.pickTeams && G.pickTeams.length === 2)) return;
    const pk = G.pickTeams.slice(), H = G.teams[G.host];
    (G.inviteOffers || []).forEach(o => { if ((o.want === 'in') === pk.includes(o.team)) { transfer(G.teams[o.team], H, o.B); notify('🤝 ' + nm(G.teams[o.team]) + ' pays the host ' + bundleText(o.B) + ' (' + (o.want === 'in' ? 'invited' : 'left out') + ').', G.teams[o.team].col); } });
    G.inviteOffers = [];
    G.pickTeams = null;
    invite(pk);
  };
  // an invited person sends one of its ready robots; the fight goes on when every invited person has
  ACT.sendBot = (S, rid) => {
    const F = G.fight, bot = myBot(S, rid);
    if (G.phase !== 'arena' || !F || !PS(S).choose || !bot) return;
    if (bot.exhausted) { say(S, '😴 <b>' + esc(bot.name) + '</b> is exhausted and can\'t fight this round.', '#b45309'); return; }
    const e = F.teams.indexOf(S); if (e < 0) return;
    F.robots[e] = bot; PS(S).choose = false;
    notify('🤖 ' + nm(G.teams[S]) + ' sends <b>' + esc(bot.name) + '</b>.', G.teams[S].col);
    if (!humanSeats().some(h => PS(h).choose)) afterChoose();
  };
  ACT.decline = S => { if (G.phase === 'arena' && G.fight && PS(S).choose) declineInvite(S); };

  function declineInvite(S = HS) {
    const F = G.fight;
    if (F.format !== 'duel' && F.format !== 'mirror' && F.format !== 'double') return;   // events can't be declined
    const t = G.teams[S], s = F.teams.indexOf(S);
    if (s < 0) return;
    t.fame = Math.max(0, t.fame - 1);
    const free = x => !F.teams.includes(x.i) && x.i !== S;
    const repl = G.teams.filter(x => free(x) && !isHuman(x.i) && readyRobots(x).length)[0] || G.teams.filter(x => free(x) && readyRobots(x).length)[0] || G.teams.filter(free)[0];
    F.teams[s] = repl.i;
    F.robots[s] = (readyRobots(repl).length ? readyRobots(repl) : repl.robots).slice().sort((a, b) => power(b) - power(a))[0];
    PS(S).choose = false;
    notify(nm(t) + ' declines the invite (−1 Fame); <b>' + esc(repl.name) + '</b> steps in.', repl.col);
    if (!humanSeats().some(h => PS(h).choose)) afterChoose();
  }

  // the engine fight for this round: specs (copies for Mirror, the House Robot), engine robot index -> entrant
  function buildFight(F, seed, withTamper) {
    const copies = F.format === 'mirror' ? 2 : 1, list = [], botEnt = [];
    F.teams.forEach((ti, e) => {
      const r = F.robots[e], sp = withTamper ? fightSpec(r, ti) : spec2(r, ti);
      for (let c = 0; c < copies; c++) { list.push(Object.assign(clone(sp), { team: F.sides[e] })); botEnt.push(e); }
    });
    if (F.house && list.length < 4) { list.push(Object.assign(LU.build(HOUSE_NAME), { name: 'House Robot', level: levelOf(HOUSE_NAME), pal: palOf(HOUSE_COL), teamName: 'House', team: 9 })); botEnt.push(-1); }
    let S;
    if (list.length === 2) S = DL.create({ a: list[0], b: list[1], seed, countdown: 2.99 });
    else {
      const twoSides = !list.some(x => x.team === 9) && new Set(list.map(x => x.team)).size === 2;
      S = DL.create({ mode: twoSides ? '2v2' : 'ffa', robots: list, seed, countdown: 2.99 });
    }
    return { S, botEnt };
  }
  // which side won: a side index or 'house'
  function winSide(F, S, botEnt) {
    const res = S && S.result; if (!res) return -1;
    if (S.multi && S.mode === '2v2') return res.winTeam === 9 ? 'house' : res.winTeam;
    const e = botEnt[res.winner];
    return e == null || e < 0 ? 'house' : F.sides[e];
  }
  // the House Robot needs a free place: 4 robots at most in a 2.0 fight
  const fightBots = F => F.teams.length * (F.format === 'mirror' ? 2 : 1);
  const HOUSE_STR = () => R2.strength(null, HOUSE_NAME, levelOf(HOUSE_NAME), []);

  async function afterChoose() {
    G.chooseMyBot = false;
    for (let s = 0; s < 4; s++) PS(s).choose = false;
    const F = G.fight;
    if (F && F.format === 'double' && !F.seconds) await addSeconds(F);
    await treacherousStep(F);
    // appearance money (rulebook): 2 Cr per invited team, plus 2 per Fan token on its robot (6 for a Fan Favourite)
    { const paid = new Set(); F.teams.forEach((ti, e) => { const T = G.teams[ti], r = F.robots[e]; if (!r) return; T.credits += (r.wins >= favWins(T) ? 4 : 2 * r.wins) + (paid.has(ti) ? 0 : 2); paid.add(ti); }); }   // 2 Cr per invited team + 2 per Fan token (FAV: 6 total)
    // 2.0 bookie: every side's strength (Repair2, open information only); P(side) ∝ exp(strength)
    if (F.house && fightBots(F) >= 4) { F.house = false; notify('🏠 No room for the House Robot: a 2.0 fight has at most 4 robots.', '#b45309'); }
    { const copies = F.format === 'mirror' ? 2 : 1;
      const ss = Array.from({ length: F.nSides }, (_, sd) => Math.log(F.robots.reduce((a, r, e) => a + (F.sides[e] === sd && r ? copies * Math.exp(str2(r)) : 0), 0) || 1e-9));
      if (F.house) ss.push(HOUSE_STR());
      const mx = Math.max(...ss), ex = ss.map(s => Math.exp(s - mx)), tot = ex.reduce((a, b) => a + b, 0);
      F.p = ex.slice(0, F.nSides).map(x => Math.max(0.03, Math.min(0.95, x / tot))); }
    // ✦ Underrated (Artillery): its side is listed one band lower, so bets on it pay more

  // Double duel: each invited team may add a second ready robot (AI: always, if it has one); uneven = no host fame

      if (checkWin()) return;   // no fate step after a draw: check here (Headline Act can still give the host its last fame)
      updateHud();
      return;
    }
    const famePer = F.event && F.event.kind === 'final' ? 2 : 1;
    const winners = F.teams.map((ti, e) => ({ ti, e })).filter(x => F.sides[x.e] === ws);
    const losers = F.teams.map((ti, e) => ({ ti, e })).filter(x => F.sides[x.e] !== ws);
    const famed = new Set();
    winners.forEach(({ ti, e }) => {
      const T = G.teams[ti], r = F.robots[e];
      G.fameSrc = F.event && F.event.kind === 'final' ? 'win:grand final' : 'win';
      if (!famed.has(ti)) { T.fame += famePer; famed.add(ti); }   // fame once per team (a double duel or a team fight)
      G.fameSrc = 'fan';
      r.wins++;   // rulebook: no prize money, credits come from bets and appearance money
      if (r.wins === favWins(T)) T.fame += 1;
      if (quirkOf(r) === 'Hotshot') { T.credits += 1; notify('✦ Hotshot: ' + esc(r.name) + ' wins ' + nm(T) + ' +1 Cr.', T.col); }
      G.fameSrc = 'quirk';
      if (quirkOf(r) === 'Showstopper' && G.host >= 0 && G.host !== ti && G.teams[G.host].fame > 0) { G.teams[G.host].fame -= 1; T.fame += 1; notify('✦ Showstopper: ' + esc(r.name) + ' steals the show: ' + nm(T) + ' takes the host\'s +1 fame from ' + nm(G.teams[G.host]) + '.', T.col); }
    });

    F.robots.forEach((r, e) => {

      if (F.sides[e] !== ws) { r.grudge = [...new Set(r.grudge.concat(winners.map(x => x.ti)))]; notify('✦ Grudge: ' + esc(r.name) + ' won\'t forget ' + winners.map(x => nm(G.teams[x.ti])).join(' and ') + ' (+1 firepower next time they meet).', G.teams[F.teams[e]].col); }
    });
    notify('🏆 <b>' + esc(sideLabel(F, ws)) + '</b> (' + esc(sideName(F, ws)) + ') win' + (winners.length > 1 ? '' : 's') + '! +' + famePer + ' Fame' + (winners.length > 1 ? ' each' : '') + '.', G.teams[winners[0].ti].col);

    for (const x of F.bets) {
      if (x.side === ws) {
        const pay = Math.round(x.amt * payFor(G.teams[x.team], F, ws));
        x.payout = pay;
        G.teams[x.team].credits += pay;
        notify('🪙 <b>' + esc(G.teams[x.team].name) + '</b> won ' + pay + ' Cr on their bet!', G.teams[x.team].col);
      } else if (G.teams[x.team].sponsor === 'lucky') {
        x.payout = 1;
        G.teams[x.team].credits += 1;
      } else {
        x.payout = 0;
      }
    }
    // Kev, 6 Nov: the host judges EVERY losing robot, one at a time, in the order they were knocked out
    const koAt = e => Math.min(...S.robots.map((R, i) => F.botEnt[i] === e ? (R.alive ? 1e9 : (R.koT || S.t)) : 1e9));
    const order = losers.slice().sort((a, b) => koAt(a.e) - koAt(b.e));
    F.winner = { team: winners[0].ti, robot: F.robots[winners[0].e] };
    F.winners = winners.map(x => ({ team: x.ti, robot: F.robots[x.e] }));
    F.fateQueue = order.map(x => ({ team: x.ti, robot: F.robots[x.e] }));

    // 2.0: every losing team gets a free repair action next Upkeep (Vulture Salvage: 2), after the spare/scrap decisions
    F.crateQueue = [...new Set(losers.map(x => x.ti))].map(ti => ({ team: ti }));
    F.crateTxt = [];
    F.loserCrateText = 'Free repair action next Upkeep';
    F.winnerCrateText = 'Fan token +1';   // Winner's Crate cut (rulebook)

    fateStep();
  }

  // Spare or scrap, with deals (Kev, 6 Nov): the loser's team pleads, rivals push to scrap; the host takes the offers of the side it picks
  async function fateStep() {
    if (!G.fight.loser) { nextCrate(); return; }   // no losing robot (safety net)
    const F = G.fight, H = G.teams[G.host], L = G.teams[F.loser.team], lr = F.loser.robot;
    const canScrap = lr.wins < favWins(L) && G.host !== L.i;
    if (!canScrap) {   // nothing to decide: the host's own robot, or a Fan Favourite
      resolveFate(false, G.host === L.i ? 'it is the host\'s own robot' : 'a Fan Favourite can\'t be scrapped');
      return;
    }
    F.fateOffers = { spare: [], scrap: [] };
    G.fateBusy = true; updateHud();
    for (const T of G.teams) {
      if (T === H || isHuman(T.i)) continue;
      if (T === L) { const B = aiBundle(T, H, Math.min(T.credits - 1, 1 + 2 * lr.wins + (rnd() < 0.5 ? 1 : 0))); if (!bundleEmpty(B)) F.fateOffers.spare.push({ team: T.i, B }); }
      else if (canScrap && L === leaderOf() && rnd() < 0.6) { const B = aiBundle(T, H, 1 + (rnd() < 0.5 ? 1 : 0)); if (!bundleEmpty(B)) F.fateOffers.scrap.push({ team: T.i, B }); }
    }
    for (const h of humanSeats()) {
      if (h === H.i || !canScrap) continue;
      const mine = L.i === h;
      const pick = mine ? 'spare' : await askSeat(h, '👑 Spare or scrap?' + (F.fateN > 1 ? ' (' + F.fateI + ' of ' + F.fateN + ')' : ''), 'Host ' + nm(H) + ' decides the fate of ' + nm(L) + '\'s <b>' + esc(lr.name) + '</b>' + (F.fateN > 1 ? ' (every losing robot is judged in turn)' : '') + '. Push the decision with a deal?',
        [{ label: '👍 Offer: spare it', value: () => 'spare' }, { label: '👎 Offer: scrap it', value: () => 'scrap' }, { label: 'Stay out', secondary: true, value: () => null }]);
      if (pick) {
        const d = await dealPanel({ title: (pick === 'spare' ? '👍 Plead to spare ' : '👎 Push to scrap ') + esc(lr.name), intro: 'The host only takes the offers of the side it picks.' + (mine ? ' Your robot is on the line.' : ''), from: H, lock: 'Lock in offer' }, h);
        if (d && !bundleEmpty(d.give)) F.fateOffers[pick].push({ team: h, B: d.give });
      }
    }
    const offTxt = side => F.fateOffers[side].map(o => esc(G.teams[o.team].name) + ' ' + bundleText(o.B)).join(', ');
    if (F.fateOffers.spare.length || F.fateOffers.scrap.length) notify('👑 Offers to the host: ' + [F.fateOffers.spare.length ? '👍 spare: ' + offTxt('spare') : '', F.fateOffers.scrap.length ? '👎 scrap: ' + offTxt('scrap') : ''].filter(Boolean).join(' · '), H.col);
    G.fateBusy = false;
    if (isHuman(G.host)) { G.awaitingJudgment = true; updateHud(); return; }
    const lead = leaderOf().i;
    // v2: scrap a robot of a team that is a fame threat to the host (close to it or ahead), spare the others
    const base = canScrap && (aiV2(H, 'fate') ? (L.fame >= H.fame - aiP(H).scrapThreat || L.i === lead) && rnd() < 0.85 : (L.i === lead ? rnd() < 0.7 : rnd() < 0.3));
    const v = side => F.fateOffers[side].reduce((a, o) => a + bundleWorth(H, o.B), 0);
    const score = (base ? 2 : 0) + v('scrap') - v('spare') - (base ? 0 : 1);
    resolveFate(canScrap && score > 0);
  }

  ACT.fate = (S, scrap) => { if (G.phase === 'after' && G.awaitingJudgment && G.host === S) resolveFate(!!scrap); };
  function resolveFate(scrap, safeWhy) {
    G.awaitingJudgment = false;
    const { team, robot } = G.fight.loser, T = G.teams[team];
    { const H = G.teams[G.host], offs = (G.fight.fateOffers || {})[scrap ? 'scrap' : 'spare'] || [];   // the host takes the offers of the side it picked
      offs.forEach(o => { transfer(G.teams[o.team], H, o.B); notify('🤝 ' + nm(G.teams[o.team]) + ' pays the host ' + bundleText(o.B) + ' (' + (scrap ? 'scrap' : 'spare') + ').', G.teams[o.team].col); }); }
    if (scrap) {
      robotLeaves(T, robot, null, 'host scrap'); returnStarter(robot.name);   // (a Fan Favourite can't be scrapped by the host; if it ever is, its owner loses the fame)
      for (const v of G.teams) if (v.sponsor === 'vulture') v.credits += 2;
      notify('👎 Host scrapped <b>' + esc(robot.name) + '</b>!', '#d62828');
      if (removeFromHand(T, 'blaze_of_glory')) { discardCard('blaze_of_glory'); addFame(T, 1); notify('🔥 ' + cardRef('blaze_of_glory') + ': ' + nm(T) + ' +1 fame for the scrapped robot.', T.col); }
      if (!T.robots.length) noRobotsLeft(T);   // 2.0 (Kev, 8 Nov): no free Scrapbot
    } else if (safeWhy) {
      notify('🛡️ <b>' + esc(robot.name) + '</b> (' + nm(T) + ') is safe: ' + safeWhy + '.', '#2a9d3a');
    } else {
      notify('👍 Host spared <b>' + esc(robot.name) + '</b>.', '#2a9d3a');
    }
    if (checkWin()) return;
    const F = G.fight;
    if (F && F.fateQueue && F.fateQueue.length) {   // next losing robot

  /* ---------- 2.0: the loser's free repair (replaces the Scrap Crate items) ---------- */
  const aiCratePick = (T, r, opts) => opts.slice();
  ACT.crate = () => {};
  function nextCrate() {
    const F = G.fight;
    while (F && F.crateQueue && F.crateQueue.length) {

    }
    G.crateChoices = null; checkWin(); updateHud();
  }

  /* ============================================================================
   * MULTIPLAYER GLUE (Kev, 7 Nov): what src/net.js talks to (window.ROBOCUS_GAME).
   * Host: runs the game, sends each seat a filtered snapshot (snapFor), the log, board moments and the fight tick.
   * Client: shows the snapshots (applySnap), runs the same fight from the seed, sends its clicks as actions.
   * ============================================================================ */
  const dynLots = () => { const o = {}; for (const k in LOTS) if (k.startsWith('robot:') || k.startsWith('crew:')) o[k] = LOTS[k]; return o; };
  // what one seat may see: other hands and the decks are hidden cards; others' sealed bids and per-seat state are blank
  function snapFor(s) {
    if (!G) return null;
    const fightPhase = G.phase === 'fight', analyst = s >= 0 && hasCrew(G.teams[s], 'analyst');
    const tie = G.marketAuction && G.marketAuction.tie;
    return JSON.stringify(G, function (k, v) {
      if (typeof v === 'function') return true;
      if (this === G) {
        if (k === 'cstat' || k === 'liveStat') return undefined;
        if (k === 'deck' || k === 'auctionDeck' || k === 'robotDeck' || k === 'crewDeck' || k === 'starterDeck' || k === 'legends') return Array.isArray(v) ? v.map(() => '?') : v;
        if (k === 'lots') return Array.isArray(v) ? v.map((x, i) => analyst && i >= v.length - NLOTS ? x : '?') : v;
        if (k === 'ps') return v.map((p, i) => i === s ? p : {});
      }
      if (G.fight && this === G.fight && k === 'aiBids') return undefined;
      if (G.fight && this === G.fight && (k === 'B' || k === 'S' || k === 'introT' || k === 'rollout' || k === 'countdown' || k === 'rolloutDone' || k === 'fightFlash')) return undefined;
      if (k === 'hand' && this && this.robots && typeof this.i === 'number' && this.i !== s) return v.map(() => '?');
      if (G.marketAuction && this === G.marketAuction && (k === 'all' || k === 'initialAll' || k === 'rebidAdds')) return v.map((row, i) => i === s ? row : row.map(() => 0));
      if (tie && this === tie && (k === 'add' || k === 'maxAdd')) { const o = {}; if (v[s] != null) o[s] = v[s]; return o; }
      if (!fightPhase && k === 'faceDown' && Array.isArray(v)) return v.map(x => x.from === s ? x : { from: x.from, id: 'hidden' });

  }
  function relink(g) {   // a snapshot has copies; point the fight's robots back at the teams' robots
    const byId = {}; g.teams.forEach(t => t.robots.forEach(r => { byId[r.id] = r; }));
    const L = r => r && byId[r.id] ? byId[r.id] : r;
    const F = g.fight;
    if (F) {

    }

  }
  let clientFight = null, desyncs = 0, resims = 0;
  function applySnap(m) {

    if (m.win) WIN_FAME = m.win; if (m.hostFame != null) HOST_FAME = m.hostFame;

  }
  function clientFightSync() { /* 2.0: no online play yet */ }

  /* ---------- save (Kev, 7 Nov): kept at the start of every round, once Upkeep's debts are settled ---------- */
  let SAVE = null;
  function saveState() {
    const g = JSON.parse(JSON.stringify(G, function (k, v) { if (typeof v === 'function') return undefined; if (G.fight && this === G.fight && (k === 'B' || k === 'S')) return undefined; return v; }));
    return { v: 1, build: BUILD, at: new Date().toISOString(), G: g, rnd: rndState, lotsDyn: dynLots(), seq: { botSeq, crewSeq, crewLotSeq, fightSeq }, WIN_FAME, HOST_FAME, CATCHUP, names: netNames.slice() };
  }
  function roundSave() { if (!G || G.fast || G.phase !== 'upkeep') return; try { SAVE = JSON.stringify(saveState()); } catch (e) { console.warn('save failed', e); } }
  function loadState(o) {
    G = o.G; rndState = o.rnd >>> 0;
    Object.assign(LOTS, o.lotsDyn || {});
    ({ botSeq, crewSeq, crewLotSeq, fightSeq } = Object.assign({ botSeq, crewSeq, crewLotSeq, fightSeq }, o.seq || {}));
    if (o.WIN_FAME) WIN_FAME = o.WIN_FAME; if (o.HOST_FAME != null) HOST_FAME = o.HOST_FAME; if (o.CATCHUP) CATCHUP = o.CATCHUP;

    notify('💾 <b>Saved game loaded</b> (round ' + G.round + ', saved ' + esc(String(o.at || '').slice(0, 16).replace('T', ' ')) + ').', '#111');
    setCameraGoal('compound');
    updateHud();
  }
  function downloadText(name, text) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([text], { type: 'application/json' }));
    a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  }

  /* ---------- the host's nudge / skip: a seat that keeps everyone waiting gets the default for what it is asked ---------- */
  function seatBusyWith(s) {   // what the game waits for from this seat right now (for the host's banner), or null
    if (!G || !isHuman(s) || G.over) return null;
    if (G.phase === 'setup') return G.setupStep === 'sponsor' ? (!isNetGame() || !PS(s).sponsor ? 'sponsor' : null) : (PS(s).draftOffer && !PS(s).draftPick ? 'draft' : null);
    if (G.phase === 'intrigue') return G.intrigueTurn === s ? 'intrigue turn' : null;
    if (G.marketAuction && G.marketAuction.tie && tieMine(s)) return 'rebid';
    if ((PS(s).install || []).length) return 'install';
    if (PS(s).choose) return 'robot pick';
    if (G.awaitingJudgment && G.host === s) return 'spare/scrap';
    if (G.crateChoices && G.crateChoices.team === s) return 'crate';
    if (G.phase === 'arena' && G.host === s && G.pickTeams && !G.fight && !G.hostStep) return 'invites';
    const step = gatherStep();
    if (step && !(G.gather && G.gather.key === step[0] + ':' + G.round && G.gather.done[s])) return step[0];
    return null;
  }
  function gatherStep() {   // the simultaneous step the game is in: [gather key, action]
    if (G.phase === 'upkeep' && !G.debtBusy) return ['upkeep', 'upkeepDone'];
    if (G.phase === 'market' && !G.marketAuction) {
      if (G.marketResolved) return [G.hostResolved ? 'mres2' : 'mres', 'continueMarket'];
      if (G.marketStage === 'open' && !G.openBusy) return ['open', 'startLots'];
      if (G.marketStage === 'lots') return ['lots', 'lockBids'];
      if (G.marketStage === 'host') return ['hostbid', 'lockHost'];
    }
    if (G.phase === 'bets' && !G.betsLocked) return ['bets', 'lockBets'];
    if (G.phase === 'after' && !G.awaitingJudgment && !G.fateBusy && !G.crateChoices && !G.over) return ['next', 'nextRound'];
    return null;
  }
  function skipSeat(s) {
    if (!G || !isHuman(s)) return;
    if (window.ROBOCUS_NET) window.ROBOCUS_NET.cancelSeat(s);   // its open questions and deal panels get their default answer
    const P = PS(s);
    if (G.phase === 'setup') { if (G.setupStep === 'sponsor' && isNetGame() && !P.sponsor) runAct(s, 'pickSponsor', [null]); else if (PS(s).draftOffer && !PS(s).draftPick) runAct(s, 'pickStarter', [-1]); return; }
    if (G.phase === 'intrigue' && G.intrigueTurn === s) { P.skipTurn = true; if (G.endHumanTurn && !G.ivBusy) G.endHumanTurn(); return; }
    if (tieMine(s)) { runAct(s, 'rebidLock', []); return; }
    if ((P.install || []).length) { while ((P.install || []).length) { const it = P.install[0], r = aiPickRobot(G.teams[s], it.lot); if (r) runAct(s, 'install', [r.id]); else runAct(s, 'installKeep', []); if (P.install[0] === it) runAct(s, 'installKeep', []); } return; }
    if (P.choose) { const r = readyRobots(G.teams[s]).sort((a, b) => power(b) - power(a))[0]; if (r) runAct(s, 'sendBot', [r.id]); else runAct(s, 'decline', []); return; }
    if (G.awaitingJudgment && G.host === s) { runAct(s, 'fate', [false]); return; }
    if (G.crateChoices && G.crateChoices.team === s) { const CC = G.crateChoices; for (const id of aiCratePick(G.teams[s], CC.robot, CC.items)) { if (G.crateChoices !== CC) break; runAct(s, 'crate', [id]); } return; }
    if (G.phase === 'arena' && G.host === s && G.pickTeams && !G.fight && !G.hostStep) {
      const opts = G.teams.filter(t => readyRobots(t).length).sort((a, b) => b.fame - a.fame).map(t => t.i);
      G.pickTeams = opts.slice(0, 2); if (G.pickTeams.length === 2) runAct(s, 'invite', []); return;

  }
  function seatToAI(s) {   // the host lets the AI play a seat whose person left
    if (!SEATS || SEATS[s] !== 'remote') return;
    skipSeat(s);
    SEATS[s] = 'ai'; netNames[s] = null; if (G.names) G.names[s] = null; delete G.teams[s].player;
    notify('🤖 The AI now plays ' + nm(G.teams[s]) + '.', G.teams[s].col);
    if (G.phase === 'intrigue' && G.intrigueTurn === s && G.endHumanTurn) G.endHumanTurn();
    if (G.phase === 'arena' && G.chooseMyBot && !humanSeats().some(h => PS(h).choose)) afterChoose();
    if (tieMine(s) || (G.marketAuction && G.marketAuction.tie && G.marketAuction.tie.waitingHuman && !G.marketAuction.tie.waiting.some(isHuman))) submitHumanRebid();
    recheckGather();
    updateHud();
  }

  /* ---------- test bots (?bot=1): a seat that plays itself with simple rules, through the same actions ---------- */
  let botBusy = false;
  function botStep() {
    if (!G || G.over || botBusy || HS < 0 || window.__noBot) return;
    if (document.getElementById('ivModal') && !document.getElementById('ivModal').hidden) return;
    if (document.getElementById('dealModal') && !document.getElementById('dealModal').hidden) return;
    const t = me(), P = PS(), R = Math.random;
    const busy = seatBusyWith(HS);
    if (!busy) return;
    if (busy === 'sponsor') return act('pickSponsor', null);

      const t = now - f.t0; ctx.save(); ctx.globalAlpha = Math.max(0, Math.min(1, t / 200, (f.dur - t) / 220)); fxArrow(ctx, A, Bx, G.teams[f.ti].col, t); ctx.restore();
    }
  }

  function teamAtPos(pos) { return (viewerSeat + pos) % 4; }
  function posOfTeam(ti) { return (ti - viewerSeat + 4) % 4; }

  function drawBar(ctx, x, y, w, h, frac, fillCol, bgCol = '#e6e3da', ticks = 0) {
    const f = Math.max(0, Math.min(1, frac || 0));
    ctx.fillStyle = bgCol;
    ctx.fillRect(x, y, w, h);
    if (f > 0) {
      ctx.fillStyle = fillCol;
      ctx.fillRect(x, y, w * f, h);
    }
    if (ticks > 1) {
      ctx.fillStyle = 'rgba(255,255,255,0.65)';
      for (let i = 1; i < ticks; i++) {
        ctx.fillRect(Math.round(x + (w * i) / ticks), y, 1, h);
      }
    }
    ctx.strokeStyle = '#c8c4b8';
    ctx.lineWidth = 1;
    ctx.strokeRect(x, y, w, h);
  }

  // 2.0: a robot's picture, drawn by the fight renderer (src2/view.js portrait: lost parts missing, team colours)
  const PORT = new Map();
  function drawPortrait(ctx, r, T, x, y, w, h) {
    ctx.fillStyle = '#e9e5da'; ctx.fillRect(x, y, w, h);
    ctx.strokeStyle = '#d0ccc0'; ctx.lineWidth = 1; ctx.strokeRect(x, y, w, h);
    let img = null; const sz = Math.max(w, h) > 70 ? 224 : 128, pk = (T ? T.col : '') + sz + '|' + wearKey(r);
    if (PORT.has(pk)) img = PORT.get(pk);
    else { try { img = VW.portrait(spec2(r, T), sz); } catch (e) { img = null; } if (PORT.size > 200) PORT.clear(); PORT.set(pk, img); }
    const s = Math.min(w, h);
    if (img) ctx.drawImage(img, x + (w - s) / 2, y + (h - s) / 2, s, s);
  }
  // the three repair zones of a robot: lit red (broken) or amber (damaged); clickable in your own Upkeep
  const ZCOL = q => q.broken ? '#d62828' : q.damaged ? '#d99000' : null;
  function drawZoneButtons(ctx, r, x, y, w, h, clickable, small) {
    const Z = zonesOf(r), gap = small ? 3 : 6, bw = (w - gap * 2) / 3;
    R2.ZONES.forEach((z, k) => {
      const q = Z[z.key], bx = x + k * (bw + gap), col = ZCOL(q);
      ctx.fillStyle = col || '#f2efe8'; ctx.fillRect(bx, y, bw, h);
      ctx.strokeStyle = col || '#cfcab9'; ctx.lineWidth = clickable && col ? 2 : 1; ctx.strokeRect(bx, y, bw, h);
      ctx.fillStyle = col ? '#fff' : '#8a857a'; ctx.textAlign = 'center';
      if (small) fitText(ctx, z.icon + ' ' + (q.broken ? 'broken' : q.damaged ? Math.round(q.f * 100) + '%' : 'ok'), bx + bw / 2, y + h / 2 + 3.5, bw - 4, '800', 9);
      else {
        fitText(ctx, z.icon + ' ' + z.label, bx + bw / 2, y + 15, bw - 8, '900', 12);
        fitText(ctx, (q.broken ? 'BROKEN' : q.damaged ? Math.round(q.f * 100) + '%' : 'ok') + (clickable && col ? ' · repair' : ''), bx + bw / 2, y + 30, bw - 8, '700', 10);
      }
      const hz = helpZone(r, z.key); help(bx, y, bw, h, hz[0], hz[1] + (clickable && col ? '<br><i>Click: spend 1 repair action on it.</i>' : ''));
      if (clickable && col) hitRegions.push({ kind: 'zone_fix', robot: r, zone: z.key, x: bx, y, w: bw, h });
    });
    ctx.textAlign = 'left';
  }

  function renderWorld(now) {
    const dpr = Math.max(1, window.devicePixelRatio || 1);
    const sw = window.innerWidth, sh = window.innerHeight;
    const targetW = Math.round(sw * dpr);
    const targetH = Math.round(sh * dpr);

    if (cv.width !== targetW || cv.height !== targetH) {
      cv.width = targetW;
      cv.height = targetH;
      cv.style.width = sw + 'px';
      cv.style.height = sh + 'px';
    }

    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, targetW, targetH);

    ctx.fillStyle = '#f6f4ee';
    ctx.fillRect(0, 0, targetW, targetH);

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';

    // Smoothly interpolate Arena expansion (0 = compact pre-fight stage, 1 = full 900x560 fight arena)
    const targetExpand = 0;   // 2.0: the fight has its own full screen; the board's pit stays small
    arenaExpand += (targetExpand - arenaExpand) * 0.12;
    if (Math.abs(targetExpand - arenaExpand) < 0.002) arenaExpand = targetExpand;

    if (narrowScreen() && !cam.manualZoom) phoneCam();
    cam.x += (cam.tx - cam.x) * 0.10;
    cam.y += (cam.ty - cam.y) * 0.10;
    cam.zoom += (cam.tzoom - cam.zoom) * 0.10;
    if (Math.abs(cam.tx - cam.x) < 0.04) cam.x = cam.tx;
    if (Math.abs(cam.ty - cam.y) < 0.04) cam.y = cam.ty;
    if (Math.abs(cam.tzoom - cam.zoom) < 0.001) cam.zoom = cam.tzoom;

    ctx.save();
    ctx.translate(sw / 2, sh / 2);
    ctx.scale(cam.zoom, cam.zoom);
    ctx.translate(-cam.x, -cam.y);

    hitRegions = [];
    helpRegions = [];

    const L = getDynamicLayout(arenaExpand);
    const ax0 = L.ax - L.aw / 2, ay0 = L.ay - L.ah / 2;

    // Subtle architectural background grid
    ctx.strokeStyle = '#e5e1d7';
    ctx.lineWidth = 1;
    for (let x = -900; x <= 900; x += 60) { ctx.beginPath(); ctx.moveTo(x, -660); ctx.lineTo(x, 660); ctx.stroke(); }
    for (let y = -660; y <= 660; y += 60) { ctx.beginPath(); ctx.moveTo(-900, y); ctx.lineTo(900, y); ctx.stroke(); }

    // 2. Draw Central Pit / Stage (compact 620x210 when no fight is ongoing; expands to 900x560 during fights)
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(ax0, ay0, L.aw, L.ah);
    ctx.strokeStyle = '#f0ede6'; ctx.lineWidth = 1;
    for (let x = ax0 + 60; x < ax0 + L.aw; x += 60) { ctx.beginPath(); ctx.moveTo(x, ay0); ctx.lineTo(x, ay0 + L.ah); ctx.stroke(); }
    for (let y = ay0 + 60; y < ay0 + L.ah; y += 60) { ctx.beginPath(); ctx.moveTo(ax0, y); ctx.lineTo(ax0 + L.aw, y); ctx.stroke(); }

    ctx.strokeStyle = '#dfdbd0'; ctx.lineWidth = 1.8;
    ctx.beginPath(); ctx.arc(L.ax, L.ay, Math.min(L.aw, L.ah) * 0.34, 0, Math.PI * 2); ctx.stroke();

    ctx.strokeStyle = '#111111'; ctx.lineWidth = 3;
    ctx.strokeRect(ax0, ay0, L.aw, L.ah);

    hitRegions.push({ kind: 'arena', x: ax0, y: ay0, w: L.aw, h: L.ah });

    // 3. Draw Asymmetrical Garages: Player Command Garage (Pos 0) vs Slim Opponent Recon Strips (Pos 1, 2, 3)
    L.slots.forEach(slot => {
      const ti = teamAtPos(slot.pos);
      const t = G.teams[ti];
      if (slot.pos === 0) drawPlayerCommandGarage(ctx, slot, ti, t, now);
      else drawSlimOpponentGarage(ctx, slot, ti, t, now);
    });

    // 4. Draw Spatial Phase Content inside the Central Stage / Arena
    if (G.phase === 'setup') {
      drawSetupOnArena(ctx, L, now);
    } else if (G.phase === 'market') {
      drawMarketOnArena(ctx, L);
    } else if (G.phase === 'bets' && G.fight) {
      drawBettingOnArena(ctx, L);
    } else if (G.phase === 'fight' && G.fight && G.fight.B) {
      drawLiveBattleInArena(ctx, now, L);
    } else if (G.phase === 'after' && G.fight && G.fight.B) {
      drawAftermathOnArena(ctx, L);
    } else {
      drawStandbyStage(ctx, L, now);
    }

    if (G.phase !== 'fight') G.teams.forEach(t => { const B = boxOf(L, t.i); if (B) drawPurse(ctx, t, B); });
    if (G.phase === 'intrigue') drawIntrigueOrder(ctx, L, now, 'under');
    placeHand(L);
    drawBoardFx(ctx, L);
    if (G.phase === 'intrigue') drawIntrigueOrder(ctx, L, now, 'over');   // tags stay readable over a played card's show

    // Welding sparks FX in garages
    for (let i = weldSparks.length - 1; i >= 0; i--) {
      const sp = weldSparks[i];
      sp.x += sp.vx * 0.016; sp.y += sp.vy * 0.016; sp.life -= 0.016;
      ctx.fillStyle = '#f59e0b';
      ctx.fillRect(sp.x - 2, sp.y - 2, 4, 4);
      if (sp.life <= 0) weldSparks.splice(i, 1);
    }

    ctx.restore();

    // 5. Screen-Space Targeting Arrow when dragging a card
    if (dragCard) {
      drawTargetingArrow(ctx, dragCard.startX, dragCard.startY, dragCard.curX, dragCard.curY, dragCard.card.phase === 'fight' ? '#d99000' : '#1f6feb');
    }

    ctx.restore();
  }

  /* ---------- Interactive Opening Setup & Starter Deck Draft on Arena Stage ---------- */
  function wrapLines(ctx, text, maxW) {
    const words = String(text || '').split(/\s+/);
    const lines = [];
    let cur = '';
    for (const w of words) {
      const test = cur ? cur + ' ' + w : w;
      if (ctx.measureText(test).width > maxW && cur) {
        lines.push(cur);
        cur = w;
      } else {
        cur = test;
      }
    }
    if (cur) lines.push(cur);
    return lines;
  }

  function drawSetupOnArena(ctx, L, now) {
    const cx = L.ax, cy = L.ay, x0 = cx - L.aw / 2, y0 = cy - L.ah / 2;
    const t = me();

    ctx.fillStyle = '#f6f4ee';
    ctx.fillRect(x0 + 2, y0 + 2, L.aw - 4, 26);
    ctx.strokeStyle = '#dedad0'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(x0, y0 + 28); ctx.lineTo(x0 + L.aw, y0 + 28); ctx.stroke();

    if (G.setupStep === 'sponsor') {
      ctx.fillStyle = '#111'; ctx.font = '900 11px system-ui, sans-serif'; ctx.textAlign = 'left';
      ctx.fillText('SETUP 1/3  —  YOU ARE DEALT 2 SPONSORS: KEEP 1', x0 + 12, y0 + 18.5);
      ctx.fillStyle = '#666'; ctx.font = '700 9.5px system-ui, sans-serif'; ctx.textAlign = 'right';
      ctx.fillText('AI teams: dealt 2 of the rest', x0 + L.aw - 12, y0 + 18.5);

        ctx.fillText('You signed with ' + SPONSORS[PS().sponsor].name + '.', cx, cy - 6);
        ctx.fillStyle = '#666'; ctx.font = '700 11px system-ui, sans-serif';
        ctx.fillText('Waiting for the other players to sign…', cx, cy + 16);
        return;
      }
      mySponsorDeal().forEach((spKey, idx) => {
        const sp = SPONSORS[spKey];
        const col = idx % 2, row = 0;
        const bx = startX + col * (cw + gapX), by = startY + row * (ch + gapY);
        const hov = mouse.wx >= bx && mouse.wx <= bx + cw && mouse.wy >= by && mouse.wy <= by + ch;

        ctx.fillStyle = hov ? '#f5f9ff' : '#fcfbf9';
        ctx.fillRect(bx, by, cw, ch);
        ctx.strokeStyle = hov ? t.col : '#222';
        ctx.lineWidth = hov ? 2.5 : 1.3;
        ctx.strokeRect(bx, by, cw, ch);

        // Top Sponsor Name & Tag Header
        ctx.fillStyle = hov ? t.col : '#111';
        ctx.fillRect(bx, by, cw, 20);
        ctx.fillStyle = '#ffffff'; ctx.font = '800 10px system-ui, sans-serif'; ctx.textAlign = 'left';
        ctx.fillText(sp.name, bx + 8, by + 13.5);
        ctx.font = '700 8.5px system-ui, sans-serif'; ctx.textAlign = 'right';
        ctx.fillText(sp.tag.toUpperCase(), bx + cw - 8, by + 13.5);

        // Wrapped Sponsor Rule Description
        ctx.fillStyle = '#333'; ctx.font = '600 9.5px system-ui, sans-serif'; ctx.textAlign = 'left';
        const lines = wrapLines(ctx, sp.text, cw - 16);
        lines.slice(0, 2).forEach((ln, li) => {
          ctx.fillText(ln, bx + 8, by + 35 + li * 12);
        });

        // Bottom Select Pill
        ctx.fillStyle = hov ? t.col : '#eae6dc';
        ctx.fillRect(bx + 8, by + ch - 21, cw - 16, 16);
        ctx.fillStyle = hov ? '#fff' : '#111'; ctx.font = '800 9.5px system-ui, sans-serif'; ctx.textAlign = 'center';
        ctx.fillText('Sign Sponsor Contract →', bx + cw / 2, by + ch - 9.5);

        hitRegions.push({ kind: 'setup_sponsor', spKey, x: bx, y: by, w: cw, h: ch });
      });

    }

    // Step 2 & Step 3: Starter Deck Draft (keep 1 of 2, in secret, from the 9 s1. starters)
    const pickNum = G.setupStep === 'draft1' ? 1 : 2;
    ctx.fillStyle = '#111'; ctx.font = '900 11px system-ui, sans-serif'; ctx.textAlign = 'left';
    ctx.fillText(STARTER_PICKS > 1 ? `STARTER DECK DRAFT (PICK ${pickNum} OF ${STARTER_PICKS})  —  KEEP 1 OF 2, IN SECRET` : 'STARTER DECK DRAFT  —  KEEP 1 OF 2, IN SECRET (REVEALED TOGETHER)', x0 + 12, y0 + 18.5);
    ctx.fillStyle = '#555'; ctx.font = '700 9.5px system-ui, sans-serif'; ctx.textAlign = 'right';
    ctx.fillText('Level 0 · 2 part slots + 1 legendary', x0 + L.aw - 12, y0 + 18.5);

    const offer = myDraftOffer(), picked = PS().draftPick;
    const cw = 192, ch = 180, gap = 10;
    const startX = cx - (offer.length * cw + (offer.length - 1) * gap) / 2, by = y0 + 33;
    if (picked) {
      ctx.fillStyle = '#111'; ctx.font = '800 13px system-ui, sans-serif'; ctx.textAlign = 'center';

      ctx.fillStyle = hov ? '#f8fbff' : '#fcfbf9';
      ctx.fillRect(bx, by, cw, ch);
      ctx.strokeStyle = hov ? t.col : '#222';
      ctx.lineWidth = hov ? 2.5 : 1.5;
      ctx.strokeRect(bx, by, cw, ch);
      const px = bx + 8, py = by + 8, ps = 84;
      drawPortrait(ctx, rb, t, px, py, ps, ps);
      { const hl = helpLook(rb); help(px, py, ps, ps, hl[0], hl[1]); }
      const tx = bx + 100, tw = cw - 106;
      ctx.fillStyle = '#111'; ctx.textAlign = 'left'; fitText(ctx, sName, tx, by + 22, tw, '900', 13);
      ctx.fillStyle = '#c08400'; fitText(ctx, 'STARTER · LEVEL 0', tx, by + 37, tw, '900', 9);
      ctx.fillStyle = t.col; fitText(ctx, wepLabel(sName).toUpperCase(), tx, by + 52, tw, '800', 9.5);
      ctx.fillStyle = '#444'; fitText(ctx, 'Power ×' + LU.ROBOTS[sName][1].toFixed(2), tx, by + 67, tw, '700', 9);
      help(tx, by + 58, tw, 12, 'Power grade', 'Its weapon damage and every part\'s HP are multiplied by this (0.76 to 1.10 among the starters). Matchups still matter: the fights are physics, not numbers.');
      ctx.fillStyle = '#f3f1ea'; ctx.fillRect(bx + 8, by + 98, cw - 16, 46);
      ctx.strokeStyle = '#dfdbd0'; ctx.lineWidth = 1; ctx.strokeRect(bx + 8, by + 98, cw - 16, 46);

      const tableAvg = Math.round(starterVsTableAvg(sName, viewerSeat) * 100), baseAvg = Math.round(starterOverallAvg(sName) * 100);
      ctx.fillStyle = hasRivals && tableAvg >= 55 ? '#15803d' : '#1f6feb';
      fitText(ctx, hasRivals ? `vs robots on the table: ${tableAvg}%` : `vs the other starters: ${baseAvg}% avg`, bx + 12, by + 138, cw - 24, '800', 9);
      ctx.fillStyle = hov ? t.col : '#111';
      ctx.fillRect(bx + 8, by + 149, cw - 16, 25);
      ctx.fillStyle = '#ffffff'; ctx.textAlign = 'center';
      fitText(ctx, `Draft ${sName} →`, bx + cw / 2, by + 165, cw - 24, '800', 10.5);
      if (!picked) hitRegions.push({ kind: 'setup_draft', idx, x: bx, y: by, w: cw, h: ch });
      ctx.globalAlpha = 1;
    });
  }

  /* ---------- Intrigue turn order on the board: the active garage glows with a NOW tag, the next one gets NEXT,
     finished ones are dimmed with a ✓, and each garage has its 1–4 turn number (a pill on its bottom edge). ---------- */
  function ivPill(ctx, cx, cy, txt, col, solid, size) {
    ctx.font = '900 ' + size + 'px system-ui, sans-serif'; ctx.textAlign = 'center';
    const w = ctx.measureText(txt).width + size * 1.4, h = size + 8;
    rrect(ctx, cx - w / 2, cy - h / 2, w, h, h / 2);
    ctx.fillStyle = solid ? col : '#ffffff'; ctx.fill();
    ctx.strokeStyle = col; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.fillStyle = solid ? '#ffffff' : col; ctx.fillText(txt, cx, cy + size * 0.36);
  }
  function drawIntrigueOrder(ctx, L, now, layer) {
    const O = G.ivOrder; if (!O || !O.length) return;
    const cur = O.indexOf(G.intrigueTurn), done = cur >= 0 ? cur : (G.ivDone || 0), pulse = 0.5 + 0.5 * Math.sin(now / 320);
    O.forEach((ti, k) => {
      const B = boxOf(L, ti); if (!B) return;
      const t = G.teams[ti], by = B.y + B.h, bx = B.x + B.w / 2;
      ctx.save();
      if (layer === 'under') {
        if (k < done) { ctx.fillStyle = 'rgba(246,244,238,0.38)'; ctx.fillRect(B.x, B.y, B.w, B.h); }   // turn over: dim a little
      } else if (k < done) {
        ivPill(ctx, bx, by, k + 1 + '  ✓ DONE', '#8a8578', false, 10);
      } else if (k === cur) {   // turn now: glowing team-coloured outline
        ctx.shadowColor = t.col; ctx.shadowBlur = 10 + 10 * pulse;
        ctx.strokeStyle = t.col; ctx.lineWidth = 4;
        ctx.strokeRect(B.x - 3, B.y - 3, B.w + 6, B.h + 6);
        ctx.shadowBlur = 0;
        ivPill(ctx, bx, by, k + 1 + '  ·  NOW', t.col, true, 12);
      } else if (k === cur + 1) {
        ivPill(ctx, bx, by, k + 1 + '  ·  NEXT', t.col, false, 10.5);
      } else {
        ivPill(ctx, bx, by, String(k + 1), t.col, false, 10);
      }
      ctx.restore();
    });
  }
  // a quiet clockwise ring in the arena pit: one dot per team where its garage is, numbered in turn order
  function drawIntrigueRing(ctx, L, now) {
    const O = G.ivOrder; if (!O || !O.length) return;
    const cx = L.ax, cy = L.ay + 8, R = Math.min(L.aw, L.ah) * 0.30;
    const cur = O.indexOf(G.intrigueTurn), done = cur >= 0 ? cur : (G.ivDone || 0);
    const ang = ti => [135, 225, 315, 45][posOfTeam(ti)] * Math.PI / 180;   // your garage bottom-left, rivals TL, TR, BR: clockwise like the seats
    ctx.save();
    ctx.strokeStyle = '#e4e0d5'; ctx.lineWidth = 2;
    for (let q = 0; q < 4; q++) {   // four arcs with arrowheads, clockwise
      const a0 = (q * 90 + 45 + 14) * Math.PI / 180, a1 = (q * 90 + 135 - 14) * Math.PI / 180;
      ctx.beginPath(); ctx.arc(cx, cy, R, a0, a1); ctx.stroke();
      const ex = cx + R * Math.cos(a1), ey = cy + R * Math.sin(a1), tx = -Math.sin(a1), ty = Math.cos(a1);
      ctx.fillStyle = '#d6d1c4'; ctx.beginPath();
      ctx.moveTo(ex + tx * 7, ey + ty * 7); ctx.lineTo(ex - ty * 5, ey + tx * 5); ctx.lineTo(ex + ty * 5, ey - tx * 5); ctx.closePath(); ctx.fill();
    }
    O.forEach((ti, k) => {
      const a = ang(ti), x = cx + R * Math.cos(a), y = cy + R * Math.sin(a), t = G.teams[ti], on = k === cur, r = on ? 13 + 2 * Math.sin(now / 320) : 10;
      ctx.globalAlpha = k < done ? 0.45 : 1;
      if (on) { ctx.shadowColor = t.col; ctx.shadowBlur = 12; }
      ctx.fillStyle = on || k >= done ? t.col : '#b9b4a6'; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#fff'; ctx.font = '900 ' + (on ? 13 : 11) + 'px system-ui, sans-serif'; ctx.textAlign = 'center';
      ctx.fillText(k < done ? '✓' : String(k + 1), x, y + (on ? 4.5 : 4));
      ctx.globalAlpha = 1;
    });
    ctx.restore();
  }

  /* ---------- Compact Pre-Fight Central Stage Overview ---------- */
  function drawStandbyStage(ctx, L, now) {
    const cx = L.ax, cy = L.ay, x0 = cx - L.aw / 2, y0 = cy - L.ah / 2;

    // Minimalist Stage Header Bar
    ctx.fillStyle = '#f6f4ee';
    ctx.fillRect(x0 + 2, y0 + 2, L.aw - 4, 28);
    ctx.strokeStyle = '#dedad0'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(x0, y0 + 30); ctx.lineTo(x0 + L.aw, y0 + 30); ctx.stroke();

    ctx.fillStyle = '#111'; ctx.font = '800 11px system-ui, sans-serif'; ctx.textAlign = 'left';
    ctx.fillText(`ARENA PIT  ·  ROUND ${G.round} STANDBY`, x0 + 14, y0 + 19);

    const hostTxt = G.host >= 0 ? `HOST: ${G.teams[G.host].name.toUpperCase()}` : 'HOST: DECIDED IN MARKET';
    ctx.fillStyle = G.host >= 0 ? G.teams[G.host].col : '#666';
    ctx.textAlign = 'right';
    ctx.fillText(hostTxt, x0 + L.aw - 14, y0 + 19);

    ctx.textAlign = 'center';
    if (G.phase === 'arena' && G.fight && G.fight.teams) {
      // Show Invited Matchup Preview (any format: sides joined by VS, teams on a side by +)
      const F = G.fight, n = F.nSides || 2;
      ctx.fillStyle = '#111'; ctx.font = '800 12px system-ui, sans-serif';

  function drawBettingOnArena(ctx, L) {
    const F = G.fight, mine = mySide(F);
    const maxB = betLimit(me());
    const n = F.nSides || 2, gap = 12;
    const w = n === 2 ? 276 : n === 3 ? 196 : 146, h = 158;   // fits the 620-wide pit (board layout)
    const totalW = n * w + (n - 1) * gap, x0 = L.ax - totalW / 2;
    const AU = F.auction && !F.auction.done ? F.auction : null;   // with the card auction the robots move up
    const ay0 = L.ay; L = Object.assign({}, L, { ay: AU ? L.ay - L.ah / 2 + 26 + h / 2 : L.ay });
    // format banner
    ctx.fillStyle = '#111'; ctx.font = '900 11px system-ui, sans-serif'; ctx.textAlign = 'center';
    const banner = fightTitle(F).toUpperCase() + (F.house ? ' + HOUSE ROBOT' : '') + (F.format === 'mirror' ? ' — EVERY ROBOT FIGHTS AS 2 COPIES' : F.event && F.event.kind === 'final' ? ' — GRAND FINAL: DOUBLE FAME' : '');
    ctx.fillText(banner, L.ax, L.ay - h / 2 - 8);
    if (F.house) help(L.ax - 160, L.ay - h / 2 - 20, 320, 16, '🏠 House Robot', 'A neutral robot (heavy gun, armour 2) that attacks whoever is closest. If it is the last one standing nobody gets fame and bets are refunded. The bookie counts it in the odds.');
    for (let s = 0; s < n; s++) {
      const ents = F.teams.map((ti, e) => ({ ti, e })).filter(x => F.sides[x.e] === s);
      if (!ents.length) continue;
      const T = G.teams[ents[0].ti], robots = ents.map(x => F.robots[x.e]);
      const bd = F.bands ? F.bands[s] : bandOf(F.p[s]);
      const x = x0 + s * (w + gap), y = L.ay - h / 2 - 1;
      const stake = (PS().bet || [])[s] || 0;

      ctx.fillStyle = '#fcfbf9';

        ctx.fillStyle = '#555'; fitText(ctx, `${r.level ? '★'.repeat(r.level) : 'starter'}  ·  ${buildText(r)}`, x + w / 2, y + 39, w - 16, '600', 10.5);
        { const hl = helpLook(r); help(x + 10, y + 29, w - 20, 14, hl[0], hl[1]); }
      } else {
        ents.forEach((x2, j) => { const r2 = F.robots[x2.e]; ctx.fillStyle = G.teams[x2.ti].col; fitText(ctx, G.teams[x2.ti].name + ': ' + r2.name + ' (' + (r2.level ? '★'.repeat(r2.level) : 'starter') + ')', x + w / 2, y + 18 + j * 15, w - 16, '800', 11.5); });
