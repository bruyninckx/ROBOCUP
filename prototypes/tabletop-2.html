      else nr = mkRobot(drawStarter() || pick(Object.keys(STARTERS)));
      if (t.robots.length >= 3) {   // trade-in (BAL.tradeIn): the AI scraps its weakest robot now; a person picks (PS.tradeIn prompt)
        if (isHuman(ti)) { (PS(ti).tradeIn = PS(ti).tradeIn || []).push({ bot: nr, lot }); return '♻️ Trade-in: pick a robot to scrap'; }
        const old = aiTradeInPick(t);
        return doTradeIn(t, old, nr);
      }
      t.robots.push(nr);
      return `New Bot: ${nr.name}`;
    }
    if (L.tape) { t.hand.push(draw1()); addCr(t, 1, 'lot'); return '+1 Intrigue card, +1 Cr'; }
    if (!r) return '';
    if (!canFit(r, L)) return 'No room on ' + r.name;
    if (L.part) {
      if (LU.PARTS[L.part].kind === 'legendary') r.leg = L.part; else (r.parts = r.parts || []).push(L.part);
    }
    return `Fitted on ${r.name}`;
  }

  function applyMarketWins(A) {
    const live = A.wins.filter(x => !x.botched);   // a botched part went back to the lot deck
    for (const x of live) if (!needsRobot(x.lot)) A.results[x.idx].target = applyLot(x.team, x.lot, null);
    for (const h of humanSeats()) PS(h).install = (PS(h).install || []).concat(live.filter(x => x.team === h && needsRobot(x.lot) && canTake(G.teams[h], x.lot)));
    for (const x of live) {
      if (!needsRobot(x.lot)) continue;
      const T = G.teams[x.team];
      if (isHuman(x.team) && canTake(T, x.lot)) { A.results[x.idx].target = '▼ Click a Robot Bay below'; continue; }
      const pickR = isHuman(x.team) ? null : aiPickRobot(T, x.lot);
      if (pickR) { A.results[x.idx].target = applyLot(x.team, x.lot, pickR); continue; }
      stashParts(T, [x.lot]); A.results[x.idx].target = stashOf(T).includes(x.lot) ? '📦 To the Stash' : '🏦 Stash full: sold';
    }
  }
  function resolveMarket() {
    if (G.marketAuction) return;   // already resolving (rebid or Botched Install window)
    const all = G.teams.map(t => isHuman(t.i) ? (PS(t.i).bids || zeroBids()).slice() : aiBids(t));
    G.teams.forEach((t, i) => { if (t.shill) { all[i] = all[i].map(v => Math.max(0, v - t.shill)); if (all[i].some(v => v)) notify('🏢 Shill Bidder: ' + esc(t.name) + '\'s bids count ' + t.shill + ' lower.', t.col); } });
    all.forEach(b => { b[HOST_K] = 0; });
    G.marketAuction = {
      all, lastK: NLOTS - 1,
      initialAll: all.map(b => b.slice()),
      rebidAdds: G.teams.map(zeroBids),
      curK: 0,
      wins: [],
      results: [],
      tie: null
    };
    stepMarketAuction();
  }

  // a tie with people in it: each tied person sets how much to add on top, then locks it in
  const tieMine = (S = HS) => { const T = G.marketAuction && G.marketAuction.tie; return !!T && T.waitingHuman && (T.waiting || []).includes(S); };
  ACT.rebidAdj = (S, d) => { if (!tieMine(S)) return; const T = G.marketAuction.tie; T.add[S] = Math.max(0, Math.min(T.maxAdd[S] || 0, (T.add[S] || 0) + d)); };
  ACT.rebidLock = S => {
    if (!tieMine(S)) return;
    const T = G.marketAuction.tie; T.waiting = T.waiting.filter(x => x !== S);
    if (!T.waiting.filter(isHuman).length) submitHumanRebid();
  };
  function submitHumanRebid() {
    const A = G.marketAuction;
    if (!A || !A.tie) return;
    const { k, teams, baseBid } = A.tie, addOf = A.tie.add || {};
    const adds = [];
    teams.forEach(ti => {
      const add = isHuman(ti) ? Math.min(addOf[ti] || 0, availForRebid(ti, k)) : aiRebid(G.teams[ti], k, baseBid, availForRebid(ti, k));
      A.all[ti][k] += add;
      A.rebidAdds[ti][k] += add;
      adds.push(add);
    });
    A.tie.lastMaxAdd = Math.max(...adds);
    A.tie.waitingHuman = false;
    stepMarketAuction();
  }

  function finalizeLotResult(k, w, mx, rebidNote) {
    const A = G.marketAuction;
    const col = A.all.map(b => b[k]);
    const initCol = A.initialAll.map(b => b[k]);
    const addCol = A.rebidAdds.map(b => b[k]);
    if (w >= 0 && mx > 0) {
      addCr(G.teams[w], -mx, k === HOST_K ? 'host' : 'market');
    }
    if (k < NLOTS) {
      const lotId = G.market[k], L = LOTS[lotId];
      if (w >= 0) A.wins.push({ idx: k, lot: lotId, team: w, price: mx });
      else if (L.starter) { returnStarter(L.starter); L.bot = null; }   // an unsold robot goes back to its deck
      else if (L.legend && !G.legends.includes(lotId)) G.legends.unshift(lotId);   // an unsold legendary comes back later
      else if (L.crew) G.crewDeck.unshift(L.crew);                                 // unsold crew goes back to the crew deck
      A.results.push({
        idx: k, id: lotId, name: L.name, icon: L.icon, text: L.text,
        winner: w, price: mx, bids: col, initBids: initCol, addBids: addCol,
        rebidNote: rebidNote || '', target: w < 0 ? 'Unclaimed' : ''
      });
    } else {
      G.host = w >= 0 ? w : Math.floor(rnd() * 4);
      const hostT = G.teams[G.host];
      A.results.push({
        idx: HOST_K, id: 'host', name: 'Host the Fight', icon: '👑', text: '+1 Fame & Pick Fighters',
        winner: G.host, price: w >= 0 ? mx : 0, bids: col, initBids: initCol, addBids: addCol,
        rebidNote: rebidNote || '',
        target: w >= 0 ? '+1 Fame' + (hostT.sponsor === 'apex' ? ' & +2 Cr' : '') : 'Random Draw (0 Cr)'
      });
    }
  }

  function stepMarketAuction() {
    const A = G.marketAuction;
    if (!A) return;

    while (A.curK <= A.lastK) {
      const k = A.curK;
      const lotName = k < NLOTS ? LOTS[G.market[k]].name : 'Host the Fight';
      const col = A.all.map(b => b[k]);
      const eligible = A.tie && A.tie.k === k ? A.tie.teams : [0, 1, 2, 3];
      const mx = Math.max(...eligible.map(ti => col[ti]));

      if (mx <= 0 || (k < NLOTS && mx < minBidOf(G.market[k]))) {   // no bids, or below a level 4 lot's lowest winning bid
        if (mx > 0) notify('⭐ <b>' + esc(lotName) + '</b>: top bid ' + mx + ' Cr is below the ' + minBidOf(G.market[k]) + ' Cr minimum. Unsold.', '#7c3aed');
        finalizeLotResult(k, -1, 0, mx > 0 ? 'Below the minimum' : '');
        A.tie = null;
        A.curK++;
        continue;
      }

      const contenders = eligible.filter(ti => col[ti] === mx);
      if (contenders.length === 1) {
        const w = contenders[0];
        const hadRebid = A.tie && A.tie.k === k;
        const note = hadRebid ? `Won Rebid (${A.initialAll[w][k]}+${A.rebidAdds[w][k]} Cr)` : '';
        if (hadRebid) {
          notify(`⚔️ <b>${esc(G.teams[w].name)}</b> won the tie-break rebid on <b>${esc(lotName)}</b> (${mx} Cr total)!`, G.teams[w].col);
        }
        finalizeLotResult(k, w, mx, note);
        A.tie = null;
        A.curK++;
        continue;
      }

      // Tie among 2+ teams at mx > 0!
      // Rulebook (5 Nov): Sovereign Foundry wins any tie it's in outright, without a rebid.
      // Kev, 7 Nov (sponsor check): only Market lot ties, not the host bid (winning host ties made it win 31–41%)
      const sov = A.hostOnly ? null : contenders.find(ti => G.teams[ti].sponsor === 'sovereign');
      if (sov != null) {
        notify(`⚖️ Tie on <b>${esc(lotName)}</b> at ${mx} Cr — <b>${esc(G.teams[sov].name)}</b> wins outright (Sovereign Foundry)!`, G.teams[sov].col);
        finalizeLotResult(k, sov, mx, 'Sovereign wins ties');
        A.tie = null;
        A.curK++;
        continue;
      }
      // If a rebid round just took place and nobody added any credits, the team with less fame wins.
      if (A.tie && A.tie.k === k && A.tie.lastMaxAdd === 0) {
        const sorted = contenders.slice().sort((a, b) => G.teams[a].fame - G.teams[b].fame || tieRank(a) - tieRank(b));
        const w = sorted[0];
        const reason = 'Low-Fame Tiebreak';
        notify(`⚖️ Rebid stalemate on <b>${esc(lotName)}</b> at ${mx} Cr — <b>${esc(G.teams[w].name)}</b> wins (${reason})!`, G.teams[w].col);
        finalizeLotResult(k, w, mx, reason);
        A.tie = null;
        A.curK++;
        continue;
      }

      // Start or continue Spartacus Rebid among tied contenders!
      if (contenders.some(isHuman)) {
        const maxAdd = {}; contenders.filter(isHuman).forEach(ti => { maxAdd[ti] = availForRebid(ti, k); });
        A.tie = {
          k,
          teams: contenders,
          baseBid: mx,
          add: {}, maxAdd,
          waiting: contenders.filter(isHuman),
          waitingHuman: true,
          lastMaxAdd: null
        };
        updateHud();
        return; // Wait for human rebid input
      } else {
        // AI-only tie: resolve secret AI rebids immediately
        const adds = [];
        contenders.forEach(ti => {
          const add = aiRebid(G.teams[ti], k, mx, availForRebid(ti, k));
          A.all[ti][k] += add;
          A.rebidAdds[ti][k] += add;
          adds.push(add);
        });
        A.tie = {
          k,
          teams: contenders,
          baseBid: mx,
          waitingHuman: false,
          lastMaxAdd: Math.max(...adds)
        };
        // Loop continues on same k to evaluate the new rebid totals!
      }
    }

    if (A.hostOnly) {
      const hostT = G.teams[G.host], res = A.results[0];
      const hf = CATCHUP.leaderhost && soleLeader() === hostT ? 0 : HOST_FAME;
      G.fameSrc = 'host'; hostT.fame += hf; G.fameSrc = null; G.hostFameGiven = hf;
      if (hostT.sponsor === 'apex') addCr(hostT, 2, 'sponsor');
      notify('👑 <b>' + esc(hostT.name) + '</b> is Arena Host' + (res && res.price ? ' for ' + res.price + ' Cr' : ' (nobody bid: random draw)') + ' (' + (hf ? '+' + hf + ' Fame' : 'no host fame: fame leader') + (hostT.sponsor === 'apex' ? ', +2 Cr Apex' : '') + ').', hostT.col);
      G.hostCount = (G.hostCounts || [])[G.host] || 1;
      tlog('wager', { host: G.host, count: G.hostCount });
      if (G.hostCount === 2) notify('🤖🤖 ' + nm(hostT) + '\'s robot count: <b>2 per side</b> (if this round is a normal duel). Each invited team sends up to 2 robots.', hostT.col);
      G.marketResults = (G.marketResults || []).filter(r => r.idx !== HOST_K).concat(A.results);
      tlog('host_bid', { host: G.host, price: res ? res.price : 0, bids: res ? res.bids : null });
      G.hostResolved = true; G.marketResolved = true; G.marketAuction = null; G.marketStage = 'done';
      if (checkWin()) return;
      updateHud();
      return;
    }
    // All lots resolved! First a window for Botched Install, then the installs (hosting is bid for afterwards)
    if (!A.sabotageDone) {
      for (const x of A.wins) notify('📦 <b>' + esc(G.teams[x.team].name) + '</b> won ' + lotRef(x.lot) + ' (' + x.price + ' Cr).', G.teams[x.team].col);
      A.sabotageDone = true; G.ivBusy = true; updateHud();
      botchedWindow(A).catch(e => console.error(e)).then(() => { G.ivBusy = false; stepMarketAuction(); });
      return;
    }
    // Bug fix (Kev's playtest, 8 Nov): robots, crew and other lots first, then the parts. The install list used to be made before the
    // lots were applied, so a part won together with a robot (by a team with no robot that fitted it yet) was marked "Click a Robot
    // Bay" but never queued: it could not be fitted and was lost. A part now always ends fitted, queued for a person, or in the Stash.
    applyMarketWins(A);
    G.marketResults = A.results;
    tlog('market', { lots: A.results.map(r => ({ id: r.id, winner: r.winner, price: r.price, bids: r.bids, target: r.target })) });
    G.marketResolved = true;
    G.marketAuction = null;
    if (checkWin()) return;
    updateHud();
  }

  /* ---------- Botched Install (Kev, 6 Nov): stopping a rival's upgrade is a scheme, not a dead bid ----------
   * After the lots are won and before anything is fitted, every team holding Botched Install may play it on a
   * rival's part. Normal defence: the target's Security Bots roll 4-6, then the reaction window. If it lands, the
   * part is scrapped (bottom of the lot deck), the winner gets half its bid back and the saboteur 1 Cr. */
  function partThreat(ti, lot) {   // best band jump the part gives one of the winner's robots, or null while the bookie works
    const T = G.teams[ti];
    let best = null;
    for (const r of T.robots) {
      const nb = lotBuild(r, LOTS[lot]); if (!nb) continue;
      const a = fieldOdds(ti, r).p, b = fieldOdds(ti, nb).p;
      const jump = BANDS.indexOf(bandOf(a)) - BANDS.indexOf(bandOf(b));
      if (!best || jump > best.jump || (jump === best.jump && b - a > best.d)) best = { r, a, b, jump, d: b - a };
    }
    return best;
  }
  async function botchedWindow(A) {
    const parts = A.wins.filter(x => needsRobot(x.lot) && canTake(G.teams[x.team], x.lot));
    for (const x of parts) {
      const W = G.teams[x.team], th = partThreat(x.team, x.lot);
      const thTxt = th ? esc(th.r.name) + ': ' + shiftTxt(th.a, th.b) : '';
      for (const oi of seatOrder()) {
        const o = G.teams[oi];
        if (o === W || !o.hand.includes('botched_install') || o.fame < (CARDS.botched_install.need || 0)) continue;
        let yes = isHuman(oi)
          ? await askSeat(oi, '🔧 Botched Install?', nm(W) + ' won ' + lotRef(x.lot) + ' for ' + x.price + ' Cr.' + (thTxt ? '<br>🎩 Best fit: <b>' + thTxt + '</b>' : '') + '<br>Play ' + cardRef('botched_install') + ': the install fails and the part is scrapped (they get ' + Math.floor(x.price / 2) + ' Cr back, you take 1 Cr). Or threaten it and ask for a payoff.',
              [{ label: '🔧 Botch it', value: () => true }, { label: '💰 Demand a payoff', value: () => 'pay' }, { label: 'Let it go', secondary: true, value: () => false }])
          : (th && th.jump >= 1) || (W === leaderOf() && x.price >= 3 && rnd() < 0.6) || (!th && x.price >= 4 && rnd() < 0.5);
        if (!yes) continue;
        // a threat first: pay off the holder and the card stays in its hand
        const demand = Math.ceil(x.price / 2) + 1;
        if (yes === 'pay') {
          const d = await dealPanel({ title: '💰 Payoff from ' + esc(W.name), intro: 'What do you want from ' + nm(W) + ' to leave its ' + lotRef(x.lot) + ' alone?', from: W, give: false, want: true, lock: 'Lock in demand' });
          const ask = d && d.want;
          if (ask && !bundleEmpty(ask) && bundleWorth(W, ask) <= partWorth(W, x.lot) + 1) { transfer(W, o, ask, 'deal'); notify('💰 ' + nm(W) + ' pays you ' + bundleText(ask) + ' to keep its ' + lotRef(x.lot) + ' safe.', W.col); break; }
          if (ask && !bundleEmpty(ask)) notify('✋ ' + nm(W) + ' refuses to pay ' + bundleText(ask) + '.', W.col);
          yes = await askSeat(oi, '🔧 Botch it now?', nm(W) + ' didn\'t pay. Play ' + cardRef('botched_install') + ' on its ' + lotRef(x.lot) + '?', [{ label: '🔧 Botch it', value: () => true }, { label: 'Let it go', secondary: true, value: () => false }]);
          if (!yes) continue;
        } else if (!isHuman(oi)) {
          if (isHuman(W.i)) {
            const pay = await askSeat(W.i, '💰 A threat', nm(o) + ' says it will wreck your ' + lotRef(x.lot) + ' (' + cardRef('botched_install') + ') unless you pay <b>' + demand + ' Cr</b>.', [{ label: 'Pay ' + demand + ' Cr', value: () => 'pay' }, { label: '🤝 Offer something else', value: () => 'deal' }, { label: 'Refuse', secondary: true, value: () => null }]);
            if (pay === 'pay' && W.credits >= demand) { transfer(W, o, { cr: demand, items: [] }, 'deal'); notify('💰 ' + nm(W) + ' pays ' + nm(o) + ' ' + demand + ' Cr to keep your ' + lotRef(x.lot) + '.', W.col); break; }
            if (pay === 'deal') {
              const d = await dealPanel({ title: '🤝 Buy off ' + esc(o.name), intro: 'It wants about ' + demand + ' Cr.', from: o, lock: 'Lock in offer' });
              if (d && bundleWorth(o, d.give) >= demand - 1) { transfer(W, o, d.give, 'deal'); notify('💰 ' + nm(o) + ' takes ' + bundleText(d.give) + ' and leaves your ' + lotRef(x.lot) + ' alone.', o.col); break; }
              notify('✋ ' + nm(o) + ' isn\'t bought off.', o.col);
            }
          } else if (W.credits >= demand + 1 && partWorth(W, x.lot) >= demand && rnd() < 0.5) {
            transfer(W, o, { cr: demand, items: [] }, 'deal'); notify('💰 ' + nm(W) + ' pays ' + nm(o) + ' ' + demand + ' Cr to keep its ' + lotRef(x.lot) + ' safe.', W.col); break;
          }
        }
        { const ph = playHead(o, 'botched_install', W); logBegin(ph[0], o.col, ph[1], ph[2]); }
        await playFx(o, 'botched_install', W);
        notify('target: ' + lotRef(x.lot) + (thTxt ? ' (' + thTxt + ')' : ''));
        removeFromHand(o, 'botched_install');
        const d = await defend(o, CARDS.botched_install, W);
        discardCard('botched_install');
        if (!d.blocked) {
          x.botched = true;
          const back = Math.floor(x.price / 2); addCr(W, back, 'card'); addCr(o, 1, 'card');
          if (LOTS[x.lot] && LOTS[x.lot].legend) { if (!G.legends.includes(x.lot)) G.legends.unshift(x.lot); } else G.lots.unshift(x.lot);
          A.results[x.idx].target = '🔧 Botched: scrapped';
          notify('🔧 The install fails: ' + lotRef(x.lot) + ' is scrapped. ' + nm(W) + ' gets ' + back + ' Cr back, ' + nm(o) + ' takes 1 Cr.', o.col);
        }
        logEnd(d.blocked ? 'blocked' : 'landed');
        updateHud();
        break;   // one Botched Install per part
      }
    }
    A.wins = A.wins.filter(x => !x.botched);
  }

  /* ---------- Phase 4: Host step, then invites ----------
   * Kev, 6 Nov: Arena cards. The fight has a format: 'duel' (host invites 2), 'mirror' (duel, every robot fights as
   * 2 copies), 'ffa' (Grand Melee: every team with a ready robot), '2v2' (Grand Final / Tag Team Licence). The House
   * Robot can join any format. A fight has entrants (one team + robot each) on sides: F.teams[e], F.robots[e],
   * F.sides[e]; bets, odds and the winner are per side. */
  const HOUSE_NAME = 'Big Mallet';   // 2.0 House Robot (Kev, 8 Nov): a huge neutral robot with a giant overhead mallet (engine preset, house colours)
  const HOUSE_COL = '#D9A520';
  const HOUSE_ODDS = 0.8;   // the House Robot makes a fight a little less predictable: the bookie shrinks the strength gaps (tools/damage-lab/house.js: the favourite wins 3-4 points less often)
  const FORMAT_NAME = { duel: 'Duel', mirror: 'Mirror duel', ffa: 'Free-for-all', '2v2': '2v2', double: 'Double duel (2 per side)' };
  // Robot-count wager (Kev, 6 Nov): with the host bid you name 1 or 2 robots per side; the winning host's count is used.
  // 2 costs the host 1 Cr; each invited team sends up to 2; if the fight ends up uneven (2 vs 1) the host loses its host fame.
  const WAGER_COST = 1;
  // AI robot count (Kev, 6 Nov: "improve AI play"): 2 per side only when the host has 2 fit robots and another team does too
  // (an uneven 2 vs 1 costs the host its fame), and not every time
  const fitRobots = T => readyRobots(T).filter(r => !wrecked(r));
  function aiHostCount(t) { return fitRobots(t).length >= 2 && G.teams.some(x => x !== t && fitRobots(x).length >= 2) && rnd() < 0.6 ? 2 : 1; }
  // the AI's guess of robot a beating robot b: the bookie's number if it has one, else a rough power comparison
  const aiEdge = (ra, rb) => Math.max(0.02, Math.min(0.98, duelP(ra, rb)));   // 2.0: strength already counts damage
  // what the face-down cards a team put on this robot itself do to its odds (it knows them; others' cards stay hidden)
  const knownSwing = (r, ti) => ti == null ? 0 : (r.faceDown || []).filter(x => x.from === ti).reduce((a, x) => a + (CARDS[x.id] && CARDS[x.id].name === 'Secret Upgrade' ? CARD_SWING.up : 0), 0);
  const bestVs = (T, foes, ti) => readyRobots(T).map(r => ({ r, p: (foes.length ? foes.reduce((a, f) => a + aiEdge(r, f), 0) / foes.length : 0.5) + knownSwing(r, ti) })).sort((x, y) => y.p - x.p)[0];
  const sideTeams = (F, sd) => F.teams.filter((_, e) => F.sides[e] === sd);
  const sideName = (F, sd) => sd === 'house' || sd === 9 ? 'House Robot' : sideTeams(F, sd).map(ti => G.teams[ti].name).join(' + ');
  const sideRobots = (F, sd) => F.robots.filter((r, e) => F.sides[e] === sd && r);
  const sideLabel = (F, sd) => sideRobots(F, sd).map(r => r.name).join(' + ');
  const mySide = F => { const e = F.teams.indexOf(viewerSeat); return e >= 0 ? F.sides[e] : -1; };
  const fightTitle = F => (F.house ? '🏠 ' : '') + (FORMAT_NAME[F.format] || 'Duel') + (F.arena && F.arena !== 'open' && ARENA_INFO[F.arena] ? ' · ' + ARENA_INFO[F.arena].icon + ' ' + ARENA_INFO[F.arena].name : '');

  async function startArena() {
    G.phase = 'arena';
    G.chooseMyBot = false;
    G.fight = null;
    setCameraGoal('compound');
    // the format this round: from an Intrigue event (Grand Final / Tag Team), then the Host step may change it
    G.arenaEvent = G.nextEvent || null;
    G.houseRobot = !!window.__testHouse;   // test hook: the House Robot joins every fight
    G.hostStep = true; updateHud();
    await hostStep();
    G.hostStep = false;
    const ev = G.arenaEvent, H = G.host;
    if (ev && ev.kind === 'ffa') return invite(G.teams.map(t => t.i), G.teams.map((_, i) => i), 'ffa');
    if (ev && (ev.kind === 'final' || ev.kind === 'tag')) {
      let a = ev.kind === 'final' ? G.teams.slice().sort((x, y) => y.fame - x.fame || tieRank(x) - tieRank(y)).slice(0, 2).map(t => t.i) : ev.teams.slice();
      const b = G.teams.map(t => t.i).filter(i => !a.includes(i));
      return invite(a.concat(b), [0, 0, 1, 1], '2v2');
    }
    let fmt = ev && ev.kind === 'mirror' ? 'mirror' : 'duel';
    if (fmt === 'duel' && G.hostCount === 2) {   // the host called 2 per side: pays 1 Cr (if it can)

    }

      // AI teams may offer you a deal to be invited, or to be left out
      G.inviteOffers = [];
      for (const T of G.teams) {
        if (T.i === H || isHuman(T.i) || !readyRobots(T).length) continue;
        const r = readyRobots(T).sort((x, y) => power(y) - power(x))[0], p = fieldOdds(T.i, r).p;
        const want = wrecked(r) || p <= 0.3 ? 'out' : p >= 0.55 ? 'in' : null;
        if (want && rnd() < 0.55) { const B = aiBundle(T, G.teams[H], 1 + (rnd() < 0.4 ? 1 : 0)); if (!bundleEmpty(B)) G.inviteOffers.push({ team: T.i, want, B }); }

  // Host step: the host may play Mirror or Unleash the House Robot, anyone may play Grand Melee (host first, then clockwise)
  async function hostStep() {
    const H = G.host;

        const opts = ['grand_melee', 'mirror', 'unleash_the_house_robot'].filter(id => usable(t, id) && !active[id]);   // nothing that is already in force
        if (!opts.length) break;
        let id = null;

        } else {

          id = opts.find(o => rnd() < want[o]) || null;
        }
        if (!id) break;

        await playFx(t, id, null);
        removeFromHand(t, id); discardCard(id);
        if (id === 'grand_melee') { G.arenaEvent = { kind: 'ffa', by: ti, card: id }; notify('⚔️ Grand Melee: this round is a free-for-all for every team with a ready robot. The host gets +1 fame when it happens.'); }
        if (id === 'mirror') { G.arenaEvent = { kind: 'mirror', by: ti, card: id }; notify('🪞 Mirror: each invited robot fights as 2 copies; afterwards it keeps the damage of its healthiest copy.'); }
        if (id === 'unleash_the_house_robot') { G.houseRobot = true; notify('🏠 Big Mallet, the House Robot, joins this fight. It rarely lands a hit, but when it does it hurts.'); }

  // Spare or scrap, with deals (Kev, 6 Nov): the loser's team pleads, rivals push to scrap; the host takes the offers of the side it picks

  // the damage chart: x = fight time, y = damage taken (0–100), a line per robot in its team colour; grey bars = all the
  // damage dealt in each 5 s, so you see where the fight was decided; ticks = cards played
  function drawDamageChart(ctx, D, rec, x, y, w, h) {
    paperBox(ctx, x, y, w, h, INK, 2, PAPER2);
    const pl = x + 40, pr = x + w - 150, pt = y + 24, pb = y + h - 20, T = Math.max(10, D.t[D.t.length - 1]);
    const X = t => pl + (pr - pl) * t / T, Y = d => pb - (pb - pt) * d / 100;
    ctx.fillStyle = MUTED; ctx.textAlign = 'left'; fitText(ctx, 'DAMAGE OVER THE FIGHT', x + 10, y + 15, 260, '700', 10, F_MONO);
    help(x, y, w, h, 'Damage over the fight', 'Each line is a robot\'s damage (its health bar from the fight screen, upside down), over the fight time. The grey bars are all the damage done in each 5 seconds: tall bars = where the fight was decided. Ticks at the bottom: cards played.');
    // grid and axes
    ctx.strokeStyle = LINE; ctx.lineWidth = 1;
    for (const d of [0, 50, 100]) { ctx.beginPath(); ctx.moveTo(pl, Y(d)); ctx.lineTo(pr, Y(d)); ctx.stroke(); ctx.fillStyle = MUTED; ctx.textAlign = 'right'; fitText(ctx, d + '%', pl - 4, Y(d) + 3, 34, '600', 8.5, F_MONO); }
    ctx.textAlign = 'center'; for (let t = 0; t <= T; t += T > 90 ? 30 : 15) { ctx.fillStyle = MUTED; fitText(ctx, t + 's', X(t), pb + 12, 30, '600', 8.5, F_MONO); }
    // 5 s buckets of all damage dealt
    const B = [], step = 5; let maxB = 1;
    for (let i = 1; i < D.t.length; i++) { const k = Math.floor(D.t[i - 1] / step), inc = D.d[i].reduce((a, v, j) => a + Math.max(0, v - D.d[i - 1][j]), 0); B[k] = (B[k] || 0) + inc; }
    B.forEach(v => { maxB = Math.max(maxB, v || 0); });
    ctx.fillStyle = 'rgba(110,100,87,0.22)';
    B.forEach((v, k) => { if (!v) return; const bh = (pb - pt) * 0.9 * v / maxB, x0 = X(k * step) + 1, x1 = X(Math.min(T, (k + 1) * step)) - 1; ctx.fillRect(x0, pb - bh, Math.max(1, x1 - x0), bh); });

    ctx.strokeStyle = '#2F6DB5'; ctx.lineWidth = 2;

      ctx.fillStyle = INK; ctx.textAlign = 'left'; fitText(ctx, wh.name + ' ' + last + '%', pr + 28, ly - 2, x + w - pr - 36, '600', 10);
    });
  }

  function drawTargetingArrow(ctx, x1, y1, x2, y2, col) {

  /* ---------- Pointer & Card Drop Interactions ---------- */
  window.addEventListener('pointermove', e => {
    mouse.sx = e.clientX; mouse.sy = e.clientY;

    const hEl = e.target && e.target.closest ? e.target.closest('[data-help]') : null;
    mouse.htmlHelp = hEl ? hEl.dataset.help : null;
    const w = screenToWorld(e.clientX, e.clientY);
    mouse.wx = w.x; mouse.wy = w.y;

    // Spatial hysteresis for Hand Tray open/close so it never jitters at hover boundaries
    const stage = $('#handStage');
    if (stage) {
      const sr = stage.getBoundingClientRect(), half = sr.width / 2;   // the drawer sits under your rail (layout B)
      const distCenter = Math.abs(e.clientX - (sr.left + half));
      const fromBottom = window.innerHeight - e.clientY;
      if (stage.classList.contains('open')) {
        if (!dragCard && (fromBottom > 255 || distCenter > half + 20)) {
          stage.classList.remove('open');

      } else if (fromBottom <= 62 && distCenter <= half - 20) {
        stage.classList.add('open');
      }
    }

    if (dragCard) {
      dragCard.curX = e.clientX;
      dragCard.curY = e.clientY;
      const dx = e.clientX - dragCard.startX, dy = e.clientY - dragCard.startY;

  const ROBOT_PICK = new Set(['Secret Upgrade', 'Overclock', 'We Have Your Number']);
  function tryPlayDraggedCard(dc, wx, wy) {
    const c = dc.card, t = me();

      const gHit = hitRegions.find(r => r.kind === 'garage' && wx >= r.x && wx <= r.x + r.w && wy >= r.y && wy <= r.y + r.h);
      if ((c.target === 'rival' || c.target === 'any' || c.phase === 'security') && !gHit) return false;
      // dropped on one robot: Secret Upgrade / Overclock go on that robot of yours, a bounty on that rival robot (Kev, 9 Nov)

          act('install', bot.id);
        } else if (G.phase === 'arena' && PS().choose) {
          if (bot.exhausted) { notify('😴 <b>' + esc(bot.name) + '</b> is exhausted and can\'t fight this round.', '#b45309'); return; }
          act('sendBot', bot.id);
        } else continue;   // e.g. the host picking teams: a click on one of your robots picks your whole team (the rail below it)
        return;
      }

      if (r.kind === 'market_continue') { act('continueMarket'); return; }
      if (r.kind === 'rebid_minus') { act('rebidAdj', -1); return; }
      if (r.kind === 'rebid_plus') { act('rebidAdj', 1); return; }
      if (r.kind === 'rebid_submit') { act('rebidLock'); return; }
      if (r.kind === 'market_minus') { act('bid', r.idx, 'minus'); return; }
      if (r.kind === 'market_plus' || r.kind === 'market_tile') { act('bid', r.idx, r.kind === 'market_tile' ? 'tile' : 'plus'); return; }

      if (r.kind === 'garage' && G.phase === 'arena' && G.host === HS && !G.chooseMyBot && !G.hostStep && !G.fight && G.pickTeams) { act('pickTeam', r.team); return; }
      if (r.kind === 'bet_card') { act('bet', r.side); return; }
      if (r.kind === 'card_bid') { act('cardBid', r.k, r.d); return; }


      if (r.kind === 'crate_pick') { act('crate', r.lot); return; }
    }
  });

  function spawnWeldSparks(wx, wy) {
    for (let k = 0; k < 18; k++) {
      const a = rnd() * Math.PI * 2, sp = 40 + rnd() * 90;
      weldSparks.push({ x: wx, y: wy, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 0.35 + rnd() * 0.25 });
    }
  }

  /* ---------- Main 60 FPS Loop ---------- */
  let lastT = performance.now(), accT = 0, finishWait = 0;
  function loop(now) {
    requestAnimationFrame(loop);
    const dt = Math.min(0.1, (now - lastT) / 1000);
    lastT = now;
    update(dt);
    if (window.__noRender && G && G.fast) return;   // AI-only test games: no drawing (2× faster)
    renderWorld(now);
    updateHelp(now);
  }
  // Kev, 7 Nov (online test): a browser stops drawing a tab that isn't on screen, and the fight stopped with it
  // (the host's fight runs everyone's game). A timer keeps the game going in a background tab.
  setInterval(() => { const now = performance.now(); if (now - lastT > 300) { const dt = Math.min(2, (now - lastT) / 1000); lastT = now; update(dt); } }, 250);
  function update(dt) {
    if (G && !G.over && (G.phase === 'upkeep' || G.phase === 'market')) renderStash();
    if (G && G.phase === 'fight' && G.fight && G.fight.S) {
      const F = G.fight;
      // online host in a background tab: the browser stops the fight view's frames, so step the fight here (everyone waits on it)
      if (NETROLE === 'host' && document.hidden && !F.viewDone && !headless()) {
        const S = F.S; let n = Math.min(240, Math.round(dt * 120));
        while (n-- > 0 && !S.over) { DL.step(S); fightStep(F, S); S.fx.length = 0; }
        if (S.over && S.t > S.result.t + 2) { F.viewDone = true; VW.close(); }
      }
      if (F.S.over && F.viewDone && !isClient()) aftermath();
    }
  }

  /* ---------- Top Pill & Hand Controls ---------- */
  $('#seatSel').onchange = e => {
    viewerSeat = +e.target.value; if (HS >= 0) HS = viewerSeat;
    updateHud();
  };
  $('#handTab').addEventListener('pointerenter', () => {
    $('#handStage').classList.add('open');
  });
  // Kev, 6 Nov: "keep open" toggle (remembered) and a toggle that moves the hand under your middle, right or left bay
  const setPin = on => {
    const tray = $('#handTray'); tray.classList.toggle('pinned', on);
    $('#handPin').classList.toggle('on', on); $('#handPin').textContent = on ? '📌 kept open' : '📌 keep open';
    $('#handTab').title = on ? 'Hand kept open (click to collapse)' : 'Click to keep the hand open';
    try { localStorage.setItem('robocus2.handPinned', on ? '1' : '0'); } catch (e) {}
  };
  $('#handTab').onclick = e => { e.stopPropagation(); setPin(!$('#handTray').classList.contains('pinned')); };
  $('#handPin').onclick = e => { e.stopPropagation(); setPin(!$('#handTray').classList.contains('pinned')); };
  const SIDES = ['middle', 'right', 'left'];
  const setSide = k => { handSide = k; $('#handSide').textContent = '⇆ ' + k; $('#handSide').classList.toggle('on', k !== 'middle'); try { localStorage.setItem('robocus2.handSide', k); } catch (e) {} };
  $('#handSide').onclick = e => { e.stopPropagation(); setSide(SIDES[(SIDES.indexOf(handSide) + 1) % 3]); };
  try { if (localStorage.getItem('robocus2.handPinned') === '1') setPin(true); const sd = localStorage.getItem('robocus2.handSide'); if (SIDES.includes(sd)) setSide(sd); } catch (e) {}
  window.addEventListener('resize', () => {
    if (!cam.manualZoom) {
      setCameraGoal(G?.phase === 'fight' ? 'arena' : 'compound');
    }
  });
  // Kev, 6 Nov: the 🔍 View and ⚡ Instant Fight buttons are gone from the top bar (handlers kept, guarded)
  if ($('#camToggleBtn')) $('#camToggleBtn').onclick = () => {
    cam.manualZoom = !cam.manualZoom;
    if (cam.manualZoom) {
      const zoomedIn = cam.tzoom > 0.85;
      cam.tx = 0; cam.ty = zoomedIn ? 72 : 0; cam.tzoom = zoomedIn ? getCompoundZoom() : getArenaZoom();
    } else {
      setCameraGoal(G.phase === 'fight' ? 'arena' : 'compound');
    }
  };
  // action log controls: collapse (remembered per browser), "new" jump button, out of the way while dragging a card
  (() => {
    const lp = $('#logPanel'), body = $('#ticker'), nb = $('#lpNew'), tg = $('#lpToggle');
    let col = window.innerWidth < 1250;
    try { const v = localStorage.getItem('robocus2.logCollapsed'); if (v != null) col = v === '1'; } catch (e) {}
    const apply = () => { lp.classList.toggle('collapsed', col); LOGC.unread = 0; tg.textContent = col ? '▸ show' : '–'; if (G) setCameraGoal(G.phase === 'fight' ? 'arena' : 'compound'); };
    tg.onclick = () => { col = !col; try { localStorage.setItem('robocus2.logCollapsed', col ? '1' : '0'); } catch (e) {} apply(); if (!col) body.scrollTop = body.scrollHeight; };
    body.addEventListener('scroll', () => { if (logAtBottom()) nb.hidden = true; });
    nb.onclick = () => { body.scrollTop = body.scrollHeight; nb.hidden = true; };
    apply();
    setInterval(() => lp.classList.toggle('dragging', !!dragCard), 150);
  })();
  $('#ptBtn').onclick = ptMenu;
  ptRestoreDir();
  VW.mount(document.getElementById('fightView'));
  applyBal();
  newGame();
  requestAnimationFrame(loop);
})();
</script>
