      ctx.strokeRect(x + 12, y + 48, w - 24, 58);

      const exactStr = scouted() ? ` (${Math.round(F.p[s] * 100)}%)` : '';
      fitText(ctx, `${bd.name.toUpperCase()}  ·  Pays ${payFor(me(), F, s)}×${me().sponsor === 'lucky' ? ' (Lucky)' : ''}${exactStr}`, x + w / 2, y + 69, w - 32, '900', 14);
      drawBar(ctx, x + 24, y + 79, w - 48, 8, F.p[s], T.col, '#e2dfd7', 4);

      // tags: for a one-robot side vs a one-robot foe, this matchup; else vs the field

      ctx.textAlign = 'center'; ctx.fillStyle = '#333';

      hitRegions.push({ kind: 'card_bid', k, d: -1, x: x + 8, y: by, w: bw, h: bh });

  function drawAftermathOnArena(ctx, L) {
    const F = G.fight, rec = F && F.recap;
    if (!rec) return;

    const w = 596, h = 194;
    const x = L.ax - w / 2, y = L.ay - h / 2;
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(x, y, w, h);

    // 2-Column Aftermath Overview: Left = Fight Recap & Log, Right = Bookie Bets & Match Payouts
    const splitX = x + 312;

    // --- Left Column: Fight Recap ---
    ctx.fillStyle = '#111'; ctx.font = '900 13.5px system-ui, sans-serif'; ctx.textAlign = 'left';
    fitText(ctx, 'FIGHT RECAP: ' + rec.headline, x + 12, y + 20, splitX - x - 24, '900', 13.5);
    help(x + 8, y + 6, splitX - x - 16, 20, 'Fight recap', esc(rec.headline) + (rec.turning ? '<br>⭐ Turning point at ' + rec.turning.t + ' s' + (rec.turning.line ? ': ' + esc(rec.turning.line.text) : '') + '.' : ''));
    if (rec.upset) {
      ctx.fillStyle = '#d99000'; ctx.font = '800 10px system-ui, sans-serif';
      ctx.fillText(rec.upset, x + 12, y + 35);
    } else {
      ctx.fillStyle = '#666'; ctx.font = '600 10px system-ui, sans-serif';
      const sumTxt = Array.isArray(rec.summary) ? rec.summary.join('  ') : (rec.summary || '');
      fitText(ctx, sumTxt, x + 12, y + 35, splitX - x - 24, '600', 10);
      help(x + 8, y + 26, splitX - x - 16, 13, 'What each robot lost', esc(sumTxt) + '<br>Damage stays on the robots until it is repaired in Upkeep.');
    }

    ctx.strokeStyle = '#e5e1d7'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(x + 12, y + 43); ctx.lineTo(splitX - 10, y + 43); ctx.stroke();

    const lines = rec.lines || [];
    if (!lines.length) {
      ctx.fillStyle = '#777'; ctx.font = '600 10.5px system-ui, sans-serif';
      ctx.fillText('Clean fight: nothing big happened.', x + 12, y + 66);
    } else {
      // the 6 most important moments (KOs, cards played, breaks first), shown in time order
      const show = lines.slice().sort((a, b) => (b.pri - a.pri) || (a.t - b.t)).slice(0, 6).sort((a, b) => a.t - b.t);
      show.forEach((it, idx) => {
        const rowY = y + 60 + idx * 19;
        ctx.fillStyle = '#777'; ctx.font = '700 10px system-ui, sans-serif'; ctx.textAlign = 'left';
        ctx.fillText(it.t.toFixed(1) + 's', x + 12, rowY);
        ctx.fillStyle = it.k === 'break' || it.k === 'ko' ? '#d62828' : it.k === 'card' ? '#1f6feb' : it.k === 'event' ? '#777' : '#111';
        fitText(ctx, (it.turn ? '⭐ ' : '') + it.text, x + 46, rowY, splitX - x - 58, it.k === 'card' || it.turn ? '800' : '700', 10);
        help(x + 8, rowY - 12, splitX - x - 16, 17, it.t.toFixed(1) + ' s' + (it.turn ? ' · ⭐ turning point' : ''), esc(it.detail || it.text) + (it.turn ? '<br>Around here the winner took the health lead for good.' : ''));
      });
    }

    // Vertical Divider
    ctx.strokeStyle = '#dedad0'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(splitX, y + 8); ctx.lineTo(splitX, y + h - 8); ctx.stroke();

    // --- Right Column: Bookie Bets & Match Rewards Overview ---
    const rx = splitX + 12, rw = x + w - rx - 10;
    ctx.fillStyle = '#111'; ctx.font = '900 11.5px system-ui, sans-serif'; ctx.textAlign = 'left';
    ctx.fillText('BOOKIE BETS & PAYOUTS OVERVIEW', rx, y + 20);
    ctx.fillStyle = '#666'; ctx.font = '600 9.5px system-ui, sans-serif';
    ctx.fillText('Who bet on what & how much they won/lost', rx, y + 34);

    ctx.strokeStyle = '#e5e1d7'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(rx, y + 43); ctx.lineTo(rx + rw, y + 43); ctx.stroke();

    G.teams.forEach((tm, ti) => {
      const rowY = y + 60 + ti * 23;
      const bObj = (F.bets || []).find(b => b.team === ti);
      ctx.fillStyle = tm.col; ctx.font = '800 10.5px system-ui, sans-serif'; ctx.textAlign = 'left';
      ctx.fillText(tm.name + (ti === HS ? ' (You)' : ''), rx, rowY);

      if (!bObj) {
        ctx.fillStyle = '#999'; ctx.font = '600 10px system-ui, sans-serif'; ctx.textAlign = 'right';
        ctx.fillText('No Bet (0 Cr)', rx + rw, rowY);
      } else {
        const botName = F.sides ? sideLabel(F, bObj.side) : (F.robots[bObj.side]?.name || 'Bot');
        const mult = F.pay ? F.pay[bObj.side] : 1;
        const won = F.winSide === bObj.side;
        const draw = F.winSide === -1 || F.winSide === 'house';
        const pay = draw ? bObj.amt : (bObj.payout || 0);
        const net = pay - bObj.amt;

        ctx.fillStyle = '#444'; ctx.font = '600 9.5px system-ui, sans-serif'; ctx.textAlign = 'left';
        ctx.fillText(`${bObj.amt} Cr on ${botName} (${mult}×)`, rx, rowY + 11);

        ctx.textAlign = 'right';
        ctx.font = '800 10px system-ui, sans-serif';
        if (draw) {
          ctx.fillStyle = '#666';
          ctx.fillText(`Refund ${bObj.amt} Cr`, rx + rw, rowY + 5);
        } else if (won) {
          ctx.fillStyle = '#15803d';
          ctx.fillText(`Won ${pay} Cr (+${net})`, rx + rw, rowY + 5);
        } else {
          ctx.fillStyle = '#d62828';
          ctx.fillText(pay > 0 ? `Lucky +1 Cr (Net ${net})` : `Lost −${bObj.amt} Cr`, rx + rw, rowY + 5);
        }
      }
    });

    // Match Prize & Crate Summary Box at bottom-right
    if (F.winner && F.loser) {
      const bx = rx, by = y + 148, bw = rw, bh = 38;
      ctx.fillStyle = '#f6f4ee'; ctx.fillRect(bx, by, bw, bh);
      ctx.strokeStyle = '#d5d1c7'; ctx.lineWidth = 1; ctx.strokeRect(bx, by, bw, bh);
      const wT = G.teams[F.winner.team], lT = G.teams[F.loser.team];
      const fp = F.event && F.event.kind === 'final' ? 2 : 1, wNames = (F.winners || [F.winner]).map(x => G.teams[x.team].name).join(' + ');
      const wLine = `🏆 ${wNames}: +${fp} Fame${(F.winners || []).length > 1 ? ' each' : ''} · ${F.winnerCrateText || ''}`, lLine = (F.winners || []).length > 1 || F.nSides > 2 ? `🔧 ${F.loserCrateText || 'Scrap Crate'}` : `🔧 ${lT.name}: ${F.loserCrateText || 'Scrap Crate'}`;
      ctx.fillStyle = wT.col; ctx.textAlign = 'left'; fitText(ctx, wLine, bx + 6, by + 14, bw - 12, '800', 10);
      ctx.fillStyle = lT.col; fitText(ctx, lLine, bx + 6, by + 29, bw - 12, '700', 10);
      help(bx, by, bw, bh, 'Prizes', esc(wLine) + '<br>' + esc(lLine));
    }
  }

  // 2.0: the fight runs on its own full screen (src2/view.js); the board's pit just says so
  function battleFrame(L) { const k = Math.min(L.aw / ARENA_W, L.ah / ARENA_H); return { k, x0: L.ax - ARENA_W * k / 2, y0: L.ay - ARENA_H * k / 2 }; }
  function drawLiveBattleInArena(ctx, now, L) {
    const F = G.fight, S = F.S, x0 = L.ax - L.aw / 2, y0 = L.ay - L.ah / 2;
    ctx.fillStyle = '#211C17'; ctx.fillRect(x0 + 2, y0 + 2, L.aw - 4, L.ah - 4);
    ctx.textAlign = 'center';
    ctx.fillStyle = '#E8C547'; fitText(ctx, '⚔️ FIGHT ON SCREEN', L.ax, L.ay - 26, L.aw - 40, '900', 24);
    ctx.fillStyle = '#EDE6D9'; fitText(ctx, fightTitle(F) + ': ' + Array.from({ length: F.nSides }, (_, sd) => sideLabel(F, sd)).join('  vs  ') + (F.house ? '  + House Robot' : ''), L.ax, L.ay + 4, L.aw - 40, '800', 14);
    ctx.fillStyle = '#B8AE9E'; fitText(ctx, S && S.over ? S.result.text : S ? 'Fight time ' + Math.max(0, Math.floor(S.t)) + ' s' : '', L.ax, L.ay + 28, L.aw - 40, '700', 12);
  }

  function drawTargetingArrow(ctx, x1, y1, x2, y2, col) {
    ctx.save();
    const cx = (x1 + x2) / 2, cy = Math.min(y1, y2) - 90;
    ctx.strokeStyle = col;
    ctx.lineWidth = 4;
    ctx.setLineDash([10, 6]);
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.quadraticCurveTo(cx, cy, x2, y2);
    ctx.stroke();
    ctx.setLineDash([]);

    ctx.beginPath();
    ctx.arc(x2, y2, 16, 0, Math.PI * 2);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(x2, y2, 4, 0, Math.PI * 2);
    ctx.fillStyle = col;
    ctx.fill();
    ctx.restore();
  }

  /* ---------- Pointer & Card Drop Interactions ---------- */
  window.addEventListener('pointermove', e => {
    mouse.sx = e.clientX; mouse.sy = e.clientY;
    mouse.overCanvas = e.target && e.target.id === 'worldCv';
    const hEl = e.target && e.target.closest ? e.target.closest('[data-help]') : null;
    mouse.htmlHelp = hEl ? hEl.dataset.help : null;
    const w = screenToWorld(e.clientX, e.clientY);
    mouse.wx = w.x; mouse.wy = w.y;

    // Spatial hysteresis for Hand Tray open/close so it never jitters at hover boundaries
    const stage = $('#handStage');
    if (stage) {
      const distCenter = Math.abs(e.clientX - window.innerWidth / 2);
      const fromBottom = window.innerHeight - e.clientY;
      if (stage.classList.contains('open')) {
        if (!dragCard && (fromBottom > 245 || distCenter > 365)) {
          stage.classList.remove('open');
        }
      } else if (fromBottom <= 62 && distCenter <= 300) {
        stage.classList.add('open');
      }
    }

    if (dragCard) {
      dragCard.curX = e.clientX;
      dragCard.curY = e.clientY;
      const dx = e.clientX - dragCard.startX, dy = e.clientY - dragCard.startY;
      dragCard.el.style.transform = `translate(${dx}px, ${dy}px) rotate(${dx * 0.04}deg) scale(1.08)`;
    }
  });

  window.addEventListener('pointerup', e => {
    if (!dragCard) return;
    const dc = dragCard;
    dragCard = null;
    $('#handStage').classList.remove('dragging-active');
    const w = screenToWorld(e.clientX, e.clientY);

    if (e.clientY < window.innerHeight - 145) {
      if (tryPlayDraggedCard(dc, w.x, w.y)) {
        renderHand(true);
        updateHud();
        return;
      }
    }
    renderHand(true);
  });

  function tryPlayDraggedCard(dc, wx, wy) {
    const c = dc.card, t = me();
    if (G.phase === 'intrigue' && G.intrigueTurn === HS && c.phase !== 'fight') {
      const gHit = hitRegions.find(r => r.kind === 'garage' && wx >= r.x && wx <= r.x + r.w && wy >= r.y && wy <= r.y + r.h);
      if ((c.target === 'rival' || c.target === 'any' || c.phase === 'security') && !gHit) return false;
      act('play', dc.id, gHit ? gHit.team : null);
      return true;
    }
    return false;
  }

  cv.addEventListener('click', e => {
    if (dragCard) return;
    const w = screenToWorld(e.clientX, e.clientY);
    const wx = w.x, wy = w.y;
    { const top = hitRegions.slice().reverse().find(r => wx >= r.x && wx <= r.x + r.w && wy >= r.y && wy <= r.y + r.h);
      if (top) tlog('click', { kind: top.kind, idx: top.idx, side: top.side, team: top.team, robot: top.robot ? top.robot.name : undefined }); }

    { const od = hitRegions.find(r => r.kind === 'odds' && wx >= r.x && wx <= r.x + r.w && wy >= r.y && wy <= r.y + r.h);   // odds chip: matchups panel
      if (od && G.teams[od.team] && G.teams[od.team].robots.includes(od.robot)) { openMatchups(od.team, od.robot); return; } }
    for (let i = hitRegions.length - 1; i >= 0; i--) {
      const r = hitRegions[i];
      if (wx < r.x || wx > r.x + r.w || wy < r.y || wy > r.y + r.h) continue;

      if (r.kind === 'setup_sponsor') {
        act('pickSponsor', r.spKey);
        return;
      }

      if (r.kind === 'setup_draft') {
        act('pickStarter', r.idx);
        return;
      }

      if (r.kind === 'sponsor_cycle') {
        const t = me();
        const idx = (SPONSOR_KEYS.indexOf(t.sponsor) + 1) % SPONSOR_KEYS.length;
        t.sponsor = SPONSOR_KEYS[idx];
        t.mechs = t.sponsor === 'sovereign' ? 4 : 3;
        notify(`Sponsor switched to <b>${esc(SPONSORS[t.sponsor].name)}</b> (${esc(SPONSORS[t.sponsor].tag)}).`, t.col);
        updateHud();
        return;
      }

      if (r.kind === 'zone_fix') { spawnWeldSparks(r.x + r.w / 2, r.y + r.h / 2); act('repairZone', r.robot.id, r.zone); return; }

      if (r.kind === 'bay_action' || (r.kind === 'bay' && r.team === HS)) {
        const t = me(), bot = r.robot, inst = PS().install || [];
        if (G.phase === 'upkeep') {
          void t;   // 2.0: repairs are on the zone buttons
        } else if (G.phase === 'market' && inst.length) {
          const L0 = LOTS[inst[0].lot];
          if (!canFit(bot, L0)) { notify('⚠️ ' + lotRef(inst[0].lot) + ' doesn\'t fit ' + esc(bot.name) + ': ' + esc(lotPreview(bot, L0)) + '.', '#b45309'); return; }
          if (swapAsk) return;
          spawnWeldSparks(r.x + r.w / 2, r.y + r.h / 2);
          act('install', bot.id);
        } else if (G.phase === 'arena' && PS().choose) {
          if (bot.exhausted) { notify('😴 <b>' + esc(bot.name) + '</b> is exhausted and can\'t fight this round.', '#b45309'); return; }
          act('sendBot', bot.id);
        }
        return;
      }

      if (r.kind === 'market_continue') { act('continueMarket'); return; }
      if (r.kind === 'rebid_minus') { act('rebidAdj', -1); return; }
      if (r.kind === 'rebid_plus') { act('rebidAdj', 1); return; }
      if (r.kind === 'rebid_submit') { act('rebidLock'); return; }
      if (r.kind === 'market_minus') { act('bid', r.idx, 'minus'); return; }
      if (r.kind === 'market_plus' || r.kind === 'market_tile') { act('bid', r.idx, r.kind === 'market_tile' ? 'tile' : 'plus'); return; }

      if (r.kind === 'garage' && G.phase === 'arena' && G.host === HS && !G.chooseMyBot && !G.hostStep && !G.fight && G.pickTeams) { act('pickTeam', r.team); return; }
      if (r.kind === 'bet_card') { act('bet', r.side); return; }
      if (r.kind === 'card_bid') { act('cardBid', r.k, r.d); return; }


      if (r.kind === 'crate_pick') { act('crate', r.lot); return; }
    }
  });

  function spawnWeldSparks(wx, wy) {
    for (let k = 0; k < 18; k++) {
      const a = rnd() * Math.PI * 2, sp = 40 + rnd() * 90;
      weldSparks.push({ x: wx, y: wy, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 0.35 + rnd() * 0.25 });
    }
  }

  /* ---------- Main 60 FPS Loop ---------- */
  let lastT = performance.now(), accT = 0, finishWait = 0;
  function loop(now) {
    requestAnimationFrame(loop);
    const dt = Math.min(0.1, (now - lastT) / 1000);
    lastT = now;
    update(dt);
    if (window.__noRender && G && G.fast) return;   // AI-only test games: no drawing (2× faster)
    renderWorld(now);
    updateHelp(now);
  }
  // Kev, 7 Nov (online test): a browser stops drawing a tab that isn't on screen, and the fight stopped with it
  // (the host's fight runs everyone's game). A timer keeps the game going in a background tab.
  setInterval(() => { const now = performance.now(); if (now - lastT > 300) { const dt = Math.min(2, (now - lastT) / 1000); lastT = now; update(dt); } }, 250);
  function update(dt) {
    if (G && !G.over && (G.phase === 'upkeep' || G.phase === 'market')) renderStash();
    if (G && G.phase === 'fight' && G.fight && G.fight.S) {
      const F = G.fight;
      if (F.S.over && F.viewDone && !isClient()) aftermath();
    }
  }

  /* ---------- Top Pill & Hand Controls ---------- */
  $('#seatSel').onchange = e => {
    viewerSeat = +e.target.value; if (HS >= 0) HS = viewerSeat;
    updateHud();
  };
  $('#handTab').addEventListener('pointerenter', () => {
    $('#handStage').classList.add('open');
  });
  // Kev, 6 Nov: "keep open" toggle (remembered) and a toggle that moves the hand under your middle, right or left bay
  const setPin = on => {
    const tray = $('#handTray'); tray.classList.toggle('pinned', on);
    $('#handPin').classList.toggle('on', on); $('#handPin').textContent = on ? '📌 kept open' : '📌 keep open';
    $('#handTab').title = on ? 'Hand kept open (click to collapse)' : 'Click to keep the hand open';
    try { localStorage.setItem('robocus2.handPinned', on ? '1' : '0'); } catch (e) {}
  };
  $('#handTab').onclick = e => { e.stopPropagation(); setPin(!$('#handTray').classList.contains('pinned')); };
  $('#handPin').onclick = e => { e.stopPropagation(); setPin(!$('#handTray').classList.contains('pinned')); };
  const SIDES = ['middle', 'right', 'left'];
  const setSide = k => { handSide = k; $('#handSide').textContent = '⇆ ' + k; $('#handSide').classList.toggle('on', k !== 'middle'); try { localStorage.setItem('robocus2.handSide', k); } catch (e) {} };
  $('#handSide').onclick = e => { e.stopPropagation(); setSide(SIDES[(SIDES.indexOf(handSide) + 1) % 3]); };
  try { if (localStorage.getItem('robocus2.handPinned') === '1') setPin(true); const sd = localStorage.getItem('robocus2.handSide'); if (SIDES.includes(sd)) setSide(sd); } catch (e) {}
  window.addEventListener('resize', () => {
    if (!cam.manualZoom) {
      setCameraGoal(G?.phase === 'fight' ? 'arena' : 'compound');
    }
  });
  // Kev, 6 Nov: the 🔍 View and ⚡ Instant Fight buttons are gone from the top bar (handlers kept, guarded)
  if ($('#camToggleBtn')) $('#camToggleBtn').onclick = () => {
    cam.manualZoom = !cam.manualZoom;
    if (cam.manualZoom) {
      const zoomedIn = cam.tzoom > 0.85;
      cam.tx = 0; cam.ty = zoomedIn ? 72 : 0; cam.tzoom = zoomedIn ? getCompoundZoom() : getArenaZoom();
    } else {
      setCameraGoal(G.phase === 'fight' ? 'arena' : 'compound');
    }
  };
  // action log controls: collapse (remembered per browser), "new" jump button, out of the way while dragging a card
  (() => {
    const lp = $('#logPanel'), body = $('#ticker'), nb = $('#lpNew'), tg = $('#lpToggle');
    let col = window.innerWidth < 1250;
    try { const v = localStorage.getItem('robocus2.logCollapsed'); if (v != null) col = v === '1'; } catch (e) {}
    const apply = () => { lp.classList.toggle('collapsed', col); LOGC.unread = 0; tg.textContent = col ? '▸ show' : '–'; if (G) setCameraGoal(G.phase === 'fight' ? 'arena' : 'compound'); };
    tg.onclick = () => { col = !col; try { localStorage.setItem('robocus2.logCollapsed', col ? '1' : '0'); } catch (e) {} apply(); if (!col) body.scrollTop = body.scrollHeight; };
    body.addEventListener('scroll', () => { if (logAtBottom()) nb.hidden = true; });
    nb.onclick = () => { body.scrollTop = body.scrollHeight; nb.hidden = true; };
    apply();
    setInterval(() => lp.classList.toggle('dragging', !!dragCard), 150);
  })();
  $('#ptBtn').onclick = ptMenu;
  ptRestoreDir();
  VW.mount(document.getElementById('fightView'));
  newGame();
  requestAnimationFrame(loop);
})();
</script>
</body>
