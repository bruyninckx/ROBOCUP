<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ROBOCUS 2.0</title>
<!-- ROBOCUS 2.0 tabletop (fork of tabletop-prototype.html, 8 Nov 2026): the 1.0 board, phases and cards, with the 2.0
     robots and parts (src2/lineup.js), physics fights (src2/engine.js, shown full screen by src2/view.js) and zone repairs
     (src2/repair.js). The 1.0 page and src/ stay as they are. Needs internet for planck.js. -->
<!-- bench fonts (Google Fonts; without internet the page falls back to the system fonts) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Stencil+One&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap">
<style>
/* ROBOCUS 2.0 · "Workshop Bench" layout (Kev, 9 Nov 2026: layout B + the card-type system).
   Six fixed zones: 1 top bar · 2 rival tickets · 3 the pit (phase stage) · 4 sticky note (your move) · 5 your team rail
   (with the Stash) · 6 hand drawer · 7 log clipboard. Zones 2, 3 and 5 are drawn on the canvas (#worldCv); the sticky
   note, the log, the Stash and the hand are HTML, placed over the canvas zones each frame (placeOverlays). */
:root {
  --bg: #E9E4DA;      /* the bench */
  --panel: #F6F2EA;   /* paper panels */
  --paper: #FFFDF8;
  --ink: #2B2118;
  --muted: #6E6457;
  --line: #CFC6B7;
  --dash: #A79C8C;
  --hazard: #E8C547;
  --pit: #3A3530;
  --floor: #CFC7B8;
  --blue: #2F6DB5;
  --red: #B23A2B;
  --green: #2F7D4A;
  --orange: #D9731A;
  --gold: #B07A10;
  --purple: #7C4D9E;
  --stencil: "Saira Stencil One", Impact, "Arial Narrow", sans-serif;
  --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --tbh: 52px;   /* top bar height */
  color-scheme: light;
}
* { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
[hidden] { display: none !important; }
html, body {
  margin: 0; padding: 0;
  width: 100vw; height: 100vh;
  overflow: hidden;
  background: var(--bg);
  color: var(--ink);
  font: 13px/1.35 var(--sans);
}
#worldCv { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; z-index: 1; }

/* ---------- 1 · top bar: round, the 8 steps, who we wait for, seat ---------- */
.topbar {
  position: fixed; top: 0; left: 0; right: 0; height: var(--tbh); z-index: 12;
  display: flex; align-items: center; gap: 16px; padding: 0 16px;
  background: var(--bg); border-bottom: 3px solid var(--ink); white-space: nowrap;
}
.tb-brand { display: flex; flex-direction: column; line-height: 1; gap: 2px; }
.tb-meta { font: 600 10px var(--mono); letter-spacing: 1.5px; color: var(--muted); text-transform: uppercase; }
.tb-meta b { background: var(--hazard); color: var(--ink); padding: 1px 4px; border-radius: 2px; font-weight: 700; }
.tb-name { font: 400 26px var(--stencil); letter-spacing: .5px; }
.phase-steps { display: flex; align-items: center; justify-content: center; gap: 4px; flex: 1; min-width: 0; overflow: hidden; }
.phase-steps .st { display: flex; align-items: center; gap: 5px; font: 500 12.5px var(--sans); color: var(--ink); cursor: help; }
.phase-steps .st i { width: 22px; height: 22px; flex-shrink: 0; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font: 700 11px var(--mono); font-style: normal; border: 2px solid var(--ink); background: var(--panel); }
.phase-steps .st.done { color: #8B8174; }
.phase-steps .st.done i { background: #CFC6B7; color: var(--muted); }
.phase-steps .st.on { font-weight: 700; }
.phase-steps .st.on i { background: var(--ink); color: var(--hazard); }
.phase-steps .ln { width: 14px; height: 2px; background: var(--dash); flex-shrink: 0; }
.tb-who { display: flex; gap: 5px; align-items: center; }
.tb-who span { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--c); background: var(--panel); display: inline-flex; align-items: center; justify-content: center; font: 700 8px var(--mono); color: #fff; cursor: help; }
.tb-who span.done { background: #4C8A3F; border-color: #4C8A3F; }
.tb-who span.busy { background: var(--c); animation: whoPulse 1.2s ease-in-out infinite; }
.tb-who span.now { background: var(--c); box-shadow: 0 0 0 2px var(--hazard); }
@keyframes whoPulse { 50% { opacity: .45; } }
#netBadge { font: 600 12px var(--sans) !important; margin-left: 0 !important; padding: 5px 11px !important; border: 2px solid var(--ink) !important; border-radius: 5px !important; background: var(--panel) !important; color: var(--ink) !important; white-space: nowrap; cursor: pointer; }
.win-watch { font: 700 12px var(--mono); padding: 3px 9px; border-radius: 3px; background: #FBE3DE; color: var(--red); border: 2px solid var(--red); white-space: nowrap; cursor: help; }
.win-watch.one { background: var(--red); color: #fff; animation: winPulse 1.4s ease-in-out infinite; }
@keyframes winPulse { 50% { box-shadow: 0 0 0 4px rgba(178,58,43,.25); } }
.seat-select { font: 600 12px var(--sans); border: 2px solid var(--ink); border-radius: 5px; padding: 4px 8px; background: var(--panel); color: var(--ink); cursor: pointer; }
.pill-btn { font: 600 12px var(--sans); background: var(--panel); color: var(--ink); border: 2px solid var(--ink); border-radius: 5px; padding: 4px 10px; cursor: pointer; }
.pill-btn.primary { background: var(--ink); color: var(--hazard); }
@media (max-width: 1380px) { .phase-steps .st:not(.on) b { display: none; } .phase-steps .ln { width: 8px; } }
@media (max-width: 1000px) { .tb-meta { display: none; } .tb-name { font-size: 20px; } .topbar { gap: 10px; padding: 0 10px; } }

/* ---------- 4 · sticky note: what to do now, and the button that moves on ---------- */
.prompt-bar {
  position: fixed; z-index: 14; left: 0; top: 0; width: 280px;
  background: var(--hazard); color: var(--ink);
  border: 2px solid var(--ink); border-radius: 3px;
  padding: 26px 13px 11px;
  box-shadow: 0 4px 10px rgba(0,0,0,.2);
  display: flex; flex-wrap: wrap; align-items: flex-start; align-content: flex-start; gap: 7px;
  font: 600 13px/1.38 var(--sans); overflow-y: auto; scrollbar-width: thin;
  transition: opacity .15s ease;
}
.prompt-bar::before { content: 'YOUR MOVE'; position: absolute; left: 13px; top: 8px; font: 600 10.5px var(--mono); letter-spacing: 1.5px; }
.prompt-bar.idle::before { content: 'AT THE TABLE'; }
.prompt-bar.idle { background: #EFE3B0; }
.prompt-bar > span { flex: 1 1 100%; }
.prompt-bar b { font-weight: 700; }
.prompt-bar .act {
  font: 400 14px var(--stencil); letter-spacing: 1px;
  background: var(--ink); color: var(--panel); border: 0; border-radius: 4px; padding: 6px 13px; cursor: pointer;
}
.prompt-bar .act:hover:not(:disabled) { background: #000; color: var(--hazard); }
.prompt-bar .act:disabled { opacity: .4; cursor: default; }
.prompt-bar .act.secondary { font: 700 12px var(--sans); letter-spacing: 0; background: transparent; color: var(--ink); border: 2px solid var(--ink); padding: 4px 10px; }
.prompt-bar .act.secondary:hover:not(:disabled) { background: rgba(255,255,255,.45); color: var(--ink); }
.prompt-bar select { font: 600 12px var(--sans); border: 2px solid var(--ink); border-radius: 4px; background: var(--paper); padding: 2px 4px; }
.prompt-bar .ivorder { flex: 1 1 100%; background: rgba(255,253,248,.6); color: var(--ink); border-radius: 3px; padding: 4px 8px; font-size: 11.5px; font-weight: 600; line-height: 1.5; }
.prompt-bar .ivorder i { font-style: normal; font-weight: 700; }
.prompt-bar .sc-note { color: #5A4C24; }

/* ---------- 7 · log clipboard under the pit ---------- */
.logpanel {
  position: fixed; z-index: 11; left: 0; top: 0; width: 600px; height: 110px;
  display: flex; flex-direction: column;
  background: var(--panel); border: 2px solid var(--ink); border-radius: 6px; font-size: 11.5px;
}
.logpanel.dragging { pointer-events: none; opacity: .35; }
.lp-head { display: flex; align-items: center; justify-content: space-between; padding: 3px 8px; border-bottom: 2px dashed var(--line); }
.lp-head > span:first-child { font: 400 15px var(--stencil); letter-spacing: .5px; cursor: help; }
.lp-head button { border: 2px solid var(--ink); background: var(--paper); border-radius: 4px; font: 600 10.5px var(--mono); padding: 0 7px; cursor: pointer; color: var(--ink); }
.lp-body { flex: 1; min-height: 0; overflow-y: auto; padding: 4px 8px 6px; display: flex; flex-direction: column; gap: 3px; scrollbar-width: thin; }
.logpanel.collapsed { height: auto !important; }
.logpanel.collapsed .lp-body, .logpanel.collapsed .lp-new { display: none; }
.logpanel.collapsed .lp-head { border-bottom: 0; }
.lp-new { position: absolute; bottom: 6px; left: 50%; transform: translateX(-50%); border: 2px solid var(--ink); background: var(--ink); color: var(--hazard); border-radius: 4px; font: 600 10.5px var(--mono); padding: 1px 10px; cursor: pointer; }
.lp-new[hidden] { display: none; }
.lp-phase { margin: 5px 0 1px; font: 600 10px var(--mono); text-transform: uppercase; letter-spacing: 1px; color: var(--muted); border-bottom: 1px solid var(--line); padding-bottom: 1px; cursor: help; }
.lp-phase:first-child { margin-top: 0; }
.tick-msg { background: var(--paper); border-left: 4px solid var(--ink); padding: 3px 7px; border-radius: 0 3px 3px 0; line-height: 1.35; animation: slideIn .18s ease-out; }
.lp-act { background: var(--paper); border-left: 4px solid var(--ink); border-radius: 0 3px 3px 0; animation: slideIn .18s ease-out; }
.lp-act > .lp-ah { padding: 3px 7px; line-height: 1.35; cursor: help; }
.lp-act > .lp-steps { padding: 0 7px 3px 12px; display: flex; flex-direction: column; gap: 1px; }
.lp-act > .lp-steps:empty { display: none; }
.lp-step { color: #4A4136; font-size: 11px; line-height: 1.3; }
.lp-step::before { content: '↳ '; color: var(--dash); }
.lp-res { float: right; font: 700 9.5px var(--mono); padding: 0 5px; border-radius: 2px; margin-left: 4px; }
.lp-res.ok { background: #DCEBD6; color: #2F6B2A; } .lp-res.no { background: #F6DAD5; color: var(--red); }
.lp-money { font: 600 11px var(--mono); }
.lp-money i { font-style: normal; color: var(--muted); }
.lcard { text-decoration: underline dotted var(--dash); text-underline-offset: 2px; cursor: help; font-weight: 700; }
@keyframes slideIn { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: translateX(0); } }

/* ---------- 5 · the Stash, in your rail under the robots ---------- */
.stashcard { position: fixed; z-index: 11; left: 0; top: 0; width: 400px; background: var(--panel); border: 2px dashed var(--dash); border-radius: 6px; font-size: 12px; overflow: hidden; }
.stashcard .lp-head { border-bottom: 0; padding: 2px 8px; }
.stashcard .lp-head > span:first-child { font: 600 10.5px var(--mono); letter-spacing: 1px; color: var(--muted); }
.st-list { padding: 0 8px 5px; display: flex; flex-direction: column; gap: 3px; }
.st-row { display: flex; align-items: center; gap: 5px; }
.st-row .lcard { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.st-row button { border: 2px solid var(--ink); border-radius: 4px; background: var(--paper); font: 600 10.5px var(--mono); padding: 0 6px; cursor: pointer; color: var(--ink); }
.stashcard .sc-note { padding: 0 8px 4px !important; display: inline; }

/* ---------- 6 · the hand drawer (cards on the card-type shapes) ---------- */
.hand-stage { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 560px; height: 230px; z-index: 25; pointer-events: none; transition: left .25s ease; }
.hand-tray { position: absolute; bottom: 0; left: 0; width: 100%; height: 230px; pointer-events: none; transform: translateY(160px); transition: transform 0.26s cubic-bezier(0.22, 1, 0.36, 1); will-change: transform; }
.hand-stage.open .hand-tray, .hand-tray.pinned, .hand-stage.dragging-active .hand-tray { transform: translateY(0); }
.cards-fan { position: absolute; inset: 0; pointer-events: none; }
.hand-bar { position: absolute; bottom: 210px; left: 50%; transform: translateX(-50%); display: flex; gap: 6px; align-items: center; z-index: 5; }
.hand-ctl, .hand-tab { font: 600 10.5px var(--mono); letter-spacing: .5px; background: var(--panel); color: var(--ink); border: 2px solid var(--ink); border-radius: 4px; padding: 2px 9px; pointer-events: auto; cursor: pointer; white-space: nowrap; box-shadow: 0 2px 6px rgba(0,0,0,.12); }
.hand-ctl:hover, .hand-tab:hover { background: var(--ink); color: var(--hazard); }
.hand-ctl.on, .hand-tray.pinned .hand-tab { background: var(--ink); color: var(--hazard); }
.hand-tab { display: flex; align-items: center; gap: 5px; line-height: 1.2; transition: opacity .16s ease; }
.hand-tray:has(.hs-slot:hover) .hand-ctl, .hand-tray:has(.hs-slot:hover) .hand-tab { opacity: 0; pointer-events: none; }
.hand-tab .tab-arrow { display: inline-block; font-size: 8.5px; transition: transform 0.22s ease; }
.hand-stage.open .hand-tab .tab-arrow, .hand-tray.pinned .hand-tab .tab-arrow { transform: rotate(180deg); }
.hs-slot { position: absolute; bottom: 0; left: 50%; width: 138px; height: 206px; margin-left: -69px; pointer-events: auto; }
.hs-slot:hover { z-index: 60 !important; }
.hs-slot.dragging-slot { z-index: 100 !important; pointer-events: none; }
/* a card = its frame (the type's colour or stripes) around its face */
.hs-card {
  --kc: var(--blue); --kbg: #F4EFE6; --kfg: var(--ink); --ksub: #4A4136; --kband: #fff;
  position: absolute; bottom: 12px; left: 0; width: 138px; height: 188px;
  background: var(--kc); padding: 3px; border-radius: 9px;
  display: flex; cursor: grab;
  filter: drop-shadow(0 5px 8px rgba(0,0,0,.22));
  transform: translateY(var(--hy, 0px)) rotate(var(--ang, 0deg)); transform-origin: 50% 100%;
  transition: transform 0.2s cubic-bezier(0.22, 1, 0.36, 1), filter .18s ease;
  will-change: transform;
}
.hs-in { flex: 1; min-width: 0; display: flex; flex-direction: column; background: var(--kbg); color: var(--kfg); border-radius: 6px; overflow: hidden; }
.hs-band { display: flex; justify-content: space-between; align-items: center; gap: 4px; background: var(--kc); color: var(--kband); font: 700 9px var(--mono); letter-spacing: .6px; padding: 2px 6px 4px; }
.hs-when { font: 700 7.5px var(--mono); letter-spacing: .3px; padding: 1px 4px; border-radius: 2px; background: var(--kband); color: var(--kc); }
.hs-top { display: flex; justify-content: space-between; align-items: center; gap: 3px; padding: 4px 6px 0; }
.hs-fam { font: 700 8px var(--mono); padding: 1px 5px; border-radius: 8px; color: #fff; background: var(--fam, #6E6457); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 78px; }
.hs-need { font: 700 9px var(--mono); padding: 0 4px; border: 1.5px solid currentColor; border-radius: 3px; color: var(--kfg); white-space: nowrap; }
.hs-art { height: 34px; display: flex; align-items: center; justify-content: center; font-size: 22px; }
.hs-title { font: 400 14.5px/1.02 var(--stencil); color: var(--kfg); text-align: center; padding: 0 6px; }
.hs-desc { flex: 1; font-size: 10.5px; font-weight: 500; color: var(--ksub); text-align: center; line-height: 1.24; padding: 3px 7px 0; overflow: hidden; }
.hs-footer { display: flex; justify-content: space-between; align-items: center; gap: 4px; font: 600 8.5px var(--mono); color: var(--kfg); background: rgba(43,33,24,.08); padding: 3px 6px; }
.hs-footer em { font-style: normal; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hs-coin { font: 700 9.5px var(--mono); background: #F2C14E; color: #5A3D00; border-radius: 3px; padding: 0 4px; flex-shrink: 0; }
/* the six card types: colour, shape, corner tag */
.hs-card.k-scheme { --kc: #2F6DB5; }
.hs-card.k-react { --kc: #D9731A; --kband: #2B2118; clip-path: polygon(18px 0, 100% 0, 100% 100%, 0 100%, 0 18px); }
.hs-card.k-react .hs-in { clip-path: polygon(16px 0, 100% 0, 100% 100%, 0 100%, 0 16px); }
.hs-card.k-react .hs-band { padding-left: 18px; }
.hs-card.k-react .hs-when { background: #2B2118; color: #F2B27A; }
.hs-card.k-face { --kc: #8B5CC4; --kbg: #2B2236; --kfg: #F4EDE2; --ksub: #D9CFE8; }
.hs-card.k-face .hs-in { background-image: repeating-linear-gradient(45deg, rgba(139,92,196,.2) 0 6px, transparent 6px 14px); }
.hs-card.k-face .hs-footer { background: rgba(0,0,0,.35); }
.hs-card.k-face .hs-when { background: #2B2236; color: #D9C2F5; }
.hs-card.k-sec { --kc: #4A5560; --kbg: #DCE2E6; border-radius: 24px 8px 24px 8px; }
.hs-card.k-sec .hs-in { border-radius: 21px 6px 21px 6px; }
.hs-card.k-sec .hs-band { padding-left: 14px; }
.hs-card.k-sec .hs-when { background: #DCE2E6; color: #2B3540; }
.hs-card.k-fight { --kc: #E8C547; --kbg: #1A1A12; --kfg: #F4EDE2; --ksub: #D9CFC2; --kband: #1A1A12; padding: 5px; background: repeating-linear-gradient(-45deg, #E8C547 0 10px, #1A1A12 10px 20px); }
.hs-card.k-fight .hs-in { border-radius: 4px; }
.hs-card.k-fight .hs-when { background: #1A1A12; color: #E8C547; }
.hs-card.k-fight .hs-footer { background: #E8C547; color: #1A1A12; }
.hs-card.k-arena { --kc: #5C6E2E; --kbg: #EEF0E0; border-radius: 3px; }
.hs-card.k-arena .hs-in { border-radius: 1px; }
.hs-card.k-arena .hs-when { color: #5C6E2E; }
/* states */
.hs-card.playable { filter: drop-shadow(0 0 0 #E8C547) drop-shadow(0 0 4px #E8C547) drop-shadow(0 6px 8px rgba(0,0,0,.25)); cursor: grab; }
.hs-card.unplayable { cursor: default; }
.hs-card.unplayable .hs-in { filter: saturate(.7); }
.hs-card.cash-card.playable { filter: drop-shadow(0 0 3px #D99000) drop-shadow(0 0 6px #F2C14E); }
.hs-card.need-fame::after { content: ''; position: absolute; inset: 0; border-radius: inherit; background: rgba(178,58,43,.2); pointer-events: none; }
.hs-card.need-fame .hs-need { color: #fff; background: var(--red); border-color: var(--red); }
.hs-slot:hover .hs-card { transform: translateY(-34px) rotate(0deg) scale(1.2); filter: drop-shadow(0 16px 18px rgba(0,0,0,.32)); }
.hs-card.dragging { cursor: grabbing; transition: none !important; pointer-events: none; filter: drop-shadow(0 24px 24px rgba(0,0,0,.35)); }

/* ---------- panels: end credits, choices, help, deals, scouting ---------- */
#awardsPanel { position: fixed; inset: 0; z-index: 9000; display: flex; align-items: center; justify-content: center; background: rgba(43,33,24,.45); padding: 16px; }
#awardsPanel[hidden] { display: none; }
.aw-box { background: var(--panel); border: 3px solid var(--ink); border-radius: 6px; box-shadow: 0 18px 50px rgba(0,0,0,.35); padding: 16px; width: min(760px, 100%); max-height: calc(100vh - 32px); overflow: auto; display: flex; flex-direction: column; gap: 12px; }
.aw-top { background: var(--ink); color: var(--hazard); border-radius: 4px; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.aw-sub { font: 700 11px var(--mono); letter-spacing: 2px; text-transform: uppercase; }
.aw-head { font: 400 30px/1 var(--stencil); }
.aw-fame { font: 700 38px var(--mono); }
.aw-stand { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.aw-stand div { border: 2px solid var(--c); border-radius: 5px; padding: 6px 8px; display: flex; flex-direction: column; gap: 2px; background: var(--paper); min-width: 0; }
.aw-stand em { font: 700 11px var(--mono); font-style: normal; }
.aw-stand b { font: 400 15px var(--stencil); color: var(--c); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.aw-stand span { font: 600 12px var(--mono); }
.aw-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }
.aw-card { background: var(--paper); border: 2px solid var(--ink); border-left: 7px solid var(--ink); border-radius: 6px; padding: 9px 12px; display: flex; gap: 10px; align-items: flex-start; }
.aw-ic { font-size: 22px; line-height: 1; }
.aw-t { font: 400 15px var(--stencil); }
.aw-who { font: 700 11px var(--mono); }
.aw-x { font-size: 12px; line-height: 1.4; color: #4A4136; }
.aw-btns { display: flex; gap: 10px; flex-wrap: wrap; }
.aw-btns button, .iv-btns button, .sc-spar { font: 700 12.5px var(--sans); padding: 7px 13px; border-radius: 4px; border: 2px solid var(--ink); cursor: pointer; background: transparent; color: var(--ink); }
.aw-btns button.primary, .iv-btns button.primary { font: 400 15px var(--stencil); letter-spacing: 1px; background: var(--ink); color: var(--hazard); }
#ivModal { position: fixed; inset: 0; z-index: 9999; display: flex; align-items: center; justify-content: center; background: rgba(43,33,24,.3); }
#ivModal[hidden] { display: none; }
#helpTip { position: fixed; z-index: 10050; pointer-events: none; max-width: 300px; background: var(--paper); border: 2px solid var(--ink); border-radius: 4px; box-shadow: 0 8px 24px rgba(0,0,0,.22); padding: 7px 10px; font: 12px/1.42 var(--sans); color: #2B2118; }
#helpTip[hidden] { display: none; }
#helpTip .ht { font-weight: 700; font-size: 12.5px; margin-bottom: 2px; }
#helpTip i { color: var(--muted); }

<script>/* both CDNs failed (offline, a test sandbox): a local copy in vendor/ if there is one (not in git; see docs/robocus-2.0-sim.md) */ window.planck || document.write('<script src="../vendor/planck-1.4.3.min.js"><\/script>');</script>

<script>
/* ============================================================================
 * 1. FIGHTS (ROBOCUS 2.0): no 1.0 Sim here. Fights run on the 2.0 physics engine (src2/engine.js, window.DamageLab,
 *    seeded), the robots and parts come from src2/lineup.js, repairs and strength from src2/repair.js, and the
 *    full-screen fight view from src2/view.js.
 * ============================================================================ */

/* ============================================================================
 * 2. ASYMMETRICAL SCRAPYARD COMPOUND + ENGINEERS, SPONSORS & CARD ENGINE
 * ============================================================================ */
(function () {
  'use strict';
  const $ = s => document.querySelector(s);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  // game dice: seedable (?seed=N) so a game can be replayed (regression tests, save/rematch). Fights keep their own Sim seeds.
  const GAME_SEED = (+new URLSearchParams(location.search).get('seed') >>> 0) || ((Math.random() * 4294967296) >>> 0);
  let rndState = GAME_SEED;
  const rnd = () => { rndState = (rndState + 0x6D2B79F5) >>> 0; let t = rndState; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  const pick = a => a[Math.floor(rnd() * a.length)];
  const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const clone = o => JSON.parse(JSON.stringify(o));
  /* ---------- BAL: the balance settings in one place (8 Nov, balance overhaul phase 1) ----------
   * Defaults are the rules as they stand (Kev, 8 Nov: start fame 0). The game reads these numbers at the moment it uses them.
   * Change them before a game starts: ?bal=<url-encoded JSON> (deep-merged into BAL; arrays are replaced), or
   * ROBOCUS_DEBUG.bal({...}) (merges, then deals a fresh game with the same seed). Every key: docs/robocus-2.0-sim.md. */
  const BAL_DEFAULT = {
    startFame: 0, winFame: 12,
    fameFloor: 1,                 // fame never drops below this by losing it (or below the start fame, if that is lower)
    startCredits: 8,
    // Kev, 8 Nov (round 2 "combo"): 2 Mechanics + Accountant + Analyst; more engineers in the crew deck; 7 crew lots; lean part lots
    // Kev, 9 Nov (round 7): crew = Mechanics only (was 2 Mechanics + Accountant + Analyst, 13-card crew deck, 7 crew lots)
    startCrew: { mechanic: 2, chief: 0, accountant: 0, analyst: 0 }, sovereignMechanics: 4,
    crewDeck: ['mechanic', 'mechanic', 'mechanic', 'mechanic'],
    lots: {                       // the Market lot deck (4 lots a round stays fixed)
      robot: 4, crew: 4,          // New Robot / New Crew lots (crew 4: Kev, 9 Nov, round 7; was 7)
      partCopies: { medic: 1, laser: 0, waller: 0, blocker: 0, spotter: 0, shield: 1 },   // copies per part id (src2/lineup.js PARTS key); others: its own copies
      kindCopies: {},             // copies per part kind (drone / module / stat) for every part of that kind; partCopies wins
    },
    // tuning chips (Kev, 9 Nov sims): slot true = a chip gets its own slot (it does not use one of the 2 part slots);
    // fromRound = chip lots stay out of the Market before this round (dealt later from the same deck)
    chips: { slot: false, fromRound: 1 },
    robotLevels: {                // which level a New Robot lot deals, by round: [from round, { level: weight }]
      scheme: 'gradual', rounds: 5, // rounds 1..rounds always offer a robot lot (Kev, 8 Nov: gradual, was waves)
      schemes: {
        waves:   [[1, { 1: 1 }], [3, { 2: 1 }], [5, { 3: 1 }]],
        waves2:  [[1, { 1: 1 }], [3, { 2: 1 }], [5, { 1: 1, 2: 1, 3: 2 }]],
        gradual: [[1, { 1: 1 }], [2, { 1: 2, 2: 1 }], [3, { 1: 1, 2: 2 }], [4, { 2: 2, 3: 1 }], [5, { 2: 1, 3: 2 }], [6, { 3: 1 }]],
        flat:    [[1, { 1: 1, 2: 1, 3: 1 }]],
      },
    },
    level4: {                     // level 4 end-game robots (docs/robocus-2.0-level4.md; Kev, 8 Nov: "we need level 4 in the game")
      on: true, fromRound: 6,     // their lots start in this round (Kev, 8 Nov: 6, was 7)
      perGame: 8,                 // of the 8, drawn at random per game (8 = all; Kev, 8 Nov: 8, was 4)
      lotEvery: 1,                // from fromRound: a level 4 lot every N rounds (1 = every round) while any are left
      minBid: 5,                  // lowest winning bid for a level 4 lot (lower = unsold, back to its deck)
      upkeep: 0,                  // extra Cr per level 4 robot every Upkeep (option: 1; the Accountant does not cover it)
      announce: true,             // name next round's level 4 robot a round ahead (like the legendary parts)
      priceNote: 'Lowest winning bid',   // the words before the minimum on the level 4 tag's help
    },
    repair: {
      credits: 2,                 // Cr per action once the free and crew actions are used up
      crewActs: { default: 1 },   // repair actions per crew member, per kind (e.g. { default: 1, chief: 2 })
      engineersOnly: true,        // switch: only the engineer kinds below give repair actions (Kev, 8 Nov: on)
      engineers: ['mechanic', 'chief', 'repairtech'],
      actsDamaged: 1, actsBroken: 1,
      brokenTwo: true,            // switch: a broken zone costs 2 actions (same as actsBroken: 2) (Kev, 8 Nov: on)
      bodyHeal: 0.5,              // body parts heal back to this every Upkeep for free
      freeLoser: 1, freeLoserVulture: 2, freeAegis: 1,
    },
    mechanicCr: 1,                // credits each Mechanic earns in Upkeep
    // robot upkeep: 'all' = every robot costs 1 Cr (the Accountant: only the first); 'first' = only your first robot costs 1 Cr for
    // everyone (Kev, 9 Nov: crew = Mechanics only test; every team started with an Accountant anyway)
    robotUpkeep: 'first',         // Kev, 9 Nov (round 7): 'first' with crew = Mechanics only
    // Kev, 8 Nov: a robot lot won with a full garage (3 bays) = trade-in: scrap one of your robots for base + perLevel × its level Cr,
    // its parts go to your Stash. off = the old rule (the robot goes back, you get 2 Cr)
    tradeIn: { on: true, base: 1, perLevel: 1 },
    fame: { win: 1, host: 1, fanFav: 1, favTokens: 3, favTokensApex: 2, finalMult: 2, bounty: 1 },   // bounty: We Have Your Number (Kev, 9 Nov)
    arenas: { on: true, cost: 1, list: ['open', 'saws', 'killbox', 'cage', 'ice'] },   // arena layouts (Kev, 9 Nov): the host picks one when inviting; open floor is free, the others cost the host `cost` Cr
    levelBoost: 0,                // level gap test (Kev, 9 Nov): every level's power grade x (1 + levelBoost) ^ level; see src2/lineup.js
    // robot-stat Intrigue cards. boltsMode: 'lid' (top plate left at boltsLid) | 'wheel' (one wheel at boltsWheel until a Drive repair);
    // ocMode: 'heat' (hot-wound motors: +35% force, 1.9x heat) | 'noheat' (+35% force without the extra heat build-up)
    cards: { upDmg: 1.15, upHp: 1.15, lens: 0.75, sugar: 0.4, ocAfter: 0.4, boltsLid: 0.3, boltsMode: 'wheel', boltsWheel: 0.3, ocMode: 'noheat' },   // round 3 card numbers (Kev, 9 Nov; were 1.2 / 1.2 / 0.85 / 0.6, bolts 'lid', overclock 'heat')
    live: {},                     // live card strengths: filled from DamageLab.LIVE_K below
    copies: {},                   // Intrigue / Auction card copies by card name, e.g. { 'Smear Campaign': 2 }
    // seat fairness (round 3, 8 Nov): ties between teams go to a seat order shuffled every round (was: the lower seat), the AI
    // reacts in that order, and round 1's Intrigue starts at a random seat. fairTies: false = the old seat-index order
    seats: { fairTies: true },
    auction: { perFight: 2, minBid: 1 },   // fight cards (Bets step): cards offered per fight; lowest bid that counts (Cr)
  };
  try { if (window.DamageLab && window.DamageLab.LIVE_K) BAL_DEFAULT.live = Object.assign({}, window.DamageLab.LIVE_K); } catch (e) {}
  function balMerge(a, b) {
    for (const k of Object.keys(b || {})) {
      const v = b[k];
      if (v && typeof v === 'object' && !Array.isArray(v) && a[k] && typeof a[k] === 'object' && !Array.isArray(a[k])) balMerge(a[k], v);
      else a[k] = clone(v);
    }
    return a;
  }
  const BAL = clone(BAL_DEFAULT);
  let BAL_URL = null;
  try { const q = new URLSearchParams(location.search).get('bal'); if (q) { BAL_URL = JSON.parse(q); balMerge(BAL, BAL_URL); } } catch (e) { console.warn('ROBOCUS: bad ?bal= JSON', e); }
  let WIN_FAME = BAL.winFame, HOST_FAME = BAL.fame.host;   // pacing knobs (ROBOCUS_DEBUG.tune, BAL)
  /* AI versions (Kev, 7 Nov): AIV[team] = 1 (the AI as it was) or 2 (better decisions, driven by the numbers in AIP[team]).
   * Real games use AI_DEFAULT; the benchmark (tools/ai-bench.js) mixes versions and parameter sets to measure them. */
  // tuned by self-play 7 Nov (docs/ai-v2.md): hosting is worth more (3 → 6 Cr per host fame), parts less (partK 1 → 0.5)
  const AI_PARAMS = { hostFame: 6, hostNoise: 0.25, reserve: 2, bidNoise: 0.25, partK: 0.5, betEdge: 0.05, betK: 0.5, feHp: 0.55, scrapThreat: 2, playMax: 2, playMin: 1,
    // surplus spending (Kev's playtest, 8 Nov: an AI held 61 Cr by round 10). Surplus = credits − aiReserve (next round's upkeep
    // shortfall, debt, expected repair credits, reserve + spendRes for bets and reactions). A lot / the host bid / a fight card is
    // worth value × min(1 + spendCap, 1 + spendK × surplus / 10); the extra over the old bid is paid from the surplus, at most
    // spendShare of it on one lot. Repairs: with a surplus it also pays credits for damaged (not only broken) drive / weapon zones,
    // and body zones once the surplus is spendBody+. spendK 0 = the AI as before. ai-bench (8 Nov): 0.3 / 0.4 as good as not spending, 0.5 / 0.6 a bit worse.
    // spendLate: within this much fame of the win it also keeps a war chest (the richest rival's credits + 1) for the host bid that
    // wins the game (hosting at match point is worth all its credits, and hoarders win those bids), at most spendWar.
    // spendMkt: credit repairs (Upkeep, before the Market), host and fight-card extras only from the surplus above this, so they
    // don't starve this or next round's Market (lot extras come after the base bids, from what is left above the reserve)
    spendK: 0.3, spendCap: 0.4, spendShare: 0.5, spendRes: 3, spendBody: 6, spendLate: 3, spendWar: 12, spendMkt: 8 };
  let AI_DEFAULT = 2;
  let AIV = [AI_DEFAULT, AI_DEFAULT, AI_DEFAULT, AI_DEFAULT], AIP = [0, 1, 2, 3].map(() => Object.assign({}, AI_PARAMS));
  // a v2 improvement can be switched off one at a time (params.off = ['bets', …]) to measure what each one is worth
  const aiV2 = (t, f) => (AIV[t.i] || 1) >= 2 && !(f && (aiP(t).off || []).includes(f));
  const aiP = t => AIP[t.i] || AI_PARAMS;
  let CATCHUP = { leaderhost: 1 };     // catch-up rules: purse / leaderhost / cards. Kev, 7 Nov: leaderhost on (a sole fame leader gets no host fame)

  /* 2.0 starters: the 9 level-0 robots of src2/lineup.js (classic robots, no module or chip) */
  const STARTERS = {};
  for (const n of Object.keys(window.Lineup.ROBOTS)) if (window.Lineup.ROBOTS[n][0] === 0) STARTERS[n] = { level: 0 };
  // Kev, 6 Nov: every team starts with ONE drafted robot (was 2); more come from New Robot lots in the Market
  const STARTER_PICKS = 1;
  const SHORT = { hp: 'HP', armor: 'AR', speed: 'SP', turret: 'TU', fp: 'FP', acc: 'AC', bullet: 'BU' };

  const SPONSORS = {
    aegis:     { name: 'Aegis Heavy',         tag: 'Free Upkeep Patch', text: 'One free repair action every Upkeep.' },
    blackwire: { name: 'Blackwire Syndicate', tag: 'Dirty Tricks',      text: '+1 Card in Upkeep; Intrigue schemes need 2 less Fame.' },
    sovereign: { name: 'Sovereign Foundry',   tag: 'Deep Pockets',      text: 'Start with 4 Mechanics & win every Market lot tie (not the host bid).' },
    apex:      { name: 'Apex Media',          tag: 'Prime Time',        text: '+2 Cr when you Host; Fan Favourite at 2 wins (not 3).' },
    lucky:     { name: 'Lucky Seven',         tag: 'House Edge',        text: 'Bet up to 5 Cr; winning bets pay one band better; losing bets refund 1 Cr.' },
    vulture:   { name: 'Vulture Salvage',     tag: 'Scrap Bounty',      text: '+2 Cr whenever a bot is scrapped; 2 free repair actions after a loss (not 1).' },
  };
  const SPONSOR_KEYS = Object.keys(SPONSORS);
  const favWins = t => t.sponsor === 'apex' ? BAL.fame.favTokensApex : BAL.fame.favTokens;
  const maxBetOf = t => t.sponsor === 'lucky' ? 5 : 3;
  // Kev, 7 Nov (sponsor check: Lucky Seven won 11%): its winning bets pay like the next band down (Even pays like Underdog)
  const payFor = (t, F, sd) => { if (!F || !F.pay) return 1; if (!t || t.sponsor !== 'lucky' || !F.bands || !F.bands[sd]) return F.pay[sd]; const k = BANDS.indexOf(F.bands[sd]); return k >= 0 ? BANDS[Math.min(BANDS.length - 1, k + 1)].pay : F.pay[sd]; };

  // rulebook (5 Nov): 5 bands by the bookie's win chance; pays 1:3 .. 3:1, so total return 1.33x .. 4x the stake
  const BANDS = [
    { min: 0.75, name: 'Heavy favourite', short: 'Heavy fav', col: '#2F6B2A', pay: 1.33 },   // bench colours (9 Nov)
    { min: 0.58, name: 'Favourite',       short: 'Favourite', col: '#4C8A3F', pay: 1.5 },
    { min: 0.42, name: 'Even',            short: 'Even',      col: '#9A7410', pay: 2 },
    { min: 0.25, name: 'Underdog',        short: 'Underdog',  col: '#C8642B', pay: 3 },
    { min: -1,   name: 'Heavy underdog',  short: 'Heavy dog', col: '#B23A2B', pay: 4 },
  ];
  const bandOf = p => BANDS.find(x => p >= x.min) || BANDS[2];

  /* ============================================================================
   * INTRIGUE v1 (docs/intrigue-deck.md, rulebook section 5; Kev 6 Nov):
   * 8 families, fame gates (backing with an optional credit offer), 5-second reaction windows,
   * Security Bots (4-6 blocks), cash-in, Ready / Exhausted.
   * Kev, 7 Nov (docs/intrigue-deck.md, live-card auction plan): trimmed to 135 copies of schemes and blockers.
   * Cards at 0 copies are cut (kept here so old saves and logs still read). The 6 live cards and Swap the Entry

  /* ---------- Hearthstone Arched Hand Rendering & Drag Physics ---------- */
  // the card's fame gate is out of reach on your own fame (you can still ask for backing)
  function lacksFame(t, c) {
    if (c.phase === 'later' || BLOCKERS.has(c.name) && typeof c.gate !== 'number') return false;
    if (c.gate === '▲' || c.gate === '▼') return !G.teams.some(o => o !== t && gateOk(c, t, o));
    return needOf(t, c) > t.fame;
  }

  function isCardPlayable(id) {
    const c = CARDS[id], t = me();
    if (!c) return false;
    if (G.phase === 'intrigue' && G.intrigueTurn === HS && !G.ivBusy) {
      if (G.cashMode) return true;
      if (c.phase === 'security') return true;
      if (c.phase === 'intrigue' || TURN_REACTIONS.has(c.name)) return typeof c.gate === 'number' || G.teams.some(o => o !== t && gateOk(c, t, o));
      return false;
    }
    return false;
  }

  function renderHand(force = false) {
    const stage = $('#handStage');
    const fan = $('#cardsFan');
    const countEl = $('#handCount');
    const t = me();
    const hand = t.hand;
    if (!fan) return;
    const n = hand.length;
    if (countEl) countEl.textContent = `(${n})`;

    // Avoid recreating DOM nodes when hand & playability haven't changed (prevents hover transition resets)
    const sig = `${G.phase}:${viewerSeat}:${G.cashMode ? 1 : 0}:${hand.join(',')}:${hand.map(id => isCardPlayable(id) ? 1 : 0).join('')}:${t.fame}`;
    if (!force && !dragCard && fan.dataset.sig === sig) return;
    fan.dataset.sig = sig;
    fan.innerHTML = '';

    hand.forEach((id, i) => {
      const c = CARDS[id];
      const playable = isCardPlayable(id);
      const need = needOf(t, c);
      const mid = (n - 1) / 2;
      const off = i - mid;
      const angle = off * 5.2;
      const hx = off * handSpread;   // spread to the hand drawer's width (placeHand)
      const hy = Math.abs(off) * Math.abs(off) * 4.0;

      // Outer stationary slot: fixed at translateX(hx) so its hover hit-box never shifts when the card lifts
      const slot = document.createElement('div');
      slot.className = 'hs-slot';
      slot.style.transform = `translateX(${hx}px)`;
      slot.style.zIndex = String(10 + i);

      const el = document.createElement('div');
      const kind = cardKind(c), K = CARD_KIND[kind];
      el.className = 'hs-card k-' + kind + ' ' +
        (G.cashMode && G.intrigueTurn === HS ? 'cash-card ' : '') +
        (lacksFame(t, c) ? 'need-fame ' : '') +
        (playable ? 'playable' : 'unplayable');
      el.style.setProperty('--hy', hy + 'px');
      el.style.setProperty('--ang', angle + 'deg');

      const typeLbl = c.phase === 'fight' ? '⚡ Live' : c.phase === 'later' ? '🏟️ Arena' : c.phase === 'security' ? '🤖 Security' :
                      c.t === 'F' ? '🂠 Face-down' : c.t === 'R' ? '🛡️ Reaction' : '🕵️ Scheme';
      const targetHint = c.name === 'We Have Your Number' ? 'Drag onto a rival robot with ' + bountyMin() + '+ 🎖' : c.name === 'Secret Upgrade' || c.name === 'Overclock' ? 'Drag onto one of your robots' : c.phase === 'security' ? 'Install: drag onto your rail' :
                         c.phase === 'later' ? (c.step === 'host' ? 'Host step: play from the prompt' : 'Bets step: play from the prompt') :
                         c.phase === 'fight' ? 'Fight: tray on the fight screen' :
                         BLOCKERS.has(c.name) || WINDOW_ONLY.has(c.name) ? 'Auto: reaction window' :
                         c.target === 'rival' ? 'Drag onto a rival' : c.target === 'any' ? 'Drag onto any team' : 'Drag onto the table';
      const gateTxt = c.gate === '▲' ? '▲ FAME' : c.gate === '▼' ? '▼ FAME' : need ? 'GATE ' + need : '';

      const typeHelp = c.phase === 'fight' ? 'Live combat card: won in the Bets-step auction, for this fight only. Play it from the card tray under the arena: tap it, then tap ' + (c.target === 'bot' ? 'a robot' : 'a spot') + '.' :
                       c.phase === 'later' ? (c.step === 'host' ? 'Arena card for the <b>Host step</b> (after the host bid, before invites): the prompt offers it then' + (c.name === 'Grand Melee' ? ' to everyone.' : ' to the host.') : 'Arena card for the <b>Bets step</b>: the prompt offers it while bets are open' + (c.name === 'Swap the Entry' ? ' (it plays right after bets are locked).' : '.')) + ' You can also cash it in on your Intrigue turn.' :
                       c.phase === 'security' ? 'Security Bot: discard it to roll 4–6 and block a scheme, or install it in your garage as a lasting guard.' :
                       c.t === 'F' ? 'Face-down card: put it on a robot without showing it. It stays hidden (the bookie can\'t see it) until that robot\'s next fight.' :
                       c.t === 'R' ? 'Reaction: played in response, often outside your own turn (in a 5-second window).' : 'Scheme: played on your Intrigue turn.';
      const gateHelp = c.gate === '▲' ? 'Only against a team with <b>more</b> fame than you.' : c.gate === '▼' ? 'Only against a team with <b>less</b> fame than you.' :
                       'Fame gate: you need <b>' + need + ' fame</b> to play it. Short? Other teams can back you with their fame (you can offer credits).';
      // the card sheet (Kev, 9 Nov): the type is the band (colour, shape, a corner tag for when you play it); the family is the chip under it
      const when = kind === 'arena' ? (c.step === 'host' ? 'HOST STEP' : 'BETS STEP') : K.when;
      el.innerHTML = '<div class="hs-in">' +
        '<div class="hs-band"><span' + helpAttr(typeLbl, typeHelp) + '>' + K.label + '</span><span class="hs-when">' + when + '</span></div>' +
        '<div class="hs-top">' + (c.fam ? '<span class="hs-fam" style="--fam:' + (FAM_COL[c.fam] || '#6E6457') + '"' + helpAttr(esc(c.fam), 'The card\'s family: what it does. ' + (HARMFUL_FAMS.has(c.fam) ? 'A harmful family: the target\'s Security Bots can roll to block it.' : '')) + '>' + esc(c.fam) + '</span>' : '<span></span>') +
          (gateTxt ? '<span class="hs-need"' + helpAttr(gateTxt, gateHelp) + '>' + gateTxt + '</span>' : '') + '</div>' +
        '<div class="hs-art">' + c.icon + '</div>' +
        '<div class="hs-title">' + esc(c.name) + '</div>' +
        '<div class="hs-desc">' + esc(c.text) + '</div>' +
        '<div class="hs-footer"><span class="hs-coin"' + helpAttr('🪙 Cash value ' + c.cash, 'On your Intrigue turn you can cash this card in for ' + c.cash + ' credit' + (c.cash === 1 ? '' : 's') + ' instead of playing it.') + '>🪙' + c.cash + '</span><em>' + targetHint + '</em></div></div>';

      slot.addEventListener('pointerenter', () => {
        stage.classList.add('open');
      });

      slot.addEventListener('pointerdown', e => {
        if (!isCardPlayable(id)) return;
        e.preventDefault();
        if (G.cashMode && G.phase === 'intrigue' && G.intrigueTurn === HS) {
          act('cashIn', id);
          return;
        }
        const rect = el.getBoundingClientRect();
        dragCard = {
          idx: i, id, card: c, el, slot,
          startX: rect.left + rect.width / 2,
          startY: rect.top + rect.height / 2,
          curX: e.clientX,
          curY: e.clientY
        };
        slot.classList.add('dragging-slot');
        el.classList.add('dragging');
        stage.classList.add('dragging-active', 'open');
      });

      slot.appendChild(el);
      fan.appendChild(slot);
    });
  }

  /* Camera (layout B): the whole bench fits under the top bar, as big as the screen allows. */
  function logRoom() { return 0; }   // the log has its own zone under the pit now (layout B)
  const TBH = () => { const b = document.getElementById('topBar'); return b ? b.offsetHeight : 52; };
  function getCompoundZoom() {
    const sw = window.innerWidth, sh = window.innerHeight, tbh = TBH();
    benchLayout(); const fitW = (sw - 24) / BENCH.W, fitH = (sh - tbh - 10) / (BENCH.bottom - BENCH.top);
    return Math.max(0.42, Math.min(1.8, Math.min(fitW, fitH)));
  }

  function getArenaZoom() { return getCompoundZoom(); }

  /* Phone camera (2.0, 8 Nov; layout B 9 Nov): the bench is a desktop layout (1400 px wide). On a narrow screen the camera
   * follows the part that matters now, below the sticky note and the log: the pit's stage (draft, market, bets, recap), one
   * of your work orders (Upkeep, sending a robot, fitting a part) or the tickets and the rail (Intrigue, the host picking). */
  const narrowScreen = () => window.innerWidth < 700;
  function phoneCam() {
    const sw = window.innerWidth, sh = window.innerHeight, lg = document.getElementById('logPanel');
    const top = Math.min(sh * 0.62, (lg ? lg.getBoundingClientRect().bottom : TBH()) + 8), bot = sh - 78, mid = (top + bot) / 2, room = Math.max(120, bot - top);
    const L = benchLayout(), P = PS(), t = G.teams[viewerSeat];
    const mine = G.phase === 'upkeep' || (G.phase === 'arena' && P.choose) || (G.phase === 'market' && ((P.install || []).length || (P.tradeIn || []).length));
    const whole = G.phase === 'intrigue' || (G.phase === 'arena' && G.host === HS && !G.fight && !P.choose);
    let cx, cy, z;
    if (mine) {
      const need = t.robots.findIndex(r => G.phase === 'upkeep' ? R2.ZONES.some(zz => zonesOf(r)[zz.key].damaged) : !r.exhausted), B = L.bays[Math.max(0, need)];
      cx = B.x + B.w / 2; cy = B.y + B.h / 2; z = Math.min((sw - 12) / (B.w + 8), room / (B.h + 10));
    } else if (whole) { cx = 0; cy = (BENCH.top + L.rail.y + L.rail.h) / 2; z = Math.min((sw - 8) / (BENCH.W + 10), room / (L.rail.y + L.rail.h - BENCH.top + 10)); }
    else { const S = L.stage; cx = S.x + S.w / 2; cy = S.y + S.h / 2; z = Math.min((sw - 10) / (S.w + 10), room / (S.h + 10)); }
    cam.tzoom = z; cam.tx = cx; cam.ty = cy - (mid - sh / 2) / z;
  }
  function setCameraGoal(mode) {
    if (cam.manualZoom) return;
    if (narrowScreen() && G) { phoneCam(); return; }
    const z = getCompoundZoom();
    cam.tzoom = z; cam.tx = 0; cam.ty = (BENCH.top + BENCH.bottom) / 2 - TBH() / 2 / z;
  }

  // credit flow log (sim / playtest: income by source, spend by sink): one 'cr' event per change, no rule effect

  const CR_WORD = { mechanics: 'Mechanics', upkeep: 'robot upkeep', repair: 'repair', sale: 'sold', sponsor: 'sponsor', card: 'card', cashin: 'card cashed in', catchup: 'underdog purse', lot: 'market lot', market: 'market bid', host: 'host bid', wager: 'robot-count wager', arena: 'arena', appearance: 'appearance money', fightcard: 'fight card', bet: 'bet', quirk: 'quirk', backing: 'backing', deal: 'deal', trade: 'trade' };

  function gateOk(c, F, T, extra) {
    if (c.gate === '▲') return !!T && F.fame > T.fame;
    if (c.gate === '▼') return !!T && F.fame < T.fame;
    return F.fame + (extra || 0) >= needOf(F, c);
  }
  function tamperRobot(r, d) { r.tamper = r.tamper || {}; for (const k in d) r.tamper[k] = (r.tamper[k] || 0) + d[k]; }
  // 2.0 (Kev, 8 Nov): a team that loses its last robot gets NO free robot (1.0 gave a Scrap Bot, but a fresh one was
  // sometimes better than repairing the old one). It sits out (an invite without a ready robot costs 1 fame, as in 1.0)
  // until it wins a robot lot in the Market.
  /* A robot leaves team T (Kev, 8 Nov: Fan Favourite = +1 fame while it stays on your team). Every removal goes through here:
   * scrapped (host, upkeep debt), sold to the bank (Fire Sale), traded or bought (to = the new team). The old owner loses
   * the Fan Favourite fame; a new owner gains it if the robot is a Fan Favourite there (Apex Media: 2 tokens). Fame stays >= 0. */
  function robotLeaves(T, r, to, reason) {
    const k = T.robots.indexOf(r); if (k < 0) return false;
    T.robots.splice(k, 1);
    if (to) to.robots.push(r);
    tlog('scrap', { team: T.i, robot: r.name, reason, to: to ? to.i : null, wins: r.wins });
    const ff = BAL.fame.fanFav;
    if (ff && r.wins >= favWins(T) && T.fame > 0) { G.fameSrc = 'fav'; T.fame = Math.max(0, T.fame - ff); G.fameSrc = null; notify('🎖 ' + nm(T) + ' loses its Fan Favourite ' + esc(r.name) + ': −' + ff + ' fame.', T.col); }
    if (ff && to && r.wins >= favWins(to)) { G.fameSrc = 'fav'; to.fame += ff; G.fameSrc = null; notify('🎖 ' + esc(r.name) + ' is a Fan Favourite for ' + nm(to) + ' now: +' + ff + ' fame.', to.col); }
    return true;
  }
  // a repair for the sim log: who paid for it (crew, a free action or credits)
  function logRepair(t, r, zk, how) { tlog('repair', { team: t.i, robot: r.name, zone: zk, by: how === 'free action' ? 'free' : /Cr$/.test(how) ? 'credits' : 'crew' }); }
  function noRobotsLeft(t) { notify('🤖 ' + nm(t) + ' has no robots left: win a New Robot lot in the Market.', t.col); }
  function discardCard(id) { if (CARDS[id] && CARDS[id].auction) { (G.auctionDiscard = G.auctionDiscard || []).push(id); return; } G.discard.push(id); }   // auction cards never go back into the Intrigue deck
  function removeFromHand(t, id) { const k = t.hand.indexOf(id); if (k >= 0) t.hand.splice(k, 1); return k >= 0; }

  /* small modal: buttons [{label, value(el), secondary}], optional timeout (ms) and default value */
  // one modal at a time: a second question waits until the first is answered (multiplayer: questions can overlap)
  let modalChain = Promise.resolve(), dealChain = Promise.resolve();
  function ivModal(title, html, buttons, timeout, def) {
    const p = modalChain.then(() => ivModal0(title, html, buttons, timeout, def));
    modalChain = p.catch(() => null);
    return p;
  }
  function ivModal0(title, html, buttons, timeout, def) {
    return new Promise(res => {
      let el = document.getElementById('ivModal');
      if (!el) { el = document.createElement('div'); el.id = 'ivModal'; document.body.appendChild(el); }
      el.innerHTML = '<div class="iv-box"><h3>' + title + '</h3><div class="iv-body">' + html + '</div><div class="iv-btns">' +
        buttons.map((b, k) => '<button class="' + (b.secondary ? 'secondary' : 'primary') + '" data-k="' + k + '">' + b.label + '</button>').join('') +
        '</div></div>';
      el.hidden = false;
      let done = false, tm = null;
      const finish = v => { if (done) return; done = true; clearTimeout(tm); el.hidden = true; el.innerHTML = ''; res(v); };
      el.querySelectorAll('button[data-k]').forEach(b => { b.onclick = () => finish(buttons[+b.dataset.k].value(el)); });
      el._finish = () => finish(def);   // closed from outside (the host cancelled the question)
      if (BOT) setTimeout(() => { const bs = [...el.querySelectorAll('button[data-k]')]; if (!done && bs.length && !window.__noBot) bs[Math.floor(Math.random() * bs.length)].click(); }, 60 + Math.random() * 120);
      // Kev, 6 Nov: no countdown bars, they put too much pressure on; every window waits for your answer
    });
  }
  // inputs (checkboxes, text) of a modal, in document order, so a remote answer can be replayed on the host
  const modalInputs = el => [...el.querySelectorAll('input,textarea,select')].map(x => x.type === 'checkbox' || x.type === 'radio' ? x.checked : x.value);
  const applyInputs = (el, vals) => [...el.querySelectorAll('input,textarea,select')].forEach((x, k) => { if (!vals || vals[k] === undefined) return; if (x.type === 'checkbox' || x.type === 'radio') x.checked = !!vals[k]; else x.value = vals[k]; });
  // ask the person who plays `seat`, on their own screen. Same buttons as ivModal; for a remote seat the host sends
  // title/html/labels, gets back {k: button index, inputs}, and runs that button's value() on a hidden copy of the modal.
  function askSeat(seat, title, html, buttons, timeout, def) {
    const N = window.ROBOCUS_NET;
    if (isRemote(seat) && N) return N.ask(seat, { title, html, buttons: buttons.map(b => ({ label: b.label, secondary: !!b.secondary })) }).then(a => {
      const el = document.createElement('div'); el.innerHTML = html; applyInputs(el, a && a.inputs);
      const b = a && buttons[a.k]; return b ? b.value(el) : def;
    });
    return ivModal(title, html, buttons, timeout, def);
  }

  /* ============================================================================
   * PLAYTEST LOG (Kev, 6 Nov): every game is recorded for later analysis and debugging.
   * One JSON file per game: build, settings, every log line, phase snapshots (fame, credits, robots, Stash), clicks
   * and buttons, Market results, fights (format, entrants, bookie odds, bets, result, recap), deals, notes and errors.
   * Saved in this browser all the time (last 10 games), and into a folder on disk once you pick one
   * (📝 in the log header; pick ROBOCUS/playtests). Read them with: node tools/playtest-report.js playtests
   * ============================================================================ */
  const BUILD = 'tabletop 2.0 2026-11-08 live cards';   // bump when the prototype changes, so logs can be matched to code
  const PT = { game: null, dir: null, dirState: 'none', timer: null, lastKey: null, errs: 0, errSeen: {} };
  const ptDiv = document.createElement('div');
  const ptPlain = h => { ptDiv.innerHTML = String(h == null ? '' : h).replace(/<br\s*\/?>/g, ' / '); return ptDiv.textContent; };   // the browser strips the tags (help text in attributes too)
  function ptNew() {
    if (PT.game && PT.game.events.length > 3) ptSaveNow();
    PT.game = { id: new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19), build: BUILD, started: Date.now(), ua: navigator.userAgent, view: [window.innerWidth, window.innerHeight], seat: viewerSeat, events: [] };
    PT.lastKey = null; PT.errs = 0; PT.errSeen = {};
    ptBadge();
  }
  function tlog(k, data) {
    if (!PT.game) return;
    try {
      PT.game.events.push(Object.assign({ t: Math.round((Date.now() - PT.game.started) / 100) / 10, k, r: G ? G.round : 0, ph: G ? G.phase : '' }, data || {}));
      ptSaveSoon();
    } catch (e) { /* never let logging break the game */ }
  }
  const ptBuild = r => r ? { level: r.level, parts: partsOf(r), damage: zoneTxt(r) } : null;
  function ptSnapshot() {
    return G.teams.map(t => ({ i: t.i, name: t.name, sponsor: t.sponsor, fame: t.fame, fameBy: Object.assign({}, t.fameBy || {}), cr: t.credits, mechs: t.mechs, eng: t.engPool, crew: t.crew.map(c => c.kind), sec: t.secBots || 0, hand: t.hand.length,
      handIds: t.i === HS ? t.hand.slice() : undefined, stash: (t.stash || []).slice(),
      robots: t.robots.map(r => ({ name: r.name, wins: r.wins, ex: !!r.exhausted, b: ptBuild(r) })) }));
  }
  function ptPhase() {
    if (!G || !PT.game) return;
    const key = G.round + '|' + G.phase + '|' + (G.phase === 'market' ? G.marketStage : '');
    if (key === PT.lastKey) return;
    PT.lastKey = key;
    tlog('phase', { stage: G.phase === 'market' ? G.marketStage : undefined, host: G.host, teams: ptSnapshot() });
  }
  // ---- saving: browser storage always, a folder on disk when picked ----
  const LS_INDEX = 'robocus2.playtest.index';
  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } }
  function lsDel(k) { try { localStorage.removeItem(k); } catch (e) {} }
  function ptSaveSoon() { if (PT.timer) return; PT.timer = setTimeout(() => { PT.timer = null; ptSaveNow(); }, 2500); }
  function ptSaveNow() {
    if (!PT.game) return;
    const json = JSON.stringify(PT.game);
    let idx = []; try { idx = JSON.parse(lsGet(LS_INDEX) || '[]'); } catch (e) {}
    if (!idx.includes(PT.game.id)) idx.push(PT.game.id);
    while (idx.length > 10) lsDel('robocus2.playtest.' + idx.shift());
    if (!lsSet('robocus2.playtest.' + PT.game.id, json)) { while (idx.length > 1 && !lsSet('robocus2.playtest.' + PT.game.id, json)) lsDel('robocus2.playtest.' + idx.shift()); }
    lsSet(LS_INDEX, JSON.stringify(idx));
    if (PT.dir && PT.dirState === 'granted') ptWriteFile(PT.game.id + '.json', json);
  }
  async function ptWriteFile(name, text) {
    try { const fh = await PT.dir.getFileHandle(name, { create: true }), w = await fh.createWritable(); await w.write(text); await w.close(); }
    catch (e) { PT.dirState = 'error'; ptBadge(); console.warn('playtest log: folder write failed', e); }
  }
  // the folder handle is kept in IndexedDB, so you pick the folder once; the browser may ask again after a restart
  function ptDb() { return new Promise((res, rej) => { const q = indexedDB.open('robocus2', 1); q.onupgradeneeded = () => q.result.createObjectStore('kv'); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); }
  async function ptDbGet(k) { try { const db = await ptDb(); return await new Promise(res => { const r = db.transaction('kv').objectStore('kv').get(k); r.onsuccess = () => res(r.result); r.onerror = () => res(null); }); } catch (e) { return null; } }
  async function ptDbSet(k, v) { try { const db = await ptDb(); db.transaction('kv', 'readwrite').objectStore('kv').put(v, k); } catch (e) {} }
  async function ptRestoreDir() {
    const h = await ptDbGet('playtestDir');
    if (!h) return;
    PT.dir = h;
    try { PT.dirState = (await h.queryPermission({ mode: 'readwrite' })) === 'granted' ? 'granted' : 'prompt'; } catch (e) { PT.dirState = 'prompt'; }
    ptBadge();
  }
  async function ptPickDir() {
    if (!window.showDirectoryPicker) { notify('⚠️ This browser can\'t write to a folder: use ⬇️ Download instead (Chrome or Edge can).', '#b45309'); return; }
    try {
      const h = await window.showDirectoryPicker({ id: 'robocus2-playtests', mode: 'readwrite' });
      PT.dir = h; PT.dirState = 'granted'; await ptDbSet('playtestDir', h);
      notify('📝 Playtest logs now also save to the folder <b>' + esc(h.name) + '</b>.', '#111');
      // also write the earlier games still in this browser
      let idx = []; try { idx = JSON.parse(lsGet(LS_INDEX) || '[]'); } catch (e) {}
      for (const id of idx) { const j = lsGet('robocus2.playtest.' + id); if (j) await ptWriteFile(id + '.json', j); }
      ptSaveNow(); ptBadge();
    } catch (e) { /* cancelled */ }
  }
  async function ptReconnect() {
    try { PT.dirState = (await PT.dir.requestPermission({ mode: 'readwrite' })) === 'granted' ? 'granted' : 'prompt'; } catch (e) { PT.dirState = 'prompt'; }
    if (PT.dirState === 'granted') { ptSaveNow(); notify('📝 Logging to the folder <b>' + esc(PT.dir.name) + '</b> again.', '#111'); }
    ptBadge();
  }
  function ptDownload() {
    ptSaveNow();
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([JSON.stringify(PT.game, null, 1)], { type: 'application/json' }));
    a.download = 'robocus2-playtest-' + PT.game.id + '.json'; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  }
  // every game still in this browser (last 10) in one file, for when no log folder was picked
  function ptDownloadAll() {
    ptSaveNow();
    let idx = []; try { idx = JSON.parse(lsGet(LS_INDEX) || '[]'); } catch (e) {}
    const games = idx.map(id => { try { return JSON.parse(lsGet('robocus2.playtest.' + id)); } catch (e) { return null; } }).filter(Boolean);
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([JSON.stringify({ build: BUILD, exported: new Date().toISOString(), games })], { type: 'application/json' }));
    a.download = 'robocus2-playtests-' + new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19) + '.json'; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
    notify('⬇️ Downloaded ' + games.length + ' saved game' + (games.length === 1 ? '' : 's') + ' in one file.', '#111');
  }
  async function ptNote() {
    const txt = await ivModal('🐞 Add a note to the log', 'What happened? Anything odd, a rule question, a bug, an idea. It is saved with the current game state.<br><textarea id="ptNoteTxt" rows="4" style="width:100%;margin-top:6px;font:13px system-ui,sans-serif"></textarea>',
      [{ label: 'Save note', value: el => el.querySelector('#ptNoteTxt').value.trim() }, { label: 'Cancel', secondary: true, value: () => '' }]);
    if (!txt) return;
    tlog('note', { text: txt, teams: ptSnapshot(), view: [window.innerWidth, window.innerHeight] });
    ptSaveNow();
    notify('🐞 Note saved to the playtest log.', '#111');
  }
  function ptBadge() {
    const b = document.getElementById('ptBtn'); if (!b) return;
    const st = PT.dirState === 'granted' ? '📝 ●' : PT.dirState === 'prompt' ? '📝 ↻' : '📝';
    b.textContent = st + (PT.errs ? ' 🐞' + PT.errs : '');
    b.style.color = PT.dirState === 'granted' ? '#17803a' : PT.dirState === 'prompt' || PT.dirState === 'error' ? '#b45309' : '#111';
    b.dataset.help = 'Playtest log|' + (PT.dirState === 'granted' ? 'Every game is saved to the folder <b>' + esc(PT.dir.name) + '</b> as you play.' : PT.dirState === 'prompt' ? 'The log folder needs your OK again (browser restart): click to reconnect.' : 'Games are saved in this browser (last 10). Click to save them to a folder on disk too (pick ROBOCUS/playtests).') +
      (PT.errs ? '<br>🐞 ' + PT.errs + ' error' + (PT.errs > 1 ? 's' : '') + ' recorded this game.' : '') + '<br><i>Click for options and to add a note.</i>';
  }
  async function ptMenu() {
    if (PT.dirState === 'prompt') { await ptReconnect(); if (PT.dirState === 'granted') return; }
    const n = PT.game ? PT.game.events.length : 0;
    const pick = await ivModal('📝 Playtest log', 'This game: <b>' + n + '</b> events recorded' + (PT.errs ? ', 🐞 <b>' + PT.errs + '</b> errors' : '') + '.<br>' +
      (PT.dirState === 'granted' ? 'Saving to the folder <b>' + esc(PT.dir.name) + '</b>.' : 'Saved in this browser (last 10 games). Pick a folder to keep them on disk: choose <b>ROBOCUS/playtests</b>.'),
      [{ label: '🐞 Add a note', value: () => 'note' }, { label: PT.dirState === 'granted' ? '📁 Change folder' : '📁 Save to a folder…', value: () => 'dir' }, { label: '⬇️ Download this game', value: () => 'dl' }, { label: '⬇️ All saved games', value: () => 'all' }, { label: 'Close', secondary: true, value: () => null }]);
    if (pick === 'note') ptNote(); else if (pick === 'dir') ptPickDir(); else if (pick === 'dl') ptDownload(); else if (pick === 'all') ptDownloadAll();
  }
  // errors: recorded with stack and the moment they happened (each distinct one counted)
  function ptError(msg, stack) {
    const key = String(msg).slice(0, 200);
    PT.errSeen[key] = (PT.errSeen[key] || 0) + 1;
    if (PT.errSeen[key] > 3) return;   // the same error every frame: keep the first few
    PT.errs++;
    tlog('error', { msg: key, stack: String(stack || '').split('\n').slice(0, 8).join('\n'), n: PT.errSeen[key], teams: G ? ptSnapshot() : undefined });
    ptSaveNow(); ptBadge();
  }
  window.addEventListener('error', e => ptError(e.message, e.error && e.error.stack || (e.filename + ':' + e.lineno)));
  window.addEventListener('unhandledrejection', e => ptError('Unhandled promise: ' + (e.reason && e.reason.message || e.reason), e.reason && e.reason.stack));
  window.addEventListener('beforeunload', () => { if (PT.game) { const json = JSON.stringify(PT.game); lsSet('robocus2.playtest.' + PT.game.id, json); } });
  // every HTML button you press (prompt, modals, deal panel, Stash, hand-limit…)
  document.addEventListener('click', e => {
    const b = e.target && e.target.closest ? e.target.closest('button') : null;
    if (b && b.id !== 'ptBtn') tlog('button', { text: (b.textContent || '').trim().slice(0, 60), id: b.id || undefined, box: b.closest('#ivModal') ? 'modal' : b.closest('#dealModal') ? 'deal' : b.closest('#promptBar') ? 'prompt' : b.closest('#stashCard') ? 'stash' : undefined });
  }, true);

  /* ============================================================================
   * STASH & DEALS (Kev, 6 Nov)
   * Stash: every team keeps up to STASH_MAX spare parts (won lots no robot can take, or parts kept aside). Fit one
   * when a robot can take it (Upkeep or Market), trade it, or sell it to the bank at half value. Open information.
   * Deals: one offer panel for every moment where someone decides (backing, invites, spare/scrap, card threats,
   * open-market trades). You move credits and Stash parts onto the table and press Lock in; no timers.
   * AI teams value a bundle as credits + what each part is worth to them (the bookie's band jump on their robots).
   * ============================================================================ */
  const STASH_MAX = 4;
  const partValue = id => { const L = LOTS[id]; if (!L) return 0; return L.legend ? 5 : L.kind === 'drone' || L.kind === 'module' ? 3 : 2; };
  const bankHalf = id => Math.max(1, Math.floor(partValue(id) / 2));
  const stashOf = t => (t.stash = t.stash || []);
  function toStash(t, id, quiet) {
    if (stashOf(t).length >= STASH_MAX) {
      const g = bankHalf(id); addCr(t, g, 'sale');
      notify('📦 ' + nm(t) + '\'s Stash is full: ' + lotRef(id) + ' goes to the bank for ' + g + ' Cr.', t.col);
      return false;
    }
    t.stash.push(id);
    if (!quiet) notify('📦 ' + lotRef(id) + ' goes into ' + nm(t) + '\'s Stash.', t.col);
    return true;
  }
  function sellStash(t, k) {
    const id = stashOf(t).splice(k, 1)[0]; if (!id) return;
    const g = bankHalf(id); addCr(t, g, 'sale');
    notify('🏦 ' + nm(t) + ' sells ' + lotRef(id) + ' to the bank for ' + g + ' Cr (half value).', t.col);
    updateHud();
  }
  // what a part is worth to a team: its value plus the bookie's best gain on one of its robots; unusable = bank price
  function partGain(t, id) {
    let best = null;
    for (const r of t.robots) {
      if (!canFit(r, LOTS[id])) continue;
      const nb = lotBuild(r, LOTS[id]); if (!nb) continue;
      const a = fieldOdds(t.i, r).p, b = fieldOdds(t.i, nb).p;
      const d = b - a;
      if (!best || d > best.d) best = { r, a, b, d };
    }
    return best;
  }
  function partWorth(t, id) { const g = partGain(t, id); return g ? partValue(id) + Math.max(0, Math.round(g.d * 15)) : bankHalf(id); }
  /* ---------- trading robots, crew and Security Bots (Kev, 6 Nov: open market only; a team keeps at least one robot) ---------- */
  const robotById = id => { for (const T of G.teams) { const r = T.robots.find(x => String(x.id) === String(id)); if (r) return { T, r }; } return null; };
  const crewByUid = uid => { for (const T of G.teams) { const c = T.crew.find(x => String(x.uid) === String(uid)); if (c) return { T, c }; } return null; };
  const isAsset = tok => /^[RC]:/.test(tok);
  // what owning a robot is worth to a team: its card value, its parts, and how the bookie rates it there
  function robotWorth(t, r) {   // 2.0: its level, its parts, how the bookie rates it there, less its damage
    const p = fieldOdds(t.i, r).p;
    return Math.max(1, Math.round(1 + r.level * 2 + (r.parts || []).length * 1.5 + (r.leg ? 3 : 0) + (p - 0.5) * 8 - hurt(r) * 1.5 + (t.robots.length <= 1 ? 2 : 0)));
  }
  const crewWorth = (t, k) => CREW[k].value + (k === 'mechanic' && G.round <= 4 ? 1 : 0) + (hasCrew(t, k) && k !== 'mechanic' && k !== 'chief' ? -1 : 1);
  function tokWorth(t, tok) {
    if (tok[0] === 'R') { const x = robotById(tok.slice(2)); return x ? (x.T === t || t.robots.length < 3 ? robotWorth(t, x.r) : 0) : 0; }
    if (tok[0] === 'C') { const x = crewByUid(tok.slice(2)); return x ? crewWorth(t, x.c.kind) : 0; }
    return partWorth(t, tok);
  }
  const bundleWorth = (t, B) => (B && B.cr || 0) + (B && B.sec || 0) * 2 + (B && B.items || []).reduce((a, id) => a + tokWorth(t, id), 0);
  const bundleEmpty = B => !B || (!B.cr && !B.sec && !(B.items || []).length);
  const tokRef = tok => { if (tok[0] === 'R' && tok[1] === ':') { const x = robotById(tok.slice(2)); return x ? '🤖 <b>' + esc(x.r.name) + '</b>' : 'a robot'; } if (tok[0] === 'C' && tok[1] === ':') { const x = crewByUid(tok.slice(2)); return x ? crewRef(x.c.kind) : 'crew'; } return lotRef(tok); };
  const bundleText = B => bundleEmpty(B) ? 'nothing' : [B.cr ? B.cr + ' Cr' : '', B.sec ? B.sec + ' Security Bot' + (B.sec > 1 ? 's' : '') : ''].concat((B.items || []).map(tokRef)).filter(Boolean).join(' + ');
  function transfer(from, to, B, src) {
    if (bundleEmpty(B)) return;
    if (B.cr) { const got = payCr(from, B.cr, src); addCr(to, got, src); if (G.stats && G.stats.gave && from.i !== to.i) G.stats.gave[from.i][to.i] += got; }
    if (B.sec) { const n = Math.min(B.sec, from.secBots || 0); from.secBots -= n; to.secBots = (to.secBots || 0) + n; }
    for (const id of B.items || []) {
      if (id.startsWith('R:')) {   // a robot with its fitted parts; its Chief Engineers stay home
        const x = robotById(id.slice(2)); if (!x || x.T !== from || from.robots.length <= 1 || to.robots.length >= 3) continue;
        robotLeaves(from, x.r, to, 'trade');
      } else if (id.startsWith('C:')) {
        const x = crewByUid(id.slice(2)); if (!x || x.T !== from) continue;

        if (crewLeft(from, x.c)) { repState(to).used[x.c.uid] = 1; to.exMechs = (to.exMechs || 0) + 1; }   // a crew member who repaired stays tired this round

    return Math.max(0, Math.min(Math.round(want * (0.4 + rnd() * 1.1)), t.credits, Math.ceil(t.credits * 0.6)));

  function resolveHostBid() {
    if (G.marketAuction) return;

    const all = G.teams.map(t => { const b = zeroBids(); b[HOST_K] = Math.min(t.credits, isHuman(t.i) ? ((PS(t.i).bids || [])[HOST_K] || 0) : aiHostBid(t)); return b; });
    G.teams.forEach((t, i) => { if (t.shill && all[i][HOST_K]) all[i][HOST_K] = Math.max(0, all[i][HOST_K] - t.shill); });
    G.marketAuction = { all, initialAll: all.map(b => b.slice()), rebidAdds: G.teams.map(zeroBids), curK: HOST_K, lastK: HOST_K, hostOnly: true, wins: [], results: [], tie: null };
    stepMarketAuction();
  }

  // v2: a part is worth its value plus the bookie's gain on the robot it fits (partWorth); robots and crew as before
  function aiLotValue(t, id) {
    const L = LOTS[id]; if (!L) return 0;
    if (L.robot) return robotWant(t, id, L.legend ? 6 : 4);
    if (L.crew) return crewWant(t, L.crew);

  function aiBids(t) {
    if (aiV2(t, 'bids')) {
      const P = aiP(t); let budget = Math.max(0, t.credits - P.reserve - Math.min(2, Math.round(aiHostValue(t) / 2)));
      const order = G.market.map((id, k) => ({ k, v: aiLotValue(t, id) })).sort((a, b) => b.v - a.v);
      const bids = zeroBids();
      for (const { k, v } of order) {   // base bids: exactly the old rule (old reserve and budget)
        if (v <= 0.5) continue;
        let b = Math.max(0, Math.min(budget, Math.round(v * (1 + (rnd() - 0.5) * 2 * P.bidNoise) * 0.8)));
        const mn = minBidOf(G.market[k]); if (mn && b < mn) b = v >= mn && budget >= mn ? mn : 0;   // level 4: at least the minimum, or nothing
        bids[k] = b; budget -= b;
      }

      // above the full reserve (aiReserve) after the base bids, at most spendShare of the surplus per lot, highest value first
      const sur0 = aiSurplus(t, true, 'spendLots'), mult = aiSpendMult(t, sur0);

      (G.aiSpend = G.aiSpend || {})[t.i] = { sur: sur0, mult, r: G.round };   // rebids use the same surplus
      for (const { k, v } of order) {
        if (pool <= 0) break;

        const add = Math.max(0, Math.min(pool, sur0 * (P.spendShare || 0.5), Math.round(bids[k] * (mult - 1))));
        bids[k] += add; pool -= add;

        const lead = leaderOf(), g = lead !== t ? partGain(lead, G.market[k]) : null;
        const b = (g && g.d > 0.08) || rnd() < 0.2 ? Math.min(budget, 1 + (rnd() < 0.4 ? 1 : 0)) : 0;

      let b = Math.round(want * (0.4 + rnd() * 1.1));

  }

  // what a crew card is worth to an AI team (Mechanics pay back early; 2.0: Chief Engineers and Repair Techs repair)
  function crewWant(t, k) {
    if (k === 'mechanic') return G.round <= 4 ? 4 : 2.5;
    if (k === 'chief') return t.robots.some(r => r.wear) ? 2.5 : 1.5;   // 2.0: 1 repair action
    if (k === 'accountant') return t.robots.length >= 2 ? 3.5 : 2;
    if (k === 'repairtech') return t.robots.some(r => wrecked(r)) ? 2.5 : 1.5;   // 2.0: 1 repair action
    return hasCrew(t, k) ? 0.5 : 2.5;

  function aiRebid(t, k, curBid, maxAdd) {
    if (maxAdd <= 0) return 0;

      let worth = k === HOST_K ? aiHostValue(t) : aiLotValue(t, G.market[k]);
      const sp = k === HOST_K ? { sur: Math.max(0, aiSurplus(t, true, 'spendHost') - (aiP(t).spendMkt || 0)) } : G.aiSpend && G.aiSpend[t.i] && G.aiSpend[t.i].r === G.round ? G.aiSpend[t.i] : null;   // surplus: worth more, as in the sealed bid
      if (sp && sp.sur > 0 && worth >= 1.5 && worth < t.credits) worth += Math.min(sp.sur * (aiP(t).spendShare || 0.5), worth * (aiSpendMult(t, sp.sur) - 1));

    const add = Math.round(Math.max(0, maxWilling - curBid) * (0.35 + rnd() * 0.85));

  /* ---------- New Robot lots: a real robot, shown on its tile ----------

  function levelsTxt() {

      const lt = lv.length > 1 ? 'level ' + lv[0] + '–' + lv[lv.length - 1] : 'level ' + lv[0];
      const last = parts[parts.length - 1];
      if (last && last.lt === lt) last.to = j + 1 < sc.length ? sc[j + 1][0] - 1 : null;
      else parts.push({ lt, from, to: j + 1 < sc.length ? sc[j + 1][0] - 1 : null });
    });
    return parts.map(p => p.lt + (p.to == null ? (p.from <= 1 ? ' every round' : ' from round ' + p.from) : p.to === p.from ? ' in round ' + p.from : ' in rounds ' + p.from + '–' + p.to)).join(', ');
  }
  const l4Open = () => BAL.level4.on && G.round >= BAL.level4.fromRound;
  const maxLv = () => l4Open() ? 4 : 3;
  function dealRobot(want) {
    const inMarket = new Set((G.market || []).map(x => LOTS[x] && LOTS[x].starter).filter(Boolean));
    const owned = new Set(G.teams.flatMap(t => t.robots.map(r => r.name)));
    const lv = want || waveLevel();
    // a level 4 robot only when the wave asks for level 4 (a dry level 3 deck falls back to level 2, not up to 4)
    for (const L0 of [lv, lv - 1, lv + 1, lv - 2, lv + 2].filter(x => x >= 1 && x <= (lv >= 4 ? 4 : 3))) {
      const D = G.robotDecks[L0] || [];

  function dealLot() {
    let id = G.lots.pop();

    for (let k = 0; k < G.lots.length && id && id.startsWith('p_') && isChip(id.slice(2)) && G.round < (BAL.chips.fromRound || 1); k++) { G.lots.unshift(id); id = G.lots.pop(); }
    if (id === 'crew') { const k = G.crewDeck.pop(); return k ? crewLot(k) : 'mech'; }
    if (id === 'robot' || (LOTS[id] && LOTS[id].robot)) {

  // what a robot lot is worth to an AI team: more when the bookie rates it well against that team's rivals
  // level 4: valued like a legendary (base at least 6) on top of its level and odds
  /* Round 3 (8 Nov): valued from Repair2 strength, so bids rise with level (round 2: L1 4.7, L2 5.4, L3 4.5, L4 7.0 Cr, because
   * a full garage valued every lot at 1 and the field odds of a level 3 robot drop late in the game).
   * robotVal: what a robot of strength s is worth (about L1 5, L2 6.4, L3 7.7, L4 8.9 Cr with its level 4 bonus), plus a bonus when it
   * would be the team's best and a need bonus with 0-1 robots. Full garage (trade-in): value of the new robot − value of the robot it
   * scraps + scrap money. The scrapped robot is the weakest of three (a bench robot that rarely fights; its parts are kept), so it
   * counts at half its robotVal (first try, full value: L3 lots sold for less than L2 lots, 5.6 vs 7.1 Cr, because most L3 lots
   * come when garages are full). */
  const robotVal = s => 3.64 + 2.2 * s, BENCH_K = 0.5;
  function robotWant(t, id, base) {
    const L = LOTS[id]; if (!L || !L.bot) return base;
    const bot = L.bot, s = baseStr(bot), off = base - 4;   // base 4 (v2); v1 passes 5.5
    const p = fieldOdds(t.i, bot).p, l4 = bot.level >= 4 ? 0.6 : 0;
    const mine = t.robots.map(power), best = mine.length ? Math.max(...mine) : -1;
    const lead = Math.max(-1, Math.min(1.5, s - best));

  // what a part card is, in plain words (Kev, 9 Nov: the old line about drones and modules was not clear)
  function partKindHelp(k) {
    const P = LU.PARTS[k]; if (!P) return '';
    const mods = me().robots.filter(r => modName(r)).map(r => esc(r.name) + '\'s ' + esc(modName(r)));
    const what = {
      drone: '<b>Drone:</b> a small helper that flies next to your robot in the fight (shoots, shields or repairs). It can be shot down; fix it with the ⛨ Body repairs.',
      module: '<b>Module:</b> a special device (a shield, jump jets, a repair arm…). A robot holds one module: on a robot that came with one, this one replaces it' + (mods.length ? ' (yours: ' + mods.join(', ') + ')' : '') + '.',
      stat: '<b>Upgrade:</b> makes the robot itself stronger.',
      chip: '<b>Tuning chip:</b> a new routine for the robot\'s brain (how it moves and attacks). One chip per robot. Made for level 0–1 robots: on heavier frames it can glitch.',
      legendary: '<b>Legendary part:</b> one of a kind. It goes in the robot\'s own legendary slot (one per robot).'

  // what a lot does to this robot, in the bookie's numbers ("62% → 70% vs the field")
  function lotPreview(r, L) {

  const weaponSwapNote = () => '';

  /* ---------- Trade-in (Kev, 8 Nov): win a robot lot with a full garage, scrap one of your robots ----------

  function applyLot(ti, lot, r) {
